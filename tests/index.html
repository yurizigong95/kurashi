<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>くらしの手帳 テスト</title>
<style>
  :root{ --ok:#2F8F6B; --ng:#C8323A; --sub:#6b6b78; --bg:#faf7f8; --ink:#2a2230; --line:#e6dfe3; }
  @media (prefers-color-scheme: dark){ :root{ --bg:#18151b; --ink:#eee8ee; --sub:#a59aa6; --line:#352f38; } }
  body{ margin:0; padding:16px; font:14px/1.6 system-ui, -apple-system, "Hiragino Sans", sans-serif; background:var(--bg); color:var(--ink); }
  h1{ font-size:18px; margin:0 0 4px; }
  p.lead{ margin:0 0 12px; color:var(--sub); }
  #sum{ font-weight:700; margin:8px 0 12px; }
  #sum.ok{ color:var(--ok); } #sum.ng{ color:var(--ng); }
  ol{ padding-left:22px; margin:0; }
  li{ padding:4px 0; border-bottom:1px solid var(--line); }
  li .t{ font-weight:600; }
  li.ok .mark{ color:var(--ok); } li.ng .mark{ color:var(--ng); } li.run .mark{ color:var(--sub); }
  li .msg{ display:block; color:var(--ng); white-space:pre-wrap; word-break:break-all; font-size:12px; }
  li .ms{ color:var(--sub); font-size:12px; margin-left:6px; }
  button{ font:inherit; padding:6px 14px; border-radius:999px; border:1px solid var(--line); background:transparent; color:inherit; cursor:pointer; }
  #frames{ display:flex; gap:8px; margin-top:16px; }
  #frames iframe{ width:390px; height:640px; border:1px solid var(--line); border-radius:12px; background:#fff; }
  @media (max-width:820px){ #frames{ flex-direction:column; } #frames iframe{ width:100%; } }
</style>
</head>
<body>
<h1>くらしの手帳 自動テスト</h1>
<p class="lead">2台の端末をまねて、同期・入力・時間割・AI・Google連携などを確かめます。本物のデータ・Firebase・Googleには触れません。</p>
<button id="again">もう一度</button>
<div id="sum">準備しています…</div>
<ol id="list"></ol>
<div id="frames"></div>
<script src="tests.js"></script>
<script src="tests-m-core2.js"></script>
<script src="tests-m-kokushi.js"></script>
<script src="tests-m-research.js"></script>
<script src="tests-m-anki2.js"></script>
<script src="tests-m-campus.js"></script>
<script src="tests-m-life.js"></script>
<script src="tests-m-petplus.js"></script>
<script src="tests-m-links2.js"></script>
<script src="tests-m-chara2.js"></script>
<script src="tests-final.js"></script>
</body>
</html>
