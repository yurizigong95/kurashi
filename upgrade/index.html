<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="UPGRADE問題集">
<meta name="theme-color" content="#1f5fa8">
<link rel="apple-touch-icon" sizes="180x180" href="../icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="../icon-192.png">
<title>UPGRADE 英文法・語法問題</title>
<style>
:root{--blue:#1f5fa8;--blue2:#2b6c7a;--bg:#f4f7fb;--card:#fff;--text:#1c2b3a;--muted:#6b7c8d;--line:#dbe4ee;--ok:#1a9e54;--ng:#e0483e;--warn:#e8a13a;--pink:#fdf0f3}
html[data-theme="dark"]{--bg:#141a21;--card:#1e2732;--text:#e8eef4;--muted:#9db0c1;--line:#334252;--pink:#2c2226}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif;font-size:16px;line-height:1.55}
header{position:sticky;top:0;z-index:20;background:var(--blue);color:#fff;padding:10px 14px;display:flex;align-items:center;gap:10px}
header .t{font-weight:800;font-size:17px}
header .sub{font-size:11px;opacity:.85}
header button{margin-left:auto;background:rgba(255,255,255,.18);border:0;color:#fff;border-radius:8px;padding:6px 10px;font-size:13px}
main{max-width:760px;margin:0 auto;padding:14px 14px 90px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
h2{font-size:16px;margin:0 0 10px}
h3{font-size:14px;margin:14px 0 6px;color:var(--blue)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{display:inline-block;background:var(--blue);color:#fff;border:0;border-radius:10px;padding:11px 16px;font-size:15px;font-weight:700;cursor:pointer;text-align:center}
.btn.sub{background:var(--card);color:var(--blue);border:1.5px solid var(--blue)}
.btn.ghost{background:transparent;color:var(--muted);border:1px solid var(--line)}
.btn:disabled{opacity:.45}
.btn.big{width:100%;padding:14px;font-size:16px}
.chip{display:inline-block;border:1.5px solid var(--line);background:var(--card);color:var(--text);border-radius:999px;padding:7px 13px;font-size:14px;cursor:pointer}
.chip.on{background:var(--blue);border-color:var(--blue);color:#fff;font-weight:700}
input[type=number],input[type=text],select,textarea{background:var(--card);color:var(--text);border:1.5px solid var(--line);border-radius:9px;padding:9px 10px;font-size:15px}
input[type=number]{width:84px}
textarea{width:100%;min-height:56px}
.muted{color:var(--muted);font-size:13px}
.bar{height:9px;background:var(--line);border-radius:99px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--blue);border-radius:99px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center}
.stat b{font-size:21px;display:block}
.stat span{font-size:12px;color:var(--muted)}
.corner{display:flex;justify-content:space-between;align-items:center;width:100%;text-align:left;background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:13px 14px;font-size:15px;cursor:pointer;margin-bottom:8px;color:var(--text)}
.corner b{font-size:17px}
.badge{display:inline-block;background:#eef3fa;color:var(--blue);border-radius:6px;padding:1px 7px;font-size:12px;font-weight:700}
html[data-theme="dark"] .badge{background:#26374a}
.badge.ng{background:#fdeceb;color:var(--ng)}
.badge.okb{background:#e6f6ec;color:var(--ok)}
.qsentence{font-size:18px;line-height:1.7;margin:10px 0;white-space:pre-wrap}
.choice{display:block;width:100%;text-align:left;background:var(--card);border:1.5px solid var(--line);color:var(--text);border-radius:11px;padding:12px 13px;font-size:16px;margin-bottom:8px;cursor:pointer}
.choice.sel{border-color:var(--blue);background:#eaf2fb}
html[data-theme="dark"] .choice.sel{background:#26374a}
.choice.correct{border-color:var(--ok);background:#e6f6ec;color:#14532d}
.choice.wrong{border-color:var(--ng);background:#fdeceb;color:#7f1d1d}
.wordbank{display:flex;gap:7px;flex-wrap:wrap;margin:8px 0}
.word{border:1.5px solid var(--blue);color:var(--blue);background:var(--card);border-radius:9px;padding:8px 12px;font-size:15px;cursor:pointer}
.word.used{opacity:.3;pointer-events:none}
.answerline{min-height:40px;border:1.5px dashed var(--line);border-radius:9px;padding:8px 10px;margin-bottom:8px}
.expl{background:var(--pink);border-radius:11px;padding:12px;white-space:pre-wrap;font-size:15px}
.extra{background:#fff7e6;border:1px dashed var(--warn);border-radius:11px;padding:12px;white-space:pre-wrap;font-size:15px;margin-top:8px}
html[data-theme="dark"] .extra{background:#2c2617}
nav.tab{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--card);border-top:1px solid var(--line);display:flex}
nav.tab button{flex:1;background:none;border:0;padding:9px 2px calc(9px + env(safe-area-inset-bottom));font-size:12px;color:var(--muted);cursor:pointer}
nav.tab button.on{color:var(--blue);font-weight:800}
.qlist{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:11px;padding:11px 12px;margin-bottom:7px;cursor:pointer;color:var(--text);font-size:14px}
.hidden{display:none!important}
.timer{font-variant-numeric:tabular-nums;font-weight:800;color:var(--blue)}
.kbd{font-size:11px;color:var(--muted)}
.daybar{display:flex;gap:3px;align-items:flex-end;height:52px;margin-top:6px}
.daybar i{flex:1;background:var(--blue);border-radius:3px 3px 0 0;min-height:2px;opacity:.85}
</style>
</head>
<body>

/* ---------- state ---------- */
const LS_KEY = "upgradeQuiz.v1";
let DB = load();
function load(){
  try{ const d = JSON.parse(localStorage.getItem(LS_KEY)); if(d && d.per) return d; }catch(e){}
  return { per:{}, sessions:[], settings:{showTrans:true, timer:true, font:16, theme:"light", dailyGoal:20, testMode:false}, session:null };
}
function save(){ localStorage.setItem(LS_KEY, JSON.stringify(DB)); }
function per(n){ if(!DB.per[n]) DB.per[n] = {att:0, ok:0, miss:0, streak:0, fav:false, memo:"", last:null, mastered:false}; return DB.per[n]; }
const Q = {}; QUESTIONS.forEach(q=>Q[q.n]=q);
const CHAPTERS = [...new Map(QUESTIONS.map(q=>[q.chapter, q.chapterTitle])).entries()];
const SECTIONS = [...new Set(QUESTIONS.map(q=>q.section))];
document.getElementById("coverageLine").textContent = "四訂版 ／ 収録: " + CHAPTERS.map(c=>"第"+c[0]+"章 "+c[1]).join("・") + "（Q" + QUESTIONS[0].n + "〜" + QUESTIONS[QUESTIONS.length-1].n + "・全" + QUESTIONS.length + "問）";
if(DB.settings.theme==="dark") document.documentElement.dataset.theme="dark";
document.body.style.fontSize = (DB.settings.font||16) + "px";

const app = document.getElementById("app");
let view = "home";
let quiz = null; // {list:[n], idx, answers:{}, label, startedAt, perQStart, elapsed:{}}
let listFilter = {text:"", chapter:"all", status:"all"};

function esc(s){ return String(s==null?"":s).replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
function todayStr(d){ d=d||new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function norm(s){ return String(s||"").toLowerCase().replace(/[.,'’"!?;:\-]/g," ").replace(/\s+/g," ").trim(); }
function accuracy(ns){ let a=0,o=0; ns.forEach(n=>{const p=DB.per[n]; if(p){a+=p.att; o+=p.ok;}}); return a? Math.round(o/a*100): null; }
function missList(pred){ return QUESTIONS.filter(q=>{ const p=DB.per[q.n]; return p && pred(p); }).map(q=>q.n); }
function shuffle(a){ a=[...a]; for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function speak(text){ try{ const u=new SpeechSynthesisUtterance(String(text).replace(/\(\s*\)/g," blank ")); u.lang="en-US"; u.rate=0.92; speechSynthesis.cancel(); speechSynthesis.speak(u);}catch(e){} }
function setTab(v){ view=v; document.querySelectorAll("nav.tab button").forEach(b=>b.classList.toggle("on", b.dataset.tab===v)); render(); window.scrollTo(0,0); }
document.querySelectorAll("nav.tab button").forEach(b=>b.addEventListener("click", ()=>setTab(b.dataset.tab)));
document.getElementById("themeBtn").addEventListener("click", ()=>{ const d=document.documentElement; const dark = d.dataset.theme!=="dark"; d.dataset.theme = dark?"dark":"light"; DB.settings.theme = dark?"dark":"light"; save(); });

/* ---------- render root ---------- */
function render(){
  if(quiz){ renderQuiz(); return; }
  if(view==="home") renderHome();
  else if(view==="corners") renderCorners();
  else if(view==="list") renderList();
  else if(view==="stats") renderStats();
  else if(view==="settings") renderSettings();
}

/* ---------- home ---------- */
function todayCount(){ const t=todayStr(); return DB.sessions.filter(s=>s.date===t).reduce((a,s)=>a+s.total,0) + (quiz?0:0); }
function streakDays(){ const days=new Set(DB.sessions.map(s=>s.date)); let n=0; const d=new Date(); if(!days.has(todayStr(d))) d.setDate(d.getDate()-1); while(days.has(todayStr(d))){ n++; d.setDate(d.getDate()-1);} return n; }
function renderHome(){
  const totalAtt = QUESTIONS.reduce((a,q)=>a+(DB.per[q.n]?DB.per[q.n].att:0),0);
  const mastered = QUESTIONS.filter(q=>DB.per[q.n] && DB.per[q.n].mastered).length;
  const due = missList(p=>p.miss>0 && !p.mastered);
  let h = "";
  if(DB.session && DB.session.list && DB.session.idx < DB.session.list.length){
    h += '<div class="card" style="border-color:var(--warn)"><h2>⏸ 中断中の回があります</h2><p class="muted">'+esc(DB.session.label)+' ・ '+(DB.session.idx)+'問目まで進行</p><div class="row"><button class="btn" onclick="resumeSession()">続きから再開</button><button class="btn ghost" onclick="discardSession()">破棄する</button></div></div>';
  }
  h += '<div class="grid2">'
    + '<div class="stat"><b>'+todayCount()+'問</b><span>今日解いた数（目標 '+DB.settings.dailyGoal+'問）</span></div>'
    + '<div class="stat"><b>'+streakDays()+'日</b><span>連続学習</span></div>'
    + '<div class="stat"><b>'+totalAtt+'回</b><span>総回答数</span></div>'
    + '<div class="stat"><b>'+mastered+' / '+QUESTIONS.length+'</b><span>マスター済み（2回連続正解）</span></div></div>'
    + '<div class="card"><h2>🎯 今日の復習セット</h2><p class="muted">間違えた問題（マスター未達）が '+due.length+' 問あります。ここを潰すのが一番効きます。</p><button class="btn big" '+(due.length?"":"disabled")+' onclick="startQuiz(window.__due, \'今日の復習セット\')">復習をはじめる（'+due.length+'問）</button></div>';
  window.__due = due;
  h += '<div class="card"><h2>📖 範囲を決めて解く</h2>'
    + '<h3>章で選ぶ</h3><div class="row" id="chChips">'
    + CHAPTERS.map(c=>{ const ns=QUESTIONS.filter(q=>q.chapter===c[0]).map(q=>q.n); const ac=accuracy(ns); return '<button class="chip on" data-ch="'+c[0]+'">第'+c[0]+'章 '+esc(c[1])+'（'+ns.length+'問'+(ac!=null?'・正答率'+ac+'%':'')+'）</button>'; }).join("")
    + '</div><h3>問題番号で選ぶ</h3><div class="row"><input type="number" id="rngFrom" min="'+QUESTIONS[0].n+'" max="'+QUESTIONS[QUESTIONS.length-1].n+'" placeholder="最初"> 〜 <input type="number" id="rngTo" min="'+QUESTIONS[0].n+'" max="'+QUESTIONS[QUESTIONS.length-1].n+'" placeholder="最後"> <span class="muted">空欄なら章の選択が優先</span></div>'
    + '<h3>UPGRADEの項目で選ぶ</h3><select id="secSel" style="width:100%"><option value="">指定なし</option>' + SECTIONS.map(s=>'<option>'+esc(s)+'</option>').join("") + '</select>'
    + '<h3>出題の仕方</h3><div class="row" id="modeChips"><button class="chip on" data-m="seq">順番通り</button><button class="chip" data-m="rand">シャッフル</button></div>'
    + '<div class="row" id="cntChips" style="margin-top:8px"><button class="chip" data-c="10">10問</button><button class="chip" data-c="20">20問</button><button class="chip" data-c="30">30問</button><button class="chip on" data-c="0">全部</button></div>'
    + '<div class="row" style="margin-top:10px"><label><input type="checkbox" id="onlyNew"> 未挑戦だけ</label><label><input type="checkbox" id="testMode" '+(DB.settings.testMode?"checked":"")+'> テスト形式（解説は最後にまとめて）</label></div>'
    + '<p><button class="btn big" onclick="startFromHome()">この範囲でスタート</button></p>'
    + '<p class="muted">同じ本の問題をそのまま出します。問題番号は本の通し番号です。</p></div>';
  app.innerHTML = h;
  chipGroup("chChips", true); chipGroup("modeChips", false); chipGroup("cntChips", false);
}
function chipGroup(id, multi){
  const el=document.getElementById(id); if(!el) return;
  el.addEventListener("click", e=>{ const b=e.target.closest(".chip"); if(!b) return; if(multi) b.classList.toggle("on"); else { el.querySelectorAll(".chip").forEach(c=>c.classList.remove("on")); b.classList.add("on"); } });
}
function selectedIn(id){ const el=document.getElementById(id); return el? [...el.querySelectorAll(".chip.on")].map(b=>b.dataset): []; }
function startFromHome(){
  const from = parseInt(document.getElementById("rngFrom").value,10), to = parseInt(document.getElementById("rngTo").value,10);
  const sec = document.getElementById("secSel").value;
  let ns;
  if(!isNaN(from)||!isNaN(to)){ ns = QUESTIONS.filter(q=>(isNaN(from)||q.n>=from)&&(isNaN(to)||q.n<=to)).map(q=>q.n); }
  else { const chs = selectedIn("chChips").map(d=>+d.ch); ns = QUESTIONS.filter(q=>chs.includes(q.chapter)).map(q=>q.n); }
  if(sec) ns = ns.filter(n=>Q[n].section===sec);
  if(document.getElementById("onlyNew").checked) ns = ns.filter(n=>!(DB.per[n]&&DB.per[n].att>0));
  DB.settings.testMode = document.getElementById("testMode").checked; save();
  const mode = (selectedIn("modeChips")[0]||{}).m || "seq";
  const cnt = +((selectedIn("cntChips")[0]||{}).c || 0);
  if(mode==="rand") ns = shuffle(ns);
  if(cnt>0) ns = ns.slice(0,cnt);
  if(!ns.length){ alert("その範囲には問題がありません"); return; }
  startQuiz(ns, "範囲指定（"+ns.length+"問）");
}

/* ---------- corners ---------- */
function cornerDefs(){
return [
{key:"m1", label:"1回間違いコーナー", ns: missList(p=>p.miss===1)},
{key:"m2", label:"2回間違いコーナー", ns: missList(p=>p.miss===2)},
{key:"m3", label:"3回間違いコーナー", ns: missList(p=>p.miss===3)},
{key:"m4", label:"4回以上間違いコーナー", ns: missList(p=>p.miss>=4)},
{key:"mall", label:"間違えた問題ぜんぶ", ns: missList(p=>p.miss>0)},
{key:"fav", label:"⭐ お気に入り", ns: QUESTIONS.filter(q=>DB.per[q.n]&&DB.per[q.n].fav).map(q=>q.n)},
{key:"new", label:"🆕 まだ解いてない問題", ns: QUESTIONS.filter(q=>!(DB.per[q.n]&&DB.per[q.n].att>0)).map(q=>q.n)},
{key:"weak", label:"🎯 苦手な項目だけ（正答率60%未満の項目）", ns: weakSections()},
];
}
function weakSections(){
const bySec = {};
QUESTIONS.forEach(q=>{ (bySec[q.section]=bySec[q.section]||[]).push(q.n);});
let out=[];
Object.entries(bySec).forEach(([s,ns])=>{ const a=accuracy(ns); if(a!=null && a<60) out=out.concat(ns);});
return out;
}
function renderCorners(){
let h = '<div class="card"><h2>❌ 間違いコーナー</h2><p class="muted">間違えた回数ごとに自動で分かれます。同じ問題を正解すると回数は減りませんが、2回連続で正解すると「マスター」になって今日の復習セットから外れます。</p></div>';
cornerDefs().forEach((c,i)=>{
h += '<button class="corner" '+(c.ns.length?"":"disabled style=opacity:.45")+' onclick="startQuiz(window.__corners['+i+'].ns, window.__corners['+i+'].label)"><span>'+esc(c.label)+'</span><b>'+c.ns.length+'問</b></button>';

/* ---------- quiz engine ---------- */
function startQuiz(ns, label){
if(!ns ||!ns.length){ alert("問題がありません"); return;}
quiz = { list:[...ns], idx:0, answers:{}, label:label||"クイズ", startedAt:Date.now(), perQStart:Date.now(), checked:{}, orderSel:[], multiSel:[], testMode: DB.settings.testMode};
persistSession(); render();
}
function persistSession(){ if(quiz){ DB.session = { list:quiz.list, idx:quiz.idx, answers:quiz.answers, label:quiz.label, checked:quiz.checked};} else DB.session = null; save();}
function resumeSession(){ const s=DB.session; if(!s) return; quiz = { list:s.list, idx:s.idx, answers:s.answers||{}, label:s.label, startedAt:Date.now(), perQStart:Date.now(), checked:s.checked||{}, orderSel:[], multiSel:[], testMode: DB.settings.testMode}; render();}
function discardSession(){ DB.session=null; save(); render();}
function quitQuiz(){ persistSession(); quiz=null; setTab("home");}

let timerInt = null;
function renderQuiz(){
clearInterval(timerInt);
const q = Q[quiz.list[quiz.idx]];
const p = per(q.n);
const done =!!quiz.checked[q.n];
const total = quiz.list.length;
let h = '<div class="card">'
+ '<div class="row" style="justify-content:space-between"><span class="badge">'+esc(quiz.label)+'</span><span class="muted">'+(quiz.idx+1)+' / '+total+'問</span></div>'
+ '<div class="bar" style="margin:8px 0"><i style="width:'+Math.round(quiz.idx/total*100)+'%"></i></div>'
+ '<div class="row" style="justify-content:space-between"><span><b>Q'+q.n+'</b> <span class="badge">'+esc(q.section)+'</span> <span class="muted">第'+q.chapter+'章 '+esc(q.chapterTitle)+(q.source?' ・ '+esc(q.source):'')+'</span></span>'
+ '<span class="row"><span class="timer" id="qtimer"></span><button class="chip" onclick="toggleFav('+q.n+')">'+(p.fav?'⭐':'☆')+'</button></span></div>'
+ (p.miss? '<p><span class="badge ng">これまで '+p.miss+' 回間違えた問題</span>'+(p.mastered?' <span class="badge okb">マスター済み</span>':'')+'</p>':'')
+ (q.instruction? '<p class="muted">'+esc(q.instruction)+'</p>':'')
+ '<div class="qsentence">'+esc(q.sentence)+'</div>'
+ '<div class="row"><button class="chip" onclick="speak(Q['+q.n+'].sentence)">🔊 英文を聞く</button>'
+ '<button class="chip" onclick="toggleTrans()">訳文 '+(quiz.showTrans===undefined? (DB.settings.showTrans?'表示':'非表示'): (quiz.showTrans?'表示':'非表示'))+'</button></div>'
+ '<div id="transBox" class="muted" style="margin-top:6px">'+(((quiz.showTrans===undefined? DB.settings.showTrans: quiz.showTrans) && q.translation)? esc(q.translation):"")+'</div>'
+ '<div id="answerArea" style="margin-top:12px">' + answerAreaHTML(q, done) + '</div>'
+ '<div id="feedback"></div>'
+ '<div class="row" style="margin-top:12px">'
+ (done? '<button class="btn" style="flex:1" onclick="nextQ()">'+(quiz.idx+1>=total?'結果を見る':'次の問題へ')+'</button>': '<button class="btn sub" onclick="skipQ()">スキップ</button>')
+ '<button class="btn ghost" onclick="quitQuiz()">中断する</button></div>'
+ '<p class="kbd">PCでは 1〜4 キーで選択、Enterで次へ進めます</p>'
+ '</div>'
+ '<div class="card"><h3>📝 この問題のメモ</h3><textarea id="memoBox" placeholder="覚え方のコツなど">'+esc(p.memo||"")+'</textarea><button class="btn sub" onclick="saveMemo('+q.n+')">メモを保存</button></div>';
app.innerHTML = h;
if(DB.settings.timer &&!done){
const tick = ()=>{ const el=document.getElementById("qtimer"); if(!el){ clearInterval(timerInt); return;} const s=Math.floor((Date.now()-quiz.perQStart)/1000); el.textContent = "⏱ "+Math.floor(s/60)+":"+String(s%60).padStart(2,"0");};
tick(); timerInt = setInterval(tick, 500);
}
if(done) showFeedback(q, true);
}
function toggleTrans(){ const cur = quiz.showTrans===undefined? DB.settings.showTrans: quiz.showTrans; quiz.showTrans =!cur; renderQuiz();}
function toggleFav(n){ per(n).fav =!per(n).fav; save(); renderQuiz();}
function saveMemo(n){ per(n).memo = document.getElementById("memoBox").value; save(); alert("保存しました");}

function answerAreaHTML(q, done){
const prev = quiz.answers[q.n];
if(q.type==="mcq"){
return q.choices.map((c,i)=>{
let cls = "choice";
if(done){ if(i+1===q.answer) cls+=" correct"; else if(prev===i+1) cls+=" wrong";}
else if(prev===i+1) cls += " sel";
return '<button class="'+cls+'" onclick="pickMCQ('+q.n+','+(i+1)+')">'+["①","②","③","④","⑤","⑥"][i]+' '+esc(c)+'</button>';
}).join("") + (done?"":'<button class="btn big" onclick="checkCurrent()">答え合わせ</button>');
}
if(q.type==="multi"){
const sel = done? (prev||[]): quiz.multiSel;
return q.choices.map((c,i)=>'<button class="choice'+(sel.includes(i+1)?" sel":"")+'" onclick="pickMulti('+(i+1)+')">'+["①","②","③","④","⑤","⑥"][i]+' '+esc(c)+'</button>').join("")
+ '<p class="muted">当てはまるものを全部選んでください</p>' + (done?"":'<button class="btn big" onclick="checkCurrent()">答え合わせ</button>');
}
if(q.type==="fill"){
return '<input type="text" id="fillInput" style="width:100%" placeholder="空所に入る語句を入力（複数の空所はスペースやカンマで区切る）" value="'+(done? esc(prev||""):"")+'" '+(done?"disabled":"")+'>'
+ (done?"":'<p style="margin-top:10px"><button class="btn big" onclick="checkCurrent()">答え合わせ</button></p>');
}
if(q.type==="order"){
const sel = done? (prev||[]): quiz.orderSel;
const chips = q.choices.map((c,i)=>{ const used = sel.includes(i); return '<button class="word'+(used?" used":"")+'" onclick="pickWord('+i+')">'+(q.n===73? ["①","②","③","④","⑤","⑥"][i]+" ":"")+esc(c)+'</button>';}).join("");
const line = sel.map(i=> q.n===73? String(i+1): q.choices[i]).join(q.n===73? " - ": " ");
return '<div class="answerline">'+esc(line||"（下の語句を順番にタップ）")+'</div><div class="wordbank">'+chips+'</div>'
+ '<div class="row"><button class="btn ghost" onclick="undoWord()">1つ戻す</button>'+(done?"":'<button class="btn" onclick="checkCurrent()">答え合わせ</button>')+'</div>';
}
return "";
}
function pickMCQ(n, i){ if(quiz.checked[n]) return; quiz.answers[n]=i; if(DB.settings.testMode){ nextQAuto();} else renderQuiz();}
function pickMulti(i){ const n=quiz.list[quiz.idx]; if(quiz.checked[n]) return; const a=quiz.multiSel; const k=a.indexOf(i); if(k>=0) a.splice(k,1); else a.push(i); renderQuiz();}
function pickWord(i){ const n=quiz.list[quiz.idx]; if(quiz.checked[n]) return; if(!quiz.orderSel.includes(i)) quiz.orderSel.push(i); renderQuiz();}
function undoWord(){ quiz.orderSel.pop(); renderQuiz();}
function skipQ(){ quiz.answers[quiz.list[quiz.idx]] = quiz.answers[quiz.list[quiz.idx]]?? null; advance();}
function nextQAuto(){ advance();}
function advance(){
if(quiz.idx+1 >= quiz.list.length){ finishQuiz(); return;}
quiz.idx++; quiz.perQStart=Date.now(); quiz.orderSel=[]; quiz.multiSel=[];
persistSession(); renderQuiz(); window.scrollTo(0,0);
}
function nextQ(){ advance();}

function judge(q){
const a = quiz.answers[q.n];
if(q.type==="mcq") return a === q.answer;
if(q.type==="multi"){ const got=[...(a||[])].sort(), want=[...q.answer].sort(); return JSON.stringify(got)===JSON.stringify(want);}
if(q.type==="fill"){
const got = norm(a);
if(q.fillRequired) return q.fillRequired.every(r=> got.includes(norm(r)));
return got === norm(q.answerText);
}
if(q.type==="order"){
const sel = quiz.orderSel;
if(q.n===73) return sel.map(i=>i+1).join("-") === q.answerText;
return norm(sel.map(i=>q.choices[i]).join(" ")) === norm(q.answerText);
}
return false;
}
function collectAnswer(q){
if(q.type==="multi") quiz.answers[q.n] = [...quiz.multiSel];
else if(q.type==="fill"){ const el=document.getElementById("fillInput"); quiz.answers[q.n] = el? el.value: "";}
else if(q.type==="order") quiz.answers[q.n] = [...quiz.orderSel];
}
function checkCurrent(){
  const q = Q[quiz.list[quiz.idx]];
  collectAnswer(q);
  if(q.type==="mcq" && quiz.answers[q.n]==null){ alert("選択肢を選んでください"); return; }
  if(q.type==="multi" && !(quiz.answers[q.n]||[]).length){ alert("1つ以上選んでください"); return; }
  if(q.type==="order" && !(quiz.answers[q.n]||[]).length){ alert("語句をタップして並べてください"); return; }
  if(q.type==="fill" && !String(quiz.answers[q.n]||"").trim()){ alert("答えを入力してください"); return; }
  if(quiz.testMode){ advance(); return; }
  gradeOne(q);
  renderQuiz();
}
function gradeOne(q){
  const ok = judge(q);
  const p = per(q.n);
  p.att++; p.last = todayStr();
  if(ok){ p.ok++; p.streak++; if(p.streak>=2) p.mastered = true; }
  else { p.miss++; p.streak = 0; p.mastered = false; }
  quiz.checked[q.n] = ok;
  save(); persistSession();
  return ok;
}

function explHTML(q){
  let h = '<h3>📖 統合解説</h3><div class="expl"><b>【本書の解説】</b>\n'+esc(q.explanation)+'</div>';
  if(q.choiceNotes && q.choiceNotes.length){
    h += '<div class="expl" style="margin-top:8px"><b>【選択肢の解説】（モモが追加）</b>\n' + q.choiceNotes.map(function(c,i){
      const mark = c.verdict==="correct" ? "⭕正解" : (c.verdict==="part" ? "▸役割" : "❌不正解");
      return ["①","②","③","④","⑤","⑥"][i]+' '+esc(c.t)+' ― 意味：'+esc(c.meaning)+' ／ '+mark+'：'+esc(c.reason);
    }).join("\n") + '</div>';
  }
  if(q.extra) h += '<div class="extra"><b>【モモの補足】</b>\n'+esc(q.extra)+'</div>';
  return h;
}
function answerText(q){
if(q.type==="mcq") return ["①","②","③","④","⑤","⑥"][q.answer-1] + " " + q.choices[q.answer-1];
if(q.type==="multi") return q.answer.map(i=>["①","②","③","④","⑤","⑥"][i-1]+" "+q.choices[i-1]).join(" と ");
return q.answerText || "";
}
function filledSentence(q){
if(q.type!=="mcq" && q.type!=="multi") return "";
const ans = q.type==="mcq"? q.choices[q.answer-1]: q.answer.map(i=>q.choices[i-1]).join(" / ");
return q.sentence.replace(/\(\s*\)/, "( "+ans+")");
}
function showFeedback(q, replay){
const ok = quiz.checked[q.n];
const el = document.getElementById("feedback"); if(!el) return;
const fs = filledSentence(q);
el.innerHTML = '<div style="margin-top:12px"><span class="badge '+(ok?"okb":"ng")+'" style="font-size:15px">'+(ok?"⭕ 正解！":"❌ 不正解")+'</span>'
+ ' <b>正解: '+esc(answerText(q))+'</b></div>'
+ (fs? '<p class="muted">完成文: '+esc(fs)+' <button class="chip" onclick="speak(window.__fs)">🔊</button></p>':"")
+ (q.translation? '<p class="muted">訳: '+esc(q.translation)+'</p>':"")
+ explHTML(q)
window.__fs = fs;
}
function finishQuiz(){
  const list = quiz.list;
  const wasTest = quiz.testMode;
  if(wasTest){
    list.forEach(n=>{ const q=Q[n]; if(quiz.answers[n]!=null && quiz.checked[n]===undefined){ 
      // order answers were stored as index arrays in quiz.answers; judge() reads orderSel for order type, so adapt:
      if(q.type==="order"){ const keep=quiz.orderSel; quiz.orderSel = quiz.answers[n]; gradeOneSilent(q); quiz.orderSel = keep; }
      else gradeOneSilent(q);
    }});
  }
  let okCount = 0; const wrong = [];
  list.forEach(n=>{ if(quiz.checked[n]===true) okCount++; else if(quiz.checked[n]===false) wrong.push(n); });
  const answered = Object.keys(quiz.checked).length;
  DB.sessions.push({ date: todayStr(), label: quiz.label, total: answered, ok: okCount, at: Date.now() });
  const label = quiz.label;
  const checkedCopy = {...quiz.checked};
  DB.session = null; save();
  quiz = null;
  let h = '<div class="card" style="text-align:center"><h2>🎉 おつかれさま</h2>'
    + '<p style="font-size:26px"><b>'+okCount+' / '+answered+' 問正解</b>（'+(answered?Math.round(okCount/answered*100):0)+'%）</p>'
    + '<p class="muted">'+esc(label)+'</p>'
    + (wrong.length? '<button class="btn big" onclick="startQuiz(window.__wrong, \'間違えた問題だけ解き直し\')">間違えた '+wrong.length+' 問だけ解き直す</button><p></p>':"")
    + '<button class="btn sub big" onclick="setTab(\'home\')">ホームへ戻る</button></div>';
  window.__wrong = wrong;
  if(wasTest){
    h += '<div class="card"><h2>📖 解説まとめ（テスト形式）</h2>' + list.filter(n=>checkedCopy[n]!==undefined).map(n=>{ const q=Q[n]; return '<h3>Q'+n+'（'+esc(q.section)+'） '+(checkedCopy[n]?'⭕':'❌')+'</h3><p><b>正解: '+esc(answerText(q))+'</b></p>'+(q.translation?'<p class="muted">訳: '+esc(q.translation)+'</p>':'')+explHTML(q); }).join("") + '</div>';
  }
  app.innerHTML = h;
  document.querySelectorAll("nav.tab button").forEach(b=>b.classList.toggle("on", b.dataset.tab==="home"));
}
function gradeOneSilent(q){
  const ok = judge(q);
  const p = per(q.n);
  p.att++; p.last = todayStr();
  if(ok){ p.ok++; p.streak++; if(p.streak>=2) p.mastered = true; }
  else { p.miss++; p.streak = 0; p.mastered = false; }
  quiz.checked[q.n] = ok;
  return ok;
}
document.addEventListener("keydown", e=>{
if(!quiz) return;
const q = Q[quiz.list[quiz.idx]]; if(!q) return;
if(quiz.checked[q.n]!==undefined && e.key==="Enter"){ nextQ(); return;}
if(q.type==="mcq" && ["1","2","3","4","5","6"].includes(e.key)){ const i=+e.key; if(i<=q.choices.length) pickMCQ(q.n, i);}
});

/* ---------- list / search / study ---------- */
function renderList(){
let h = '<div class="card"><h2>📚 一覧・検索</h2>'
+ '<div class="row"><input type="text" id="qSearch" placeholder="キーワード・問題番号・英文" value="'+esc(listFilter.text)+'" style="flex:1">'
+ '<select id="qCh"><option value="all">全ての章</option>'+CHAPTERS.map(c=>'<option value="'+c[0]+'"'+(listFilter.chapter==String(c[0])?" selected":"")+'>第'+c[0]+'章 '+esc(c[1])+'</option>').join("")+'</select>'
+ '<select id="qStatus"><option value="all">状態: 全部</option><option value="miss">間違えたことあり</option><option value="fav">お気に入り</option><option value="new">未挑戦</option><option value="mastered">マスター済み</option></select></div>'
+ '<p class="muted">タップすると問題と解説が見られます（見るだけでは成績に記録されません）。この条件で一括出題もできます。</p>'
+ '<button class="btn" onclick="quizFromList()">この条件の問題を全部解く</button></div><div id="listBox"></div>';

const upd = ()=>{ listFilter.text = document.getElementById("qSearch").value; listFilter.chapter = document.getElementById("qCh").value; listFilter.status = document.getElementById("qStatus").value; drawList();};
document.getElementById("qSearch").addEventListener("input", upd);
document.getElementById("qCh").addEventListener("change", upd);
document.getElementById("qStatus").addEventListener("change", upd);
document.getElementById("qStatus").value = listFilter.status;
drawList();
}
function filteredQuestions(){
const t = norm(listFilter.text);
return QUESTIONS.filter(q=>{
if(listFilter.chapter!=="all" && q.chapter!==+listFilter.chapter) return false;
const p = DB.per[q.n];
if(listFilter.status==="miss" &&!(p&&p.miss>0)) return false;
if(listFilter.status==="fav" &&!(p&&p.fav)) return false;
if(listFilter.status==="new" && (p&&p.att>0)) return false;
if(listFilter.status==="mastered" &&!(p&&p.mastered)) return false;
if(t &&!(norm(q.sentence).includes(t) || norm(q.section).includes(t) || String(q.n)===listFilter.text.trim())) return false;
return true;
});
}
function drawList(){
const box = document.getElementById("listBox"); if(!box) return;
const fs = filteredQuestions();
box.innerHTML = '<p class="muted">'+fs.length+'問</p>' + fs.map(q=>{
const p = DB.per[q.n];
return '<button class="qlist" onclick="openDetail('+q.n+')"><b>Q'+q.n+'</b> <span class="badge">'+esc(q.section)+'</span> '
+ (p&&p.miss? '<span class="badge ng">×'+p.miss+'</span>':"") + (p&&p.mastered? '<span class="badge okb">マスター</span>':"") + (p&&p.fav?' ⭐':"")
+ '<br>'+esc(q.sentence.slice(0,90))+'</button>';
}).join("");
}
function quizFromList(){ const fs = filteredQuestions(); if(!fs.length){ alert("問題がありません"); return;} startQuiz(fs.map(q=>q.n), "一覧から出題（"+fs.length+"問）");}
function openDetail(n){

}
function toggleFavList(n){ per(n).fav=!per(n).fav; save(); openDetail(n);}

// last 14 days

h += '<div class="card"><h2>直近14日の学習量</h2><div class="daybar">' + days.map(d=>'<i style="height:'+Math.max(4, Math.round(d.tot/mx*48))+'px" title="'+d.ds+': '+d.tot+'問"></i>').join("") + '</div><p class="muted">'+days[0].ds+' 〜 '+days[13].ds+'</p></div>';
h += '<div class="card"><h2>🗒 間違いノート</h2><p class="muted">間違えた問題を回数が多い順に並べています。印刷して眺める用にも。</p>'
+ missList(p=>p.miss>0).sort((a,b)=>DB.per[b].miss-DB.per[a].miss).map(n=>{ const q=Q[n]; return '<p style="font-size:14px"><b>Q'+n+'</b> <span class="badge ng">×'+DB.per[n].miss+'</span> '+esc(q.sentence.slice(0,80))+'<br><span class="muted">正解: '+esc(answerText(q))+'</span></p>';}).join("")
+ (missList(p=>p.miss>0).length? '<button class="btn sub" onclick="window.print()">印刷する</button>':'<p class="muted">まだ間違いはありません</p>') + '</div>';
h += '<div class="card"><h2>最近のセッション</h2>' + (DB.sessions.slice(-10).reverse().map(s=>'<p style="font-size:14px;margin:4px 0">'+esc(s.date)+' ・ '+esc(s.label)+' ・ '+s.ok+'/'+s.total+'問正解</p>').join("") || '<p class="muted">まだありません</p>') + '</div>';
app.innerHTML = h;
}

/* ---------- settings ---------- */
function renderSettings(){
app.innerHTML = '<div class="card"><h2>⚙️ 設定</h2>'
+ '<p><label><input type="checkbox" id="setTimer" '+(DB.settings.timer?"checked":"")+'> 1問ごとのタイマーを表示</label></p>'
+ '<p><label><input type="checkbox" id="setTrans" '+(DB.settings.showTrans?"checked":"")+'> 訳文を最初から表示する</label></p>'
+ '<p>1日の目標問数 <input type="number" id="setGoal" value="'+DB.settings.dailyGoal+'" min="1" max="200"></p>'
+ '<p>文字サイズ <select id="setFont"><option value="15">小</option><option value="16">標準</option><option value="18">大</option><option value="20">特大</option></select></p>'
+ '<button class="btn" onclick="saveSettings()">設定を保存</button></div>'
+ '<div class="card"><h2>💾 データのバックアップ</h2><p class="muted">成績・間違い回数・メモはこの端末のブラウザに保存されています。機種変更やブラウザを変えるときは書き出して移してください。</p>'
+ '<div class="row"><button class="btn sub" onclick="exportData()">書き出す（コピー）</button><button class="btn sub" onclick="importData()">読み込む</button></div>'
+ '<textarea id="dataBox" placeholder="ここにデータが表示されます／読み込むときはここに貼り付け"></textarea></div>'
+ '<div class="card"><h2>⚠️ リセット</h2><button class="btn ghost" onclick="resetData()">成績データを全部消す</button></div>'
+ '<div class="card"><h2>このアプリについて</h2><p class="muted">UPGRADE 英文法・語法問題 四訂版（ユーザーの本のスキャン）から作成。収録範囲: '+esc(document.getElementById("coverageLine").textContent)+'。解説は本書の文をそのまま掲載し、補足はと明記しています。記述式・並べ替え形式の問題も本書通りの形式で収録しています。</p></div>';
document.getElementById("setFont").value = String(DB.settings.font||16);
}
function saveSettings(){
DB.settings.timer = document.getElementById("setTimer").checked;
DB.settings.showTrans = document.getElementById("setTrans").checked;
DB.settings.dailyGoal = Math.max(1, parseInt(document.getElementById("setGoal").value,10)||20);
DB.settings.font = +document.getElementById("setFont").value;
document.body.style.fontSize = DB.settings.font + "px";
save(); alert("保存しました");
}
function exportData(){ document.getElementById("dataBox").value = JSON.stringify(DB); document.getElementById("dataBox").select(); try{ navigator.clipboard.writeText(document.getElementById("dataBox").value);}catch(e){}}
function importData(){ try{ const d = JSON.parse(document.getElementById("dataBox").value); if(!d.per) throw 0; DB = d; save(); alert("読み込みました"); setTab("home");}catch(e){ alert("読み込めませんでした");}}
function resetData(){ if(confirm("成績・間違い回数・メモを全部消します。よろしいですか？")){ localStorage.removeItem(LS_KEY); DB = load(); save(); setTab("home");}}

render();
</script>
</body>
</html>
