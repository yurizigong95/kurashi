<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="かんご実習メーカー">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#A8506A">
<meta name="description" content="学習用の架空の事例（ペーパーペイシェント）で、看護過程を練習するアプリ">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" sizes="180x180" href="icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<title>かんご実習メーカー</title>
<script>
/* 読みこめなかったファイルを、あとで知らせるために覚えておく */
window.__careMissing = [];
function careMiss(el){ window.__careMissing.push(el.getAttribute('href') || el.getAttribute('src')); }
</script>
<style>
body{margin:0;background:#F7F3F4;color:#3A2A30;font-family:-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif}
#splash{position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;background:#F7F3F4;color:#A8506A;font-weight:700}
#loadfail{position:fixed;inset:0;z-index:200;display:flex;align-items:center;justify-content:center;padding:20px;background:#F7F3F4;font-size:15px;line-height:1.7}
#loadfail .box{max-width:460px;background:#fff;border-radius:18px;padding:20px 18px;box-shadow:0 8px 30px rgba(0,0,0,.12)}
#loadfail code{font-size:13px;background:#f4ecef;padding:1px 5px;border-radius:6px;word-break:break-all}
#loadfail button{display:block;width:100%;margin-top:10px;padding:12px;border-radius:999px;border:1px solid #A8506A;background:#fff;color:#3A2A30;font:inherit}
</style>
<link rel="stylesheet" href="css/app.css" onerror="careMiss(this)">
</head>
<body>

<div id="splash">
  <svg width="84" height="84" viewBox="0 0 84 84" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <rect x="8" y="10" width="68" height="64" rx="14" fill="#A8506A"/>
    <rect x="18" y="22" width="30" height="6" rx="3" fill="#fff" opacity=".95"/>
    <rect x="18" y="36" width="24" height="6" rx="3" fill="#fff" opacity=".7"/>
    <rect x="18" y="50" width="20" height="6" rx="3" fill="#fff" opacity=".7"/>
    <circle cx="58" cy="52" r="14" fill="#fff"/>
    <rect x="55" y="43" width="6" height="18" rx="2" fill="#A8506A"/>
    <rect x="49" y="49" width="18" height="6" rx="2" fill="#A8506A"/>
  </svg>
  <div>かんご実習メーカー</div>
</div>

<header>
  <div class="hrow">
    <h1 id="apptitle">事例</h1>
    <button type="button" id="synctag" class="st" data-act="sy-go"></button>
  </div>
  <!-- いつも出しておく注意（消さないでください） -->
  <div id="fictional" role="note">これは学習用の架空事例アプリです。実在の患者さんの情報は入力しないでください</div>
</header>
<main id="app"></main>
<nav id="nav"></nav>
<div id="toast" role="status" aria-live="polite"></div>

<!-- 読みこむ順番に意味があります（上のファイルの関数を、下のファイルが使います） -->
<script src="js/core.js" onerror="careMiss(this)"></script>
<script src="js/data.js" onerror="careMiss(this)"></script>
<script src="js/ai.js" onerror="careMiss(this)"></script>
<script src="js/model.js" onerror="careMiss(this)"></script>
<script src="js/sync.js" onerror="careMiss(this)"></script>
<script src="js/ui.js" onerror="careMiss(this)"></script>
<script src="js/cases.js" onerror="careMiss(this)"></script>
<script src="js/work.js" onerror="careMiss(this)"></script>
<script src="js/chat.js" onerror="careMiss(this)"></script>
<script src="js/set.js" onerror="careMiss(this)"></script>
<script src="js/main.js" onerror="careMiss(this)"></script>
<script>
/* ファイルが足りないときは、まっ白ではなく、直し方を出す */
(function(){
  function esc(s){ return String(s).replace(/[&<>"]/g, function(c){ return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' }[c]; }); }
  function check(){
    var missing = window.__careMissing.slice();
    if(window.__CARE_OK && !missing.length) return;
    var sp = document.getElementById('splash');
    if(sp) sp.style.display = 'none';
    if(document.getElementById('loadfail')) return;
    var box = document.createElement('div');
    box.id = 'loadfail';
    box.innerHTML = '<div class="box"><h2>アプリを開けませんでした</h2>' +
      (missing.length ? '<p>次のファイルが見つかりません：<br><code>' + missing.slice(0, 6).map(esc).join('</code><br><code>') + '</code></p>'
                      : '<p>中身を読みこめませんでした。</p>') +
      '<p><code>index.html</code> と同じ場所に、<code>css</code> と <code>js</code> のフォルダを置いてください。</p>' +
      '<button type="button" id="careReload">もう一度読みこむ</button>' +
      '<button type="button" id="careClean">しまってある古いファイルを消して読みこむ</button></div>';
    document.body.appendChild(box);
    document.getElementById('careReload').onclick = function(){ location.reload(); };
    document.getElementById('careClean').onclick = function(){
      var jobs = [];
      /* 消すのは、このアプリのものだけ（同じ場所のほかのアプリは消さない） */
      if('serviceWorker' in navigator) jobs.push(navigator.serviceWorker.getRegistrations().then(function(rs){
        return Promise.all(rs.filter(function(r){ return /\/care\/$/.test(r.scope); }).map(function(r){ return r.unregister(); }));
      }));
      if(window.caches) jobs.push(caches.keys().then(function(ks){ return Promise.all(ks.filter(function(k){ return k.indexOf('care-') === 0; }).map(function(k){ return caches.delete(k); })); }));
      Promise.all(jobs).then(function(){ location.reload(); }, function(){ location.reload(); });
    };
  }
  if(document.readyState === 'complete') setTimeout(check, 1200);
  else window.addEventListener('load', function(){ setTimeout(check, 1200); });
})();
</script>
</body>
</html>
