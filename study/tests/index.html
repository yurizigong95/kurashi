<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>もんだいメーカー テスト</title>
<style>
  :root{ --ok:#2F8F6B; --ng:#C8323A; --sub:#6b7b80; --bg:#f5f8f9; --ink:#20343A; --line:#e0e8ea; }
  @media (prefers-color-scheme: dark){ :root{ --bg:#141b1e; --ink:#e8eef0; --sub:#9bb0b7; --line:#2c393e; } }
  body{ margin:0; padding:16px; font:14px/1.6 system-ui,-apple-system,"Hiragino Sans",sans-serif; background:var(--bg); color:var(--ink); }
  h1{ font-size:18px; margin:0 0 4px; }
  p.lead{ margin:0 0 12px; color:var(--sub); }
  #sum{ font-weight:700; margin:8px 0 12px; }
  #sum.ok{ color:var(--ok); } #sum.ng{ color:var(--ng); }
  ol{ padding-left:22px; margin:0; }
  li{ padding:4px 0; border-bottom:1px solid var(--line); }
  li .t{ font-weight:600; }
  li.ok .mark{ color:var(--ok); } li.ng .mark{ color:var(--ng); } li.run .mark{ color:var(--sub); }
  li .msg{ display:block; color:var(--ng); white-space:pre-wrap; word-break:break-all; font-size:12px; }
  li .ms{ color:var(--sub); font-size:12px; margin-left:6px; }
  button{ font:inherit; padding:6px 14px; border-radius:999px; border:1px solid var(--line); background:transparent; color:inherit; cursor:pointer; }
  #frame iframe{ width:390px; height:700px; border:1px solid var(--line); border-radius:12px; background:#fff; margin-top:16px; }
  @media (max-width:820px){ #frame iframe{ width:100%; } }
</style>
</head>
<body>
<h1>もんだいメーカー 自動テスト</h1>
<p class="lead">アプリを本物と同じように動かして確かめます。AIは、にせもの（テスト用）に差しかえます。</p>
<button id="again">もう一度</button>
<div id="sum">準備しています…</div>
<ol id="list"></ol>
<div id="frame"></div>
<script src="kt.js"></script>
<script src="tests-base.js"></script>
<script src="tests-make.js"></script>
<script src="tests-drill.js"></script>
<script src="tests-files.js"></script>
<script src="tests-note.js"></script>
<script src="tests-sync.js"></script>
</body>
</html>
