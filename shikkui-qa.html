<script>
const DATA = [{"group": "厳選30", "title": "★★★厳選50問（確実なものだけ）", "unit": "本試験で出たテーマ（クラス共有情報）", "num": "1", "stars": "★★★", "labels": ["クラス共有情報より"], "problem": "高次脳機能障害のうち「失語」「失行」「失認」について、それぞれの特徴を述べよ。（本試験では「2つ以上の名前と特徴」が出た）", "answer": "失語＝言語の理解・表出の障害（聞く・話す・読む・書くが障害される）。失行＝麻痺などの運動障害がないのに、目的に合った動作ができない（道具の使い方が分からないなど）。失認＝視力・聴力などの感覚障害がないのに、見たり聞いたりした対象が何であるか分からない。", "point": "この3つはセットで覚える。高次脳機能障害には他に半側空間無視・注意障害・記憶障害・遂行機能障害がある。", "id": 0}, {"group": "厳選30", "title": "★★★厳選50問（確実なものだけ）", "unit": "本試験で出たテーマ（クラス共有情報）", "num": "2", "stars": "★★★", "labels": ["クラス共有情報より"], "problem": "運動性失語と感覚性失語の違いを述べよ。", "answer": "運動性失語（ブローカ失語）＝言葉を話すことが困難だが、言葉の理解は比較的保たれる。感覚性失語（ウェルニッケ失語）＝流暢に話すが言葉の理解が障害され、発話内容に誤りが多い。", "point": "損傷部位はブローカ野（運動性）とウェルニッケ野（感覚性）。「話せない／理解できない」の対比で覚える。", "id": 1}, {"group": "厳選30", "title": "★★★厳選50問（確実なものだけ）", "unit": "本試験で出たテーマ（クラス共有情報）", "num": "3", "stars": "★★★", "labels": ["クラス共有情報より"], "problem": "前立腺肥大症で排尿困難が起こるのはなぜか。（本試験では「尿道が狭くなる理由」と選択問題で出た）", "answer": "前立腺は膀胱の直下で尿道を取り囲むように存在するため、加齢で肥大すると前立腺部尿道が圧迫・狭窄され、排尿困難・残尿・頻尿が起こる。", "point": "症状は排尿困難・残尿感・頻尿・夜間頻尿。進行すると尿閉や水腎症の原因にもなる。", "id": 2}, {"group": "厳選30", "title": "★★★厳選50問（確実なものだけ）", "unit": "本試験で出たテーマ（クラス共有情報）", "num": "4", "stars": "★★★", "labels": ["クラス共有情報より"], "problem": "チアノーゼについて正しい記述はどれか。（本試験では正しい記述を選ぶ選択問題で出た）", "answer": "還元ヘモグロビン（酸素と結合していないヘモグロビン）が5g/dL以上になると出現し、口唇や爪床などが青紫色になる。", "point": "貧血では出現しにくく、多血症では出現しやすい、が定番のひっかけ。中枢性（動脈血の酸素不足）と末梢性（末梢血流のうっ滞）の区別も確認。", "id": 3}, {"group": "厳選30", "title": "★★★厳選50問（確実なものだけ）", "unit": "本試験で出たテーマ（クラス共有情報）", "num": "5", "stars": "★★★", "labels": ["クラス共有情報より"], "problem": "鉄欠乏性貧血の特徴を2つ述べよ。（本試験では「特徴ふたつ」が出た）", "answer": "①小球性低色素性貧血で、血清鉄・血清フェリチンが低下し、総鉄結合能（TIBC）が上昇する。②匙状爪（スプーン状爪）・舌炎・口角炎・異食症などの組織の鉄欠乏症状がみられる。", "point": "最も頻度の高い貧血。原因は月経過多・消化管出血・妊娠などによる需要増大。", "id": 4}, {"group": "厳選30", "title": "★★★厳選50問（確実なものだけ）", "unit": "本試験で出たテーマ（クラス共有情報）", "num": "6", "stars": "★★★", "labels": ["クラス共有情報より"], "problem": "門脈圧亢進症の徴候を3つ述べよ。（本試験では「3徴候」が出た）", "answer": "①脾腫　②腹水　③側副血行路の発達（食道・胃       '<div class="btns"><button class="act">答えを見る</button><button class="know'+(known[q.id]?' on':'')+'">'+(known[q.id]?'分かった✓':'分かったら✓')+'</button></div>';
    const ans=c.querySelector('.ans'), act=c.querySelector('.act'), know=c.querySelector('.know');
    act.onclick=()=>{ const open=ans.style.display==='block'; ans.style.display=open?'none':'block'; act.textContent=open?'答えを見る':'答えを隠す'; };
    know.onclick=()=>{ known[q.id]=!known[q.id]; try{localStorage.setItem('qa_known',JSON.stringify(known))}catch(e){} render(); };
    list.appendChild(c);
  });
  if(!shown) list.innerHTML='<div class="empty">この条件の問題は全部「分かった」になりました</div>';
  const done=DATA.filter(q=>known[q.id]).length;
  document.getElementById('prog').textContent='表示 '+shown+'問／分かった '+done+' / '+DATA.length+'問';
}
document.querySelectorAll('.chip[data-f]').forEach(b=>{ b.onclick=()=>{ document.querySelectorAll('.chip[data-f]').forEach(x=>x.classList.remove('on')); b.classList.add('on'); filter=b.dataset.f; render(); }; });
gsel.onchange=render;
document.getElementById('shuffle').onclick=()=>{ for(let i=order.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[order[i],order[j]]=[order[j],order[i]];} render(); };
render();
</script></body></html>
