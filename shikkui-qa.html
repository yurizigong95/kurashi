 "labels": ["スライドより"], "problem": "脳死とは、呼吸と循環の中枢である ① を含む全脳が、 ② な程度まで機能を喪失した状態である。", "answer": "① 脳幹　② 回復不能", "point": "全脳＝脳幹を含む点がポイント。心臓が動いていても脳死があり得る。", "id": 84}, {"group": "第1〜3回", "title": "第1回〜第3回 （病態生理学を学ぶための基礎知識：感染症／細胞・組織の障害・循環障害・腫瘍／先天異常・遺伝・老化と死・体液調節）", "unit": "老化・フレイルとサルコペニア・細胞死・死と脳死（第3回）", "num": "70", "stars": "★★", "labels": ["スライドより"], "problem": "脳死判定基準は、深昏睡・瞳孔が固定し左右とも ① mm以上・ ② 反射の消失・平坦脳波・自発呼吸の消失で、条件が満たされたのち ③ 時間経過をみて変化がないことを確認する。", "answer": "① 4　② 脳幹　③ 6", "point": "瞳孔4mm以上と6時間の数字が狙われる。", "id": 85}, {"group": "第1〜3回", "title": "第1回〜第3回 （病態生理学を学ぶための基礎知識：感染症／細胞・組織の障害・循環障害・腫瘍／先天異常・遺伝・老化と死・体液調節）", "unit": "老化・フレイルとサルコペニア・細胞死・死と脳死（第3回）", "num": "71", "stars": "★★★", "labels": ["国試より"], "problem": "第109回国家試験午前9問「死の三徴候に含まれるのはどれか」への答えは ① である。", "answer": "① 呼吸の停止", "point": "講義で③に丸。筋の弛緩・角膜の混濁・呼名反応の消失は三徴候に含まれない。", "id": 86}, {"group": "第1〜3回", "title": "第1回〜第3回 （病態生理学を学ぶための基礎知識：感染症／細胞・組織の障害・循環障害・腫瘍／先天異常・遺伝・老化と死・体液調節）", "unit": "体液調節・脱水・酸塩基平衡（第3回）", "num": "72", "stars": "★★★", "labels": ["スライドより"], "problem": "体液は体重の ① %を占め、その内訳は細胞内液 ② %、細胞外液 ③ %（間質液15%・血漿5%）である。", "answer": "① 60　② 40　③ 20", "point": "60＝40＋20、20＝15＋5。ちなみに血液は体重の8%。", "id": 87}, {"group": "第1〜3回", "title": "第1回〜第3回 （病態生理学を学ぶための基礎知識：感染症／細胞・組織の障害・循環障害・腫瘍／先天異常・遺伝・老化と死・体液調節）", "unit": "体液調節・脱水・酸塩基平衡（第3回）", "num": "73", "stars": "★★", "labels": ["スライドより"], "problem": "水分出納は摂取・排泄とも合計 ① mLでバランスする。摂取の内訳は飲料水1,200mL・食物に含まれる水1,000mL・ ② 水300mLである。", "answer": "① 2,500　② 代謝", "point": "排泄は尿1,500・皮膚600・呼気300・糞便100mL。最大項目は飲料水と尿。", "id": 88}, {"group": "第1〜3回", "title": "第1回〜第3回 （病態生理学を学ぶための基礎知識：感染症／細胞・組織の障害・循環障害・腫瘍／先天異常・遺伝・老化と死・体液調節）", "unit": "体液調節・脱水・酸塩基平衡（第3回）", "num": "74", "stars": "★★", "labels": ["スライドより"], "problem": "体内の水分量は ① の増減によって調節され、水分を減少させたいときは①量が増加する。体内のNaを増加させたいときは、尿中のナトリウムは ② する。", "answer": "① 尿　② 減少（保持される）", "point": "Na調節＝尿へのナトリウム排泄で調節する。増やしたい→排泄を減らす、の逆向きがひっかけ。", "id": 89}, {"group": "第1〜3回", "title": "第1回〜第3回 （病態生理学を学ぶための基礎知識：感染症／細胞・組織の障害・循環障害・腫瘍／先天異常・遺伝・老化と死・体液調節）", "unit": "体液調節・脱 ／先天異常・遺伝・老化と死・体液調節）", "unit": "体液調節・脱水・酸塩基平衡（第3回）", "num": "81", "stars": "★★★", "labels": ["スライドより"], "problem": "代謝性アルカローシスは多量の ① による胃液の喪失で起こり、糖尿病でインスリンが分泌されないと脂肪が分解されケトン体が蓄積する ② アシドーシスが起こる。", "answer": "① 嘔吐　② ケト", "point": "嘔吐＝酸を失う→アルカローシス。下痢はアルカリを失うので逆、と対比。", "id": 96}, {"group": "第1〜3回", "title": "第1回〜第3回 （病態生理学を学ぶための基礎知識：感染症／細胞・組織の障害・循環障害・腫瘍／先天異常・遺伝・老化と死・体液調節）", "unit": "体液調節・脱水・酸塩基平衡（第3回）", "num": "82", "stars": "★★★", "labels": ["国試より"], "problem": "講義で扱った国試問題「酸塩基平衡の異常と原因の組合せで正しいのはどれか」への答えは、 ① 性アシドーシス―慢性 ② 不全である。", "answer": "① 代謝　② 腎", "point": "講義で③に丸。誤りは代謝性アルカローシス―下痢、代謝性アシドーシス―嘔吐、呼吸性アシドーシス―過換気症候群。アシドーシスの治療薬としてメイロン（炭酸水素ナトリウム）が紹介された。", "id": 97}, {"group": "第4・5回", "title": "第4回・第5回 （皮膚・体温調節のしくみと病態生理／呼吸のしくみと病態生理）", "unit": "皮膚の構造と機能", "num": "1", "stars": "★★★", "labels": ["スライドより"], "problem": "皮膚は表面から ① 、 ② 、 ③ の三層構造である。", "answer": "① 表皮　② 真皮　③ 皮下組織", "point": "熱傷の深度や創傷の深さは、この三層のどこまで傷ついたかで決まる。順番を逆にしない。", "id": 98}, {"group": "第4・5回", "title": "第4回・第5回 （皮膚・体温調節のしくみと病態生理／呼吸のしくみと病態生理）", "unit": "皮膚の構造と機能", "num": "2", "stars": "★★★", "labels": ["スライドより"], "problem": "表皮を構成する細胞のうち、角化とターンオーバーを担うのは ① 、メラニンを産生するのは ② 、免疫防御を担うのは ③ である。", "answer": "① 角化細胞（ケラチン細胞）　② 色素細胞（メラニン細胞）　③ ランゲルハンス細胞", "point": "3つの細胞と働きの組み合わせが狙われる。ランゲルハンス細胞＝免疫、と結びつける。", "id": 99}, {"group": "第4・5回", "title": "第4回・第5回 （皮膚・体温調節のしくみと病態生理／呼吸のしくみと病態生理）", "unit": "皮膚の構造と機能", "num": "3", "stars": "★★", "labels": ["スライドより"], "problem": "表皮の層は表面から角質層・淡明層・ ① 層・ ② 層・ ③ 層の順であり、最下層は基底膜に接する。", "answer": "① 顆粒　② 有棘　③ 基底", "point": "表面→角質→淡明→顆粒→有棘→基底。新しい細胞は基底層で生まれる。", "id": 100}, {"group": "第4・5回", "title": "第4回・第5回 （皮膚・体温調節のしくみと病態生理／呼吸のしくみと病態生理）", "unit": "皮膚の構造と機能", "num": "4", "stars": "★★", "labels": ["スライドより"], "problem": "真皮には血管・汗腺・神経・ ① ・毛包があり、皮膚の ② や弾力を支え、栄養補給・体温調節・感覚受容に関わる。", "answer": "① 皮脂腺　② 強度", "point": "真皮は「中身が詰まった働きの層」。表皮には血管がないことも対比で覚える。", "id": 101}, {"group": "第4・5回", "title": "第4回・第5回 （皮膚・体温調節のしくみと病態生理／呼吸のしくみと病態生理）", "unit": "皮膚の構造と機能", "num": "5", "stars": "★★", "labels": ["スライドより"], ": "潰瘍の種類と原因の組み合わせとして、糖尿病性潰瘍は免疫力低下・創傷治癒遅延・神経障害・動脈硬化、静脈うっ滞性潰瘍は ① 、動脈性潰瘍は閉塞性動脈硬化症や ② 病が原因である。", "answer": "① 下肢静脈瘤や下肢静脈還流異常　② バージャー", "point": "静脈性＝うっ滞（戻れない）、動脈性＝閉塞（届かない）と原因の向きで区別する。", "id": 115}, {"group": "第4・5回", "title": "第4回・第5回 （皮膚・体温調節のしくみと病態生理／呼吸のしくみと病態生理）", "unit": "褥瘡・潰瘍・高齢者の皮膚", "num": "19", "stars": "★★★", "labels": ["スライドより"], "problem": "加齢により表皮菲薄化・真皮弾性低下が起こると皮膚バリア機能が低下して摩擦やズレに弱くなり、表皮剥離や ① （皮膚裂傷）が起こりやすくなる。また皮下脂肪の減少は ② への耐久性を下げ、褥瘡リスクを上げる。", "answer": "① スキンテア　② 圧迫", "point": "高齢者は「薄くなる・弾力が落ちる・皮脂が減る・皮下脂肪が減る」の4点セット。乾燥→皮膚亀裂→感染リスク上昇も続く。", "id": 116}, {"group": "第4・5回", "title": "第4回・第5回 （皮膚・体温調節のしくみと病態生理／呼吸のしくみと病態生理）", "unit": "熱傷", "num": "20", "stars": "★★★", "labels": ["教科書訂正より"], "problem": "浅達性II度熱傷の臨床症状は ① 性（痛みを感じる）であり、教科書に記載された「 ② 」はない、と熱傷診療ガイドラインの深度分類に合わせて覚える。", "answer": "① 有痛　② 知覚鈍麻", "point": "教科書訂正で明示された超頻出ひっかけ。知覚鈍麻があるのは深達性II度。「浅達性＝痛い」が正解。", "id": 117}, {"group": "第4・5回", "title": "第4回・第5回 （皮膚・体温調節のしくみと病態生理／呼吸のしくみと病態生理）", "unit": "熱傷", "num": "21", "stars": "★★★", "labels": ["スライドより"], "problem": "臨床症状による深度分類では、I度熱傷は紅斑・有痛性、浅達性II度熱傷は紅斑・水疱・有痛性で水疱を圧迫すると発赤が ① 、深達性II度熱傷は知覚鈍麻があり圧迫しても発赤が ② 、III度熱傷は黒色・褐色または白色で水疱（−）・ ③ 性である。", "answer": "① 消失する　② 消失しない　③ 無痛", "point": "圧迫テストと痛みの有無で浅達性と深達性を分ける表がそのまま出る可能性大。", "id": 118}, {"group": "第4・5回", "title": "第4回・第5回 （皮膚・体温調節のしくみと病態生理／呼吸のしくみと病態生理）", "unit": "熱傷", "num": "22", "stars": "★★★", "labels": ["スライドより"], "problem": "熱傷の程度で、障害が表皮のみで紅潮し数日で治るのは ① 度熱傷、真皮まで達し約10日で治るのは ② 熱傷、表皮・真皮の全層に及び自然治癒しないのは ③ 度熱傷である。", "answer": "① I　② 浅達性II度　③ III", "point": "治癒期間の数字（数日／約10日／約3週間／自然治癒しない）と深さの対応。", "id": 119}, {"group": "第4・5回", "title": "第4回・第5回 （皮膚・体温調節のしくみと病態生理／呼吸のしくみと病態生理）", "unit": "熱傷", "num": "23", "stars": "★★", "labels": ["スライドより"], "problem": "深達性II度熱傷の治癒期間は約 ① 週間であり、傷害組織は ② の深層までである。", "answer": "① 3　② 真皮", "point": "浅達性II度（約10日）と深達性II度（約3週間）を混同しない。", "id": 120}, {"group": "第4・5回", "title": "第4回・第5回 （皮膚・体温調節のしくみと病態生理／呼吸のしくみと病態生理）", "unit": "熱傷", "num": "24", "stars": "★★", "labels": ["スライドより"], "problem": "熱傷の治癒が変わって 合わせと入れ替えるひっかけに注意。", "id": 127}, {"group": "第4・5回", "title": "第4回・第5回 （皮膚・体温調節のしくみと病態生理／呼吸のしくみと病態生理）", "unit": "体温調節・発熱と解熱", "num": "31", "stars": "★★", "labels": ["スライドより"], "problem": "自律性体温調節反応のうち、外環境温が高いときは発汗による ① 性熱放散、低温のときは骨格筋の ② 熱産生や褐色脂肪組織での ③ 熱産生で調節される。", "answer": "① 蒸散　② ふるえ　③ 非ふるえ", "point": "発汗は蒸散性、血管の拡張・収縮は非蒸散性熱放散による調節。", "id": 128}, {"group": "第4・5回", "title": "第4回・第5回 （皮膚・体温調節のしくみと病態生理／呼吸のしくみと病態生理）", "unit": "体温調節・発熱と解熱", "num": "32", "stars": "★★★", "labels": ["事後課題より"], "problem": "感染などで生じた外因性発熱物質が単球・マクロファージを刺激すると ① 発熱物質（発熱性サイトカイン）が放出され、 ② E2が産生されて体温調節中枢のセットポイントが上昇し発熱する。", "answer": "① 内因性　② プロスタグランジン", "point": "事後課題1「発熱と解熱のしくみ（病態関連図）」そのもの。外因性→内因性→PGE2→セットポイント上昇の因果の鎖が核心。", "id": 129}, {"group": "第4・5回", "title": "第4回・第5回 （皮膚・体温調節のしくみと病態生理／呼吸のしくみと病態生理）", "unit": "体温調節・発熱と解熱", "num": "33", "stars": "★★★", "labels": ["スライドより"], "problem": "発熱物質が作用する体温調節中枢（セットポイントが設定される場所）は、脳の ① にある。", "answer": "① 視床下部", "point": "脳出血・脳腫瘍・頭蓋底骨折による体温調節中枢の圧迫（機械的刺激）でも発熱が起こることが関連図に示されている。", "id": 130}, {"group": "第4・5回", "title": "第4回・第5回 （皮膚・体温調節のしくみと病態生理／呼吸のしくみと病態生理）", "unit": "体温調節・発熱と解熱", "num": "34", "stars": "★★★", "labels": ["スライドより"], "problem": "セットポイントが上昇して体温が上がっていく時期には、熱産生の ① と熱放散の ② が起こり、 ③ 戦慄や皮膚血管の収縮がみられる。", "answer": "① 促進　② 抑制　③ 悪寒", "point": "事例Aさん（19歳女性、39度5分）の悪寒戦慄はこの時期のサイン。「寒いから震える」のではなく「体温を上げるために震える」。", "id": 131}, {"group": "第4・5回", "title": "第4回・第5回 （皮膚・体温調節のしくみと病態生理／呼吸のしくみと病態生理）", "unit": "体温調節・発熱と解熱", "num": "35", "stars": "★★★", "labels": ["スライドより"], "problem": "解熱はセットポイントが ① することで始まり、発汗や血管 ② による熱放散の促進で体温が下がる。", "answer": "① 下降　② 拡張", "point": "解熱鎮痛剤内服後に大量の発汗がみられた事例と対応。発汗は解熱の結果として起こる放散反応。", "id": 132}, {"group": "第4・5回", "title": "第4回・第5回 （皮膚・体温調節のしくみと病態生理／呼吸のしくみと病態生理）", "unit": "体温調節・発熱と解熱", "num": "36", "stars": "★★", "labels": ["スライドより"], "problem": "発熱の治療のうち、NSAIDs（非ステロイド性抗炎症薬）やアセトアミノフェンは ① の産生を抑えることで、ステロイド・抗炎症治療は ② 発熱物質の放出を抑えることで作用する。", "answer": "① プロスタグランジンE2　② 内因性", "point": "薬が関連図の「どこに効くか」を問う問題。クーリング（冷罨法）は体温そのものへの対処。", "id": 133}, {"group": "第4・5回", "title": "第4回・第5回 （皮膚・体温調節のしくみと病態生理／呼吸のしくみと病態生理）", "unit": "熱中症", "num": "37", "stars": "★★★", "labels": ["教科書訂正より"], "problem": "熱中症の重症度評価は「熱中症診療ガイドライン2024」により、 ① 度から ② 度までの分類となった。", "answer": "① I　② IV", "point": "教科書p.43の旧分類から変更された訂正事項。従来のIII度まで、と答えると誤り。", "id": 134}, {"group": "第4・5回", "title": "第4回・第5回 （皮膚・体温調節のしくみと病態生理／呼吸のしくみと病態生理）", "unit": "熱中症", "num": "38", "stars": "★★★", "labels": ["スライドより"], "problem": "熱中症I度は、めまい・立ちくらみ・大量の発汗・筋肉の硬直（こむら返り）などがみられ、 ① 障害を認めない段階で、通常は現場で対応可能である。", "answer": "① 意識", "point": "意識障害の有無がI度の線引き。治療はPassive Coolingと経口での水分・電解質補給。", "id": 135}, {"group": "第4・5回", "title": "第4回・第5回 （皮膚・体温調節のしくみと病態生理／呼吸のしくみと病態生理）", "unit": "熱中症", "num": "39", "stars": "★★", "labels": ["スライドより"], "problem": "熱中症II度では頭痛・嘔吐・倦怠感・集中力や判断力の低下（JCS≧1）がみられ、 ① での診療が必要である。IV度は深部体温 ② ℃以上かつGCS≦8で、Active Coolingを含めた早急な集学的治療を行う。", "answer": "① 医療機関　② 40.0", "point": "III度は深部体温39.9℃以下相当＋中枢神経症状・肝腎機能障害・血液凝固異常のいずれかを含む段階。", "id": 136}, {"group": "第4・5回", "title": "第4回・第5回 （皮膚・体温調節のしくみと病態生理／呼吸のしくみと病態生理）", "unit": "熱中症", "num": "40", "stars": "★★", "labels": ["スライドより"], "problem": "熱中症で発汗が続くと ① が喪失して脱水となり、深部体温の上昇は ② 凝固異常を招いて多臓器不全につながる。冷却のうち、自然な方法で体温を下げるものを ③ Cooling、冷却機器などで強制的に下げるものを ④ Coolingという。", "answer": "① ナトリウム　② 血液　③ Passive　④ Active", "point": "水分だけでなくナトリウム（電解質）補正が必要なのが熱中症看護の要点。", "id": 137}, {"group": "第4・5回", "title": "第4回・第5回 （皮膚・体温調節のしくみと病態生理／呼吸のしくみと病態生理）", "unit": "呼吸のしくみ・ガス交換・呼吸不全", "num": "41", "stars": "★★★", "labels": ["スライドより"], "problem": "肺胞でガス交換を行うために必要な重要な3要素は、 ① ・ ② ・血流である。", "answer": "① 換気　② 拡散", "point": "3要素のうち1つでも欠けるとガス交換が成立しない。", "id": 138}, {"group": "第4・5回", "title": "第4回・第5回 （皮膚・体温調節のしくみと病態生理／呼吸のしくみと病態生理）", "unit": "呼吸のしくみ・ガス交換・呼吸不全", "num": "42", "stars": "★★★", "labels": ["スライドより"], "problem": "肺胞の換気が行われていない（換気量が減少した）ためにガス交換ができない状態を ① 、血流が遮断されている（血流量が減少した）ためにガス交換ができない部分を ② という。", "answer": "① シャント　② 死腔", "point": "シャント＝血流はあるのに換気なし、死腔＝換気はあるのに血流なし。逆にしない。", "id": 139}, {"group": "第4・5回", "title": "第4回・第5回 （皮膚・体温調節のしくみと病態生理／呼吸のしくみと病態生理）", "unit": "呼吸のしくみ・ガス交換・呼吸不全", "num": "43", "stars": "★★★", "labels": ["スライドより"], "problem": "呼吸不全とは、動脈血酸素分圧（PaO2）が ① mmHg以下になる状態であり、正常のPaO2は ② 〜 ③ mmHgである。", "answer": "① 60　② 80　③ 100", "point": "数値問題の本命。「60以下」が呼吸不全の定義ライン。", "id": 140}, {"group": "第4・5回", "title": "第4回・第5回 （皮膚・体温調節のしくみと病態生理／呼吸のしくみと病態生理）", "unit": "呼吸のしくみ・ガス交換・呼吸不全", "num": "44", "stars": "★★★", "labels": ["スライドより"], "problem": "PaO2が60mmHg以下でPaCO2が45mmHg以下のものを ① 型呼吸不全、PaCO2が45mmHgを超えて高二酸化炭素血症を伴うものを ② 型呼吸不全といい、正常のPaCO2は ③ 〜 ④ mmHgである。", "answer": "① I　② II　③ 35　④ 45", "point": "II型はCO2の排出も低下する型。拡散能の高いCO2はI型では排出が保たれる。", "id": 141}, {"group": "第4・5回", "title": "第4回・第5回 （皮膚・体温調節のしくみと病態生理／呼吸のしくみと病態生理）", "unit": "呼吸器の主症状（呼吸困難・咳嗽・喀痰）", "num": "45", "stars": "★★★", "labels": ["先生のアドバイスより"], "problem": "高二酸化炭素血症は血液ガスで ① （酸性化）を示し、中枢性化学受容器を刺激して換気を促進する。一方、低酸素血症は ② 化学受容器による換気促進を引き起こす。", "answer": "① アシドーシス　② 末梢", "point": "先生のアドバイス「呼吸器系の主たる症状について病態や定義を説明できる」の対象。中枢＝CO2/H+、末梢＝O2低下、と対応させる。", "id": 142}, {"group": "第4・5回", "title": "第4回・第5回 （皮膚・体温調節のしくみと病態生理／呼吸のしくみと病態生理）", "unit": "呼吸器の主症状（呼吸困難・咳嗽・喀痰）", "num": "46", "stars": "★★", "labels": ["スライドより"], "problem": "動脈血中の ① ヘモグロビンが増加すると中心性 ② が現れる。", "answer": "① 還元　② チアノーゼ", "point": "中心性チアノーゼは舌や口唇など中心部にも出る。呼吸困難の関連図の終点の1つ。", "id": 143}, {"group": "第4・5回", "title": "第4回・第5回 （皮膚・体温調節のしくみと病態生理／呼吸のしくみと病態生理）", "unit": "呼吸器の主症状（呼吸困難・咳嗽・喀痰）", "num": "47", "stars": "★★", "labels": ["スライドより"], "problem": "不安・緊張による呼吸中枢の興奮（過換気症候群など）では、低 ① 血症となり、血液は ② に傾く。", "answer": "① 二酸化炭素　② アルカローシス", "point": "心因性呼吸困難の流れ。CO2を吐きすぎる→アルカローシス、が因果の向き。", "id": 144}, {"group": "第4・5回", "title": "第4回・第5回 （皮膚・体温調節のしくみと病態生理／呼吸のしくみと病態生理）", "unit": "呼吸器の主症状（呼吸困難・咳嗽・喀痰）", "num": "48", "stars": "★★★", "labels": ["スライドより"], "problem": "喀痰の性状のうち、肺炎や気管支拡張症などで細菌感染を伴うものは ① 性、肺がんや肺結核などで組織破壊によるものは ② 性、肺水腫や肺うっ血によるものは ③ 性である。", "answer": "① 膿　② 血　③ 泡沫", "point": "痰の性状→原因疾患の対応表は症状の病態として出やすい。漿液性＝上気道炎（透過性亢進）、粘稠性＝気管支炎の炎症、も合わせて。", "id": 145}, {"group": "第4・5回", "title": "第4回・第5回 （皮膚・体温調節のしくみと病態生理／呼吸のしくみと病態生理）", "unit": "呼吸器の主症状（呼吸困難・咳嗽・喀痰）", "num": "49", "stars": "★★", "labels": ["スライドより"], "problem": "呼吸困難の評価・原因検索に用いる検査には、胸部X線・CT・心電図・呼吸機能検査・血液ガス分析・心臓 ① 検査などがあり、血液ガスとともに ② （パルスオキシメーター）も用いられる。", "answer": "① エコー　② SpO2", "point": "検査を並べるだけでなく「疾患の同定→治療」につなげるのが関連図の考え方。", "id": 146}, {"group": "第4・5回", "title": "第4回・第5回 （皮膚・体温調節のしくみと病態生理／呼吸のしくみと病態生理）", "unit": "換気障害（閉塞性・拘束性）", "num": "50", "stars": "★★★", "labels": ["スライドより"], "problem": "閉塞性換気障害は「 ① ない」障害、拘束性換気障害は「 ② ない」障害と表現される。", "answer": "① 吐け　② 吸え", "point": "スライドの黄色強調そのもの。まずこの一言で2つを分ける。", "id": 147}, {"group": "第4・5回", "title": "第4回・第5回 （皮膚・体温調節のしくみと病態生理／呼吸のしくみと病態生理）", "unit": "換気障害（閉塞性・拘束性）", "num": "51", "stars": "★★★", "labels": ["スライドより"], "problem": "換気障害の分類図では、閉塞性は ① 率が70％未満に低下し、拘束性は ② が80％未満に低下する。両方が低下したものは ③ 性換気障害である。", "answer": "① 1秒　② ％肺活量　③ 混合", "point": "縦軸＝1秒率、横軸＝％肺活量の図。正常域は1秒率≧70％かつ％肺活量≧80％。", "id": 148}, {"group": "第4・5回", "title": "第4回・第5回 （皮膚・体温調節のしくみと病態生理／呼吸のしくみと病態生理）", "unit": "換気障害（閉塞性・拘束性）", "num": "52", "stars": "★★", "labels": ["スライドより"], "problem": "閉塞性肺疾患で吐けないのは、肺胞の構造がこわれて ① 力が失われ、胸腔内陰圧の低下に伴って気管支が圧迫され ② が生じるためである。", "answer": "① 収縮　② 狭窄", "point": "肺胞壁の破壊（肺気腫のしくみ）と直結。弾性収縮力が落ちるのが本質。", "id": 149}, {"group": "第4・5回", "title": "第4回・第5回 （皮膚・体温調節のしくみと病態生理／呼吸のしくみと病態生理）", "unit": "換気障害（閉塞性・拘束性）", "num": "53", "stars": "★★", "labels": ["スライドより"], "problem": "拘束性換気障害では、肺実質（間質）の ① ・肥厚による硬化で肺が拡張できなくなり、 ② が減少する。", "answer": "① 線維化　② 肺活量", "point": "肺コンプライアンス低下＝肺が硬くて広がらない。間質性肺炎・肺線維症が代表。", "id": 150}, {"group": "第4・5回", "title": "第4回・第5回 （皮膚・体温調節のしくみと病態生理／呼吸のしくみと病態生理）", "unit": "呼吸器疾患（肺炎・COPD・喘息・肺水腫・無気肺）", "num": "54", "stars": "★★★", "labels": ["スライドより"], "problem": "呼吸器の炎症は、炎症が起こる部位によって ① 炎、気管支炎、 ② 炎に分類され、いずれも細菌やウイルスなどの ③ 微生物への感染により急性の炎症が生じる疾患である。", "answer": "① 上気道　② 肺　③ 病原", "point": "部位による分類が基本。肺炎では胸部X線で浸潤影がみられる（スライドで赤囲み強調）。", "id": 151}, {"group": "第4・5回", "title": "第4回・第5回 （皮膚・体温調節のしくみと病態生理／呼吸のしくみと病態生理）", "unit": "呼吸器疾患（肺炎・COPD・喘息・肺水腫・無気肺）", "num": "55", "stars": "★★★", "labels": ["スライドより"], "problem": "肺炎の胸部X線で肺野にみられる白い陰影を ① 影という。1つの肺葉全体に炎症が広がる肺炎を ② 性肺炎という。", "answer": "① 浸潤　② 大葉", "point": "「浸潤影」はスライドで枠囲みされた用語。気管支肺炎との写真対比も出ていた。", "id": 152}, {"group": "第4・5回", "title": "第4回・第5回 （皮膚・体温調節のしくみと病態生理／呼吸のしくみと病態生理）", "unit": "呼吸器疾患（肺炎・COPD・喘息・肺水腫・無気肺）", "num": "56", "stars": "★★★", "labels": ["スライドより"], "problem": "肺炎では、肺実質の炎症により呼吸面積が減少して ① 血症となり、胸膜の炎症は ② を起こす。また喀痰による気道の通過障害は ③ 肺の原因となる。", "answer": "① 低酸素　② 胸痛　③ 無気", "point": "肺炎の関連図の終点3つ。発熱→代謝亢進→全身倦怠感、食欲低下・発汗→脱水の全身の流れもセット。", "id": 153}, {"group": "第4・5回", "title": "第4回・第5回 （皮膚・体温調節のしくみと病態生理／呼吸のしくみと病態生理）", "unit": "呼吸器疾患（肺炎・COPD・喘息・肺水腫・無気肺）", "num": "57", "stars": "★★★", "labels": ["先生のアドバイスより"], "problem": "間質性肺炎は肺 ① の炎症や線維化による疾患で、進むと肺胞壁が線維性に肥厚した ② 症となる。肺が硬くなり肺コンプライアンスが低下するため、 ③ 性換気障害を呈する。", "answer": "① 間質　② 肺線維　③ 拘束", "point": "肺胞性肺炎（肺胞の中の炎症）との炎症部位の違いが事前課題でも明示。間質＝壁側＝拘束性。", "id": 154}, {"group": "第4・5回", "title": "第4回・第5回 （皮膚・体温調節のしくみと病態生理／呼吸のしくみと病態生理）", "unit": "呼吸器疾患（肺炎・COPD・喘息・肺水腫・無気肺）", "num": "58", "stars": "★★★", "labels": ["スライドより"], "problem": "慢性閉塞性肺疾患（COPD）の原因は ① 煙であり、気流制限を伴う慢性の気管支炎が ② 的に進行した状態で、慢性気管支炎と ③ の2つからなる。", "answer": "① たばこ　② 不可逆　③ 肺気腫", "point": "「慢性気管支炎」「肺気腫」はスライドで赤枠強調。可逆的な喘息との違い（不可逆的）がポイント。", "id": 155}, {"group": "第4・5回", "title": "第4回・第5回 （皮膚・体温調節のしくみと病態生理／呼吸のしくみと病態生理）", "unit": "呼吸器疾患（肺炎・COPD・喘息・肺水腫・無気肺）", "num": "59", "stars": "★★★", "labels": ["スライドより"], "problem": "COPDの症状として、呼気延長・ ① 呼吸・ ② 指・胸鎖乳突筋の発達・るいそう・呼吸音減弱がみられ、検査では肺の過膨張所見と ③ 率の低下がみられる。", "answer": "① 口すぼめ　② ばち　③ 1秒", "point": "口すぼめ呼吸とばち指はスライドで赤字。ばち指の写真まで出ていた＝確実に押さえる。", "id": 156}, {"group": "第4・5回", "title": "第4回・第5回 （皮膚・体温調節のしくみと病態生理／呼吸のしくみと病態生理）", "unit": "呼吸器疾患（肺炎・COPD・喘息・肺水腫・無気肺）", "num": "60", "stars": "★★", "labels": ["スライドより"], "problem": "気管支喘息の発作時には、アレルゲンなどの誘因により気道炎症の悪化・浮腫の増強・平滑筋の ① ・ ② の貯留が起こり気道が狭くなる。非発作時にも好酸球の浸潤に伴う慢性の気道炎症と気道の ③ 亢進がある。", "answer": "① 収縮　② 粘液　③ 過敏性", "point": "喘息は「慢性炎症＋発作時の収縮」。COPD（不可逆）と喘息（発作性）の対比で整理。", "id": 157}, {"group": "第4・5回", "title": "第4回・第5回 （皮膚・体温調節のしくみと病態生理／呼吸のしくみと病態生理）", "unit": "呼吸器疾患（肺炎・COPD・喘息・肺水腫・無気肺）", "num": "61", "stars": "★★★", "labels": ["スライドより"], "problem": "肺水腫は、肺の ① 血管から漏出した過剰な水分が間質や肺胞内に貯留する状態で、肺胞壁が壊れて間質液や血球が漏出すると ② 色 ③ 痰がみられる。", "answer": "① 毛細　② ピンク　③ 泡沫", "point": "ピンク色泡沫痰＝肺水腫の代名詞。泡沫性喀痰（Q48）ともリンクする。", "id": 158}, {"group": "第4・5回", "title": "第4回・第5回 （皮膚・体温調節のしくみと病態生理／呼吸のしくみと病態生理）", "unit": "呼吸器疾患（肺炎・COPD・喘息・肺水腫・無気肺）", "num": "62", "stars": "★★", "labels": ["スライドより"], "problem": "肺水腫には心原性と非心原性があり、非心原性の代表は ① 症候群である。聴診では ② 音が聞かれ、症状が進むと起坐呼吸となる。治療には利尿薬や ③ 投与・人工呼吸器が用いられる。", "answer": "① 急性呼吸窮迫（ARDS）　② 水泡　③ 酸素", "point": "検査は胸部X線（蝶形陰影）、BNPなど。心原性かどうかで治療の軸が変わる。", "id": 159}, {"group": "第4・5回", "title": "第4回・第5回 （皮膚・体温調節のしくみと病態生理／呼吸のしくみと病態生理）", "unit": "呼吸器疾患（肺炎・COPD・喘息・肺水腫・無気肺）", "num": "63", "stars": "★★", "labels": ["スライドより"], "problem": "無気肺は、 ① により肺容量が低下した状態であり、気道の通過障害から始まって肺のガス交換障害・低酸素血症に至る。聴診では呼吸音の ② ・消失がみられる。", "answer": "① 肺虚脱　② 減弱", "point": "胸部X線で浸潤影、重症例では縦隔が患側へ偏位する。", "id": 160}, {"group": "第4・5回", "title": "第4回・第5回 （皮膚・体温調節のしくみと病態生理／呼吸のしくみと病態生理）", "unit": "呼吸器疾患（肺炎・COPD・喘息・肺水腫・無気肺）", "num": "64", "stars": "★★★", "labels": ["事後課題より"], "problem": "誤嚥性肺炎の事例（87歳女性・パーキンソン病）で発症前にみられたサインは、食事の際の ① の増加、前日のせき込みと ② 、普段36度台の人の ③ ℃の微熱、普段96〜97％のSpO2の ④ ％への低下であった。", "answer": "① むせ　② 嘔吐　③ 37.0　④ 94", "point": "事後課題2「誤嚥性肺炎（病態関連図）」の事例そのもの。「普段との違い」が異常の判断基準になるという看護の視点が問われる。", "id": 161}, {"group": "第4・5回", "title": "第4回・第5回 （皮膚・体温調節のしくみと病態生理／呼吸のしくみと病態生理）", "unit": "呼吸器疾患（肺炎・COPD・喘息・肺水腫・無気肺）", "num": "65", "stars": "★★", "labels": ["事後課題より"], "problem": "誤嚥性肺炎は、翌朝には体温が ① 度を超え、苦しそうな咳嗽がみられ、往診で ② 下葉の肺炎と診断されて抗菌薬が開始された。", "answer": "① 39　② 右", "point": "誤嚥したものは重力で右下葉に落ちやすい（右主気管支は太く垂直に近い）ことと結びつけて覚える。", "id": 162}, {"group": "第6・7回", "title": "第6回・第7回 循環器のしくみと病態生理／免疫のしくみと病態生理", "unit": "前回課題のフィードバック（発熱・誤嚥性肺炎）", "num": "1", "stars": "★★★", "labels": ["スライドより"], "problem": "発熱は、発熱物質の産生をきっかけに ① が産生され、体温調節中枢（視床下部）の ② が上昇し、熱産生の促進と熱放散の抑制が起こって生じる。", "answer": "① プロスタグランジンE2　② セットポイント", "point": "発熱時は悪寒戦慄と皮膚血管の収縮がみられる。NSAIDsやアセトアミノフェンは①の産生を抑えて解熱させる。", "id": 163}, {"group": "第6 くみと病態生理／免疫のしくみと病態生理", "unit": "循環器系の基礎と体循環・肺循環", "num": "8", "stars": "★★", "labels": ["スライドより"], "problem": "全身から戻った静脈血は、上大静脈・下大静脈から ① に流入し、 ② を経て肺動脈を流れ肺に入流する。肺からは肺静脈→ ③ → ④ と流れ込み、大動脈に血液が送り込まれる。", "answer": "① 右心房　② 右心室　③ 左心房　④ 左心室", "point": "血液の流れの順序問題は図6-2そのまま。「右→肺→左→全身」の大きな流れを先に押さえる。", "id": 170}, {"group": "第6・7回", "title": "第6回・第7回 循環器のしくみと病態生理／免疫のしくみと病態生理", "unit": "循環器系の基礎と体循環・肺循環", "num": "9", "stars": "★★", "labels": ["スライドより"], "problem": "症候別看護のうち、この授業で扱う循環器の障害を示す症状は、 ① ・ ② ・ ③ の3つである。", "answer": "① チアノーゼ　② 不整脈　③ ショック", "point": "スライドで黄色強調された3症状。先生のアドバイス「循環器系の障害を示す症状の病態を説明できる」と直結する。", "id": 171}, {"group": "第6・7回", "title": "第6回・第7回 循環器のしくみと病態生理／免疫のしくみと病態生理", "unit": "心臓の構造と弁・冠動脈", "num": "10", "stars": "★★★", "labels": ["スライドより"], "problem": "「心房と心室の間の弁を ① 、心室からの出口の弁を ② と言い、血液の逆流を防いでいる」という記述は誤りである。正しくは、心房と心室の間の弁を ③ 、心室からの出口の弁を ④ という。", "answer": "① 心房弁　② 心室弁　③ 房室弁　④ 動脈弁", "point": "授業内クイズで赤塗り表示された誤文そのもの。再試験でも用語の正確さが問われる（アドバイスでも専門用語の正確さが強調された範囲）。", "id": 172}, {"group": "第6・7回", "title": "第6回・第7回 循環器のしくみと病態生理／免疫のしくみと病態生理", "unit": "心臓の構造と弁・冠動脈", "num": "11", "stars": "★★★", "labels": ["スライドより"], "problem": "心臓の4枚の弁膜のうち、房室弁は右の ① と左の ② 、動脈弁は ③ と ④ である。", "answer": "① 三尖弁　② 僧帽弁　③ 肺動脈弁　④ 大動脈弁", "point": "右＝三尖弁、左＝僧帽弁（二尖弁）。左右の入れ替えが典型的なひっかけ。", "id": 173}, {"group": "第6・7回", "title": "第6回・第7回 循環器のしくみと病態生理／免疫のしくみと病態生理", "unit": "心臓の構造と弁・冠動脈", "num": "12", "stars": "★★★", "labels": ["スライドより"], "problem": "① 動脈は心臓の栄養血管で、全血液量の ② ％が送られ、大動脈の ③ から分かれている。また、この動脈は ④ が少ない。", "answer": "① 冠（状）　② 5　③ 基部　④ 吻合", "point": "「吻合が少ない」は黄色強調。だから閉塞すると側副血行路で助けてもらえず、その先の心筋が壊死しやすい。", "id": 174}, {"group": "第6・7回", "title": "第6回・第7回 循環器のしくみと病態生理／免疫のしくみと病態生理", "unit": "心臓の構造と弁・冠動脈", "num": "13", "stars": "★", "labels": ["スライドより"], "problem": "右心房と左心房の間を仕切るのは ① 、右心室と左心室の間を仕切るのは ② である。", "answer": "① 心房中隔　② 心室中隔", "point": "心房と心室の間は房室中隔。図6-2の説明文から。", "id": 175}, {"group": "第6・7回", "title": "第6回・第7回 循環器のしくみと病態生理／免疫のしくみと病態生理", "unit": "心臓の構造と弁・冠動脈", "num": "14", "stars": "★★", "labels": ["スライドより"], "problem": "右心室から肺へ血液を送る血管は ① 、肺から左心房へ戻る血管は ② 、左心室から全身へ送る血管は ③ である。", "answer": "① 肺動脈　② 肺静脈　③ 大動脈", "point": "肺動脈には静脈血、肺静脈には動脈血が流れる。「動脈＝動脈血」ではない点がひっかけ。", "id": 176}, {"group": "第6・7回", "title": "第6回・第7回 循環器のしくみと病態生理／免疫のしくみと病態生理", "unit": "虚血性心疾患（狭心症・心筋梗塞）", "num": "15", "stars": "★★★", "labels": ["スライドより"], "problem": "冠動脈の狭窄や短時間の閉塞による一過性の虚血で起こるのが ① で、閉塞が継続して心筋の ② が起こるのが ③ である。", "answer": "① 狭心症（不安定狭心症）　② 壊死　③ 心筋梗塞", "point": "最大の違いは「心筋が壊死するか、しないか」。狭心症＝虚血でとどまる、心筋梗塞＝壊死する。", "id": 177}, {"group": "第6・7回", "title": "第6回・第7回 循環器のしくみと病態生理／免疫のしくみと病態生理", "unit": "虚血性心疾患（狭心症・心筋梗塞）", "num": "16", "stars": "★★★", "labels": ["スライドより"], "problem": "動脈硬化による ① 性プラークの ② により冠動脈が狭窄・閉塞すると、閉塞部位の先にある心筋が ③ に陥る。", "answer": "① アテローム　② 破綻　③ 虚血", "point": "図6-5の説明文そのまま。プラークの「破綻」が急性発症の引き金になる。", "id": 178}, {"group": "第6・7回", "title": "第6回・第7回 循環器のしくみと病態生理／免疫のしくみと病態生理", "unit": "虚血性心疾患（狭心症・心筋梗塞）", "num": "17", "stars": "★★", "labels": ["スライドより"], "problem": "① 性狭心症は、動脈硬化によって血液が通りにくくなった部分があり、労作により ② 需要が増えた時に虚血によって胸痛などの症状が発現する。", "answer": "① 労作　② 酸素", "point": "非発作時は器質的な異常はみられにくい。階段を上る図＝労作時発作が目印。", "id": 179}, {"group": "第6・7回", "title": "第6回・第7回 循環器のしくみと病態生理／免疫のしくみと病態生理", "unit": "虚血性心疾患（狭心症・心筋梗塞）", "num": "18", "stars": "★★", "labels": ["スライドより"], "problem": "① 性狭心症は、何らかのきっかけで冠動脈が ② をおこすことで心筋が虚血に陥るもので、労作時ではなく安静時に発作が起こりやすい。", "answer": "① 冠攣縮　② 攣縮", "point": "労作性＝「需要が増えて供給不足」、冠攣縮性＝「血管がけいれんして供給が止まる」。原因の違いで区別する。", "id": 180}, {"group": "第6・7回", "title": "第6回・第7回 循環器のしくみと病態生理／免疫のしくみと病態生理", "unit": "虚血性心疾患（狭心症・心筋梗塞）", "num": "19", "stars": "★★", "labels": ["スライドより"], "problem": "虚血性心疾患の病態の流れは、動脈硬化→ ① の形成→冠動脈の狭窄→心筋への ② 供給の減少→狭心症、冠動脈の急性閉塞→心筋壊死→ ③ である。", "answer": "① アテローム性プラーク　② 酸素　③ 心筋梗塞", "point": "原因→結果の流れで覚える型の問題。アドバイスの「原因→結果のメカニズム理解」と同じ考え方。", "id": 181}, {"group": "第6・7回", "title": "第6回・第7回 循環器のしくみと病態生理／免疫のしくみと病態生理", "unit": "刺激伝導系と心臓の自動能（心収縮のしくみ）", "num": "20", "stars": "★★★", "labels": ["国試より"], "problem": "心臓の収縮・拡張のリズムを引き起こす歩調とり（ペースメーカー）は ① であり、プルキンエ線維ではない。また、自動性の源（はじまり）も ① である  "甲状腺機能 ① 症では基礎代謝率の上昇が刺激生成異常を起こし頻脈性不整脈に、甲状腺機能 ② 症では基礎代謝率の低下が興奮伝導異常を起こし徐脈性不整脈につながる。", "answer": "① 亢進　② 低下", "point": "不整脈の病態関連図から。電解質異常は心筋細胞の再分極に影響し、僧帽弁の病気は心房の負荷となり刺激生成異常を起こす。", "id": 195}, {"group": "第6・7回", "title": "第6回・第7回 循環器のしくみと病態生理／免疫のしくみと病態生理", "unit": "血管・静脈還流・深部静脈血栓症", "num": "34", "stars": "★★", "labels": ["スライドより"], "problem": "動脈は壁が ① 弾力性がある。静脈は ② が発達しておらず、動脈と比べて薄い。", "answer": "① 厚く　② 中膜", "point": "動脈は心臓から強い圧で押し出される血液を受けるため壁が厚い。", "id": 196}, {"group": "第6・7回", "title": "第6回・第7回 循環器のしくみと病態生理／免疫のしくみと病態生理", "unit": "血管・静脈還流・深部静脈血栓症", "num": "35", "stars": "★★★", "labels": ["スライドより"], "problem": "末梢静脈から心臓へ戻る静脈還流は、 ① ポンプ、 ② ポンプ、 ③ の3つの駆動力によって支配され、静脈弁が逆流を防いでいる。", "answer": "① 筋（筋肉）　② 呼吸　③ 心臓の吸引作用", "point": "3つをセットで答える問題として提示されたスライド。「3つの駆動力と静脈弁」がタイトルそのもの。", "id": 197}, {"group": "第6・7回", "title": "第6回・第7回 循環器のしくみと病態生理／免疫のしくみと病態生理", "unit": "血管・静脈還流・深部静脈血栓症", "num": "36", "stars": "★★★", "labels": ["スライドより"], "problem": "長時間同じ姿勢・手術・長期臥床・がん・妊娠などによる血流の ① →深部静脈に ② 形成→血栓が肺動脈を閉塞する ③ が、エコノミークラス症候群の病態である。", "answer": "① うっ滞　② 血栓　③ 肺血栓塞栓症", "point": "別名は深部静脈血栓症から起こる旅行者血栓症。災害時の避難所でも起こりやすいと示された（教科書p.122）。", "id": 198}, {"group": "第6・7回", "title": "第6回・第7回 循環器のしくみと病態生理／免疫のしくみと病態生理", "unit": "血管・静脈還流・深部静脈血栓症", "num": "37", "stars": "★★", "labels": ["スライドより"], "problem": "肺血栓塞栓症では、血栓が肺動脈を閉塞して ① 交換を障害し、 ② や ③ などの症状がおこる。血栓は、長期臥床後の ④ の再開によりはがれて血流にのって移動する。", "answer": "① ガス　② 呼吸困難　③ 胸痛　④ 活動", "point": "図6-17の説明文から。「動き始めた時」に血栓が飛ぶ点がひっかけになりやすい。", "id": 199}, {"group": "第6・7回", "title": "第6回・第7回 循環器のしくみと病態生理／免疫のしくみと病態生理", "unit": "血管・静脈還流・深部静脈血栓症", "num": "38", "stars": "★", "labels": ["スライドより"], "problem": "静脈弁は開閉することで、血液が ① に向かって ② するのを防いでいる。", "answer": "① 末梢　② 逆流", "point": "筋収縮で静脈が圧迫されると血液は心臓側へ押し出され、筋弛緩時は弁が閉じて逆流を防ぐ。", "id": 200}, {"group": "第6・7回", "title": "第6回・第7回 循環器のしくみと病態生理／免疫のしくみと病態生理", "unit": "動脈硬化症・大動脈瘤と大動脈解離", "num": "39", "stars": "★★★", "labels": ["スライドより"], "problem": "動脈硬化でプラークが形成される最初のステップは、 ① 細胞の ② である。これには ③ （悪玉コレステロール）の内膜への侵入が関係する。", "answer": "① 血管内皮　② 障害　③ LDL", "point": "赤枠と黄色マーカーで強調された一文そのもの。原因→結果の出発点を問う問題。", "id": 201}, {"group": "第6・7回", "title": "第6回・第7回 循環器のしくみと病態生理／免疫のしくみと病態生理", "unit": "動脈硬化症・大動脈瘤と大動脈解離", "num": "40", "stars": "★★", "labels": ["スライドより"], "problem": "動脈硬化症は、 ① が変性し動脈壁 ② の下へ蓄積した状態で、血管が硬くなり内腔が狭くなる。原因には高血圧・糖尿病・ ③ などがある。", "answer": "① コレステロール　② 内膜　③ 脂質異常症", "point": "教科書p.120。血管壁の異常として分類された。", "id": 202}, {"group": "第6・7回", "title": "第6回・第7回 循環器のしくみと病態生理／免疫のしくみと病態生理", "unit": "動脈硬化症・大動脈瘤と大動脈解離", "num": "41", "stars": "★★", "labels": ["スライドより"], "problem": "動脈硬化がおこると大動脈が硬くなり、 ① 期血圧は上昇する。一方、 ② 期血圧は高くならず下降する場合があり、結果として ③ が大きくなる。", "answer": "① 収縮　② 拡張　③ 脈圧", "point": "正常な大動脈は収縮期に押し広げられ、拡張期にもとに戻る作用で末梢へ血液を送る。この弾力が失われることが機序（表6-3）。", "id": 203}, {"group": "第6・7回", "title": "第6回・第7回 循環器のしくみと病態生理／免疫のしくみと病態生理", "unit": "動脈硬化症・大動脈瘤と大動脈解離", "num": "42", "stars": "★★", "labels": ["スライドより"], "problem": "大動脈の血管壁の一部が ① 状になったものを大動脈瘤という。大動脈解離では、内膜の亀裂（ ② ）による中膜の解離で ③ が形成される。本来の内腔は ④ という。", "answer": "① 瘤　② エントリー　③ 偽腔　④ 真腔", "point": "高血圧・動脈硬化などが背景。再流入孔はリエントリーと呼ばれる。", "id": 204}, {"group": "第6・7回", "title": "第6回・第7回 循環器のしくみと病態生理／免疫のしくみと病態生理", "unit": "ショック", "num": "43", "stars": "★★★", "labels": ["スライドより"], "problem": "ショックとは、 ① 循環不全に伴う組織・臓器の血流の不全状態で、 ② の低下により重要臓器の障害を伴う状態である。", "answer": "① 末梢　② 血圧", "point": "「血圧の低下」が赤字強調された定義。出血などによる循環血液量の減少と、抗原の侵入・細菌毒素などによる末梢血管拡張が、血圧低下への2つの道。", "id": 205}, {"group": "第6・7回", "title": "第6回・第7回 循環器のしくみと病態生理／免疫のしくみと病態生理", "unit": "ショック", "num": "44", "stars": "★★★", "labels": ["スライドより"], "problem": "急性心筋梗塞・重症弁膜症・重症不整脈などによる急性心不全で、心臓の ① 機能が急激に低下して起こるショックを ② ショックという。交感神経優位で頻脈が多く、末梢血管は収縮し、皮膚血流は低下し、 ③ がみられる。", "answer": "① ポンプ　② 心原性　③ 冷汗", "point": "表6-5の1行目。心臓自体が原因なので「ポンプ機能の急激な低下」と結びつける。", "id": 206}, {"group": "第6・7回", "title": "第6回・第7回 循環器のしくみと病態生理／免疫のしくみと病態生理", "unit": "ショック", "num": "45", "stars": "★★", "labels": ["スライドより"], "problem": "出血や脱水（ ① や ② など）により循環血液量が急激に減少して起こるショックを、循環血液量減少性ショックという。", "answer": "① 熱傷　② 熱中症", "point": "水・電解質異常や、血漿が血管外へ漏出することも循環血液量の減少につながる。", "id": 207}, {"group": "第6・7回", "title": "第6回・第7回 循環器のしくみと病態生理／免疫のしくみと病態生理", "unit": "ショック", "num": "46", "stars": "★★★", "labels": ["スライドより"], "problem": "敗血症や ① などにより血管容積が急激に増加して起こるショックを ② ショックという。初期は末梢血管が拡張し皮膚血流は増加する。一方、脊髄損傷や強い迷走神経反射などによる副交感神経興奮では ③ 脈となり、発汗が停止する。", "answer": "① アナフィラキシー　② 血液分布異常性　③ 徐", "point": "同じ血液分布異常性でも「頻脈が多いタイプ」と「副交感神経による徐脈タイプ」がある点が表6-5のひっかけ。", "id": 208}, {"group": "第6・7回", "title": "第6回・第7回 循環器のしくみと病態生理／免疫のしくみと病態生理", "unit": "ショック", "num": "47", "stars": "★★", "labels": ["スライドより"], "problem": "心タンポナーデや肺塞栓症など、心臓の外側の問題でポンプ機能が急激に低下するショックを ① ショックという。", "answer": "① 心外閉塞・拘束性", "point": "心原性ショックと並べて表に示された。「心臓そのもの」か「心臓の外の閉塞・拘束」かで区別する。", "id": 209}, {"group": "第6・7回", "title": "第6回・第7回 循環器のしくみと病態生理／免疫のしくみと病態生理", "unit": "血圧と高血圧", "num": "48", "stars": "★★★", "labels": ["スライドより"], "problem": "血圧は、 ① × ② で表される。", "answer": "① 心拍出量　② 全末梢血管抵抗", "point": "赤枠で大きく示された最重要公式。血圧の問題はすべてこの式から考える。", "id": 210}, {"group": "第6・7回", "title": "第6回・第7回 循環器のしくみと病態生理／免疫のしくみと病態生理", "unit": "血圧と高血圧", "num": "49", "stars": "★★", "labels": ["スライドより"], "problem": "心拍出量を増やす因子は、 ① の亢進（心拍数や心収縮力の増加）と、 ② （循環血液量）の増加であり、②には ③ の摂取が関係している。", "answer": "① 心機能　② 体液量　③ 塩分", "point": "血圧＝心拍出量×全末梢血管抵抗 の左側の因子。塩分→体液量増加→血圧上昇の流れは高血圧の基本。", "id": 211}, {"group": "第6・7回", "title": "第6回・第7回 循環器のしくみと病態生理／免疫のしくみと病態生理", "unit": "血圧と高血圧", "num": "50", "stars": "★★", "labels": ["スライドより"], "problem": "全末梢血管抵抗を増やす因子は、血液の ① と、 ② の収縮・緊張亢進である。", "answer": "① 粘性　② 細動脈", "point": "公式の右側の因子。血管が細く硬くなるほど抵抗が上がり血圧が上がる。", "id": 212}, {"group": "第6・7回", "title": "第6回・第7回 循環器のしくみと病態生理／免疫のしくみと病態生理", "unit": "血圧と高血圧", "num": "51", "stars": "★★★", "labels": ["スライドより"], "problem": "成人の血圧分類で、I度高血圧は収縮期血圧 ① mmHgまたは拡張期血圧 ② mmHgである。収縮期と拡張期が異なる分類に属する場合は ③ 方で判断する。", "answer": "① 140〜159　② 90〜99　③ 高い", "point": "正常血圧は120未満かつ80未満、正常高値120〜129、高値血圧130〜139または80〜89、II度は160〜179または100〜109、III度は180以上または110以上（高血圧管理・治療ガイドライン2025、教科書p.119）。", "id": 213}, {"group": "第6・7回", "title": "第6回・第7回 循環器のしくみと病態生理／免疫のしくみと病態生理", "unit": "血圧と高血圧", "num": "52", "stars": "★", "labels": ["スライドより"], "problem": "血圧とは、心臓の収縮によって拍出された血液が末梢の血管を ① 力をいう。心臓の収縮期の血圧を ② 、拡張期の血圧を ③ という。", "answer": "① 押し広げる　② 収縮期血圧　③ 拡張期血圧", "point": "教科書p.116の定義文そのまま。", "id": 214}, {"group": "第6・7回", "title": "第6回・第7回 循環器のしくみと病態生理／免疫のしくみと病態生理", "unit": "チアノーゼ", "num": "53", "stars": "★★★", "labels": ["スライドより"], "problem": "チアノーゼは、血流中の ① が不足し、唇や指先などの皮膚や粘膜が ② 色に変化した状態で、 ③ ヘモグロビン（還元ヘモグロビン）が増えることで起こる。", "answer": "① 酸素　② 青紫　③ 脱酸素化（デオキシ）", "point": "教科書p.123。先生のアドバイス「循環器系の障害を示す症状の病態」に該当する代表症状。", "id": 215}, {"group": "第6・7回", "title": "第6回・第7回 循環器のしくみと病態生理／免疫のしくみと病態生理", "unit": "チアノーゼ", "num": "54", "stars": "★★★", "labels": ["スライドより"], "problem": "「酸素と結合したヘモグロビンを還元ヘモグロビンという」は ① （○か×か）。「貧血時にはチアノーゼが出現しやすい」は ② （○か×か）。", "answer": "① ×　② ×", "point": "授業の○×問題で赤字表示された答え。還元ヘモグロビンは酸素を放したヘモグロビン。貧血ではヘモグロビン自体が少ないため、むしろチアノーゼは出現しにくい。", "id": 216}, {"group": "第6・7回", "title": "第6回・第7回 循環器のしくみと病態生理／免疫のしくみと病態生理", "unit": "チアノーゼ", "num": "55", "stars": "★★", "labels": ["スライドより"], "problem": "酸素供給不足・拡散障害・動静脈シャントにより動脈血中の還元ヘモグロビンが増加して起こるチアノーゼを ① 性、阻血・うっ血などによる部分的な血流の停滞で起こるものを ② 性という。", "answer": "① 中枢　② 末梢", "point": "中枢性は低酸素血症を伴う。肺でのガス交換障害により静脈血が十分に酸素化できないと還元ヘモグロビンが増加する、は○の問題だった。", "id": 217}, {"group": "第6・7回", "title": "第6回・第7回 循環器のしくみと病態生理／免疫のしくみと病態生理", "unit": "チアノーゼ", "num": "56", "stars": "★", "labels": ["スライドより"], "problem": "チアノーゼの観察では、口腔粘膜・ ① ・ ② ・耳介などの色をみる。また、指先がばちのようにふくれ爪と指の角度が ③ 度以上になった状態をばち指という。", "answer": "① 口唇　② 爪床　③ 180", "point": "正常な爪の角度は180度未満。ばち指は慢性的な低酸素状態と関連する所見として図で示された。", "id": 218}, {"group": "第6・7回", "title": "第6回・第7回 循環器のしくみと病態生理／免疫のしくみと病態生理", "unit": "心不全（事例：田中昭夫さん）", "num": "57", "stars": "★★★", "labels": ["事例より"], "problem": "心不全の患者が「横になると苦しくて眠れず、起きて椅子に座って過ごす」状態を ① という。臥位では下肢や腹腔にたまっていた血液が心臓に戻って ② が増悪し、座位では血液が下肢側にとどまって②が軽減するために起こる。", "answer": "① 起坐呼吸　② 肺うっ血", "point": "事例の事前学習で明示された課題。78歳・田中昭夫さんの訴えそのもので、「なぜ座ると楽なのか」を病態で説明できるようにする。", "id": 219}, {"group": "第6・7回", "title": "第6回・第7回 循環器のしくみと病態生理／免疫のしくみと病態生理", "unit": "心不全（事例：田中昭夫さん）", "num": "58", "stars": "★★★", "labels": ["事例より"], "problem": "左心のポンプ機能低下により ① に血液がうっ滞して呼吸困難や起坐呼吸を起こすのが ② 心不全、右心のポンプ機能低下により ③ にうっ滞して下肢浮腫・頸静脈怒張・体重増加を起こすのが ④ 心不全である。", "answer": "① 肺　② 左　③ 体循環（全身）　④ 右", "point": "事例の事前学習課題「右心不全と左心不全を区別して調べましょう」。田中さんは肺うっ血（左心側）と浮腫・頸静脈怒張（右心側）の両方の所見をもつ。", "id": 220}, {"group": "第6・7回", "title": "第6回・第7回 循環器のしくみと病態生理／免疫のしくみと病態生理", "unit": "心不全（事例：田中昭夫さん）", "num": "59", "stars": "★★★", "labels": ["事例より"], "problem": "① （LVEF）とは、左室が1回の収縮で拡張末期の容量の何％を拍出するかを示す値である。田中さんの値は ② ％と低下しており、左室の ③ 機能の低下を示す。", "answer": "① 左室駆出率　② 38　③ 収縮", "point": "事例の事前学習課題「LVEFとは何か、38％とはどういう状態か評価しましょう」。数値38％は事例本文とスライドの両方に明記。", "id": 221}, {"group": "第6・7回", "title": "第6回・第7回 循環器のしくみと病態生理／免疫のしくみと病態生理", "unit": "心不全（事例：田中昭夫さん）", "num": "60", "stars": "★★", "labels": ["事例より"], "problem": "田中さんは2週間前と比べて体重が ① kg増加し68kgとなり、下肢浮腫と ② の怒張がみられた。これは心不全で体内に ③ がたまった（うっ血した）ことを示す。", "answer": "① 3　② 頸静脈　③ 水分（体液）", "point": "心不全では「体重増加＝水分の貯留」。急な体重増加は増悪のサインとして事例で強調された数値。", "id": 222}, {"group": "第6・7回", "title": "第6回・第7回 循環器のしくみと病態生理／免疫のしくみと病態生理", "unit": "心不全（事例：田中昭夫さん）", "num": "61", "stars": "★★", "labels": ["事例より"], "problem": "心不全で前方への拍出が低下すると、 ① の低下、代償としての ② 、全身への酸素供給不足による ③ （易疲労感）、腎臓への血流低下による ④ の減少が起こる。", "answer": "① 血圧　② 頻脈　③ 倦怠感　④ 尿量", "point": "事例の事前学習課題「心不全でこれらの症状が起こるのはなぜか」。田中さんの入院時所見（軽度の血圧低下・頻脈・倦怠感・尿量減少）そのもの。", "id": 223}, {"group": "第6・7回", "title": "第6回・第7回 循環器のしくみと病態生理／免疫のしくみと病態生理", "unit": "心不全（事例：田中昭夫さん）", "num": "62", "stars": "★★", "labels": ["事例より"], "problem": "田中さんの食事は、塩分 ① g未満の心不全食と糖尿病食が提供され、薬物療法では体内の余分な水分を排出する ② や血圧を調整する薬、糖尿病の薬が処方された。入院後は ③ 安静とされた。", "answer": "① 6　② 利尿薬　③ ベッド上", "point": "塩分6g未満という具体的な数値が事例で黄色強調された。背景に高血圧と糖尿病（10年前に診断）があることも事例の読み取りポイント。", "id": 224}, {"group": "第6・7回", "title": "第6回・第7回 循環器のしくみと病態生理／免疫のしくみと病態生理", "unit": "免疫のしくみ", "num": "63", "stars": "★★★", "labels": ["休講分授業より"], "problem": "① 免疫は、B細胞が抗原の刺激を受けて ② 細胞に分化し、 ③ （免疫グロブリン）を産生して、体液中で抗原を中和・排除する免疫である。", "answer": "① 液性　② 形質　③ 抗体", "point": "休講分授業の必須課題Q1「液性免疫について簡単に説明してください」そのもの。主役は「抗体」。", "id": 225}, {"group": "第6・7回", "title": "第6回・第7回 循環器のしくみと病態生理／免疫のしくみと病態生理", "unit": "免疫のしくみ", "num": "64", "stars": "★★", "labels": ["休講分授業より"], "problem": "① 免疫は、T細胞が主役となり、ウイルス感染細胞や移植された組織などを直接攻撃して排除する免疫である。 ② 型アレルギーはこの免疫が関わる。", "answer": "① 細胞性　② IV", "point": "液性免疫（抗体が主役）と細胞性免疫（T細胞が主役）の対比が免疫単元の軸。", "id": 226}, {"group": "第6・7回", "title": "第6回・第7回 循環器のしくみと病態生理／免疫のしくみと病態生理", "unit": "免疫のしくみ", "num": "65", "stars": "★", "labels": ["事前課題より"], "problem": "免疫反応の ① は免疫不全を、免疫反応の ② はアレルギーや ③ 疾患を引き起こす。事前課題で指定された③疾患の代表は全身性エリテマトーデスと関節リウマチである。", "answer": "① 低下　② 過剰　③ 自己免疫", "point": "事前課題■4のタイトル「免疫反応の低下・過剰、自己免疫疾患」そのままの整理。", "id": 227}, {"group": "第6・7回", "title": "第6回・第7回 循環器のしくみと病態生理／免疫のしくみと病態生理", "unit": "アレルギー I型〜IV型", "num": "66", "stars": "★★★", "labels": ["先生のアドバイスより"], "problem": "I型アレルギーは ① 型とも呼ばれ、 ② 抗体が肥満細胞などに結合し、ヒスタミンなどが放出されて数分〜数十分で症状が出る。代表的な疾患は ③ ショック、花粉症、気管支喘息、蕁麻疹である。", "answer": "① 即時（アナフィラキシー）　② IgE　③ アナフィラキシー", "point": "アドバイスで明示された「I型〜IV型の特徴と代表的な疾患」の筆頭。休講分授業の課題Q2でも全型の説明が求められた。アナフィラキシーはショックの単元でも血液分布異常性ショックとして登場する。", "id": 228}, {"group": "第6・7回", "title": "第6回・第7回 循環器のしくみと病態生理／免疫のしくみと病態生理", "unit": "アレルギー I型〜IV型", "num": "67", "stars": "★★★", "labels": ["先生のアドバイスより"], "problem": "II型アレルギーは ① 型とも呼ばれ、 ② ・IgM抗体が細胞表面の抗原と結合し、補体の活性化や食作用により細胞が障害される。代表的な疾患は自己免疫性 ③ 性貧血、不適合輸血、新生児溶血性疾患などである。", "answer": "① 細胞障害（細胞融解）　② IgG　③ 溶血", "point": "「抗体が自分の細胞を攻撃して細胞が壊れる」型。血小板が障害される特発性血小板減少性紫斑病（ITP）も同じ型。", "id": 229}, {"group": "第6・7回", "title": "第6回・第7回 循環器のしくみと病態生理／免疫のしくみと病態生理", "unit": "アレルギー I型〜IV型", "num": "68", "stars": "★★★", "labels": ["先生のアドバイスより"], "problem": "III型アレルギーは ① 型とも呼ばれ、抗原と抗体の複合体が組織に沈着し、補体の活性化と好中球による炎症を起こす。代表的な疾患は ② 、関節リウマチ、血清病、糸球体腎炎である。", "answer": "① 免疫複合体　② 全身性エリテマトーデス（SLE）", "point": "SLEは事前課題■4でも指定された自己免疫疾患。「複合体が沈着する」ことがキーワード。", "id": 230}, {"group": "第6・7回", "title": "第6回・第7回 循環器のしくみと病態生理／免疫のしくみと病態生理", "unit": "アレルギー I型〜IV型", "num": "69", "stars": "★★★", "labels": ["先生のアドバイスより"], "problem": "IV型アレルギーは ① 型とも呼ばれ、抗体ではなく ② 細胞が主役となって、抗原との反応に24〜72時間かけて症状が出る。代表は ③ 反応、接触皮膚炎、移植片の拒絶反応である。", "answer": "① 遅延　② T　③ ツベルクリン", "point": "I型＝即時型とIV型＝遅延型の対比が最頻出。「抗体が関わらない唯一の型」という点がひっかけになる。", "id": 231}, {"group": "第6・7回", "title": "第6回・第7回 循環器のしくみと病態生理／免疫のしくみと病態生理", "unit": "アレルギー I型〜IV型", "num": "70", "stars": "★★", "labels": ["休講分授業より"], "problem": "アレルギーの4つの型のうち、IgEが関わるのは ① 型、免疫複合体が関わるのは ② 型、T細胞が関わるのは ③ 型、細胞表面の抗原への抗体が細胞を障害するのは ④ 型である。", "answer": "① I　② III　③ IV　④ II", "point": "休講分授業の課題Q2「I型〜IV型について簡単に説明してください」の総まとめ確認。主役（IgE／細胞への抗体／免疫複合体／T細胞）で4型を見分ける。", "id": 232}, {"group": "第8・9回", "title": "第8回・第9回 （筋骨格系：変形性関節症／血液・造血器：鉄欠乏性貧血／内分泌・代謝：糖尿病）", "unit": "変形性関節症（第8回・筋骨格系）", "num": "1", "stars": "★★★", "labels": ["スライドより"], "problem": "変形性関節症（OA）は、① を基盤として生じ、関節軟骨の ② と骨の増殖性変化（③ など）により、疼痛・腫脹・可動域制限・関節変形をきたす疾患である。", "answer": "① 加齢など　② 変性・摩耗　③ 骨棘", "point": "定義は学習目標そのもの。「軟骨がすり減る→骨が増殖して変形する」の流れで覚える。", "id": 233}, {"group": "第8・9回", "title": "第8回・第9回 （筋骨格系：変形性関節症／血液・造血器：鉄欠乏性貧血／内分泌・代謝：糖尿病）", "unit": "変形性関節症（第8回・筋骨格系）", "num": "2", "stars": "★★★", "labels": ["スライドより"], "problem": "変形性関節症の ① 性は明らかな要因を特定できないもの（例：加齢）であり、② 性は関節リウマチ・外傷・代謝異常など特定される原因があるものである。", "answer": "① 一次　② 二次", "point": "スライドで赤字強調された最重要の対比。二次性の原因には先天性形成不全、痛風、骨軟化症、Paget病、骨壊死なども含まれる。", "id": 234}, {"group": "第8・9回", "title": "第8回・第9回 （筋骨格系：変形性関節症／血液・造血器：鉄欠乏性貧血／内分泌・代謝：糖尿病）", "unit": "変形性関節症（第8回・筋骨格系）", "num": "3", "stars": "★★★", "labels": ["スライドより"], "problem": "変形性膝関節症の主な症候は、初期の ① の痛み（立ち上がり・歩き始め）と、末期の ② 、可動域制限、歩行困難である。", "answer": "① 動作開始時　② 安静時痛", "point": "「動き始めが痛い＝初期、じっとしていても痛い＝末期」。進行度の目安になる。", "id": 235}, {"group": "第8・9回", "title": "第8回・第9回 （筋骨格系：変形性関節症／血液・造血器：鉄欠乏性貧血／内分泌・代謝：糖尿病）", "unit": "変形性関節症（第8回・筋骨格系）", "num": "4", "stars": "★★★", "labels": ["スライドより"], "problem": "変形性股関節症は ① 性が多い。特徴的な跛行を ② 歩行という。", "answer": "① 二次　② トレンデレンブルグ", "point": "膝は一次性（Q3）、股は二次性が多い――この対比はひっかけの定番。赤字＋青字リンクで強調されていた。", "id": 236}, {"group": "第8・9回", "title": "第8回・第9回 （筋骨格系：変形性関節症／血液・造血器：鉄欠乏性貧血／内分泌・代謝：糖尿病）", "unit": "変形性関節症（第8回・筋骨格系）", "num": "5", "stars": "★★★", "labels": ["スライドより"], "problem": "治療法の比較：膝関節症の , "labels": ["国試より"], "problem": "肝硬変による肝性脳症で生じるのは ① と ② である（2つ）。", "answer": "① 異常行動　② 羽ばたき振戦", "point": "浮腫・くも状血管腫・メドゥーサの頭は肝硬変の所見ではあるが「脳症の症状ではない」という切り分けが問われた。羽ばたき振戦は手関節を背屈させると羽ばたくように震える所見。", "id": 305}, {"group": "第10・11回", "title": "第10回・第11回 消化器系疾患（胃がん・肝硬変を中心に）", "unit": "肝硬変", "num": "15", "stars": "★★★", "labels": ["国試より"], "problem": "C型肝炎から肝硬変になった患者が約1,100mLの吐血をし、血圧86/42mmHg、脈拍122回/分、顔面蒼白、冷汗を認めた。考えられる状態は ① である。", "answer": "① 食道静脈瘤破裂", "point": "肝硬変＋大量吐血＋血圧低下・頻脈・冷汗（出血性ショックの兆候）の組合せで診断する事例問題。数値ごと覚える。", "id": 306}, {"group": "第10・11回", "title": "第10回・第11回 消化器系疾患（胃がん・肝硬変を中心に）", "unit": "肝硬変", "num": "16", "stars": "★★★", "labels": ["国試より"], "problem": "食道静脈瘤破裂をきたしたとき、一時的な止血に使用するのは ① チューブで、バルーンで食道・胃を圧迫して止血する。", "answer": "① S-B（ゼングスターケン-ブレークモア／Sengstaken-Blakemore）", "point": "固有名詞がそのまま答えになる問題。根本治療は内視鏡的止血（事例でも緊急内視鏡止血術が行われた）。", "id": 307}, {"group": "第10・11回", "title": "第10回・第11回 消化器系疾患（胃がん・肝硬変を中心に）", "unit": "肝硬変", "num": "17", "stars": "★★★", "labels": ["先生のアドバイスより"], "problem": "肝硬変の原因の代表は、B型・C型などの ① 感染と、長年の ② である。", "answer": "① ウイルス（肝炎ウイルス）　② 飲酒（アルコール）", "point": "事例Iさんはアルコール性、国試事例はC型肝炎由来。「飲酒に起因する健康障害＝肝硬変」も国試で出た。原因を聞かれたらこの2本柱。", "id": 308}, {"group": "第10・11回", "title": "第10回・第11回 消化器系疾患（胃がん・肝硬変を中心に）", "unit": "肝硬変", "num": "18", "stars": "★★", "labels": ["国試より"], "problem": "重度の肝硬変で、基準値よりも低い値を示す血液検査項目は血清 ① である（ビリルビンとアンモニアは上昇、プロトロンビン時間は延長する）。", "answer": "① アルブミン〈Alb〉", "point": "アルブミンを作る力（合成能）が落ちるのが肝硬変の本質のひとつ。Q12と合わせて「Alb↓」は二方向から出ている。", "id": 309}, {"group": "第10・11回", "title": "第10回・第11回 消化器系疾患（胃がん・肝硬変を中心に）", "unit": "肝硬変", "num": "19", "stars": "★★", "labels": ["国試より"], "problem": "肝硬変におけるChild-Pugh〈チャイルド-ピュー〉分類の判定項目として国試で選ばれたのは、① 時間と血清 ② 値である。", "answer": "① プロトロンビン　② アルブミン", "point": "判定5項目は他にビリルビン・腹水・肝性脳症【補足】。血中アンモニア値・血小板数・尿酸値は判定項目ではない、が切り分けポイント。", "id": 310}, {"group": "第10・11回", "title": "第10回・第11回 消化器系疾患（胃がん・肝硬変を中心に）", "unit": "肝硬変", "num": "20", "stars": "★★", "labels": ["国試より"], "problem": "肝硬変で食道静脈瘤破裂後に退院する患者への食事指導で正しいのは、「① 食品を控える」と「② を控える」の2つである。", "answer": "① 固い　② 辛い香辛料", "point": "静脈瘤を傷つけたり刺激したりしない食事。高蛋白食にする・塩分は制限しない・食物繊維を控える、は誤り選択肢だった（食物繊維は便通を整えるので控えない）。", "id": 311}, {"group": "第10・11回", "title": "第10回・第11回 消化器系疾患（胃がん・肝硬変を中心に）", "unit": "肝硬変", "num": "21", "stars": "★★", "labels": ["国試より"], "problem": "肝硬変で皮下出血、腹水貯留および手指の振戦がある患者に対する食事で適切なのは ① 食である。", "answer": "① 塩分制限", "point": "腹水がある→塩分（と水分）を制限する、が判断の軸。高蛋白食は振戦（脳症の兆候）がある状態では不適切、と消去できる。", "id": 312}, {"group": "第10・11回", "title": "第10回・第11回 消化器系疾患（胃がん・肝硬変を中心に）", "unit": "肝硬変", "num": "22", "stars": "★★", "labels": ["国試より"], "problem": "門脈系の血管は2つある。① 静脈と ② 静脈である。", "answer": "① 脾　② 下腸間膜", "point": "門脈は脾静脈と腸間膜静脈（上・下）が合流してできる。肝静脈は門脈系ではない（肝臓から出ていく側）、がひっかけ。", "id": 313}, {"group": "第10・11回", "title": "第10回・第11回 消化器系疾患（胃がん・肝硬変を中心に）", "unit": "肝硬変", "num": "23", "stars": "★★", "labels": ["国試より"], "problem": "次の栄養素のうち、門脈を通って輸送されるのは ① で、脂肪（中性脂肪）や脂溶性ビタミンは ② を通る。", "answer": "① 糖質　② リンパ管", "point": "水溶性の栄養素は門脈→肝臓、脂質はリンパ管→（門脈を通らない）。消化器①の「脂肪酸の輸送経路＝リンパ管」と同じ話。", "id": 314}, {"group": "第10・11回", "title": "第10回・第11回 消化器系疾患（胃がん・肝硬変を中心に）", "unit": "肝硬変", "num": "24", "stars": "★★", "labels": ["国試より"], "problem": "待機的に行う食道静脈瘤硬化療法について正しいのは、「治療後に ① が出現する可能性がある」ことである。", "answer": "① 胸部痛", "point": "硬化剤注入後の合併症・症状として胸部痛が出る。治療翌日から常食・全身麻酔下で行う、などは誤り選択肢。", "id": 315}, {"group": "第10・11回", "title": "第10回・第11回 消化器系疾患（胃がん・肝硬変を中心に）", "unit": "肝硬変", "num": "25", "stars": "★★", "labels": ["国試より"], "problem": "食道静脈瘤の患者の看護で正しいのは、「吐物に ① が混入している場合は、すみやかな対処が必要である」ことである。", "answer": "① 血液", "point": "再破裂のサインを見逃さない。便の観察も必要（不要ではない）、一度治療しても再発することはある、も誤り選択肢の裏返しで覚える。", "id": 316}, {"group": "第10・11回", "title": "第10回・第11回 消化器系疾患（胃がん・肝硬変を中心に）", "unit": "肝硬変", "num": "26", "stars": "★", "labels": ["補足"], "problem": "肝硬変で門脈圧が亢進すると側副血行路が発達し、食道静脈瘤のほかに腹壁静脈の怒張＝① 、脾腫、直腸静脈瘤（痔）などが生じる。", "answer": "① メドゥーサの頭", "point": "門脈圧亢進→行き場のない血液が側副路へ、という原因→結果の流れ。脾腫は血小板減少の原因にもつながる。", "id": 317}, {"group": "第10・11回", "title": "第10回・第11回 消化器系疾患（胃がん・肝硬変を中心に）", "unit": "肝硬変", "num": "27", "stars": "★", "labels": ["補足"], "problem": "肝硬変で腹水がたまる機序は、門脈圧亢進に加え、血清 ① 低下による膠質浸透圧低下と、アルドステロン作用の亢進が重なるためである。", "answer": "① アルブミン", "point": "腹水＝「門脈圧↑＋Alb↓」の合わせ技。だから治療は塩分制限・利尿薬・アルブミン製剤が軸になる。", "id": 318}, {"group": "第10・11回", "title": "第10回・第11回 消化器系疾患（胃がん・肝硬変を中心に）", "unit": "肝硬変の関連図（事例Iさん）", "num": "28", "stars": "★★★", "labels": ["関連図より"], "problem": "事例のIさん（70歳男性）の肝硬変の原因は ① 性であり、強い意志と家族の支えで ② を継続していたが病気は進行した。", "answer": "① アルコール　② 断酒", "point": "関連図の出発点。原因が止まっても一度硬変した肝臓は元に戻らず進行する、という前提を押さえる。", "id": 319}, {"group": "第10・11回", "title": "第10回・第11回 消化器系疾患（胃がん・肝硬変を中心に）", "unit": "肝硬変の関連図（事例Iさん）", "num": "29", "stars": "★★★", "labels": ["関連図より"], "problem": "Iさんは「数時間前に血便が見られた」と電話相談し緊急訪問したところ、血圧 ① mmHg（普段は130/80程度）、脈拍 ② 回/分で、意識は清明ではなかった。", "answer": "① 95/50　② 100", "point": "「普段より血圧が低く頻脈＝出血が続いているサイン」と判断して救急受診につなげた事例。数値は関連図の矢印の根拠になるのでそのまま覚える。", "id": 320}, {"group": "第10・11回", "title": "第10回・第11回 消化器系疾患（胃がん・肝硬変を中心に）", "unit": "肝硬変の関連図（事例Iさん）", "num": "30", "stars": "★★★", "labels": ["関連図より"], "problem": "Iさんの出血の診断は ① 破裂で、緊急の ② による止血術を受けて入院し、約1週間で退院した。", "answer": "① 食道静脈瘤　② 内視鏡（内視鏡的止血術）", "point": "本人が「痔の出血」と解釈して気に留めていなかった、という経緯も含めて「肝硬変患者の消化管出血は静脈瘤破裂を疑う」が教訓。", "id": 321}, {"group": "第10・11回", "title": "第10回・第11回 消化器系疾患（胃がん・肝硬変を中心に）", "unit": "肝硬変の関連図（事例Iさん）", "num": "31", "stars": "★★★", "labels": ["関連図より"], "problem": "退院後に目立つようになった症状は、皮膚や白目（眼球結膜）が黄色くなる ① で、血液中の ② が処理できず蓄積するために起こる。", "answer": "① 黄疸　② ビリルビン", "point": "肝臓の処理能力低下→ビリルビン蓄積→黄疸、という関連図の主軸のひとつ。黄疸が進むにつれて次のかゆみが出てくる流れもセットで。", "id": 322}, {"group": "第10・11回", "title": "第10回・第11回 消化器系疾患（胃がん・肝硬変を中心に）", "unit": "肝硬変の関連図（事例Iさん）", "num": "32", "stars": "★★★", "labels": ["関連図より"], "problem": "黄疸に伴うIさんの全身のかゆみは塗り薬が効かなかったが、医師の指示による ① （炭酸水素ナトリウムを溶かしたお湯のおしぼりで身体を拭く）でかなり軽くなり、掻き壊しの傷もほぼなくなった。", "answer": "① 重曹清拭", "point": "事例の結論部分。かゆみ止めの内服を提案→重曹清拭が指示された、という展開ごと覚える。掻き壊しは感染の入口にもなるため、かゆみ対策自体が看護の要点。", "id": 323}, {"group": "第10・11回", "title": "第10回・第11回 消化器系疾患（胃がん・肝硬変を中心に）", "unit": "消化管の基礎（胃・腸のしくみ）", "num": "33", "stars": "★★★", "labels": ["小テストより", "国試より"], "problem": "McBurney〈マックバーニー〉点の圧痛を特徴とする疾患は ① で、圧痛点は図の ② の位置である。", "answer": "① 急性虫垂炎　② ③（右上前腸骨棘と臍を結ぶ線上）", "point": "小テスト問題3と国試問題14・24で三重に出た図問題。場所と疾患名を両方向で言えるように。", "id": 324}, {"group": "第10・11回", "title": "第10回・第11回 消化器系疾患（胃がん・肝硬変を中心に）", "unit": "消化管の基礎（胃・腸のしくみ）", "num": "34", "stars": "★★", "labels": ["国試より"], "problem": "胃から分泌される消化管ホルモンは ① で、胃酸分泌を促進する。一方、胃酸分泌を抑制するのは ② である。", "answer": "① ガストリン　② セクレチン", "point": "ガストリン＝促進、セクレチン＝抑制、の対比が2問に分かれて出た鉄板ペア。", "id": 325}, {"group": "第10・11回", "title": "第10回・第11回 消化器系疾患（胃がん・肝硬変を中心に）", "unit": "消化管の基礎（胃・腸のしくみ）", "num": "35", "stars": "★★", "labels": ["国試より"], "problem": "胃液に含まれ、たんぱく質の消化を助ける酵素は ① で、胃の主細胞から分泌される ② が塩酸で活性化されてできる。", "answer": "① ペプシン　② ペプシノゲン", "point": "「主細胞→ペプシノゲン」「主細胞由来のタンパク分解酵素→ペプシン」と、聞き方を変えて2回出た。壁細胞＝塩酸・内因子と対比する【補足】。", "id": 326}, {"group": "第10・11回", "title": "第10回・第11回 消化器系疾患（胃がん・肝硬変を中心に）", "unit": "消化管の基礎（胃・腸のしくみ）", "num": "36", "stars": "★★", "labels": ["国試より"], "problem": "正常な胃液のpHは ① で、胃液の説明としても「pH ② である」が正しいとされた。", "answer": "① pH1〜2　② 1.5〜2.0", "point": "数値問題はそのまま出る。胃液は1日に約500mLではなくもっと多い（約1.5〜2L）【補足】ため、量の選択肢は誤り。", "id": 327}, {"group": "第10・11回", "title": "第10回・第11回 消化器系疾患（胃がん・肝硬変を中心に）", "unit": "消化管の基礎（胃・腸のしくみ）", "num": "37", "stars": "★★", "labels": ["国試より"], "problem": "小腸で吸収された脂肪酸の輸送経路は ① で、大腸で主に吸収されるのは ② である。", "answer": "① リンパ管　② 水分", "point": "脂質はリンパ、水溶性栄養は門脈（Q23と対）。大腸は水分と電解質の吸収が仕事で、栄養素はほとんど吸収しない。", "id": 328}, {"group": "第10・11回", "title": "第10回・第11回 消化器系疾患（胃がん・肝硬変を中心に）", "unit": "消化管の基礎（胃・腸のしくみ）", "num": "38", "stars": "★★", "labels": ["国試より"], "problem": "便の性状と原因の組合せで正しいのは、「① 便―上部消化管出血」である。", "answer": "① タール（タール便）", "point": "血液が胃酸などで変性して黒くなる＝上部消化管出血。鮮紅色の下血は直腸など下部・肛門に近い出血（次問と対）。", "id": 329}, {"group": "第10・11回", "title": "第10回・第11回 消化器系疾患（胃がん・肝硬変を中心に）", "unit": "消化管の基礎（胃・腸のしくみ）", "num": "39", "stars": "★★", "labels": ["国試より"], "problem": "鮮紅色の下血が見られたときの出血部位は ① で、少量の胃出血を示す吐物の色は ② である。", "answer": "① 直腸　② 黒（コーヒー残渣様）", "point": "「鮮やかな赤＝出口に近い」「黒＝上部で変性」の色の原則で、吐血・下血の部位推定問題をまとめて解く。", "id": 330}, {"group": "第10・11回", "title": "第10回・第11回 消化器系疾患（胃がん・肝硬変を中心に）", "unit": "消化管の基礎（胃・腸のしくみ）", "num": "40", "stars": "★", "labels": ["国試より"], "problem": "食道について正しいのは2つある。粘膜は ① 上皮であることと、生理的狭窄部では ② の停滞が起こりやすいことである。", "answer": "① 重層扁平　② 食塊", "point": "食道の長さは成人で約25cm【補足】（60cmや50cmは誤り選択肢）。漿膜ではなく外膜で覆われるのも特徴。", "id": 331}, {"group": "第10・11回", "title": "第10回・第11回 消化器系疾患（胃がん・肝硬変を中心に）", "unit": "消化管の基礎（胃・腸のしくみ）", "num": "41", "stars": "★", "labels": ["国試より"], "problem": "成人において胃食道逆流を防ぐために、食後30分から1時間程度とるとよい体位は ① である。", "answer": "① 座位", "point": "食後すぐ横にならない、が指導の形でも出る。左側臥位・仰臥位は逆流を防ぐ答えにはならない。", "id": 332}, {"group": "第10・11回", "title": "第10回・第11回 消化器系疾患（胃がん・肝硬変を中心に）", "unit": "消化管の基礎（胃・腸のしくみ）", "num": "42", "stars": "★", "labels": ["国試より"], "problem": "排便のメカニズムで正しいのは ① の上昇であり、脊髄排便反射には ② 髄と骨盤神経が関与している。", "answer": "① 腹圧　② 仙", "point": "肛門括約筋は「収縮」ではなく弛緩で排便する、という誤り選択肢の見抜き方がセット。便が直腸へ移動すると排便反射が起こる（横行結腸ではない）。", "id": 333}, {"group": "第10・11回", "title": "第10回・第11回 消化器系疾患（胃がん・肝硬変を中心に）", "unit": "肝臓・胆嚢・膵臓の基礎", "num": "43", "stars": "★★", "labels": ["国試より"], "problem": "有害物質を無毒化し排泄する臓器は ① で、肝障害の指標となる血液生化学検査項目は ② である。", "answer": "① 肝臓　② ALT〈GPT〉", "point": "解毒＝肝臓の代表機能。ALTは肝細胞が壊れると血液中に漏れ出る酵素なので障害の指標になる。", "id": 334}, {"group": "第10・11回", "title": "第10回・第11回 消化器系疾患（胃がん・肝硬変を中心に）", "unit": "肝臓・胆嚢・膵臓の基礎", "num": "44", "stars": "★★", "labels": ["国試より"], "problem": "肝細胞で合成されるものは2つある。① と、血液凝固に関わる ② である。", "answer": "① アルブミン　② フィブリノゲン", "point": "インスリン・グルカゴンは膵臓、アドレナリンは副腎髄質。「肝臓で作る＝アルブミン・凝固因子」とまとめるとQ9（凝固因子の生成）も一緒に解ける。", "id": 335}, {"group": "第10・11回", "title": "第10回・第11回 消化器系疾患（胃がん・肝硬変を中心に）", "unit": "肝臓・胆嚢・膵臓の基礎", "num": "45", "stars": "★★", "labels": ["国試より"], "problem": "脂肪を乳化するのは ① で、膵液に含まれる脂肪分解酵素は ② 、蛋白質分解酵素は ③ である。", "answer": "① 胆汁　② リパーゼ　③ トリプシン", "point": "胆汁自体に消化酵素はない（乳化してリパーゼの働きを助ける）。酵素の対応表（アミラーゼ＝糖質、リパーゼ＝脂肪、トリプシン＝蛋白質）を丸ごと覚える。", "id": 336}, {"group": "第10・11回", "title": "第10回・第11回 消化器系疾患（胃がん・肝硬変を中心に）", "unit": "肝臓・胆嚢・膵臓の基礎", "num": "46", "stars": "★★", "labels": ["国試より"], "problem": "膵液について正しい , "answer": "① 脈圧", "point": "国試Q1。血圧が上昇して脈圧が開く・徐脈・呼吸異常がクッシング現象。頻脈や体温低下は逆。", "id": 391}, {"group": "第12・13回", "title": "第12回・第13回 脳・神経のはたらきと病態生理", "unit": "脳循環のしくみと脳血管障害", "num": "44", "stars": "★★", "labels": ["事前課題より"], "problem": "頭蓋内圧亢進症状の3主徴は、① 、嘔吐、② である。", "answer": "① 頭痛　② うっ血乳頭", "point": "ワークシート■5の「頭蓋内圧亢進症状とはどのような状態か」への答えの核。頭蓋の中の容積が増える（原因）→圧が上がる（結果）という流れで。", "id": 392}, {"group": "第12・13回", "title": "第12回・第13回 脳・神経のはたらきと病態生理", "unit": "脳循環のしくみと脳血管障害", "num": "45", "stars": "★★★", "labels": ["事前課題より"], "problem": "脳梗塞や脳出血で片麻痺が病巣と ① 側に出るのは、大脳の運動野や錐体路が障害され、その神経が交叉しているためである。", "answer": "① 反対", "point": "ワークシート■5の「症状がなぜ出現するのか理由を説明しましょう」への答え。小脳症状の同側（Q13）と必ずセットで対比する。", "id": 393}, {"group": "第12・13回", "title": "第12回・第13回 脳・神経のはたらきと病態生理", "unit": "脳循環のしくみと脳血管障害", "num": "46", "stars": "★★★", "labels": ["国試より"], "problem": "髄膜炎の診断に役立つ検査は、① 検査である。", "answer": "① 髄液", "point": "国試Q7の組合せ問題より確実な1つ。なお、この問題は「2つ選べ」だが、もう1つの正答は配布資料に解答がなく断定できない。多発性硬化症はCTではなくMRI、という誤りやすい組合せの区別で押さえる。", "id": 394}, {"group": "第12・13回", "title": "第12回・第13回 脳・神経のはたらきと病態生理", "unit": "脳循環のしくみと脳血管障害", "num": "47", "stars": "★★★", "labels": ["国試より"], "problem": "右足を引きずって歩き、「大丈夫」が「らいじょうぶ」になるなど、ろれつが回らない状態は、① 障害である。", "answer": "① 構音", "point": "国試Q15。構音障害は「発音」の問題で、言葉そのものの障害である失語と区別する。ろれつ＝構音と即答できるように。", "id": 395}, {"group": "第12・13回", "title": "第12回・第13回 脳・神経のはたらきと病態生理", "unit": "脳神経系の主な症状と代表的疾患", "num": "48", "stars": "★★★", "labels": ["国試より"], "problem": "意識障害を伴わないてんかん発作は、① 発作である。", "answer": "① 単純部分", "point": "国試Q8。欠神発作・強直間代発作・複雑部分発作はいずれも意識障害を伴う。「単純」＝意識が保たれる。", "id": 396}, {"group": "第12・13回", "title": "第12回・第13回 脳・神経のはたらきと病態生理", "unit": "脳神経系の主な症状と代表的疾患", "num": "49", "stars": "★★★", "labels": ["国試より"], "problem": "てんかんについて、症候性てんかんは ① を伴い、てんかん発作は脳の神経細胞の ② によって起こる。（2つ）", "answer": "① 脳内病変　② 発作性電気的興奮", "point": "国試Q9。痙攣とてんかんは同義ではないこと、単純部分発作では意識障害を認めないことも合わせて誤りの選択肢として押さえる。", "id": 397}, {"group": "第12・13回", "title": "第12回・第13回 脳・神経のはたらきと病態生理", "unit": "脳神経系の主な症状と代表的疾患", "num": "50", "stars": "★★★", "labels": ["国試より"], "problem": "パーキンソン病の症状で正しいのは、動作が ① になることである。", "answer": "① 緩慢", "point": "国試Q2。症状は対称ではなく一側から始まり、四肢の筋肉は弛緩ではなく強剛（固縮）する。羽ばたき振戦はパーキンソン病ではない。", "id": 398}, {"group": "第12・13回", "title": "第12回・第13回 脳・神経のはたらきと病態生理", "unit": "脳神経系の主な症状と代表的疾患", "num": "51", "stars": "★★★", "labels": ["国試より"], "problem": "パーキンソン病の患者は、① を振らずに歩く。", "answer": "① 腕", "point": "国試Q3。小刻み歩行・前傾姿勢・すくみ足も同じ疾患の歩行の特徴。満月様顔貌はクッシング症候群の症状。", "id": 399}, {"group": "第12・13回", "title": "第12回・第13回 脳・神経のはたらきと病態生理", "unit": "脳神経系の主な症状と代表的疾患", "num": "52", "stars": "★★", "labels": ["事前課題より"], "problem": "パーキンソン病は、中脳黒質の ① 神経細胞が変性して ① が不足することで起こる。", "answer": "① ドパミン", "point": "ワークシート■7で病態を調べる疾患。ドパミン不足（原因）→振戦・筋強剛・動作緩慢・姿勢保持障害の4大症状（結果）という流れで覚える。", "id": 400}, {"group": "第12・13回", "title": "第12回・第13回 脳・神経のはたらきと病態生理", "unit": "脳神経系の主な症状と代表的疾患", "num": "53", "stars": "★★★", "labels": ["国試より"], "problem": "アルツハイマー病では、脳に ① タンパクが蓄積する。", "answer": "① アミロイドβ", "point": "国試Q12。初期から記憶障害がみられ、MRIでは海馬・側頭葉内側の萎縮が特徴（前頭葉の萎縮ではない）。基礎に高血圧が多いのは血管性認知症。", "id": 401}, {"group": "第12・13回", "title": "第12回・第13回 脳・神経のはたらきと病態生理", "unit": "脳神経系の主な症状と代表的疾患", "num": "54", "stars": "★★★", "labels": ["国試より"], "problem": "片側性の末梢性顔面神経麻痺の症状は、① が垂れ下がることと、② にできるしわに左右差があることである。（2つ）", "answer": "① 口角　② 額", "point": "国試Q17。末梢性は額の筋まで麻痺するのが決め手（中枢性では額が保たれる）。顔面の知覚は三叉神経、物が二重に見えるのは眼の運動の神経の障害。", "id": 402}, {"group": "第12・13回", "title": "第12回・第13回 脳・神経のはたらきと病態生理", "unit": "脳神経系の主な症状と代表的疾患", "num": "55", "stars": "★★★", "labels": ["国試より"], "problem": "高次脳機能障害のある患者が買い物で示す「失行」の行動は、① の使い方が分からないことである。", "answer": "① 買い物かご", "point": "国試Q18。何を買いに来たか忘れる＝記憶障害、献立に合わせた買い物ができない＝遂行機能障害、道に迷う＝地誌的見当識障害と区別する。", "id": 403}, {"group": "第12・13回", "title": "第12回・第13回 脳・神経のはたらきと病態生理", "unit": "脳神経系の主な症状と代表的疾患", "num": "56", "stars": "★★", "labels": ["事前課題より"], "problem": "筋萎縮性側索硬化症〈ALS〉は ① ニューロンが変性する疾患で、筋萎縮と筋力低下が進行する一方、② や眼球運動は比較的保たれる。", "answer": "① 運動　② 感覚", "point": "ワークシート■7で病態と主な症候を調べる疾患。運動だけが障害されるため、感覚が保たれることが見分けるポイント。", "id": 404}, {"group": "第12・13回", "title": "第12回・第13回 脳・神経のはたらきと病態生理", "unit": "脳神経系の主な症状と代表的疾患", "num": "57", "stars": "★", "labels": ["事前課題より"], "problem": "痙攣は症状の名前であり、てんかん発作を繰り返す慢性の脳の疾患である ① と同義では ② 。", "answer": "① てんかん　② ない", "point": "ワークシート■6の「痙攣とてんかん」の項目。発作＝てんかんとは限らず、発熱や代謝異常でも痙攣は起こる。", "id": 405}];
const groups = [...new Set(DATA.map(q=>q.group))];
const gsel = document.getElementById('gsel');
groups.forEach(g=>{const o=document.createElement('option');o.value=g;o.textContent=g;gsel.appendChild(o)});
let filter='all', known={};
try{ known = JSON.parse(localStorage.getItem('qa_known')||'{}'); }catch(e){}
document.getElementById('hsub').textContent = '全'+DATA.length+'問／★★★ '+DATA.filter(q=>q.stars==='★★★').length+'問';
let order = DATA.map((_,i)=>i);
function match(q){
  if(gsel.value && q.group!==gsel.value) return false;
  if(filter==='s3' && q.stars!=='★★★') return false;
  if(filter==='test' && !q.labels.some(l=>l.includes('小テスト')||l.includes('国試'))) return false;
  if(filter==='yet' && known[q.id]) return false;
  return true;
}
function esc(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML}
function render(){
  const list=document.getElementById('list'); list.innerHTML='';
  let shown=0;
  order.forEach(i=>{ const q=DATA[i]; if(!match(q)) return; shown++;
    const c=document.createElement('div'); c.className='card'+(known[q.id]?' known':'');
    c.innerHTML = '<div class="meta"><span class="qnum">'+q.group+' Q'+q.num+'</span><span class="stars">'+q.stars+'</span>'+
      q.labels.map(l=>'<span class="lab">'+esc(l)+'</span>').join('')+
      '<span class="unit">'+esc(q.unit)+'</span></div>'+
      '<div class="problem">'+esc(q.problem)+'</div>'+
      '<div class="ans"><div class="a">答え：'+esc(q.answer)+'</div>'+(q.point?'<div class="p">ポイント：'+esc(q.point)+'</div>':'')+'</div>'+
      '<div class="btns"><button class="act">答えを見る</button><button class="know'+(known[q.id]?' on':'')+'">'+(known[q.id]?'分かった✓':'分かったら✓')+'</button></div>';
    const ans=c.querySelector('.ans'), act=c.querySelector('.act'), know=c.querySelector('.know');
    act.onclick=()=>{ const open=ans.style.display==='block'; ans.style.display=open?'none':'block'; act.textContent=open?'答えを見る':'答えを隠す'; };
    know.onclick=()=>{ known[q.id]=!known[q.id]; try{localStorage.setItem('qa_known',JSON.stringify(known))}catch(e){} render(); };
    list.appendChild(c);
  });
  if(!shown) list.innerHTML='<div class="empty">この条件の問題は全部「分かった」になりました</div>';
  const done=DATA.filter(q=>known[q.id]).length;
  document.getElementById('prog').textContent='表示 '+shown+'問／分かった '+done+' / '+DATA.length+'問';
}
document.querySelectorAll('.chip[data-f]').forEach(b=>{ b.onclick=()=>{ document.querySelectorAll('.chip[data-f]').forEach(x=>x.classList.remove('on')); b.classList.add('on'); filter=b.dataset.f; render(); }; });
gsel.onchange=render;
document.getElementById('shuffle').onclick=()=>{ for(let i=order.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[order[i],order[j]]=[order[j],order[i]];} render(); };
render();
</script></body></html>
