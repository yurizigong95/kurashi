<script>
const DATA = [{"group": "★★★厳選50", "title": "★★★厳選50問（確実なものだけ）", "unit": "本試験で出たテーマ（クラス共有情報）", "num": "1", "stars": "★★★", "labels": ["クラス共有情報より"], "problem": "高次脳機能障害のうち「失語」「失行」「失認」について、それぞれの特徴を述べよ。（本試験では「2つ以上の名前と特徴」が出た）", "answer": "失語＝言語の理解・表出の障害（聞く・話す・読む・書くが障害される）。失行＝麻痺などの運動障害がないのに、目的に合った動作ができない（道具の使い方が分からないなど）。失認＝視力・聴力などの感覚障害がないのに、見たり聞いたりした対象が何であるか分からない。", "point": "この3つはセットで覚える。高次脳機能障害には他に半側空間無視・注意障害・記憶障害・遂行機能障害がある。", "id": 0}, {"group": "★★★厳選50", "title": "★★★厳選50問（確実なものだけ）", "unit": "本試験で出たテーマ（クラス共有情報）", "num": "2", "stars": "★★★", "labels": ["クラス共有情報より"], "problem": "運動性失語と感覚性失語の違いを述べよ。", "answer": "運動性失語（ブローカ失語）＝言葉を話すことが困難だが、言葉の理解は比較的保たれる。感覚性失語（ウェルニッケ失語）＝流暢に話すが言葉の理解が障害され、発話内容に誤りが多い。", "point": "損傷部位はブローカ野（運動性）とウェルニッケ野（感覚性）。「話せない／理解できない」の対比で覚える。", "id": 1}, {"group": "★★★厳選50", "title": "★★★厳選50問（確実なものだけ）", "unit": "本試験で出たテーマ（クラス共有情報）", "num": "3", "stars": "★★★", "labels": ["クラス共有情報より"], "problem": "前立腺肥大症で排尿困難が起こるのはなぜか。（本試験では「尿道が狭くなる理由」と選択問題で出た）", "answer": "前立腺は膀胱の直下で尿道を取り囲むように存在するため、加齢で肥大すると前立腺部尿道が圧迫・狭窄され、排尿困難・残尿・頻尿が起こる。", "point": "症状は排尿困難・残尿感・頻尿・夜間頻尿。進行すると尿閉や水腎症の原因にもなる。", "id": 2}, {"group": "★★★厳選50", "title": "★★★厳選50問（確実なものだけ）", "unit": "本試験で出たテーマ（クラス共有情報）", "num": "4", "stars": "★★★", "labels": ["クラス共有情報より"], "problem": "チアノーゼについて正しい記述はどれか。（本試験では正しい記述を選ぶ選択問題で出た）", "answer": "還元ヘモグロビン（酸素と結合していないヘモグロビン）が5g/dL以上になると出現し、口唇や爪床などが青紫色になる。", "point": "貧血では出現しにくく、多血症では出現しやすい、が定番のひっかけ。中枢性（動脈血の酸素不足）と末梢性（末梢血流のうっ滞）の区別も確認。", "id": 3}, {"group": "★★★厳選50", "title": "★★★厳選50問（確実なものだけ）", "unit": "本試験で出たテーマ（クラス共有情報）", "num": "5", "stars": "★★★", "labels": ["クラス共有情報より"], "problem": "鉄欠乏性貧血の特徴を2つ述べよ。（本試験では「特徴ふたつ」が出た）", "answer": "①小球性低色素性貧血で、血清鉄・血清フェリチンが低下し、総鉄結合能（TIBC）が上昇する。②匙状爪（スプーン状爪）・舌炎・口角炎・異食症などの組織の鉄欠乏症状がみられる。", "point": "最も頻度の高い貧血。原因は月経過多・消化管出血・妊娠などによる需要増大。", "id": 4}, {"group": "★★★厳選50", "title": "★★★厳選50問（確実なものだけ）", "unit": "本試験で出たテーマ（クラス共有情報）", "num": "6", "stars": "★★★", "labels": ["クラス共有情報より"], "problem": "門脈圧亢進症の徴候を3つ述べよ。（本試験では「3徴候」が出た）", "answer": "①脾腫 報）", "num": "12", "stars": "★★★", "labels": ["クラス共有情報より"], "problem": "糖尿病の三大合併症を述べよ。（本試験では「合併症3つ」が出た）", "answer": "糖尿病性神経障害、糖尿病性網膜症、糖尿病性腎症。", "point": "覚え方は「し・め・じ」（神経・眼（目）・腎臓）。いずれも細小血管障害によるもの。大血管障害では心筋梗塞・脳梗塞などが起こる。", "id": 11}, {"group": "★★★厳選50", "title": "★★★厳選50問（確実なものだけ）", "unit": "本試験で出たテーマ（クラス共有情報）", "num": "13", "stars": "★★★", "labels": ["クラス共有情報より"], "problem": "肝硬変の患者でコーヒー残渣様の嘔吐がみられるのはなぜか。（本試験では「肝臓とコーヒー」の問題が出た）", "answer": "門脈圧亢進により食道静脈瘤が形成され、それが破裂して上部消化管出血を起こすため。胃の中で血液が胃酸と反応するとコーヒー残渣様になる。", "point": "タール便（黒色便）も上部消化管出血のサイン。門脈圧亢進症のQ6とセットで覚える。", "id": 12}, {"group": "★★★厳選50", "title": "★★★厳選50問（確実なものだけ）", "unit": "本試験で出たテーマ（クラス共有情報）", "num": "14", "stars": "★★★", "labels": ["クラス共有情報より"], "problem": "胃がんで特徴的な転移を述べよ。（本試験では胃がんが出た）", "answer": "左鎖骨上窩リンパ節への転移（ウィルヒョウ転移）、卵巣への転移（クルーケンベルク腫瘍）、ダグラス窩への腹膜播種（シュニッツラー転移）。血行性転移では肝転移が多い。", "point": "最大の危険因子はピロリ菌感染。早期胃がんは浸潤が粘膜・粘膜下層までにとどまるもの。", "id": 13}, {"group": "★★★厳選50", "title": "★★★厳選50問（確実なものだけ）", "unit": "本試験で出たテーマ（クラス共有情報）", "num": "15", "stars": "★★★", "labels": ["クラス共有情報より"], "problem": "1型糖尿病と2型糖尿病の違いを述べよ。（本試験では糖尿病が出た）", "answer": "1型＝自己免疫などによる膵β細胞の破壊でインスリン分泌が絶対的に不足し、インスリン療法が必須。若年発症が多い。2型＝インスリン抵抗性と分泌不全が背景にあり、遺伝と生活習慣が関与する。日本の糖尿病の大部分は2型。", "point": "1型は急性発症でケトアシドーシスを起こしやすい、も頻出。", "id": 14}, {"group": "★★★厳選50", "title": "★★★厳選50問（確実なものだけ）", "unit": "本試験で出たテーマ（クラス共有情報）", "num": "16", "stars": "★★★", "labels": ["クラス共有情報より"], "problem": "死の三徴候を述べよ。（本試験で出た「しのさんこうちょう」＝死の三徴候と判明）", "answer": "①心臓の停止（心停止）　②呼吸の停止　③瞳孔の散大と対光反射の消失", "point": "死亡確認の基本となる3つの徴候。脳死判定とは別の基準であり、混同しないこと。", "id": 15}, {"group": "★★★厳選50", "title": "★★★厳選50問（確実なものだけ）", "unit": "先生の再試験アドバイスで明示された範囲", "num": "17", "stars": "★★★", "labels": ["先生のアドバイスより"], "problem": "褥瘡は、体位変換の障害により同じ部位への長時間の ① が続き、 ② による酸素・栄養の不足が起こって発生する皮膚障害である。", "answer": "① 圧迫　② 虚血", "point": "先生のアドバイスで「皮膚障害の病態（特に原因や好発部位）」が明示された最重要単元。原因＝圧迫→虚血→壊死の流れで答える。", "id": 16}, {"group": "★★★厳選50", "title": "★★★厳選50問（確実なものだけ）", "unit": "先生の再試験アドバイスで明示された範囲", "num": "18", "stars": "★★★", "labels"  "id": 41}, {"group": "★★★厳選50", "title": "★★★厳選50問（確実なものだけ）", "unit": "小テストで出た問題", "num": "43", "stars": "★★★", "labels": ["小テストより"], "problem": "潰瘍性大腸炎と比べたCrohn〈クローン〉病の特徴は2つある。悪性化の頻度が ① ことと、② を併発しやすいことである。", "answer": "① 低い　② 瘻孔", "point": "小テスト問題4（2つ選べ）。初発症状は粘血便・炎症は大腸に限局、は潰瘍性大腸炎の特徴として切り分ける。クローン病は口から肛門まで全消化管に起こり、全層性の炎症で瘻孔を作りやすい【補足】。", "id": 42}, {"group": "★★★厳選50", "title": "★★★厳選50問（確実なものだけ）", "unit": "教科書訂正・関連図（先生が授業で扱ったもの）", "num": "44", "stars": "★★★", "labels": ["教科書訂正より"], "problem": "浅達性II度熱傷の臨床症状は ① 性（痛みを感じる）であり、教科書に記載された「 ② 」はない、と熱傷診療ガイドラインの深度分類に合わせて覚える。", "answer": "① 有痛　② 知覚鈍麻", "point": "教科書訂正で明示された超頻出ひっかけ。知覚鈍麻があるのは深達性II度。「浅達性＝痛い」が正解。", "id": 43}, {"group": "★★★厳選50", "title": "★★★厳選50問（確実なものだけ）", "unit": "教科書訂正・関連図（先生が授業で扱ったもの）", "num": "45", "stars": "★★★", "labels": ["教科書訂正より"], "problem": "熱中症の重症度評価は「熱中症診療ガイドライン2024」により、 ① 度から ② 度までの分類となった。", "answer": "① I　② IV", "point": "教科書p.43の旧分類から変更された訂正事項。従来のIII度まで、と答えると誤り。", "id": 44}, {"group": "★★★厳選50", "title": "★★★厳選50問（確実なものだけ）", "unit": "教科書訂正・関連図（先生が授業で扱ったもの）", "num": "46", "stars": "★★★", "labels": ["関連図より"], "problem": "事例のIさん（70歳男性）の肝硬変の原因は ① 性であり、強い意志と家族の支えで ② を継続していたが病気は進行した。", "answer": "① アルコール　② 断酒", "point": "関連図の出発点。原因が止まっても一度硬変した肝臓は元に戻らず進行する、という前提を押さえる。", "id": 45}, {"group": "★★★厳選50", "title": "★★★厳選50問（確実なものだけ）", "unit": "教科書訂正・関連図（先生が授業で扱ったもの）", "num": "47", "stars": "★★★", "labels": ["関連図より"], "problem": "Iさんは「数時間前に血便が見られた」と電話相談し緊急訪問したところ、血圧 ① mmHg（普段は130/80程度）、脈拍 ② 回/分で、意識は清明ではなかった。", "answer": "① 95/50　② 100", "point": "「普段より血圧が低く頻脈＝出血が続いているサイン」と判断して救急受診につなげた事例。数値は関連図の矢印の根拠になるのでそのまま覚える。", "id": 46}, {"group": "★★★厳選50", "title": "★★★厳選50問（確実なものだけ）", "unit": "教科書訂正・関連図（先生が授業で扱ったもの）", "num": "48", "stars": "★★★", "labels": ["関連図より"], "problem": "Iさんの出血の診断は ① 破裂で、緊急の ② による止血術を受けて入院し、約1週間で退院した。", "answer": "① 食道静脈瘤　② 内視鏡（内視鏡的止血術）", "point": "本人が「痔の出血」と解釈して気に留めていなかった、という経緯も含めて「肝硬変患者の消化管出血は静脈瘤破裂を疑う」が教訓。", "id": 47}, {"group": "★★★厳選50", "title": "★★★厳選50問（確実なものだけ）", "unit": "教科書訂正・関連図（  "肝硬変で皮下出血、腹水貯留および手指の振戦がある患者に対する食事で適切なのは ① 食である。", "answer": "① 塩分制限", "point": "腹水がある→塩分（と水分）を制限する、が判断の軸。高蛋白食は振戦（脳症の兆候）がある状態では不適切、と消去できる。", "id": 54}, {"group": "小テスト・国試 厳選", "title": "小テスト・国試 厳選（★★★50と重ならない分）", "unit": "第10・11回（小テスト・国試）", "num": "5", "stars": "★★", "labels": ["国試より"], "problem": "門脈系の血管は2つある。① 静脈と ② 静脈である。", "answer": "① 脾　② 下腸間膜", "point": "門脈は脾静脈と腸間膜静脈（上・下）が合流してできる。肝静脈は門脈系ではない（肝臓から出ていく側）、がひっかけ。", "id": 55}, {"group": "小テスト・国試 厳選", "title": "小テスト・国試 厳選（★★★50と重ならない分）", "unit": "第10・11回（小テスト・国試）", "num": "6", "stars": "★★", "labels": ["国試より"], "problem": "次の栄養素のうち、門脈を通って輸送されるのは ① で、脂肪（中性脂肪）や脂溶性ビタミンは ② を通る。", "answer": "① 糖質　② リンパ管", "point": "水溶性の栄養素は門脈→肝臓、脂質はリンパ管→（門脈を通らない）。消化器①の「脂肪酸の輸送経路＝リンパ管」と同じ話。", "id": 56}, {"group": "小テスト・国試 厳選", "title": "小テスト・国試 厳選（★★★50と重ならない分）", "unit": "第10・11回（小テスト・国試）", "num": "7", "stars": "★★", "labels": ["国試より"], "problem": "待機的に行う食道静脈瘤硬化療法について正しいのは、「治療後に ① が出現する可能性がある」ことである。", "answer": "① 胸部痛", "point": "硬化剤注入後の合併症・症状として胸部痛が出る。治療翌日から常食・全身麻酔下で行う、などは誤り選択肢。", "id": 57}, {"group": "小テスト・国試 厳選", "title": "小テスト・国試 厳選（★★★50と重ならない分）", "unit": "第10・11回（小テスト・国試）", "num": "8", "stars": "★★", "labels": ["国試より"], "problem": "食道静脈瘤の患者の看護で正しいのは、「吐物に ① が混入している場合は、すみやかな対処が必要である」ことである。", "answer": "① 血液", "point": "再破裂のサインを見逃さない。便の観察も必要（不要ではない）、一度治療しても再発することはある、も誤り選択肢の裏返しで覚える。", "id": 58}, {"group": "小テスト・国試 厳選", "title": "小テスト・国試 厳選（★★★50と重ならない分）", "unit": "第10・11回（小テスト・国試）", "num": "9", "stars": "★★", "labels": ["国試より"], "problem": "胃から分泌される消化管ホルモンは ① で、胃酸分泌を促進する。一方、胃酸分泌を抑制するのは ② である。", "answer": "① ガストリン　② セクレチン", "point": "ガストリン＝促進、セクレチン＝抑制、の対比が2問に分かれて出た鉄板ペア。", "id": 59}, {"group": "小テスト・国試 厳選", "title": "小テスト・国試 厳選（★★★50と重ならない分）", "unit": "第10・11回（小テスト・国試）", "num": "10", "stars": "★★", "labels": ["国試より"], "problem": "胃液に含まれ、たんぱく質の消化を助ける酵素は ① で、胃の主細胞から分泌される ② が塩酸で活性化されてできる。", "answer": "① ペプシン　② ペプシノゲン", "point": "「主細胞→ペプシノゲン」「主細胞由来のタンパク分解酵素→ペプシン」と、聞き方を変えて2回出た。壁細胞＝塩酸・内因子と対比する【補足】。", "id": 60}, {"group": "小テスト・国試 厳選", "title": "小テスト・国試 厳選（★★★50と重ならない分）", "unit": "第10・11回（小テスト・国試）", "num": "11", "stars": "★★", "labels": ["国試より"], "problem": "正常な胃液のpHは ① で、胃液の説明としても「pH ② である」が正しいとされた。", "answer": "① pH1〜2　② 1.5〜2.0", "point": "数値問題はそのまま出る。胃液は1日に約500mLではなくもっと多い（約1.5〜2L）【補足】ため、量の選択肢は誤り。", "id": 61}, {"group": "小テスト・国試 厳選", "title": "小テスト・国試 厳選（★★★50と重ならない分）", "unit": "第10・11回（小テスト・国試）", "num": "12", "stars": "★★", "labels": ["国試より"], "problem": "小腸で吸収された脂肪酸の輸送経路は ① で、大腸で主に吸収されるのは ② である。", "answer": "① リンパ管　② 水分", "point": "脂質はリンパ、水溶性栄養は門脈（Q23と対）。大腸は水分と電解質の吸収が仕事で、栄養素はほとんど吸収しない。", "id": 62}, {"group": "小テスト・国試 厳選", "title": "小テスト・国試 厳選（★★★50と重ならない分）", "unit": "第10・11回（小テスト・国試）", "num": "13", "stars": "★★", "labels": ["国試より"], "problem": "便の性状と原因の組合せで正しいのは、「① 便―上部消化管出血」である。", "answer": "① タール（タール便）", "point": "血液が胃酸などで変性して黒くなる＝上部消化管出血。鮮紅色の下血は直腸など下部・肛門に近い出血（次問と対）。", "id": 63}, {"group": "小テスト・国試 厳選", "title": "小テスト・国試 厳選（★★★50と重ならない分）", "unit": "第10・11回（小テスト・国試）", "num": "14", "stars": "★★", "labels": ["国試より"], "problem": "鮮紅色の下血が見られたときの出血部位は ① で、少量の胃出血を示す吐物の色は ② である。", "answer": "① 直腸　② 黒（コーヒー残渣様）", "point": "「鮮やかな赤＝出口に近い」「黒＝上部で変性」の色の原則で、吐血・下血の部位推定問題をまとめて解く。", "id": 64}, {"group": "小テスト・国試 厳選", "title": "小テスト・国試 厳選（★★★50と重ならない分）", "unit": "第10・11回（小テスト・国試）", "num": "15", "stars": "★", "labels": ["国試より"], "problem": "食道について正しいのは2つある。粘膜は ① 上皮であることと、生理的狭窄部では ② の停滞が起こりやすいことである。", "answer": "① 重層扁平　② 食塊", "point": "食道の長さは成人で約25cm【補足】（60cmや50cmは誤り選択肢）。漿膜ではなく外膜で覆われるのも特徴。", "id": 65}, {"group": "小テスト・国試 厳選", "title": "小テスト・国試 厳選（★★★50と重ならない分）", "unit": "第10・11回（小テスト・国試）", "num": "16", "stars": "★", "labels": ["国試より"], "problem": "成人において胃食道逆流を防ぐために、食後30分から1時間程度とるとよい体位は ① である。", "answer": "① 座位", "point": "食後すぐ横にならない、が指導の形でも出る。左側臥位・仰臥位は逆流を防ぐ答えにはならない。", "id": 66}, {"group": "小テスト・国試 厳選", "title": "小テスト・国試 厳選（★★★50と重ならない分）", "unit": "第10・11回（小テスト・国試）", "num": "17", "stars": "★", "labels": ["国試より"], "problem": "排便のメカニズムで正しいのは ① の上昇であり、脊髄排便反射には ② 髄と骨盤神経が関与している。", "answer": "① 腹圧　② 仙", "point": "肛門括約筋は「収縮」ではなく弛緩で排便する、という誤り選択肢の見抜き方がセット。便が直腸へ移動すると排便反射が起こる（横行結腸ではない）。", "id": 67}, {"group": "小テスト・国試 厳選", "title": "小テスト・国試 厳選（★★★50と重ならない分）", "unit": "第10・11回（小テスト・国試）", "num": "18", "stars": "★★", "labels": ["国試より"], "problem": "有害物質を無毒化し排泄する臓器は ① で、肝障害の指標となる血液生化学検査項目は ② である。", "answer": "① 肝臓　② ALT〈GPT〉", "point": "解毒＝肝臓の代表機能。ALTは肝細胞が壊れると血液中に漏れ出る酵素なので障害の指標になる。", "id": 68}, {"group": "小テスト・国試 厳選", "title": "小テスト・国試 厳選（★★★50と重ならない分）", "unit": "第10・11回（小テスト・国試）", "num": "19", "stars": "★★", "labels": ["国試より"], "problem": "肝細胞で合成されるものは2つある。① と、血液凝固に関わる ② である。", "answer": "① アルブミン　② フィブリノゲン", "point": "インスリン・グルカゴンは膵臓、アドレナリンは副腎髄質。「肝臓で作る＝アルブミン・凝固因子」とまとめるとQ9（凝固因子の生成）も一緒に解ける。", "id": 69}, {"group": "小テスト・国試 厳選", "title": "小テスト・国試 厳選（★★★50と重ならない分）", "unit": "第10・11回（小テスト・国試）", "num": "20", "stars": "★★", "labels": ["国試より"], "problem": "脂肪を乳化するのは ① で、膵液に含まれる脂肪分解酵素は ② 、蛋白質分解酵素は ③ である。", "answer": "① 胆汁　② リパーゼ　③ トリプシン", "point": "胆汁自体に消化酵素はない（乳化してリパーゼの働きを助ける）。酵素の対応表（アミラーゼ＝糖質、リパーゼ＝脂肪、トリプシン＝蛋白質）を丸ごと覚える。", "id": 70}, {"group": "小テスト・国試 厳選", "title": "小テスト・国試 厳選（★★★50と重ならない分）", "unit": "第10・11回（小テスト・国試）", "num": "21", "stars": "★★", "labels": ["国試より"], "problem": "膵液について正しいのは、① 性であることである。また膵臓の内分泌細胞から分泌され血糖値を低下させるホルモンは ② である。", "answer": "① 弱アルカリ　② インスリン", "point": "膵液は重炭酸イオンを含み胃酸を中和する弱アルカリ性。膵臓から分泌されるものとしてソマトスタチン（δ細胞）も国試で問われた。", "id": 71}, {"group": "小テスト・国試 厳選", "title": "小テスト・国試 厳選（★★★50と重ならない分）", "unit": "第10・11回（小テスト・国試）", "num": "22", "stars": "★★", "labels": ["国試より"], "problem": "胆嚢について正しいのは、容量が ① mLであることである。胆汁は ② で生成され、胆嚢で貯蔵・濃縮される。", "answer": "① 30〜50　② 肝臓", "point": "「胆汁は胆嚢で生成される」は誤り選択肢だった。胆汁の主成分は水分で、胆汁色素の主成分はビリルビン【国試より】。", "id": 72}, {"group": "小テスト・国試 厳選", "title": "小テスト・国試 厳選（★★★50と重ならない分）", "unit": "第10・11回（小テスト・国試）", "num": "23", "stars": "★★", "labels": ["国試より"], "problem": "肝臓の機能は ① の貯蔵であり、血糖が低下したときはグルカゴンの働きでグリコーゲンを分解してグルコースを血液中に放出する。", "answer": "① 糖（グリコーゲン）", "point": "「胆汁の貯蔵」は胆嚢の役目、と混同させる選択肢だった。貯蔵（グリコーゲン）・合成（アルブミン）・解毒・胆汁生成が肝機能の柱。", "id": 73}, {"group": "小テスト・国試 厳選", "title": "小テスト・国試 厳選（★★★50と重ならない分）", "unit": "第10・11回（小テスト・国試）", "num": "24", "stars": "★", "labels": ["国試より"], "problem": "膵管と合流して大十二指腸乳頭（ファーター乳頭）に開口するのは ① である。", "answer": "① 総胆管", "point": "胆汁と膵液は同じ出口（ファーター乳頭）から十二指腸へ出る。だから総胆管結石が膵炎の原因にもなる、とつなげて覚える。", "id": 74}, {"group": "小テスト・国試 厳選", "title": "小テスト・国試 厳選（★★★50と重ならない分）", "unit": "第10・11回（小テスト・国試）", "num": "25", "stars": "★", "labels": ["国試より"], "problem": "膵臓について正しいのは、「① 腺は膵液を分泌する」ことである（内分泌腺はランゲルハンス島からホルモンを分泌する）。", "answer": "① 外分泌", "point": "膵臓は外分泌（消化酵素）と内分泌（インスリン等）の両方を持つ、という二面性が繰り返し問われる。", "id": 75}, {"group": "小テスト・国試 厳選", "title": "小テスト・国試 厳選（★★★50と重ならない分）", "unit": "第10・11回（小テスト・国試）", "num": "26", "stars": "★", "labels": ["国試より"], "problem": "肝臓について正しいのは、「肝小葉の間には ① がある」ことである。なお肝臓の基本機能単位は肝細胞ではなく ② である。", "answer": "① 小葉間胆管　② 肝小葉", "point": "肝臓は横隔膜のすぐ下で右上腹部のほとんどを占める（「左上腹部」は誤り選択肢）。位置と単位のひっかけに注意。", "id": 76}, {"group": "小テスト・国試 厳選", "title": "小テスト・国試 厳選（★★★50と重ならない分）", "unit": "第10・11回（小テスト・国試）", "num": "27", "stars": "★★", "labels": ["国試より"], "problem": "56歳女性、夕食1時間後から腹痛・嘔吐、発熱38.2℃、眼球結膜に黄染があり、直接ビリルビン優位の高値と超音波で胆嚢壁肥厚・総胆管拡張・総胆管結石を認めた。この病態は ① である。", "answer": "① 閉塞性黄疸", "point": "結石で胆汁の流れが止まる→直接（抱合型）ビリルビンが増える、が決め手。溶血性貧血なら間接ビリルビン優位になる、と対比する。", "id": 77}, {"group": "小テスト・国試 厳選", "title": "小テスト・国試 厳選（★★★50と重ならない分）", "unit": "第10・11回（小テスト・国試）", "num": "28", "stars": "★★", "labels": ["国試より"], "problem": "膵癌で幽門輪温存膵頭十二指腸切除術を受け、膵臓が約1/3になった患者では、① を消化する能力が低下する。", "answer": "① 炭水化物", "point": "膵アミラーゼの減少による。脂肪吸収は「向上」ではなく低下する、という誤り選択肢もセットで確認。", "id": 78}];
const groups = [...new Set(DATA.map(q=>q.group))];
const gsel = document.getElementById('gsel');
groups.forEach(g=>{const o=document.createElement('option');o.value=g;o.textContent=g;gsel.appendChild(o)});
let filter='all', known={};
try{ known = JSON.parse(localStorage.getItem('qa_known')||'{}'); }catch(e){}
document.getElementById('hsub').textContent = '全'+DATA.length+'問／★★★ '+DATA.filter(q=>q.stars==='★★★').length+'問';
let order = DATA.map((_,i)=>i);
function match(q){
  if(gsel.value && q.group!==gsel.value) return false;
  if(filter==='s3' && q.stars!=='★★★') return false;
  if(filter==='test' && !q.labels.some(l=>l.includes('小テスト')||l.includes('国試'))) return false;
  if(filter==='yet' && known[q.id]) return false;
  return true;
}
function esc(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML}
function render(){
  const list=document.getElementById('list'); list.innerHTML='';
  let shown=0;
  order.forEach(i=>{ const q=DATA[i]; if(!match(q)) return; shown++;
    const c=document.createElement('div'); c.className='card'+(known[q.id]?' known':'');
    c.innerHTML = '<div class="meta"><span class="qnum">'+q.group+' Q'+q.num+'</span><span class="stars">'+q.stars+'</span>'+
      q.labels.map(l=>'<span class="lab">'+esc(l)+'</span>').join('')+
      '<span class="unit">'+esc(q.unit)+'</span></div>'+
      '<div class="problem">'+esc(q.problem)+'</div>'+
      '<div class="ans"><div class="a">答え：'+esc(q.answer)+'</div>'+(q.point?'<div class="p">ポイント：'+esc(q.point)+'</div>':'')+'</div>'+
      '<div class="btns"><button class="act">答えを見る</button><button class="know'+(known[q.id]?' on':'')+'">'+(known[q.id]?'分かった✓':'分かったら✓')+'</button></div>';
    const ans=c.querySelector('.ans'), act=c.querySelector('.act'), know=c.querySelector('.know');
    act.onclick=()=>{ const open=ans.style.display==='block'; ans.style.display=open?'none':'block'; act.textContent=open?'答えを見る':'答えを隠す'; };
    know.onclick=()=>{ known[q.id]=!known[q.id]; try{localStorage.setItem('qa_known',JSON.stringify(known))}catch(e){} render(); };
    list.appendChild(c);
  });
  if(!shown) list.innerHTML='<div class="empty">この条件の問題は全部「分かった」になりました</div>';
  const done=DATA.filter(q=>known[q.id]).length;
  document.getElementById('prog').textContent='表示 '+shown+'問／分かった '+done+' / '+DATA.length+'問';
}
document.querySelectorAll('.chip[data-f]').forEach(b=>{ b.onclick=()=>{ document.querySelectorAll('.chip[data-f]').forEach(x=>x.classList.remove('on')); b.classList.add('on'); filter=b.dataset.f; render(); }; });
gsel.onchange=render;
document.getElementById('shuffle').onclick=()=>{ for(let i=order.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[order[i],order[j]]=[order[j],order[i]];} render(); };
render();
</script></body></html>
