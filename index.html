<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="くらしの手帳">
<meta name="theme-color" content="#17233A">
<title>くらしの手帳</title>
<style>
/* ================= テーマ ================= */
:root{
  --paper:#F3F5F1; --card:#fff; --ink:#17233A; --sub:#6B7686; --rule:#DDE3DC; --soft:#EEF1EC;
  --smbc:#00873C; --smbcbg:#EAF4EE; --rakuten:#BF0000; --rakutenbg:#FBECEC;
  --risyu:#4B4494; --risyubg:#ECEBF6; --warn:#B4530A; --warnbg:#FDF0E6;
  --ok:#1F7A46; --okbg:#E8F3EC;
  --e1:#E2664B; --e2:#E08A2E; --e3:#C79A18; --e4:#4E9A5B; --e5:#3FA89A;
  --e6:#3D8FC4; --e7:#4C68C0; --e8:#8163B8; --e9:#D25F94; --e10:#7A8290;
  --todaybg:rgba(253,236,239,.85); --holi:#C2334D;
  --glass:rgba(255,255,255,.60); --glass2:rgba(255,255,255,.42); --edge:rgba(255,255,255,.75);
  --blur:saturate(180%) blur(22px); --tint1:rgba(120,150,255,.20); --tint2:rgba(255,150,190,.18);
  --pill:rgba(255,255,255,.55); --pillbrd:rgba(255,255,255,.85);
  --shadow:0 1px 2px rgba(23,35,58,.06), 0 4px 14px rgba(23,35,58,.05);
  --shadow-lg:0 2px 6px rgba(23,35,58,.08), 0 12px 30px rgba(23,35,58,.10);
  --fs:15px;
}
body[data-theme="dark"]{
  --todaybg:rgba(58,38,48,.85); --holi:#F2879B;
  --glass:rgba(46,51,63,.62); --glass2:rgba(46,51,63,.42); --edge:rgba(255,255,255,.14);
  --tint1:rgba(90,120,220,.28); --tint2:rgba(180,90,140,.22);
  --pill:rgba(255,255,255,.16); --pillbrd:rgba(255,255,255,.28);
  --paper:#171A21; --card:#212632; --ink:#E9ECF2; --sub:#9AA3B2; --rule:#333A48; --soft:#2A303D;
  --smbc:#4FBE7E; --smbcbg:#1F3129; --rakuten:#F2726F; --rakutenbg:#332224;
  --risyu:#9E97E0; --risyubg:#282640; --warn:#E6A567; --warnbg:#33291F;
  --ok:#6FCB96; --okbg:#1E3128;
  --shadow:0 1px 2px rgba(0,0,0,.4); --shadow-lg:0 10px 30px rgba(0,0,0,.5);
}
body[data-theme="sakura"]{
  --todaybg:rgba(251,226,232,.85); --holi:#B4325A;
  --tint1:rgba(255,170,200,.28); --tint2:rgba(255,215,170,.22);
  --paper:#FBF2F4; --card:#fff; --ink:#4A2B36; --sub:#8B6E77; --rule:#EEDCE2; --soft:#F7E9ED;
  --risyu:#B4577E; --risyubg:#F8E5EC; --ink-head:#7A3A55;
}
body[data-theme="mint"]{
  --todaybg:rgba(252,234,238,.85);
  --tint1:rgba(130,220,180,.26); --tint2:rgba(200,230,140,.20);
  --paper:#F0F6F1; --card:#fff; --ink:#1E3629; --sub:#657A6C; --rule:#D7E5DA; --soft:#E7F0E9;
  --risyu:#2E7D62; --risyubg:#E2F0EA;
}
body[data-theme="ocean"]{
  --todaybg:rgba(251,233,236,.85);
  --tint1:rgba(110,180,240,.28); --tint2:rgba(150,220,230,.22);
  --paper:#EFF4F8; --card:#fff; --ink:#123049; --sub:#5E7689; --rule:#D6E2EC; --soft:#E5EDF4;
  --risyu:#1C6E9C; --risyubg:#E1EEF6;
}
body[data-theme="cream"]{
  --todaybg:rgba(249,231,220,.85);
  --tint1:rgba(240,200,140,.28); --tint2:rgba(220,180,200,.20);
  --paper:#F8F4EA; --card:#FFFDF7; --ink:#3B3222; --sub:#7D735F; --rule:#E6DFCE; --soft:#F1EADA;
  --risyu:#8A6A2F; --risyubg:#F2E9D6;
}
body[data-fs="s"]{--fs:13.5px}
body[data-fs="m"]{--fs:15px}
body[data-fs="l"]{--fs:16.5px}
body[data-fs="xl"]{--fs:18px}

*{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
body{
  margin:0; color:var(--ink); font-size:var(--fs);
  font-family:"Hiragino Maru Gothic ProN","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic Medium",sans-serif;
  line-height:1.55; -webkit-text-size-adjust:100%;
  transition:color .25s;
  background:var(--paper);
  min-height:100vh;
}
body::before{
  content:''; position:fixed; inset:0; z-index:-1; pointer-events:none;
  background:
    radial-gradient(58vw 42vh at 12% 4%,  var(--tint1), transparent 65%),
    radial-gradient(52vw 38vh at 92% 22%, var(--tint2), transparent 62%),
    radial-gradient(60vw 45vh at 50% 96%, var(--tint1), transparent 68%);
  opacity:.9;
}
.num{font-variant-numeric:tabular-nums; letter-spacing:.01em}

/* ================= 起動アニメ ================= */
#splash{position:fixed; inset:0; background:var(--paper); z-index:90; display:flex;
  flex-direction:column; align-items:center; justify-content:center; gap:14px;
  transition:opacity .45s ease, visibility .45s}
#splash.out{opacity:0; visibility:hidden}
#splash .ttl{font-size:1.1em; font-weight:700; letter-spacing:.14em; opacity:0; animation:rise .6s .15s forwards}
#splash svg{opacity:0; animation:rise .6s forwards}
@keyframes rise{from{opacity:0; transform:translateY(10px)} to{opacity:1; transform:none}}
@media (prefers-reduced-motion:reduce){#splash svg,#splash .ttl{animation:none; opacity:1}}

header{
  background:linear-gradient(180deg, rgba(23,35,58,.92), rgba(23,35,58,.78));
  -webkit-backdrop-filter:var(--blur); backdrop-filter:var(--blur);
  color:#F2F5FA; padding:calc(env(safe-area-inset-top) + 14px) 16px 0;
  border-bottom:1px solid rgba(255,255,255,.10);
}
body[data-theme="dark"] header{background:linear-gradient(180deg, rgba(12,15,21,.92), rgba(12,15,21,.74))}
header h1{margin:0; font-size:1.05em; letter-spacing:.04em; display:flex; align-items:center; gap:8px}
header p{margin:3px 0 10px; font-size:.78em; opacity:.72}
/* 上のアプリ切替：透明な丸がすべる */
#apps{position:relative; display:flex; gap:2px; max-width:620px; margin:0 auto 10px;
  overflow-x:auto; scrollbar-width:none; padding:4px; border-radius:999px;
  background:rgba(255,255,255,.10); border:1px solid rgba(255,255,255,.14)}
#apps::-webkit-scrollbar{display:none}
#apps .pill{position:absolute; top:4px; left:0; height:calc(100% - 8px); border-radius:999px;
  background:rgba(255,255,255,.24); border:1px solid rgba(255,255,255,.38);
  -webkit-backdrop-filter:blur(10px); backdrop-filter:blur(10px);
  box-shadow:0 2px 10px rgba(0,0,0,.18), inset 0 1px 0 rgba(255,255,255,.45);
  transition:transform .34s cubic-bezier(.34,1.2,.4,1), width .34s cubic-bezier(.34,1.2,.4,1);
  pointer-events:none; z-index:0}
#apps button{position:relative; z-index:1; flex:1 0 auto; min-width:62px; border:0; background:none;
  color:#F2F5FA; opacity:.62; font:inherit; font-size:.82em; padding:8px 10px; border-radius:999px;
  font-weight:600; transition:opacity .25s}
#apps button.on{opacity:1}

/* 下のタブ：同じく丸がすべる */
nav{position:relative; display:flex; gap:2px; z-index:5; overflow-x:auto; scrollbar-width:none;
  max-width:620px; margin:10px auto 0; padding:4px; border-radius:999px;
  background:var(--glass2); border:1px solid var(--edge);
  -webkit-backdrop-filter:var(--blur); backdrop-filter:var(--blur);
  box-shadow:0 1px 2px rgba(23,35,58,.05), inset 0 1px 0 rgba(255,255,255,.5)}
nav::-webkit-scrollbar{display:none}
nav .pill{position:absolute; top:4px; left:0; height:calc(100% - 8px); border-radius:999px;
  background:var(--pill); border:1px solid var(--pillbrd);
  box-shadow:0 2px 8px rgba(23,35,58,.10), inset 0 1px 0 rgba(255,255,255,.6);
  transition:transform .34s cubic-bezier(.34,1.2,.4,1), width .34s cubic-bezier(.34,1.2,.4,1);
  pointer-events:none; z-index:0}
nav button{position:relative; z-index:1; flex:1 0 auto; min-width:60px; border:0; background:none;
  padding:8px 10px; font:inherit; font-size:.78em; color:var(--sub); white-space:nowrap;
  border-radius:999px; transition:color .25s}
nav button.on{color:var(--ink); font-weight:700}
nav.hide{display:none}
@media (prefers-reduced-motion:reduce){ #apps .pill, nav .pill{transition:none} }
main{max-width:620px; margin:0 auto; padding:18px 14px}
footer{max-width:620px; margin:0 auto; padding:0 16px calc(env(safe-area-inset-bottom) + 34px); font-size:.74em; color:var(--sub); line-height:1.7}
section{margin-bottom:18px}
.head{display:flex; align-items:baseline; justify-content:space-between; margin-bottom:7px; gap:10px}
.head h2{margin:0; font-size:.85em; font-weight:700; letter-spacing:.02em}
.head span{font-size:.76em; color:var(--sub); text-align:right}
.box{background:var(--glass); border:1px solid var(--edge); border-radius:20px; padding:16px;
    -webkit-backdrop-filter:var(--blur); backdrop-filter:var(--blur);
    box-shadow:0 1px 2px rgba(23,35,58,.05), 0 10px 28px rgba(23,35,58,.07), inset 0 1px 0 rgba(255,255,255,.55)}
.row{display:flex; align-items:center; gap:11px; padding:10px 0; border-bottom:1px solid var(--rule);
  width:100%; text-align:left; background:none; border-left:0; border-right:0; border-top:0; font:inherit; color:inherit}
.row:last-child{border-bottom:0}
.tick{width:4px; height:32px; border-radius:2px; flex:none}
.grow{flex:1; min-width:0}
.t{font-size:.93em}
.s{font-size:.78em; color:var(--sub); overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .s.wrap{white-space:normal; overflow:visible; text-overflow:clip}
.s2{font-size:.78em; color:var(--sub)}
.amt{font-size:1em; font-weight:600}
.big{font-size:2.4em; font-weight:700; line-height:1.1}
.mid{font-size:1.5em; font-weight:700}
.accbar{display:flex; align-items:center; justify-content:space-between; padding:6px 9px; border-radius:7px; font-size:.78em; font-weight:700; margin-bottom:2px}
.smbc{color:var(--smbc)} .bg-smbc{background:var(--smbcbg)}
.rakuten{color:var(--rakuten)} .bg-rakuten{background:var(--rakutenbg)}
.chk{width:20px;height:20px;border-radius:6px;border:1.5px solid var(--rule);display:flex;align-items:center;justify-content:center;color:#fff;font-size:.75em;flex:none}
.done .t{color:var(--sub); text-decoration:line-through}
button.btn{display:block; width:100%; padding:12px; border-radius:14px; border:1px solid rgba(255,255,255,.18);
    font:inherit; font-size:.92em; font-weight:600; background:var(--ink); color:var(--card);
    box-shadow:0 4px 14px rgba(23,35,58,.16), inset 0 1px 0 rgba(255,255,255,.22)}
body[data-theme="dark"] button.btn{color:#111}
button.btn.ghost{background:var(--glass2); color:var(--ink); border:1px solid var(--edge);
    -webkit-backdrop-filter:blur(8px); backdrop-filter:blur(8px);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.5)}
button.btn[disabled]{background:var(--rule); color:var(--card)}
.pair{display:flex; gap:8px; align-items:stretch}
.pair>*{flex:1 1 0; min-width:0}
.pair>button.btn{width:auto; white-space:nowrap}
label.f{display:block; font-size:.78em; color:var(--sub); margin:0 0 4px}
input,textarea,select{width:100%; padding:10px 12px; border:1px solid var(--edge); border-radius:12px;
  background:var(--glass2); font:inherit; font-size:.92em; color:var(--ink);
  -webkit-backdrop-filter:blur(6px); backdrop-filter:blur(6px)}
textarea{min-height:80px; font-size:.8em}
.field{margin-bottom:11px}
.pick{display:flex; gap:8px; margin-bottom:11px}
.pick button{flex:1; padding:8px; border-radius:9px; border:1px solid var(--rule); background:var(--soft); font:inherit; color:var(--sub)}
.pick button.on{font-weight:700}
.pick button.on.smbc{background:var(--smbcbg); border-color:var(--smbc); color:var(--smbc)}
.pick button.on.rakuten{background:var(--rakutenbg); border-color:var(--rakuten); color:var(--rakuten)}
.pick .b{display:block; font-size:.92em}
.pick .c{display:block; font-size:.72em; opacity:.75}
.chips{display:flex; gap:7px; margin-bottom:11px; flex-wrap:wrap}
.chips button{padding:6px 13px; border-radius:999px; border:1px solid var(--edge); background:var(--glass2); font:inherit; font-size:.78em; color:var(--sub); -webkit-backdrop-filter:blur(6px); backdrop-filter:blur(6px)}
.chips button.on{background:var(--ink); border-color:var(--ink); color:var(--card)}
body[data-theme="dark"] .chips button.on{color:#111}
.note{font-size:.78em; color:var(--sub); line-height:1.7; margin-top:8px}
.msg{border-radius:9px; padding:10px 12px; font-size:.83em; margin-bottom:12px; line-height:1.5}
.ok{background:var(--okbg); color:var(--ok)}
.ng{background:var(--warnbg); color:var(--warn)}
.mini{font-size:.72em; padding:5px 10px; border-radius:999px; border:1px solid var(--edge);
    background:var(--glass2); color:var(--sub); font-family:inherit;
    -webkit-backdrop-filter:blur(6px); backdrop-filter:blur(6px)}
.hide{display:none}
img.shot{width:100%; max-height:190px; object-fit:cover; border-radius:9px; margin-bottom:11px}
#lightbox{position:fixed; inset:0; background:rgba(10,14,22,.9); display:flex; align-items:center; justify-content:center; padding:24px; z-index:60}
#lightbox img{max-width:100%; max-height:80vh; border-radius:10px}
.dot{display:inline-block; width:7px; height:7px; border-radius:50%; margin-right:5px}
code{background:var(--soft); padding:1px 5px; border-radius:4px; font-size:.8em}

/* ================= トースト ================= */
#toast{-webkit-backdrop-filter:var(--blur); backdrop-filter:var(--blur); position:fixed; left:50%; bottom:calc(env(safe-area-inset-bottom) + 22px); transform:translate(-50%,20px);
  background:var(--ink); color:var(--card); padding:11px 18px; border-radius:999px; font-size:.83em; font-weight:600;
  box-shadow:var(--shadow-lg); z-index:70; opacity:0; visibility:hidden; transition:.25s; max-width:88vw; text-align:center}
body[data-theme="dark"] #toast{background:#E9ECF2; color:#111}
#toast.on{opacity:1; visibility:visible; transform:translate(-50%,0)}
#toast.bad{background:var(--rakuten); color:#fff}

/* ================= バナー ================= */
.bn{display:flex; gap:10px; align-items:flex-start; border-radius:11px; padding:11px 13px; margin-bottom:8px; font-size:.83em; line-height:1.5}
.bn .ic{flex:none; font-size:1.05em; line-height:1.3}
.bn.red{background:var(--rakutenbg); color:var(--rakuten)}
.bn.amber{background:var(--warnbg); color:var(--warn)}
.bn.green{background:var(--okbg); color:var(--ok)}
.bn.blue{background:var(--risyubg); color:var(--risyu)}
.bn b{font-weight:700}

/* ================= イラスト ================= */
.illus{display:block; margin:0 auto}
.hero{background:linear-gradient(180deg, var(--card), var(--card)); border-radius:14px; padding:16px 16px 10px;
  box-shadow:var(--shadow); margin-bottom:16px; position:relative; overflow:hidden}
.hero .date{font-size:.78em; color:var(--sub)}
.hero .greet{font-size:1.25em; font-weight:700; margin-top:2px}
.hero .art{position:absolute; right:8px; bottom:0; opacity:.9; pointer-events:none; z-index:0}
  .hero .date,.hero .greet,.hero .wx{position:relative; z-index:1; padding-right:86px}

/* ================= 履修 ================= */
.met{display:flex; align-items:center; gap:10px; padding:7px 0; border-bottom:1px dotted var(--rule)}
.met:last-child{border-bottom:0}
.met-n{flex:0 0 40%; font-size:.85em}
.met-n small{display:block; color:var(--sub); font-size:.72em}
.bar{flex:1; height:9px; background:var(--soft); border-radius:5px; overflow:hidden}
.bar i{display:block; height:100%; background:var(--risyu); border-radius:5px; transition:width .3s}
.bar i.done{background:var(--smbc)}
.bar i.over{background:var(--rakuten)}
.met-v{flex:0 0 66px; text-align:right; font-size:.78em; color:var(--sub); font-variant-numeric:tabular-nums}
.met-v b{color:var(--ink); font-size:.95em}
.earn-grid{display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:4px}
.earn-grid label{font-size:.78em; color:var(--sub); display:flex; flex-direction:column; gap:3px}
.scroll{overflow-x:auto; -webkit-overflow-scrolling:touch; border:1px solid var(--edge); border-radius:18px; background:var(--glass); -webkit-backdrop-filter:var(--blur); backdrop-filter:var(--blur)}
table.tt{border-collapse:collapse; width:100%; min-width:600px; table-layout:fixed}
table.tt th,table.tt td{border:1px solid var(--rule); padding:0; vertical-align:top}
table.tt thead th{background:var(--risyubg); font-size:.78em; font-weight:600; padding:6px 0; text-align:center}
table.tt th.pd{width:30px; background:var(--risyubg); font-size:.78em; text-align:center; vertical-align:middle}
.cell{width:100%; min-height:48px; border:0; background:transparent; font:inherit; text-align:left; padding:6px; display:block; color:inherit}
.cell .nm{font-size:.72em; line-height:1.3; word-break:break-word; display:block}
.cell .tag{font-size:.68em; color:var(--sub); display:block; margin-top:2px}
.cell.free{color:var(--sub); font-size:.78em}
.cell.none{color:var(--rule)}
td.fx{background:var(--soft)}
td.fx .nm{color:var(--sub)}
td.sel{background:var(--risyubg)}
td.sel .nm{color:var(--risyu); font-weight:700}
.cell .x{float:right; font-size:.7em; color:var(--risyu); border:1px solid var(--risyu); border-radius:4px; padding:2px 7px; margin-left:4px; background:var(--card)}
.veil{position:fixed; inset:0; background:rgba(10,14,22,.5); display:none; z-index:40}
.veil.on{display:block}
.sheet{position:fixed; left:0; right:0; bottom:0; max-height:88vh; background:var(--paper);
  border-radius:16px 16px 0 0; z-index:41; display:none; flex-direction:column; box-shadow:var(--shadow-lg)}
.sheet.on{display:flex}
@media(min-width:700px){.sheet{max-width:620px; margin:0 auto; border-radius:16px; bottom:3vh}}
.sheet-hd{padding:12px 14px 10px; border-bottom:1px solid var(--edge); background:var(--glass2); border-radius:24px 24px 0 0}
.sheet-hd .rowline{display:flex; align-items:center; justify-content:space-between; gap:10px}
.sheet-hd h3{margin:0; font-size:1em}
.sheet-bd{overflow-y:auto; padding:10px 14px 24px; -webkit-overflow-scrolling:touch}
.crs{background:var(--glass2); border:1px solid var(--edge); border-radius:16px; -webkit-backdrop-filter:blur(8px); backdrop-filter:blur(8px); padding:10px 11px; margin-bottom:8px; display:flex; gap:10px; align-items:flex-start}
.crs.dis{opacity:.5}
.crs .body{flex:1; min-width:0}
.crs .ct{font-size:.93em; font-weight:600; line-height:1.35}
.crs .cm{font-size:.72em; color:var(--sub); margin-top:3px; line-height:1.5}
.badges{display:flex; flex-wrap:wrap; gap:5px; margin-top:6px}
.b{font-size:.68em; padding:2px 7px; border-radius:5px; white-space:nowrap}
.b.cat{background:var(--risyubg); color:var(--risyu)}
.b.cr{background:var(--soft); color:var(--sub)}
.b.r0{background:var(--okbg); color:var(--ok)}
.b.r1{background:var(--okbg); color:var(--ok)}
.b.r2{background:var(--warnbg); color:var(--warn)}
.b.r3{background:var(--rakutenbg); color:var(--rakuten)}
.b.warn{background:var(--rakutenbg); color:var(--rakuten)}
.b.en{background:var(--risyubg); color:var(--risyu)}
.add{flex:0 0 auto; border:1px solid var(--risyu); background:var(--risyu); color:#fff; border-radius:8px; font:inherit; font-size:.85em; font-weight:600; padding:7px 12px; align-self:center}
.add.rm{background:var(--card); color:var(--rakuten); border-color:var(--rakuten)}
.add[disabled]{background:var(--rule); border-color:var(--rule); color:var(--card)}
.empty{color:var(--sub); font-size:.83em; padding:16px 2px; text-align:center}
.plancard{background:var(--glass2); border:1px solid var(--edge); border-radius:16px; padding:11px 12px; margin-bottom:8px}
.plancard h3{margin:0; font-size:.93em; display:flex; gap:7px; align-items:baseline}
.plancard h3 em{font-style:normal; color:var(--risyu); font-weight:700; font-size:.8em; background:var(--risyubg); border-radius:5px; padding:1px 6px}
.plancard p{margin:5px 0 7px; font-size:.78em; color:var(--sub); line-height:1.5}
.plancard .codes{font-size:.76em; color:var(--sub); line-height:1.6; font-variant-numeric:tabular-nums}
.codebox{width:100%; font-size:.83em; font-variant-numeric:tabular-nums; min-height:60px; margin-top:9px; background:var(--card)}
label.tg{display:flex; align-items:flex-start; gap:7px; font-size:.78em; color:var(--sub); margin-top:9px; line-height:1.45}
label.tg input{width:auto; margin-top:2px}

/* ================= カレンダー ================= */
  .cal{width:100%; border-collapse:collapse; table-layout:fixed; background:var(--glass);
    border:1px solid var(--edge); border-radius:20px; overflow:hidden;
    -webkit-backdrop-filter:var(--blur); backdrop-filter:var(--blur);

function parseSlots(s){
  var out = [], last = "月";
  s.split(",").forEach(function(t){
    t = t.trim();
    var m = t.match(/^([月火水木金土])?([1-7])$/);
    if(!m) return;
    var d = m[1] || last; last = d;
    out.push({d:d, p:parseInt(m[2],10)});
  });
  return out;
}

function mk(code, slots, name, teacher, cap, apps, cat, opt){
  opt = opt || {};
  var sl = parseSlots(slots);
  return {
    code:code, slotText:slots, slots:sl, name:name, teacher:teacher,
    cap:cap, apps:apps, cat:cat,
    cr: opt.cr || (sl.length > 1 ? 2 : 1),

}

/* ============================== 日本の祝日 ============================== */
var _holCache = {};
function nthMonday(y, m, n){            /* m は 1〜12 */
  var d = new Date(y, m-1, 1);
  var first = 1 + ((8 - d.getDay()) % 7);   /* その月の最初の月曜 */
  return new Date(y, m-1, first + (n-1)*7);
}
function holidaysOf(y){
  if(_holCache[y]) return _holCache[y];
  var h = {};
  var put = function(d, name){ h[toYmd(d)] = name; };
  var fixed = [[1,1,'元日'],[2,11,'建国記念の日'],[2,23,'天皇誕生日'],[4,29,'昭和の日'],
    [5,3,'憲法記念日'],[5,4,'みどりの日'],[5,5,'こどもの日'],[8,11,'山の日'],
    [11,3,'文化の日'],[11,23,'勤労感謝の日']];
  fixed.forEach(function(f){ put(new Date(y, f[0]-1, f[1]), f[2]); });
  put(nthMonday(y,1,2),  '成人の日');
  put(nthMonday(y,7,3),  '海の日');
  put(nthMonday(y,9,3),  '敬老の日');
  put(nthMonday(y,10,2), 'スポーツの日');
  /* 春分・秋分（1980〜2099年で使える式） */
  var t = y - 1980;
  put(new Date(y, 2, Math.floor(20.8431 + 0.242194*t - Math.floor(t/4))), '春分の日');
  put(new Date(y, 8, Math.floor(23.2488 + 0.242194*t - Math.floor(t/4))), '秋分の日');

  /* 振替休日：日曜と重なったら、次の祝日でない日 */
  Object.keys(h).slice().sort().forEach(function(k){
    var a = k.split('-'), d = new Date(+a[0], +a[1]-1, +a[2]);
    if(d.getDay() !== 0) return;
    var n = new Date(d); var guard = 0;
    do { n.setDate(n.getDate()+1); guard++; } while(h[toYmd(n)] && guard < 10);
    if(!h[toYmd(n)]) h[toYmd(n)] = '振替休日';
  });
  /* 国民の休日：祝日と祝日にはさまれた平日 */
  Object.keys(h).slice().sort().forEach(function(k){
    var a = k.split('-'), d = new Date(+a[0], +a[1]-1, +a[2]);
    var mid = new Date(d); mid.setDate(mid.getDate()+1);
    var nxt = new Date(d); nxt.setDate(nxt.getDate()+2);
    if(h[toYmd(mid)] || !h[toYmd(nxt)]) return;
    if(mid.getDay() === 0 || mid.getDay() === 6) return;
    h[toYmd(mid)] = '国民の休日';
  });
  _holCache[y] = h;
  return h;
}
function holidayName(ymd){
  if(!isYmd(ymd)) return '';
  return holidaysOf(+ymd.slice(0,4))[ymd] || '';
}

/* 月と日だけから、いちばん近い年を選ぶ */
function guessYear(m, d){
  var now = new Date();
  var t0 = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  var best = now.getFullYear(), score = Infinity;
  [now.getFullYear()-1, now.getFullYear(), now.getFullYear()+1].forEach(function(yy){
    var dt = new Date(yy, m-1, d);
    if(dt.getMonth() !== m-1) return;
    var diff = Math.abs((dt - t0) / 86400000);
    var sc = (dt < t0) ? diff * 1.8 : diff;   /* これからの日を優先する */
    if(sc < score){ score = sc; best = yy; }
  });
  return best;
}
function mdToYmd(m, d){
  m = toNum(m); d = toNum(d);
  if(m < 1 || m > 12 || d < 1 || d > 31) return '';
  var y = guessYear(m, d);
  var dt = new Date(y, m-1, d);
  if(dt.getMonth() !== m-1) return '';
  return toYmd(dt);
}

function mdPicker(idBase, ymd, label, allowEmpty){
  var m = isYmd(ymd) ? +ymd.slice(5,7) : 0;
  var d = isYmd(ymd) ? +ymd.slice(8,10) : 0;
  var mo = '', da = '', i;
  if(allowEmpty) mo += '<option value="">—</option>';
  for(i=1;i<=12;i++) mo += '<option value="'+i+'"'+(m===i?' selected':'')+'>'+i+'月</option>';
  if(allowEmpty) da += '<option value="">—</option>';
  for(i=1;i<=31;i++) da += '<option value="'+i+'"'+(d===i?' selected':'')+'>'+i+'日</option>';
  return '<label class="f">'+esc(label)+'</label>'+
    '<div class="pair" style="margin-bottom:11px">'+
      '<select id="'+idBase+'_m">'+mo+'</select>'+
      '<select id="'+idBase+'_d">'+da+'</select>'+
    '</div>';
}
function readMd(idBase){
  var m = val(idBase+'_m'), d = val(idBase+'_d');
  if(!m || !d) return '';
  return mdToYmd(m, d);
}

function planRows(p){
  var out=[], start = isYm(p.start) ? p.start : thisYm();
  for(var i=0;i<p.count;i++) out.push({
    planId:p.id, name:p.name, accountId:p.accountId,
    month:addMonths(start,i), index:i+1, count:p.count,
    amount:(i===0 && p.firstAmount) ? p.firstAmount : p.monthly
  });
  return out;
}
function daysUntil(day){
  var now=new Date(), t0=new Date(now.getFullYear(),now.getMonth(),now.getDate());
  var t=new Date(now.getFullYear(),now.getMonth(),day);
  if(t<t0) t=new Date(now.getFullYear(),now.getMonth()+1,day);
  return Math.round((t-t0)/86400000);
}
async function resizeImage(file,maxSide,quality){
  var dataUrl = await new Promise(function(res,rej){ var r=new FileReader(); r.onload=function(){res(r.result);}; r.onerror=function(){rej(new Error('read'));}; r.readAsDataURL(file); });
  var img = await new Promise(function(res,rej){ var i=new Image(); i.onload=function(){res(i);}; i.onerror=function(){rej(new Error('img'));}; i.src=dataUrl; });
  var sc=Math.min(1,maxSide/Math.max(img.width,img.height));
  var cv=document.createElement('canvas');
  cv.width=Math.round(img.width*sc); cv.height=Math.round(img.height*sc);
  cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height);
  return cv.toDataURL('image/jpeg',quality);
}

function normPaid(p){
  if(p === true) return { v:1, t:0 };
  if(p === false || p == null) return null;
  if(typeof p === 'object') return { v: p.v ? 1 : 0, t: Number(p.t)||0 };
  return { v:1, t:0 };
}
function isPaid(k){ var p = normPaid(S.paid[k]); return !!(p && p.v); }
function setPaid(k, on){ S.paid[k] = { v: on?1:0, t: Date.now() }; }

function derive(){
  var rows = S.plans.reduce(function(a,p){ return a.concat(planRows(p)); }, []);
  var set = {};
  rows.forEach(function(r){ set[r.month]=1; });
  S.statements.forEach(function(s){ if(s.billingMonth) set[s.billingMonth]=1; });
  set[thisYm()]=1;
  var months = Object.keys(set).sort();
  var byMonth = {};
  months.forEach(function(m){ byMonth[m] = { smbc:{plan:0,stmt:0,rows:[],stmts:[]}, rakuten:{plan:0,stmt:0,rows:[],stmts:[]} }; });
  rows.forEach(function(r){ var g=byMonth[r.month]; if(!g||!g[r.accountId]) return; g[r.accountId].plan+=r.amount; g[r.accountId].rows.push(r); });
  S.statements.forEach(function(s){ var g=byMonth[s.billingMonth]; if(!g||!g[s.accountId]) return; g[s.accountId].stmt += Number(s.amount)||0; g[s.accountId].stmts.push(s); });
  var monthTotal = function(m){ var g=byMonth[m]; if(!g) return 0; return g.smbc.plan+g.smbc.stmt+g.rakuten.plan+g.rakuten.stmt; };
  return { rows:rows, months:months, byMonth:byMonth, monthTotal:monthTotal };
}
function sumBy(arr, f){ return (arr||[]).reduce(function(a,x){ return a + (Number(f(x))||0); }, 0); }
function budget(){
  var d = derive(), cur = thisYm();
  var pay = d.monthTotal(cur);
  var fx  = sumBy(S.fixed, function(x){ return x.amount; });
  var inc = sumBy(S.income, function(x){ return x.amount; });
  var bal = sumBy(S.balances, function(x){ return x.amount; });
  var have = bal + inc;                 /* 口座にあるお金＋今月入るお金 */
  var out  = pay + fx;                  /* 今月出ていくお金 */
  var free = have - out;
  var rate = have > 0 ? free / have : (free >= 0 ? 1 : -1);
  var level, word;
  if(have === 0){ level='none'; word='口座残高か収入を登録すると判定できます'; }
  else if(free < 0){ level='bad';  word='今月は足りません'; }
  else if(rate < .12){ level='warn'; word='かなりギリギリです'; }
  else if(rate < .3){ level='ok';   word='やりくりすれば大丈夫'; }
  else { level='good'; word='余裕があります'; }
  return { pay:pay, fixed:fx, income:inc, balance:bal, have:have, free:free,
           level:level, word:word, month:cur };
}

var syncState = { on:false, msg:'', ref:null, setDoc:null, unsub:null, timer:null, last:'', connecting:false };

function parseFbConfig(txt){
  var s = String(txt == null ? '' : txt).trim();
  if(!s) throw new Error('EMPTY');
  s = s.replace(/^\s*\/\/.*$/gm, '');
  var a = s.indexOf('{'), b = s.lastIndexOf('}');
  s = (a >= 0 && b > a) ? s.slice(a, b + 1) : '{' + s + '}';
  s = s.replace(/([{,]\s*)([A-Za-z_$][A-Za-z0-9_$]*)\s*:/g, '$1"$2":');
  s = s.replace(/'([^'\\]*)'/g, '"$1"');
  s = s.replace(/,\s*([}\]])/g, '$1');
  var cfg = JSON.parse(s);
  if(!cfg || !cfg.apiKey || !cfg.projectId) throw new Error('MISSING');
  return cfg;
}
async function initSync(){
  var room = S.settings.room, fbConfig = S.settings.fbConfig;
  if(!room || !fbConfig) return;
  if(syncState.connecting) return;
  syncState.connecting = true;
  try{
    var cfg = parseFbConfig(fbConfig);
    var fa = await import('https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js');
    var fs = await import('https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js');
    if(room !== S.settings.room || fbConfig !== S.settings.fbConfig){ syncState.connecting=false; return; }
    if(syncState.unsub){ try{ syncState.unsub(); }catch(e){} syncState.unsub = null; }
    var app = fa.initializeApp(cfg, 'kurashi-' + Date.now());
    var ref = fs.doc(fs.getFirestore(app), 'shiharai', room);
    syncState.ref = ref; syncState.setDoc = fs.setDoc; syncState.on = true; syncState.msg = '';
    syncState.unsub = fs.onSnapshot(ref, function(snap){
      if(snap.exists()) mergeRemote(snap.data());
      else pushRemote(true);
    }, function(err){ syncState.on=false; syncState.msg='つながりませんでした：'+err.message; render(); });
    render();
  }catch(e){
    syncState.on=false;
    syncState.msg = (e.message === 'EMPTY')   ? 'Firebaseの設定が空です。コンソールの firebaseConfig を貼り付けてください。'
                  : (e.message === 'MISSING') ? 'apiKey と projectId が見当たりません。firebaseConfig 全体を貼り付けてください。'
                  : /Failed to fetch|dynamically imported/.test(e.message) ? 'ネットにつながらないか、ファイルを直接開いています。https:// のURLから開いてください。'
                  : '設定を読み取れませんでした。firebaseConfig の { から } までを貼り付けてください。';
    render();
  }finally{
    syncState.connecting = false;
  }
}

function pushRemote(now){
  if(!syncState.on || !syncState.ref) return;
  clearTimeout(syncState.timer);
  var go = async function(){
    var body = payload();
    var sig = JSON.stringify(Object.assign({}, body, {updatedAt:0}));
    if(sig === syncState.last) return;
    try{ await syncState.setDoc(syncState.ref, body); syncState.last = sig; }
    catch(e){ syncState.msg = '送信できませんでした：'+e.message; }
  };
  now ? go() : (syncState.timer = setTimeout(go, 600));
}
function mergeList(local, remote, dead){
  var m = {};
  (local||[]).forEach(function(x){ if(x && x.id) m[x.id] = x; });
  (remote||[]).forEach(function(x){
    if(!x || !x.id) return;
    var cur = m[x.id];
    if(!cur || (Number(x.mt)||0) > (Number(cur.mt)||0)) m[x.id] = x;
  });
  return Object.keys(m).map(function(k){ return m[k]; }).filter(function(x){ return !dead[x.id]; });
}
function mergeRemote(d){
  var before = JSON.stringify([S.plans,S.statements,S.paid,S.deleted,S.risyu,S.income,S.fixed,S.balances,S.events,S.tasks,S.exams,S.health,S.shifts,S.attend,S.terms,S.commute,S.ui]);
  var dead = {};
  (S.deleted||[]).concat(d.deleted||[]).forEach(function(x){ dead[x]=1; });

  var pm = {}; S.plans.forEach(function(p){ pm[p.id]=p; });
  (d.plans||[]).forEach(function(p){ if(!pm[p.id]) pm[p.id]=p; });
  var sm = {}; S.statements.forEach(function(s){ sm[s.id]=s; });
  (d.statements||[]).forEach(function(s){ if(!sm[s.id]) sm[s.id]=Object.assign({}, s, {hasImage:false}); });

  S.deleted = Object.keys(dead);
  S.plans = Object.keys(pm).map(function(k){ return pm[k]; }).filter(function(p){ return !dead[p.id]; });
  S.statements = Object.keys(sm).map(function(k){ return sm[k]; })
    .filter(function(s){ return !dead[s.id]; })
    .sort(function(a,b){ return (b.createdAt||0)-(a.createdAt||0); });

  LISTS.forEach(function(k){ S[k] = mergeList(S[k], d[k], dead); });

  var rp = d.paid || {};
  var planIdOf = function(k){ var i = k.indexOf(':'); return i < 0 ? k : k.slice(0, i); };
  Object.keys(rp).forEach(function(k){
    if(dead[planIdOf(k)]) return;
    var r = normPaid(rp[k]), l = normPaid(S.paid[k]);
    if(r && (!l || r.t > l.t)) S.paid[k] = r;
  });
  Object.keys(S.paid).forEach(function(k){ if(dead[planIdOf(k)]) delete S.paid[k]; });

  if(d.risyu && (Number(d.risyu.updatedAt)||0) > (Number(S.risyu.updatedAt)||0)){
    S.risyu.selected = Array.isArray(d.risyu.selected) ? d.risyu.selected.slice() : [];
    S.risyu.earned = Object.assign({ kyoyo:0, topic:0, lang:0, langEn:0, info:0, health:0, pe:0 }, d.risyu.earned||{});
    S.risyu.otherCr = Number(d.risyu.otherCr)||0;
    S.risyu.updatedAt = Number(d.risyu.updatedAt)||0;
  }
  var rm = d.meta || {};
  var uiChanged = false;
  [['attend','attend'],['terms','terms'],['commute','commute'],['ui','ui']].forEach(function(pair){
    var k = pair[0];
    if(d[k] && (Number(rm[k])||0) > (Number(S.meta[k])||0)){
      S[k] = d[k]; S.meta[k] = Number(rm[k])||0;
      if(k==='ui') uiChanged = true;
    }
  });
  if(uiChanged){ S.ui = Object.assign(JSON.parse(JSON.stringify(UI_DEFAULT)), S.ui||{}); applyUi(); }
  if(!Array.isArray(S.commute.periods) || S.commute.periods.length!==7) S.commute.periods = COMMUTE_DEFAULT.periods.slice();

  if(d.days){
    S.settings.smbcDay = d.days.smbc || S.settings.smbcDay;
    S.settings.rakutenDay = d.days.rakuten || S.settings.rakutenDay;
  }
  if(typeof d.regDeadline === 'string') S.settings.regDeadline = d.regDeadline;
  if(d.wageWeekday != null) S.settings.wageWeekday = toNum(d.wageWeekday);
  if(d.wageWeekend != null) S.settings.wageWeekend = toNum(d.wageWeekend);
  if(typeof d.wage === 'number') S.settings.wage = d.wage;

  persist();
  if(before !== JSON.stringify([S.plans,S.statements,S.paid,S.deleted,S.risyu,S.income,S.fixed,S.balances,S.events,S.tasks,S.exams,S.health,S.shifts,S.attend,S.terms,S.commute,S.ui])) render();
  pushRemote();
}

  S[list] = S[list].filter(function(x){ return x.id !== id; });
}

function download(blob, name){
  var url=URL.createObjectURL(blob), a=document.createElement('a');
  a.href=url; a.download=name; document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(url);
}
function icsStamp(ymd, hhmm){
  var a = ymd.split('-');
  return a[0]+a[1]+a[2]+'T'+hhmm.replace(':','')+'00';
}
function icsEsc(t){
  return String(t==null?'':t).replace(/\\/g,'\\\\').replace(/;/g,'\\;').replace(/,/g,'\\,').replace(/[\r\n]+/g,' ');
}
function makeIcs(){
  var lines = ['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//kurashi//JP','CALSCALE:GREGORIAN','METHOD:PUBLISH',
    'X-WR-CALNAME:くらしの手帳',
    'BEGIN:VTIMEZONE','TZID:Asia/Tokyo','BEGIN:STANDARD','DTSTART:19700101T000000',
    'TZOFFSETFROM:+0900','TZOFFSETTO:+0900','TZNAME:JST','END:STANDARD','END:VTIMEZONE'];

  /* 時刻つきなら時間の予定、なければ終日の予定として書き出す */
  var ev = function(uid, title, ymd, hhmm, minutes, endYmd, note){
    if(!isYmd(ymd)) return;
    lines.push('BEGIN:VEVENT', 'UID:'+uid+'@kurashi', 'SUMMARY:'+icsEsc(title));
    if(hhmm && minutesOf(hhmm) != null){
      var endMin = minutesOf(hhmm) + (minutes || 60);
      var endDay = ymd;
      if(endMin >= 1440){ endMin -= 1440; endDay = shiftDate(ymd, 1); }
      lines.push('DTSTART;TZID=Asia/Tokyo:'+icsStamp(ymd, hhmm),
                 'DTEND;TZID=Asia/Tokyo:'+icsStamp(endDay, hhmmOf(endMin)));
    }else{
      var last = (isYmd(endYmd) && endYmd > ymd) ? endYmd : ymd;
      var a = ymd.split('-'), b = shiftDate(last, 1).split('-');   /* 終日は翌日が終わり */
      lines.push('DTSTART;VALUE=DATE:'+a[0]+a[1]+a[2], 'DTEND;VALUE=DATE:'+b[0]+b[1]+b[2]);
    }
    if(note) lines.push('DESCRIPTION:'+icsEsc(note));
    lines.push('END:VEVENT');
  };

  S.events.forEach(function(e){
    ev('ev-'+e.id, (e.kind==='imp'?'★ ':'')+(e.title||'予定'), e.date, e.time, 60, e.dateEnd, e.memo);
  });
  S.tasks.forEach(function(t){
    if(!t.done) ev('tk-'+t.id, '締切 '+(t.title||''), t.due, t.time, 60, '', t.subject);
  });
  S.exams.forEach(function(x){
    ev('ex-'+x.id, (x.kind==='quiz'?'小テスト ':'テスト ')+(x.subject||''), x.date, x.time, 60, '', x.room);
  });
  S.shifts.forEach(function(w){
    var mins = Math.round(shiftHours(w)*60) || 60;
    ev('wk-'+w.id, 'バイト '+(w.title||''), w.date, w.start, mins, '', w.memo);
  });
  S.health.forEach(function(h){
    ev('hl-'+h.id, (h.name||'')+' の期限', h.next, '', 0, '', h.memo);
  });
  var d = derive(), cur = thisYm();
  d.months.filter(function(m){ return m>=cur; }).forEach(function(m){
    [['smbc',S.settings.smbcDay],['rakuten',S.settings.rakutenDay]].forEach(function(pair){
      var g=d.byMonth[m][pair[0]], amt=g.plan+g.stmt; if(amt<=0) return;
      ev(pair[0]+'-'+m, ACCOUNTS[pair[0]].bank+' 引落 '+yen(amt), m+'-'+pad(pair[1]), '', 0, '', '前日までに入金');
    });
  });

  lines.push('END:VCALENDAR');
  download(new Blob([lines.join('\r\n')],{type:'text/calendar;charset=utf-8'}), 'kurashi.ics');
}

/* ============================== 授業の取り出し ============================== */
/* 後期の時間割（登録済み＋抽選で選んだ科目）を 曜日+限 で引けるようにする */
function laterTermMap(){
  var m = {};
  FIXED.forEach(function(f){
    f.slots.forEach(function(s){ m[s.d+s.p] = { name:f.name, kind:'fixed' }; });
  });
  rSelected().forEach(function(c){
    c.slots.forEach(function(s){ m[s.d+s.p] = { name:c.name, kind:'sel', code:c.code }; });
  });
  return m;
}
function courseList(){
  var out = [], seen = {};
  FIXED.forEach(function(f){ if(!seen[f.name]){ seen[f.name]=1; out.push({ key:f.name, name:f.name }); } });
  rSelected().forEach(function(c){ if(!seen[c.name]){ seen[c.name]=1; out.push({ key:c.name, name:c.name }); } });
  return out;
}
function classesOn(dayChar){
  var m = laterTermMap(), out = [];
  PERIODS.forEach(function(p){
    var c = m[dayChar+p];
    if(c) out.push({ period:p, name:c.name });
  });
  return out;
}

/* ============================== 出発時刻 ============================== */
function commuteTotal(){
  var c = S.commute;
  return toNum(c.walk)+toNum(c.bus)+toNum(c.change)+toNum(c.train)+toNum(c.toSchool)+toNum(c.buffer);
}
function departureFor(period){
  var start = minutesOf(S.commute.periods[period-1]);
  if(start == null) return null;
  var total = commuteTotal();
  return { leave: hhmmOf(start - total), start: hhmmOf(start), total: total,
           prevDay: (start - total) < 0 };   /* 通学が長すぎて前日にまわる場合 */
}

/* ============================== 天気 ============================== */
var SANDA = { lat:34.8883, lon:135.2264, name:'三田' };
var SCHOOL = { lat:34.7188, lon:135.3606, name:'西宮' };
function weatherWord(code){
  if(code===0) return '快晴';
  if(code<=2) return '晴れ';
  if(code===3) return 'くもり';
  if(code===45||code===48) return '霧';
  if(code>=51&&code<=57) return '霧雨';
  if(code>=61&&code<=67) return '雨';
  if(code>=71&&code<=77) return '雪';
  if(code>=80&&code<=82) return 'にわか雨';
  if(code>=85&&code<=86) return 'にわか雪';
  if(code>=95) return '雷雨';
  return '';
}
async function loadWeather(){
  if(!S.ui.weather){ weather.state='off'; return; }
  weather.state = 'loading';
  var url = function(p){
    return 'https://api.open-meteo.com/v1/forecast?latitude='+p.lat+'&longitude='+p.lon+
      '&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max,snowfall_sum'+
      '&hourly=visibility,snowfall,weather_code&timezone=Asia%2FTokyo&forecast_days=1';
  };
  try{
    var res = await Promise.all([fetch(url(SANDA)), fetch(url(SCHOOL))]);
    if(!res[0].ok || !res[1].ok) throw new Error('status');
    var js = await Promise.all([res[0].json(), res[1].json()]);
    weather.sanda = js[0]; weather.school = js[1];
    weather.state = 'ok';
    weather.alert = busAlert(js[0]);
  }catch(e){
    weather.state = 'ng';
    weather.msg = '天気を取れませんでした';
  }
  if(appId === 'today') render();
}
function busAlert(w){
  try{
    var d = w.daily, h = w.hourly;
    var code = d.weather_code[0];
    var snowSum = Number(d.snowfall_sum ? d.snowfall_sum[0] : 0) || 0;
    var lowVis = false, snowHour = false;
    if(h && h.time){
      for(var i=0;i<h.time.length && i<12;i++){
        var hh = Number(String(h.time[i]).slice(11,13));
        if(hh < 5 || hh > 11) continue;               /* 通学時間帯だけ見る */
        if(Number(h.visibility[i]) < 1000) lowVis = true;
        if(Number(h.snowfall[i]) > 0) snowHour = true;
      }
    }
    if(snowSum > 0 || snowHour || (code>=71&&code<=77) || code===85 || code===86)
      return '雪の予報です。三田からのバスが遅れることがあります。早めに出るか、電車への振り替えも考えてください。';
    if(lowVis || code===45 || code===48)
      return '朝は霧が出そうです。三田の山あいは見通しが悪くなり、バスが遅れることがあります。';
    if(code>=95) return '雷雨の予報です。バス・電車とも遅れる可能性があります。';
    return '';
  }catch(e){ return ''; }
}
function weatherLine(){
  if(weather.state !== 'ok') return '';
  try{
    var a = weather.sanda.daily, b = weather.school.daily;
    var ta = Math.round(a.temperature_2m_min[0]), tb = Math.round(b.temperature_2m_min[0]);
    var diff = tb - ta;
    var s = '三田 '+Math.round(a.temperature_2m_max[0])+'/'+ta+'℃・'+weatherWord(a.weather_code[0]);
    s += '　西宮 '+Math.round(b.temperature_2m_max[0])+'/'+tb+'℃';
    if(diff >= 2) s += '（三田のほうが朝'+diff+'℃低いです）';
    var pop = a.precipitation_probability_max ? a.precipitation_probability_max[0] : null;
    if(pop != null && pop >= 50) s += '　降水'+pop+'%・傘があると安心';
    return s;
  }catch(e){ return ''; }
}

/* ============================== バナー ============================== */
function banners(){
  var out = [], d = derive(), cur = thisYm(), td = today();

  /* 天気・バス遅延 */
  if(weather.alert) out.push({c:'amber', ic:'⚠', t:weather.alert});

  /* 支払い前日・当日 */
  [['smbc',S.settings.smbcDay],['rakuten',S.settings.rakutenDay]].forEach(function(p){
    var g = d.byMonth[cur] ? d.byMonth[cur][p[0]] : null;
    if(!g) return;
    var amt = g.plan + g.stmt; if(amt <= 0) return;
    var n = daysUntil(p[1]);
    if(n === 0) out.push({c:'red', ic:'●', t:'<b>今日は'+ACCOUNTS[p[0]].bank+'の引き落とし日</b>です。'+yen(amt)+' を用意してください。'});
    else if(n === 1) out.push({c:'red', ic:'●', t:'<b>明日は'+ACCOUNTS[p[0]].bank+'の引き落とし日</b>です。'+yen(amt)+' の入金を今日のうちに。'});
    else if(n <= 3) out.push({c:'amber', ic:'●', t:ACCOUNTS[p[0]].bank+'の引き落としまであと'+n+'日（'+yen(amt)+'）。'});
  });

  /* 課題の締切 */
  var near = S.tasks.filter(function(t){ return !t.done && isYmd(t.due); })
    .map(function(t){ return Object.assign({}, t, {left: daysFromToday(t.due)}); })
    .filter(function(t){ return t.left !== null && t.left <= 3; })
    .sort(function(a,b){ return a.left - b.left; });
  near.forEach(function(t){
    var w = t.left < 0 ? '<b>期限を過ぎています</b>' : t.left === 0 ? '<b>今日が締切</b>' : t.left === 1 ? '<b>明日が締切</b>' : 'あと'+t.left+'日';
    out.push({c: t.left <= 1 ? 'red' : 'amber', ic:'✎', t:'課題「'+esc(t.title)+'」'+(t.subject?'（'+esc(t.subject)+'）':'')+'は'+w+'です。'});
  });

  /* テスト */
  S.exams.filter(function(x){ return isYmd(x.date); }).forEach(function(x){
    var n = daysFromToday(x.date);
    if(n === null || n < 0 || n > 7) return;
    out.push({c: n <= 1 ? 'red' : 'blue', ic:'📖', t:(x.subject?esc(x.subject):'テスト')+'のテストは'+(n===0?'<b>今日</b>':n===1?'<b>明日</b>':'あと'+n+'日')+'です。'+(x.room?'（'+esc(x.room)+'）':'')});
  });

  /* 履修登録の締切 */
  if(isYmd(S.settings.regDeadline)){
    var r = daysFromToday(S.settings.regDeadline);
    if(r !== null && r >= 0 && r <= 7)
      out.push({c: r <= 2 ? 'red' : 'amber', ic:'🗓', t:'<b>履修登録の締切まであと'+r+'日</b>です（'+ymdLabel(S.settings.regDeadline)+'）。'});
  }

  /* 出席の残り */
  Object.keys(S.attend).forEach(function(k){
    var a = S.attend[k]; if(!a) return;
    var lim = toNum(a.limit)||5, ab = toNum(a.ab);
    if(ab >= lim) out.push({c:'red', ic:'△', t:'<b>'+esc(k)+'</b> の欠席が'+ab+'回で上限（'+lim+'回）に達しています。'});
    else if(lim - ab <= 1) out.push({c:'amber', ic:'△', t:esc(k)+' の欠席はあと'+(lim-ab)+'回で上限です。'});
  });

  /* 健康の期限 */
  S.health.filter(function(h){ return isYmd(h.next); }).forEach(function(h){
    var n = daysFromToday(h.next);
    if(n === null || n > 30) return;
    out.push({c: n < 0 ? 'red' : n <= 7 ? 'amber' : 'green', ic:'＋',
      t: esc(h.name)+'の期限は'+ymdLabel(h.next)+(n<0?'（<b>過ぎています</b>）':'（あと'+n+'日）')+'です。'});
  });

  /* お金の状態 */
  var b = budget();
  if(b.level === 'bad') out.push({c:'red', ic:'¥', t:'<b>今月は'+yen(-b.free)+'足りません。</b>収入と支払いの登録を見直してください。'});
  else if(b.level === 'warn') out.push({c:'amber', ic:'¥', t:'口座と収入を合わせても、今月自由に使えるのは'+yen(b.free)+'。かなりギリギリです。'});

  return out;
}

    '<div class="greet">'+greet+'</div>'+
    (weatherLine() ? '<div class="s2 wx" style="margin-top:6px">'+esc(weatherLine())+'</div>'
      : weather.state==='loading' ? '<div class="s2 wx" style="margin-top:6px">天気を確認しています…</div>'

    '<div class="art">'+art+'</div></div>';

    }).join('') + '</section>';
  }

  /* 今日の授業と出発時刻 */
  var cls = classesOn(dch);

  if(!cls.length){
    inner = '<div class="empty">'+ART.empty+'<div style="margin-top:8px">今日は授業がありません。</div></div>';
  }else{
    var dep = departureFor(cls[0].period);

      inner += '<div class="stat" style="margin-bottom:12px"><div class="k">最初は'+cls[0].period+'限（'+dep.start+'開始）だから</div>'+

    }

      return '<div class="tline"><span class="pd-badge">'+c.period+'</span>'+
        '<span class="grow"><span class="t">'+esc(c.name)+'</span></span>'+
        '<span class="s2 num">'+esc(st)+'</span></div>';
    }).join('');
  }
  html += section('今日の授業', dch+'曜日', inner);

  /* 今日の予定 */
  var evs = S.events.filter(function(e){
      var end = (isYmd(e.dateEnd) && e.dateEnd > e.date) ? e.dateEnd : e.date;
      return e.date <= td && td <= end;          /* 何日も続く予定も今日に出す */
    })
    .sort(function(a,b){ return String(a.time||'').localeCompare(String(b.time||'')); });
  html += section('今日の予定', evs.length ? evs.length+'件' : null,
    evs.length ? evs.map(function(e){
      return '<div class="evrow"><span class="cbar" style="background:'+colorOf(e.color)+'"></span>'+
        '<span class="grow"><span class="t">'+esc(e.title)+'</span>'+
        ((e.dateEnd && e.dateEnd>e.date) ? '<span class="s">'+ymdLabel(e.date)+' 〜 '+ymdLabel(e.dateEnd)+'</span>' :
          (e.memo?'<span class="s">'+esc(e.memo)+'</span>':''))+'</span>'+
        (e.time?'<span class="s2 num">'+esc(e.time)+'</span>':'')+'</div>';
    }).join('') : '<div class="empty">今日の予定はありません。</div>');

  /* お金 */
  var b = budget();
  var lv = b.level==='bad'?'ng':b.level==='warn'?'ng':'ok';
  html += section('今月のお金', ymLabel(b.month),
    '<div class="msg '+lv+'" style="margin-bottom:12px">'+esc(b.word)+'</div>'+

      '<div class="stat"><div class="k">自由に使えるお金</div><div class="v num">'+yen(b.free)+'</div></div>'+
      '<div class="stat"><div class="k">うち口座の残高</div><div class="v num">'+yen(b.balance)+'</div></div>'+
      '<div class="stat"><div class="k">今月の支払い</div><div class="v num">'+yen(b.pay)+'</div></div>'+
      '<div class="stat"><div class="k">固定費・サブスク</div><div class="v num">'+yen(b.fixed)+'</div></div>'+
    '</div>'+
    '<button class="btn ghost" style="margin-top:12px" data-act="go" data-app="money" data-tab="home">お金の画面をひらく</button>');

  return html;
}

function viewChart(d){
  var cur=thisYm(), future=d.months.filter(function(m){ return m>=cur; });
  var use = chartRange===0?d.months:future.slice(0,chartRange);
  var data = use.map(function(m){ var g=d.byMonth[m]; return { m:m, a:g.smbc.plan+g.smbc.stmt, b:g.rakuten.plan+g.rakuten.stmt }; });
  var max = Math.max(1, Math.max.apply(null, data.map(function(x){ return x.a+x.b; })));
  var W=340, H=190, bottom=H-24, top=8, gap=3;
  var bw = Math.max(4, (W-8)/data.length - gap);
  var unit = Math.ceil(max/10000)*10000 || 1;
  var scale = function(v){ return (bottom-top) * v / unit; };
  var bars = data.map(function(x,i){
    var px = 4 + i*((W-8)/data.length);
    var ha = scale(x.a), hb = scale(x.b);
    var showLabel = data.length<=8 || i%2===0;
    return '<rect x="'+px.toFixed(1)+'" y="'+(bottom-ha).toFixed(1)+'" width="'+bw.toFixed(1)+'" height="'+ha.toFixed(1)+'" fill="var(--smbc)"/>'+
      '<rect x="'+px.toFixed(1)+'" y="'+(bottom-ha-hb).toFixed(1)+'" width="'+bw.toFixed(1)+'" height="'+hb.toFixed(1)+'" fill="var(--rakuten)"/>'+
      (showLabel?'<text x="'+(px+bw/2).toFixed(1)+'" y="'+(H-8)+'" font-size="9" fill="var(--sub)" text-anchor="middle">'+ymShort(x.m)+'</text>':'');
  }).join('');
  var manLabel = function(v){
    var man = v/10000;
    if(man === 0) return '0';
    return (man < 1 || man % 1 !== 0) ? man.toFixed(1) : String(man);
  };
  var grid = [0,.5,1].map(function(f){ var y=bottom-(bottom-top)*f;
    return '<line x1="0" y1="'+y+'" x2="'+W+'" y2="'+y+'" stroke="var(--rule)"/>'+
      '<text x="0" y="'+(y-3)+'" font-size="9" fill="var(--sub)">'+manLabel(unit*f)+'万</text>'; }).join('');

  return section('口座別の必要額', data.length+'ヶ月',
    '<div class="chips">'+[[6,'6ヶ月'],[12,'12ヶ月'],[0,'全期間']].map(function(v){
      return '<button data-act="range" data-v="'+v[0]+'" class="'+(chartRange===v[0]?'on':'')+'">'+v[1]+'</button>'; }).join('')+'</div>'+
    '<svg viewBox="0 0 '+W+' '+H+'" style="width:100%;height:auto">'+grid+bars+'</svg>'+
    '<div class="s" style="margin-top:6px"><span class="dot" style="background:var(--smbc)"></span>三井住友　<span class="dot" style="background:var(--rakuten)"></span>楽天</div>')
  + section('口座ごとの残り総額', null, ['smbc','rakuten'].map(function(acc){
      var sum = future.reduce(function(s,m){ return s+d.byMonth[m][acc].plan+d.byMonth[m][acc].stmt; },0);
      return accRow(acc, sum, '今月以降の合計');
    }).join(''));
}

/* ============================== 明細の写真読み取り ============================== */
async function readStatement(dataUrl){
  var res = await fetch('https://api.anthropic.com/v1/messages', {
    method:'POST',
    headers:{
      'content-type':'application/json',
      'x-api-key':S.settings.apiKey,
      'anthropic-version':'2023-06-01',
      'anthropic-dangerous-direct-browser-access':'true'
    },
    body: JSON.stringify({
      model:'claude-sonnet-5', max_tokens:1000,
      messages:[{ role:'user', content:[
        { type:'image', source:{ type:'base64', media_type:'image/jpeg', data:dataUrl.split(',')[1] } },
        { type:'text', text:'これはクレジットカードの利用明細の写真です。次のJSONだけを返してください。前置きやコードフェンスは不要です。\n{"issuer":"三井住友カード|楽天カード|不明","billing_month":"YYYY-MM または null","total_amount":請求合計の数値,"items":[{"name":"店名など","amount":数値}]}\ntotal_amount はその月の請求合計。読み取れない値は null に。' }
      ]}]
    })
  });
  if(!res.ok) throw new Error('API ' + res.status);
  var data = await res.json();
  var text = (data.content||[]).map(function(c){ return c.type==='text'?c.text:''; }).join('\n').replace(/```json|```/g,'').trim();
  return JSON.parse(text.slice(text.indexOf('{'), text.lastIndexOf('}')+1));
}
async function handlePhoto(file){
  toast('写真を読み込んでいます…');
  try{
    var thumb = await resizeImage(file, 480, 0.5);

    if(S.settings.apiKey){
      try{
        var big = await resizeImage(file, 1400, 0.8);
        parsed = await readStatement(big);
      }catch(e){ toast('金額を読み取れませんでした。手で入力してください。', true); }
    }
    draft = {
      id:uid('s'),
      accountId:(parsed.issuer||'').indexOf('楽天')>=0 ? 'rakuten' : 'smbc',
      billingMonth: isYm(parsed.billing_month) ? parsed.billing_month : thisYm(),
      amount: parsed.total_amount ? String(parsed.total_amount) : '',
      memo: (Array.isArray(parsed.items) ? parsed.items : []).slice(0,2)
              .map(function(i){ return i && i.name ? String(i.name) : ''; }).filter(Boolean).join('、'),
      thumb: thumb
    };
  }catch(e){ toast('写真を読み込めませんでした。別の写真で試してください。', true); }
  render();
}

/* ============================== お金：操作 ============================== */
function moneyAction(act, t){
  if(act==='paid'){ var k=t.dataset.key; setPaid(k, !isPaid(k)); commit(); }
  else if(act==='toggle-past'){ hidePast=!hidePast; render(); }
  else if(act==='range'){ chartRange=Number(t.dataset.v); render(); }
  else if(act==='toggle-plan-form'){ showPlanForm=!showPlanForm; render(); }
  else if(act==='pf-acc' || act==='df-acc' || act==='fx-kind'){
    Array.prototype.forEach.call(t.parentNode.querySelectorAll('button'), function(b){ b.classList.remove('on'); });
    t.classList.add('on');
    if(act==='df-acc'){ readDraftFields(); draft.accountId=t.dataset.id; render(); }
  }
  else if(act==='del-plan'){
    var id=t.dataset.id;
    S.deleted=(S.deleted||[]).concat([id]);
    S.plans=S.plans.filter(function(p){ return p.id!==id; });
    Object.keys(S.paid).forEach(function(key){ if(key.indexOf(id+':')===0) delete S.paid[key]; });
    toast('削除しました'); commit();
  }
  else if(act==='add-plan'){
    var name=val('pf_name').trim(), total=toNum(val('pf_total')), count=toNum(val('pf_count')), start=val('pf_start');
    var accBtn=document.querySelector('#planform .pick button.on');
    if(!name||!total||!count){ toast('名前・総額・回数を入れてください', true); return true; }
    if(!isYm(start)) start=addMonths(thisYm(),1);
    var monthly=Math.floor(total/count), rem=total-monthly*count;
    S.plans.push({ id:uid('p'), name:name, accountId:accBtn?accBtn.dataset.id:'smbc', count:count, monthly:monthly, firstAmount:rem>0?monthly+rem:null, start:start });
    showPlanForm=false; toast(name+' を追加しました（月々 '+yen(monthly)+'）'); commit();
  }
  else if(act==='cam'){ document.getElementById('cam').click(); }
  else if(act==='pick'){ document.getElementById('pickf').click(); }
  else if(act==='manual'){ draft={ id:uid('s'), accountId:'smbc', billingMonth:thisYm(), amount:'', memo:'', thumb:null }; render(); }
  else if(act==='cancel-stmt'){ draft=null; render(); }
  else if(act==='save-stmt'){
    readDraftFields();
    if(!draft.amount){ toast('金額を入れてください', true); return true; }
    var s={ id:draft.id, accountId:draft.accountId, billingMonth:draft.billingMonth, amount:Number(draft.amount), memo:draft.memo, hasImage:!!draft.thumb, createdAt:Date.now() };
    if(draft.thumb){ try{ localStorage.setItem(imgKey(s.id), draft.thumb); }catch(err){ s.hasImage=false; } }
    S.statements.unshift(s); draft=null;
    toast(ymLabel(s.billingMonth)+'に '+yen(s.amount)+' を加算しました'); commit();
  }
  else if(act==='del-stmt'){
    var sid=t.dataset.id;
    S.deleted=(S.deleted||[]).concat([sid]);
    S.statements=S.statements.filter(function(x){ return x.id!==sid; });
    try{ localStorage.removeItem(imgKey(sid)); }catch(err){}
    toast('削除しました'); commit();
  }
  else if(act==='view-img'){
    var src=null; try{ src=localStorage.getItem(imgKey(t.dataset.id)); }catch(err){}
    if(!src){ toast('この端末に写真は保存されていません'); return true; }
    var box=el('<div id="lightbox"><img src="'+src+'" alt="明細"></div>');
    box.addEventListener('click',function(){ box.remove(); });
    document.body.appendChild(box);
  }
  else if(act==='ics'){ makeIcs(); toast('カレンダー用ファイルを保存しました'); }
  else if(act==='add-income'){
    var n=val('in_name').trim(), a=toNum(val('in_amount')), dd=toNum(val('in_day'));
    if(!n||!a){ toast('名前と金額を入れてください', true); return true; }
    S.income.push({ id:uid('in'), name:n, amount:a, day:(dd>=1&&dd<=31)?dd:0, memo:'', mt:Date.now() });
    toast('収入を追加しました'); commit();
  }
  else if(act==='del-income'){ removeItem('income', t.dataset.id); toast('削除しました'); commit(); }
  else if(act==='add-fixed'){
    var fn=val('fx_name').trim(), fa=toNum(val('fx_amount')), fd=toNum(val('fx_day'));
    var kb=document.querySelector('[data-act="fx-kind"].on');
    if(!fn||!fa){ toast('名前と月額を入れてください', true); return true; }
    S.fixed.push({ id:uid('fx'), name:fn, amount:fa, day:(fd>=1&&fd<=31)?fd:0, kind:kb?kb.dataset.id:'sub', mt:Date.now() });
    toast('追加しました'); commit();
  }
  else if(act==='del-fixed'){ removeItem('fixed', t.dataset.id); toast('削除しました'); commit(); }
  else if(act==='add-bal'){
    var bn=val('bl_name').trim(), ba=toNum(val('bl_amount'));
    if(!bn){ toast('口座名を入れてください', true); return true; }
    S.balances.push({ id:uid('bl'), name:bn, amount:ba, mt:Date.now() });
    toast('残高を追加しました'); commit();
  }
  else if(act==='edit-bal'){
    var b=S.balances.filter(function(x){ return x.id===t.dataset.id; })[0];
    if(!b) return true;
    var v=prompt(b.name+' の残高（円）', String(b.amount));
    if(v===null) return true;
    b.amount=toNum(v); b.mt=Date.now(); toast('更新しました'); commit();
  }
  else if(act==='del-bal'){ removeItem('balances', t.dataset.id); toast('削除しました'); commit(); }
  else if(act==='shift-prev'){ calYm = addMonths(calYm, -1); render(); }
  else if(act==='shift-next'){ calYm = addMonths(calYm, 1); render(); }
  else if(act==='shift-now'){ calYm = thisYm(); render(); }
  else if(act==='shift-to-income'){
    var ym2 = calYm, ls = S.shifts.filter(function(x){ return String(x.date).slice(0,7)===ym2; });
    var total = ls.reduce(function(a,x){ return a + shiftPay(x); }, 0);
    if(!total){ toast('シフトがありません', true); return true; }
    var cur2 = S.income.filter(function(x){ return x.id==='in_shift'; })[0];
    if(cur2){ cur2.amount = total; cur2.memo = ymLabel(ym2)+'のシフトから'; cur2.mt = Date.now(); }
    else S.income.push({ id:'in_shift', name:'バイト代（シフトから）', amount:total, day:0, memo:ymLabel(ym2)+'のシフトから', mt:Date.now() });
    toast('収入に '+yen(total)+' を入れました'); commit();
  }
  else if(act==='save-wage'){
    S.settings.wage = toNum(val('wk_wage'));
    toast('時給を保存しました'); commit();
  }
  else if(act==='work-to-income'){
    var ym = calYm;
    var hrs = S.shifts.filter(function(w){ return String(w.date).slice(0,7)===ym; })
      .reduce(function(a,w){ return a + shiftHours(w); }, 0);
    var amt = Math.round(hrs * toNum(S.settings.wage));
    if(!amt){ toast('シフトと時給を登録してください', true); return true; }
    var ex = S.income.filter(function(x){ return x.name==='バイト代（見込み）'; })[0];
    if(ex){ ex.amount = amt; ex.mt = Date.now(); }
    else S.income.push({ id:uid('in'), name:'バイト代（見込み）', amount:amt, day:0, memo:'', mt:Date.now() });
    toast(yen(amt)+' を収入に登録しました'); commit();
  }
  else return false;
  return true;
}

/* ============================== 履修：索引 ============================== */
var byCode = {};
COURSES.forEach(function(c){
  byCode[c.code] = c;
  c.key = norm(c.name + ' ' + c.teacher + ' ' + c.code);
});
var fixedMap = {};
FIXED.forEach(function(f){ f.slots.forEach(function(s){ fixedMap[s.d + s.p] = f; }); });
var slotHas = {};
COURSES.forEach(function(c){ c.slots.forEach(function(s){ var k=s.d+s.p; slotHas[k]=(slotHas[k]||0)+1; }); });

function rSelected(){ return S.risyu.selected.map(function(code){ return byCode[code]; }).filter(Boolean); }
function rIsSelected(code){ return S.risyu.selected.indexOf(code) >= 0; }
function selectedSlotMap(exceptCode){
  var m = {};
  rSelected().forEach(function(c){
    if(c.code === exceptCode) return;
    c.slots.forEach(function(s){ m[s.d + s.p] = c; });
  });
  return m;
}
function hardBlockers(c){
  var out = [];
  c.slots.forEach(function(s){
    var k = s.d + s.p;
    if(fixedMap[k] && !rIncludeOcc) out.push(k + '「' + fixedMap[k].name + '」と重複');
  });
  return out;
}
function swapTargets(c){
  var m = selectedSlotMap(c.code), out = [];
  c.slots.forEach(function(s){
    var o = m[s.d + s.p];
    if(o && out.indexOf(o) < 0) out.push(o);
  });
  return out;
}
function conflicts(c){
  return hardBlockers(c).concat(swapTargets(c).map(function(o){ return '「' + o.name + '」と重複'; }));
}
function ratioClass(r){ return r < 0.5 ? 'r0' : r < 1 ? 'r1' : r < 2 ? 'r2' : 'r3'; }
function ratioText(r){
  var t = r < 0.5 ? '◎ 余裕' : r < 1 ? '○ 定員内' : r < 2 ? '△ 半々' : '▲ 激戦';
  return t + ' ' + r.toFixed(2) + '倍';
}

/* ============================== 履修：単位集計 ============================== */
function tally(){
  var t = { kyoyo:0, topic:0, lang:0, langEn:0, info:0, health:0, pe:0, term:0 };
  FIXED.forEach(function(f){
    if(!f.cat) return;
    var g = CAT_INFO[f.cat] ? CAT_INFO[f.cat].group : null;
    if(g) t[g] += f.cr;
  });
  rSelected().forEach(function(c){
    t[CAT_INFO[c.cat].group] += c.cr;
    if(c.en) t.langEn += c.cr;
    t.term += c.cr;
  });
  return t;
}
var REQS = [
  {key:'total',  name:'共通教育科目 合計',  sub:'3区分あわせて127単位のうち', need:21},
  {key:'kyoyo',  name:'基礎教養科目群',     sub:'人文・社会・自然・国際理解', need:4},
  {key:'topic',  name:'トピック等4群',      sub:'現代トピック／ジェンダー／キャリア', need:6},
  {key:'lang',   name:'言語リテラシー',     sub:'外国語8単位の中心', need:5},
  {key:'langEn', name:'　うち英語',         sub:'言語5単位のうち3単位は英語', need:3},
  {key:'info',   name:'情報リテラシー',     sub:'データリテラシー・ＡＩの基礎を含む', need:2},
  {key:'health', name:'健康・スポーツ科学', sub:'実技ではなく講義のほう', need:1}
];
function metersHtml(){
  var t = tally(), e = S.risyu.earned, html = '';
  var got = {
    kyoyo:t.kyoyo+e.kyoyo, topic:t.topic+e.topic, lang:t.lang+e.lang, langEn:t.langEn+e.langEn,
    info:t.info+e.info, health:t.health+e.health, pe:t.pe+e.pe
  };
  got.total = got.kyoyo+got.topic+got.lang+got.info+got.health+got.pe;
  REQS.forEach(function(r){
    var g = got[r.key], pct = Math.min(100, Math.round(g / r.need * 100));
    html += '<div class="met"><div class="met-n">'+esc(r.name)+'<small>'+esc(r.sub)+'</small></div>'+
      '<div class="bar"><i class="'+(g>=r.need?'done':'')+'" style="width:'+pct+'%"></i></div>'+
      '<div class="met-v"><b>'+g+'</b> / '+r.need+'</div></div>';
  });
  var term = t.term + (Number(S.risyu.otherCr)||0) + 2;
  html += '<div class="met"><div class="met-n">今学期の登録単位<small>キャップ制は25単位以下</small></div>'+
    '<div class="bar"><i class="'+(term>25?'over':'done')+'" style="width:'+Math.min(100,Math.round(term/25*100))+'%"></i></div>'+
    '<div class="met-v"><b>'+term+'</b> / 25</div></div>';
  return html;
}
function warnsHtml(){
  var cs = rSelected(), out = '';
  var term = tally().term + (Number(S.risyu.otherCr)||0) + 2;
  if(term > 25) out += '<div class="msg ng">今学期の登録が'+term+'単位になります。キャップ制の上限は25単位なので、'+(term-25)+'単位ぶん減らしてください。</div>';
  var dup = cs.filter(function(c){ return conflicts(c).length; }).map(function(c){ return c.name; });
  if(dup.length) out += '<div class="msg ng">時間割が重なっています：'+esc(dup.join('、'))+'</div>';
  var hi = cs.filter(function(c){ return c.ratio >= 2; });
  if(hi.length) out += '<div class="msg ng">倍率2倍以上が'+hi.length+'件あります（'+esc(hi.map(function(c){return c.name;}).join('、'))+'）。落ちたときの代わりも決めておくと安心です。</div>';
  return out;
}

/* ============================== 履修：時間割 ============================== */
function courseRow(c){
  var hard = hardBlockers(c), swap = swapTargets(c), sel = rIsSelected(c.code);
  var b = '<span class="b cat">'+esc(CAT_INFO[c.cat].label)+'</span>'+
          '<span class="b cr">'+c.cr+'単位</span>'+
          '<span class="b '+ratioClass(c.ratio)+'">'+ratioText(c.ratio)+'</span>'+
          (c.en ? '<span class="b en">英語</span>' : '');
  if(sel && conflicts(c).length) b += '<span class="b warn">重複あり</span>';
  else if(!sel && hard.length) b += '<span class="b warn">'+esc(hard[0])+'</span>';
  else if(!sel && swap.length) b += '<span class="b r2">'+esc(swap.map(function(o){return o.name;}).join('・'))+'と差し替え</span>';

  return '<div class="crs'+(!sel && hard.length ? ' dis' : '')+'">'+
    '<div class="body"><div class="ct">'+esc(c.name)+'</div>'+
    '<div class="cm">'+esc(c.slotText)+'\u3000'+esc(c.teacher)+'<br>コード '+c.code+'\u3000定員'+c.cap+'／申込'+c.apps+'</div>'+
    '<div class="badges">'+b+'</div></div>'+
    '<button type="button" class="add'+(sel?' rm':'')+'" data-act="r-toggle" data-code="'+c.code+'"'+
      (!sel && hard.length ? ' disabled' : '')+'>'+(sel?'外す':(swap.length?'差し替え':'入れる'))+'</button></div>';
}
function gridHtml(){
  var selMap = selectedSlotMap(null);
  var h = '<thead><tr><th class="pd"></th>';
  DAYS.forEach(function(d){ h += '<th>'+d+'</th>'; });
  h += '</tr></thead><tbody>';
  PERIODS.forEach(function(p){
    h += '<tr><th class="pd">'+p+'</th>';
    DAYS.forEach(function(d){
      var k = d + p, f = fixedMap[k], s = selMap[k];
      if(f){
        h += '<td class="fx"><span class="cell none"><span class="nm">'+esc(f.name)+'</span><span class="tag">登録済み</span></span></td>';
      }else if(s){
        h += '<td class="sel"><button type="button" class="cell" data-act="r-slot" data-slot="'+k+'">'+
             '<span class="x" data-x="1">外す</span><span class="nm">'+esc(s.name)+'</span>'+
             '<span class="tag">'+esc(s.code)+'・'+s.cr+'単位</span></button></td>';
      }else if(slotHas[k]){
        h += '<td><button type="button" class="cell free" data-act="r-slot" data-slot="'+k+'">＋ '+slotHas[k]+'件</button></td>';
      }else{
        h += '<td><span class="cell none free">—</span></td>';
      }
    });
    h += '</tr>';
  });
  return h + '</tbody>';
}
function selListHtml(){
  var cs = rSelected();
  if(!cs.length) return '<div class="empty">'+ART.empty+'<div style="margin-top:8px">まだ何も選んでいません。時間割のマスをタップするか「履修案」から読み込んでください。</div></div>';
  var order = {'月':0,'火':1,'水':2,'木':3,'金':4,'土':5};
  cs = cs.slice().sort(function(a,b){
    var A=a.slots[0], B=b.slots[0];
    return (order[A.d]-order[B.d]) || (A.p-B.p);
  });
  return cs.map(courseRow).join('');
}
function codeText(){
  return rSelected().map(function(c){ return c.code + '  ' + c.slotText + '  ' + c.name; }).join('\n');
}

function dueClass(n){ return n===null?'d3': n<0?'d0': n<=1?'d0': n<=3?'d1': n<=7?'d2':'d3'; }
function dueText(n){
  if(n===null) return '期限なし';
  if(n<0) return (-n)+'日超過';
  if(n===0) return '今日まで';
  if(n===1) return '明日まで';
  return 'あと'+n+'日';
}
function subjectOptions(sel){

  };

      '<div class="s" style="margin-top:4px">'+(next.quiz?'小テスト・':'')+ymdLabel(next.date)+

      rows(regular, 'まだありません。下から追加できます。')+

/* ============================== 履修：選択シート ============================== */
function openPicker(k){
  var m = k.match(/^([月火水木金土])([1-7])$/);
  if(!m) return;
  pick.d = m[1]; pick.p = parseInt(m[2],10); pick.cat = 'all'; pick.q = '';
  document.getElementById('shSearch').value = '';
  document.getElementById('veil').classList.add('on');
  document.getElementById('sheet').classList.add('on');
  renderPicker();
}
function closePicker(){
  document.getElementById('veil').classList.remove('on');
  document.getElementById('sheet').classList.remove('on');
}
function sheetOpen(){ return document.getElementById('sheet').classList.contains('on'); }
function renderPicker(){
  document.getElementById('shTitle').textContent = pick.d + '曜 ' + pick.p + '限';
  document.getElementById('shDays').innerHTML = DAYS.map(function(d){
    return '<button type="button" class="'+(d===pick.d?'on':'')+'" data-day="'+d+'">'+d+'</button>'; }).join('');
  document.getElementById('shPeriods').innerHTML = PERIODS.map(function(p){
    return '<button type="button" class="'+(p===pick.p?'on':'')+'" data-period="'+p+'">'+p+'限</button>'; }).join('');

  var all = COURSES.filter(function(c){
    return c.slots.some(function(s){ return s.d===pick.d && s.p===pick.p; });
  });
  var cats = [];
  all.forEach(function(c){ if(cats.indexOf(c.cat)<0) cats.push(c.cat); });
  var ch = '<button type="button" class="'+(pick.cat==='all'?'on':'')+'" data-cat="all">すべて '+all.length+'</button>';
  cats.forEach(function(ct){
    var n = all.filter(function(c){ return c.cat===ct; }).length;
    ch += '<button type="button" class="'+(pick.cat===ct?'on':'')+'" data-cat="'+ct+'">'+esc(CAT_INFO[ct].label)+' '+n+'</button>';
  });
  document.getElementById('shCats').innerHTML = ch;

  var q = norm(pick.q.trim());
  var list = all.filter(function(c){
    if(pick.cat !== 'all' && c.cat !== pick.cat) return false;
    if(!q) return true;
    return c.key.indexOf(q) >= 0;
  });
  list.sort(function(a,b){
    var ba = hardBlockers(a).length?1:0, bb = hardBlockers(b).length?1:0;
    if(rIsSelected(a.code)) ba = -1;
    if(rIsSelected(b.code)) bb = -1;
    return (ba-bb) || (a.ratio-b.ratio);
  });

  var body = '';
  var cur = selectedSlotMap(null)[pick.d + pick.p];
  if(cur) body += '<div class="msg ok">この枠には「'+esc(cur.name)+'」が入っています。別の講座の「差し替え」を押すと入れ替わります。</div>';
  var fk = fixedMap[pick.d + pick.p];
  if(fk) body += '<div class="msg ng">この枠は「'+esc(fk.name)+'」で埋まっています。'+
    (rIncludeOcc ? '重複を許可する設定なので選べますが、実際に登録できるか必ず確認してください。' : '下の科目は週2コマ科目の片方としてこの枠を使うものです。')+'</div>';
  if(!list.length) body += '<div class="empty">この条件に合う講座はありません。</div>';
  body += list.map(courseRow).join('');
  var bd = document.getElementById('shBody');
  bd.innerHTML = body;
  bd.scrollTop = 0;
}

/* ============================== 履修：操作 ============================== */
function touchRisyu(){ S.risyu.updatedAt = Date.now(); }
function rToggle(code){
  var c = byCode[code];
  if(!c) return;
  var i = S.risyu.selected.indexOf(code);
  if(i >= 0){
    S.risyu.selected.splice(i,1);
  }else{
    if(hardBlockers(c).length) return;
    swapTargets(c).forEach(function(o){
      var j = S.risyu.selected.indexOf(o.code);
      if(j >= 0) S.risyu.selected.splice(j,1);
    });
    S.risyu.selected.push(code);
  }
  touchRisyu();
  commit();
  if(sheetOpen()) renderPicker();
}
function risyuAction(act, t, ev){
  if(act==='r-slot'){
    var k = t.dataset.slot;
    var selMap = selectedSlotMap(null);
    if(selMap[k] && ev.target.closest('[data-x]')){ rToggle(selMap[k].code); return true; }
    openPicker(k); return true;
  }
  if(act==='r-toggle'){ if(!t.disabled) rToggle(t.dataset.code); return true; }
  if(act==='r-clear'){ S.risyu.selected = []; touchRisyu(); toast('すべて外しました'); commit(); return true; }
  if(act==='r-plan'){
    var p = RISYU_PLANS.filter(function(x){ return x.id === t.dataset.plan; })[0];
    if(!p) return true;
    S.risyu.selected = p.codes.filter(function(c){ return byCode[c]; });
    touchRisyu(); closePicker(); risyuTab = 'tt'; toast('案'+p.id+'を読み込みました'); commit(); window.scrollTo(0,0);
    return true;
  }
  if(act==='r-copy'){
    var box = document.getElementById('codebox');
    if(box){ box.focus(); box.select(); }
    var manual = function(){ toast('下の欄が選択されています。長押しか右クリックでコピーしてください'); };
    try{
      if(navigator.clipboard && navigator.clipboard.writeText){
        navigator.clipboard.writeText(codeText()).then(function(){ toast('時間割コードをコピーしました'); })['catch'](manual);
      }else{ manual(); }
    }catch(e){ manual(); }
    return true;
  }
  if(act==='course-add'){
    evDraft = newDraft(today());
    evDraft.kind = 'task';
    evDraft.color = kindOf('task').color;
    evDraft.subject = t.dataset.name;
    evDraft.title = '';
    calEdit = null;
    appId = 'cal'; calTab = 'cal'; if(calView === 'todo') calView = 'month';
    render();
    var f = document.getElementById('evform');
    if(f) f.scrollIntoView({block:'center'});
    var ti = document.getElementById('ev_title');
    if(ti) ti.focus();
    toast(t.dataset.name+' の課題を追加します');
    return true;
  }
  if(act==='add-task'){
    var ti = val('tk_title').trim();
    if(!ti){ toast('やることの名前を入れてください', true); return true; }
    S.tasks.push({ id:uid('tk'), title:ti, subject:val('tk_subject'), due:readMd('tk_due'), done:0, memo:'', color:'c2', mt:Date.now() });
    toast('追加しました'); commit(); return true;
  }
  if(act==='task-done' || act==='task-undone'){
    var tk = S.tasks.filter(function(x){ return x.id===t.dataset.id; })[0];
    if(tk){ tk.done = act==='task-done'?1:0; tk.mt=Date.now(); if(tk.done) toast('おつかれさま！'); commit(); }
    return true;
  }
  if(act==='del-task'){ removeItem('tasks', t.dataset.id); toast('削除しました'); commit(); return true; }
  if(act==='add-exam'){
    var sb = val('ex_subject'), dt = readMd('ex_date');
    if(!sb && !val('ex_room')){ toast('科目か教室を入れてください', true); return true; }
    if(!isYmd(dt)){ toast('日付を選んでください', true); return true; }
    S.exams.push({ id:uid('ex'), subject:sb, date:dt, time:val('ex_time'), room:val('ex_room'), memo:'', quiz:0, color:'c8', mt:Date.now() });
    toast('テストを登録しました'); commit(); return true;
  }
  if(act==='del-exam'){ removeItem('exams', t.dataset.id); toast('削除しました'); commit(); return true; }
  if(act==='ab-plus' || act==='ab-minus' || act==='late-plus'){
    var key = t.dataset.key;
    var a = S.attend[key] || { ab:0, late:0, limit:5 };
    if(act==='ab-plus') a.ab = toNum(a.ab)+1;
    if(act==='ab-minus') a.ab = Math.max(0, toNum(a.ab)-1);
    if(act==='late-plus') a.late = toNum(a.late)+1;
    S.attend[key] = a; touch('attend'); commit(); return true;
  }
  if(act==='set-limit'){
    var lim = toNum(val('at_limit'));
    if(lim < 1){ toast('1以上の数字を入れてください', true); return true; }
    courseList().forEach(function(c){
      var a = S.attend[c.key] || { ab:0, late:0, limit:5 };
      a.limit = lim; S.attend[c.key] = a;
    });
    touch('attend'); toast('上限を'+lim+'回にしました'); commit(); return true;
  }
  if(act==='year-edit'){
    var slot = t.dataset.slot;
    var cur = S.terms.first[slot] || '';
    var v = prompt(slot + ' の科目名（空にすると削除）', cur);
    if(v === null) return true;
    v = v.trim();
    if(v) S.terms.first[slot] = v; else delete S.terms.first[slot];
    touch('terms'); commit(); return true;
  }
  return false;
}
/* ============================== 予定の正規化 ============================== */
function shiftHours(s){
  var a = minutesOf(s.start), b = minutesOf(s.end);
  if(a == null || b == null) return 0;
  var m = b - a; if(m < 0) m += 1440;
  return Math.round(m / 6) / 10;
}
function shiftPay(s){
  var w = toNum(s.wage) || autoWage(s.date);
  return Math.round(shiftHours(s) * w);
}
function normItems(){
  var out = [];
  S.tasks.forEach(function(t){
    out.push({ src:'task', id:t.id, date:t.due, title:t.title, sub:t.subject||'',
      time:t.time||'', color:t.color||'c2', done:t.done, rid:t.rid, edit:1 });
  });
  S.exams.forEach(function(x){
    var q = x.kind === 'quiz';
    out.push({ src:'quiz', id:x.id, date:x.date, title:(x.subject||'テスト'),
      sub:(q?'小テスト':'定期テスト')+(x.room?'・'+x.room:''), time:x.time||'',
      color:x.color||'c8', rid:x.rid, edit:1 });
  });
  S.shifts.forEach(function(s){
    var h = shiftHours(s);
    out.push({ src:'work', id:s.id, date:s.date, title:s.title||'バイト',
      sub:(h?h+'時間'+(shiftPay(s)?'・'+yen(shiftPay(s)):''):'')+(s.memo?'　'+s.memo:''),
      time:s.start||'', color:s.color||'c9', rid:s.rid, edit:1 });
  });
  S.events.forEach(function(e){
    var end = (isYmd(e.dateEnd) && e.dateEnd > e.date) ? e.dateEnd : e.date;
    out.push({ src:e.kind==='imp'?'imp':'other', id:e.id, date:e.date, end:end, span:(end>e.date)?1:0,
      title:e.title, sub:e.memo||'', time:e.time||'', color:e.color||(e.kind==='imp'?'c1':'c7'), rid:e.rid, edit:1 });
  });
  S.health.forEach(function(h){
    if(!isYmd(h.next)) return;
    out.push({ src:'health', id:h.id, date:h.next, title:h.name+'（期限）', sub:h.memo||'', time:'', color:'c5' });
  });
  return out;
}
function payItemsOn(ymd){
  var out = [], d = derive(), ym = ymd.slice(0,7), day = Number(ymd.slice(8,10));
  [['smbc',S.settings.smbcDay],['rakuten',S.settings.rakutenDay]].forEach(function(p){
    if(day !== Number(p[1])) return;
    var g = d.byMonth[ym] ? d.byMonth[ym][p[0]] : null;
    if(!g) return;
    var amt = g.plan + g.stmt;
    if(amt > 0) out.push({ src:'pay', id:p[0]+ym, date:ymd, title:ACCOUNTS[p[0]].bank+' 引き落とし',
      sub:yen(amt), time:'', colorRaw:'var(--'+ACCOUNTS[p[0]].cls+')' });
  });
  return out;
}
function classItemsOn(ymd){
  if(!isYmd(ymd)) return [];
  var a = ymd.split('-'), dch = WDAY[new Date(+a[0], +a[1]-1, +a[2]).getDay()];
  return classesOn(dch).map(function(c){
    return { src:'cls', id:'cls'+ymd+c.period, date:ymd, title:c.name,
      sub:c.period+'限', time:S.commute.periods[c.period-1]||'', colorRaw:'var(--risyu)' };
  });
}
function matchQ(x){
  var q = norm(String(calQ||'').trim());
  if(!q) return true;
  return norm((x.title||'') + ' ' + (x.sub||'')).indexOf(q) >= 0;
}
function coversDay(x, ymd){
  var e = x.end || x.date;
  return x.date <= ymd && ymd <= e;
}
function itemsOn(ymd){
  var out = normItems().filter(function(x){ return coversDay(x, ymd) && calFilter[x.src] && matchQ(x); });
  if(calFilter.pay) out = out.concat(payItemsOn(ymd).filter(matchQ));
  if(calFilter.cls) out = out.concat(classItemsOn(ymd).filter(matchQ));
  return out.sort(function(a,b){
    /* 期間の予定を先に並べると、帯が横につながって見える */
    if((b.span?1:0) !== (a.span?1:0)) return (b.span?1:0) - (a.span?1:0);
    if(a.span && b.span) return String(a.date).localeCompare(String(b.date)) || String(a.id).localeCompare(String(b.id));
    var ta = a.time || '99:99', tb = b.time || '99:99';
    return ta.localeCompare(tb);
  });
}
function itemColor(x){ return x.colorRaw || colorOf(x.color); }

  if(editing){
    h += '<div class="pair"><button class="btn" data-act="ev-save">更新する</button>'+
         '<button class="btn ghost" style="flex:0 0 auto;padding:11px 16px" data-act="ev-cancel">やめる</button></div>';
  }else{
    h += '<button class="btn" data-act="ev-save">この日に追加する</button>';
  }
  return h + '</div>';
}
function shiftDate(ymd, days){
  var a = ymd.split('-');
  return toYmd(new Date(+a[0], +a[1]-1, +a[2] + days));
}
function createOne(kind, d, rid){
  var now = Date.now();
  if(kind==='task'){
    S.tasks.push({ id:uid('tk'), title:d.title, subject:d.subject||'', due:d.date, time:d.time||'',
      color:d.color, done:0, memo:d.memo||'', rid:rid, mt:now });
  }else if(kind==='quiz'){
    S.exams.push({ id:uid('ex'), subject:d.title, date:d.date, time:d.time||'', room:d.memo||'',
      kind:'quiz', color:d.color, rid:rid, mt:now });
  }else if(kind==='work'){
    S.shifts.push({ id:uid('wk'), title:d.title, date:d.date, start:d.time||'', end:d.end||'',
      wage:toNum(d.wage), memo:d.memo||'', color:d.color, rid:rid, mt:now });
  }else{
    S.events.push({ id:uid('ev'), date:d.date, dateEnd:(isYmd(d.dateEnd)&&d.dateEnd>d.date)?d.dateEnd:'',
      title:d.title, time:d.time||'', color:d.color,
      memo:d.memo||'', kind:(kind==='imp'?'imp':'other'), rid:rid, mt:now });
  }
}
function listNameOf(src){
  return src==='task' ? 'tasks' : src==='quiz' ? 'exams' : src==='work' ? 'shifts' : 'events';
}
function findOne(src, id){
  var name = listNameOf(src), list = S[name];
  for(var i=0;i<list.length;i++) if(list[i].id===id) return { name:name, list:list, obj:list[i] };
  return null;
}
function srcOfKind(k){ return k==='task'?'task': k==='quiz'?'quiz': k==='work'?'work': k==='imp'?'imp':'other'; }
function updateOne(src, id, d){
  var newSrc = srcOfKind(d.kind);
  var sameList = listNameOf(src) === listNameOf(newSrc);
  if(!sameList){
    removeItem(listNameOf(src), id);
    createOne(d.kind, d, '');
    return;
  }
  var f = findOne(src, id); if(!f) return;
  var o = f.obj;
  if(src==='task'){ o.title=d.title; o.subject=d.subject||''; o.due=d.date; o.time=d.time||''; o.color=d.color; o.memo=d.memo||''; }
  else if(src==='quiz'){ o.subject=d.title; o.date=d.date; o.time=d.time||''; o.room=d.memo||''; o.color=d.color; }
  else if(src==='work'){ o.title=d.title; o.date=d.date; o.start=d.time||''; o.end=d.end||''; o.wage=toNum(d.wage); o.memo=d.memo||''; o.color=d.color; }
  else { o.date=d.date; o.dateEnd=(isYmd(d.dateEnd)&&d.dateEnd>d.date)?d.dateEnd:'';
         o.title=d.title; o.time=d.time||''; o.color=d.color; o.memo=d.memo||''; o.kind=(d.kind==='imp'?'imp':'other'); }
  o.mt = Date.now();
}
function saveEvent(){
  readEvForm();
  var d = evDraft;
  var title = String(d.title||'').trim();
  if(!title){ toast((d.kind==='work'?'バイト先':'予定')+'の名前を入れてください', true); return; }
  if(!isYmd(d.date)){ toast('日付を選んでください', true); return; }
  d.title = title;

  if(calEdit){
    updateOne(calEdit.src, calEdit.id, d);
    toast('更新しました');
    calEdit = null; evDraft = newDraft(d.date);
  }else{
    var rep = Math.max(0, toNum(d.rep));
    var rid = rep > 1 ? uid('rp') : '';
    var n = rep > 1 ? rep : 1;
    for(var i=0;i<n;i++){
      createOne(d.kind, Object.assign({}, d, { date:shiftDate(d.date, i*7) }), rid);
    }
    toast(n>1 ? n+'件を追加しました' : '追加しました');
    evDraft = newDraft(d.date);
  }
  calSel = d.date; calYm = d.date.slice(0,7);
  commit();
}
function loadForEdit(src, id){
  var f = findOne(src, id); if(!f) return;
  var o = f.obj;
  if(src==='task') evDraft = { kind:'task', title:o.title, subject:o.subject||'', date:o.due, time:o.time||'', end:'', wage:'', color:o.color||'c2', memo:o.memo||'', rep:0 };
  else if(src==='quiz') evDraft = { kind:'quiz', title:o.subject||'', subject:'', date:o.date, time:o.time||'', end:'', wage:'', color:o.color||'c8', memo:o.room||'', rep:0 };
  else if(src==='work') evDraft = { kind:'work', title:o.title||'バイト', subject:'', date:o.date, time:o.start||'', end:o.end||'', wage:o.wage?String(o.wage):'', color:o.color||'c9', memo:o.memo||'', rep:0 };
  else evDraft = { kind:(o.kind==='imp'?'imp':'other'), title:o.title, subject:'', date:o.date,
    dateEnd:o.dateEnd||'', time:o.time||'', end:'', wage:'', color:o.color||'c7', memo:o.memo||'', rep:0 };
  calEdit = { src:src, id:id };
  if(isYmd(evDraft.date)){ calSel = evDraft.date; calYm = evDraft.date.slice(0,7); }
}

function filterChips(){

}
function itemRow(x, withButtons){

    '<span class="grow"><span class="t">'+esc(x.title)+'</span>'+
