<script>
/* ===== 読みこみの見張り =====
   ファイルが足りない・古い保存が残っているときは、ばらばらの画面ではなく、原因と直し方を出す。 */
(function(){
  function esc(s){ return String(s).replace(/[&<>"]/g, function(c){ return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' }[c]; }); }
  function show(missing, hint){
    if(document.getElementById('loadfail')) return;
    var box = document.createElement('div');
    box.id = 'loadfail';
    box.innerHTML = '<div class="card"><h2>アプリを開けませんでした</h2>' +
      (missing.length
        ? '<p>次のファイルが見つかりません：<br><code>' + missing.slice(0, 6).map(esc).join('</code><br><code>') + '</code>' + (missing.length > 6 ? '<br>ほか' + (missing.length - 6) + '個' : '') + '</p>'
        : '<p>アプリの中身を読みこめませんでした。</p>') +
      (hint ? '<p>' + hint + '</p>' : '') +
      '<button class="main" type="button" id="lfReload">もう一度読みこむ</button>' +
      '<button type="button" id="lfClean">しまってある古いファイルを消して読みこむ（予定などのデータは消えません）</button></div>';
    document.body.appendChild(box);
    document.getElementById('lfReload').onclick = function(){ location.reload(); };
    document.getElementById('lfClean').onclick = function(){
      var jobs = [];
      if('serviceWorker' in navigator) jobs.push(navigator.serviceWorker.getRegistrations().then(function(rs){ return Promise.all(rs.map(function(r){ return r.unregister(); })); }));
      if(window.caches) jobs.push(caches.keys().then(function(ks){ return Promise.all(ks.map(function(k){ return caches.delete(k); })); }));
      Promise.all(jobs).then(function(){ location.reload(); }, function(){ location.reload(); });
    };
  }
  function check(){
    var missing = window.__kMissing.slice();
    if(window.__kurashiOK && !missing.length) return;
    var hint = '';
    /* よくある置き間違い：フォルダがもう1つ内側に入っている */
    var probe = (window.fetch ? fetch('kurashi/js/core.js', { method:'HEAD', cache:'no-store' }).then(function(r){ return r.ok; }, function(){ return false; }) : Promise.resolve(false));
    probe.then(function(nested){
      if(nested){
        hint = '<b>css・js・gas フォルダが「kurashi」フォルダの中に入っています。</b><br>' +
          'GitHubで、この index.html と同じ場所（いちばん上）に、css・js・gas・tests の4つのフォルダを置いてください。';
      }else if(missing.length){
        hint = 'GitHubに <code>css</code>・<code>js</code>・<code>gas</code> フォルダが、index.html と同じ場所にあるか確かめてください。';
      }else{
        hint = '通信が不安定か、古いファイルが残っているかもしれません。下のボタンを試してください。';
      }
      var s = document.getElementById('splash'); if(s) s.style.display = 'none';
      show(missing, hint);
    });
  }
  if(document.readyState === 'complete') setTimeout(check, 1500);
  else window.addEventListener('load', function(){ setTimeout(check, 1500); });
})();
</script>
