      '<button class="mini" data-act="ev-del" data-src="'+x.src+'" data-id="'+x.id+'">削除</button>' : '')+'</div>';
}
function monthGrid(){
  var a = calYm.split('-'), y = +a[0], mo = +a[1];
  var first = new Date(y, mo-1, 1);
  var startDow = first.getDay();
  var td = today();

  /* 前後の月の日も薄く出して、マスを埋める */
  var cells = [];
  for(var i=startDow-1;i>=0;i--){
    var d0 = new Date(y, mo-1, -i);
    cells.push({ ymd:toYmd(d0), out:1 });
  }
  var lastDay = new Date(y, mo, 0).getDate();
  for(var dn=1;dn<=lastDay;dn++) cells.push({ ymd:y+'-'+pad(mo)+'-'+pad(dn), out:0 });
  var extra = 1;
  while(cells.length % 7 !== 0 || cells.length < 35){
    cells.push({ ymd:toYmd(new Date(y, mo, extra++)), out:1 });
  }

  var h = '<table class="cal" id="calgrid"><thead><tr>'+
    WDAY.map(function(w,i){ return '<th class="'+(i===0?'sun':i===6?'sat':'')+'">'+w+'</th>'; }).join('')+
    '</tr></thead><tbody>';

  for(var r=0;r<cells.length/7;r++){
    h += '<tr>';
    for(var c=0;c<7;c++){
      var cell = cells[r*7+c], ymd = cell.ymd;
      var its = itemsOn(ymd);
      var hol = holidayName(ymd);
      var dow = new Date(+ymd.slice(0,4), +ymd.slice(5,7)-1, +ymd.slice(8,10)).getDay();
      var cls = [];
      if(cell.out) cls.push('out');
      if(ymd === td) cls.push('today');
      if(ymd === calSel) cls.push('sel');
      if(hol) cls.push('holi');
      else if(dow === 0) cls.push('sunday');
      else if(dow === 6) cls.push('saturday');

      h += '<td class="'+cls.join(' ')+'"><button class="day" data-act="cal-day" data-d="'+ymd+'">'+
        '<span class="dhead"><span class="dn">'+Number(ymd.slice(8,10))+'</span>'+
        (hol ? '<span class="holname">'+esc(hol)+'</span>' : '')+'</span>';

      if(its.length){
        h += '<span class="evs">';
        var show = its.slice(0, 4);
        show.forEach(function(x){
          var col = itemColor(x);
          if(x.span){
            var isStart = x.date === ymd, isEnd = (x.end||x.date) === ymd;
            var label = (isStart || dow === 0) ? esc(x.title) : '&nbsp;';
            h += '<span class="ev band'+(isStart?' s':'')+(isEnd?' e':'')+'" style="--c:'+col+'">'+label+'</span>';
          }else{
            h += '<span class="ev dot'+(x.done?' done':'')+'" style="--c:'+col+'">'+esc(x.title)+'</span>';
          }
        });
        if(its.length > 4) h += '<span class="more">+'+(its.length-4)+'</span>';
        h += '</span>';
      }
      h += '</button></td>';
    }
    h += '</tr>';
  }
  return h + '</tbody></table>';
}
function weekList(){
  var a = calSel.split('-');
  var base = new Date(+a[0], +a[1]-1, +a[2]);
  var start = new Date(base); start.setDate(base.getDate() - base.getDay());
  var h = '';
  for(var i=0;i<7;i++){
    var d = new Date(start); d.setDate(start.getDate()+i);
    var ymd = toYmd(d), its = itemsOn(ymd);
    var isToday = ymd === today();
    h += '<div class="box" style="margin-bottom:8px'+(isToday?';outline:2px solid var(--ink);outline-offset:-2px':'')+'">'+
      '<div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:'+(its.length?'8px':'0')+'">'+
        '<button class="mini" data-act="cal-day" data-d="'+ymd+'" style="border:0;padding:0;font-size:.9em;font-weight:700;color:'+
          (d.getDay()===0?'var(--rakuten)':d.getDay()===6?'var(--e6)':'var(--ink)')+'">'+
          (d.getMonth()+1)+'/'+d.getDate()+'（'+WDAY[d.getDay()]+'）</button>'+
        '<span class="s2">'+(its.length?its.length+'件':'')+'</span></div>'+
      its.map(function(x){ return itemRow(x, false); }).join('')+'</div>';
  }
  return h;
}
/* 同じ日で時間が重なっていないか調べる */
function clashOn(ymd){
  var list = itemsOn(ymd).filter(function(x){ return minutesOf(x.time) != null; });
  var out = [];
  for(var i=0;i<list.length;i++){
    for(var j=i+1;j<list.length;j++){
      var a=list[i], b=list[j];
      var as=minutesOf(a.time), ae=as+60, bs=minutesOf(b.time), be=bs+60;
      if(a.src==='work'){ var w=S.shifts.filter(function(z){return z.id===a.id;})[0]; if(w) ae=as+shiftHours(w)*60; }
      if(b.src==='work'){ var w2=S.shifts.filter(function(z){return z.id===b.id;})[0]; if(w2) be=bs+shiftHours(w2)*60; }
      if(as < be && bs < ae) out.push(a.title+' と '+b.title);
    }
  }
  return out;
}
/* ToDo：やること・テスト・大事な予定を締切順に */
function todoList(){
  var td = today();
  var all = normItems().filter(function(x){
    if(!isYmd(x.date) || !calFilter[x.src] || !matchQ(x)) return false;
    if(x.src === 'task') return !x.done;
    return ['quiz','imp','health'].indexOf(x.src) >= 0 && (x.end||x.date) >= td;
  }).sort(function(a,b){ return a.date.localeCompare(b.date); });

  var late = all.filter(function(x){ return x.date < td; });
  var soon = all.filter(function(x){ return x.date >= td; });
  var rowOf = function(x){
    var n = daysFromToday(x.date);
    return '<div class="evrow"><span class="cbar" style="background:'+itemColor(x)+'"></span>'+
      (x.src==='task' ? '<button class="chk" data-act="task-done" data-id="'+x.id+'" aria-label="完了"></button>' : '')+
      '<span class="grow"><span class="t">'+esc(x.title)+'</span>'+
      '<span class="s">'+ymdLabel(x.date)+(x.sub?'・'+esc(x.sub):'')+'</span></span>'+
      '<span class="due '+dueClass(n)+'">'+dueText(n)+'</span>'+
      (x.edit?'<button class="mini" data-act="ev-edit" data-src="'+x.src+'" data-id="'+x.id+'">直す</button>':'')+'</div>';
  };
  var h = '';
  if(late.length) h += section('期限が過ぎているもの', late.length+'件', late.map(rowOf).join(''));
  h += section('やること・大事な予定', soon.length?soon.length+'件':null,
    soon.length ? soon.map(rowOf).join('')
      : '<div class="empty">'+ART.empty+'<div style="margin-top:8px">やることは片付いています。</div></div>');
  var doneTasks = S.tasks.filter(function(t){ return t.done; });
  if(doneTasks.length) h += section('終わったもの', doneTasks.length+'件',
    doneTasks.slice(-12).reverse().map(function(t){
      return '<div class="evrow"><span class="cbar" style="background:'+colorOf(t.color||'c2')+'"></span>'+
        '<button class="chk" style="background:var(--smbc);border-color:var(--smbc)" data-act="task-undone" data-id="'+t.id+'">✓</button>'+
        '<span class="grow"><span class="t" style="text-decoration:line-through;color:var(--sub)">'+esc(t.title)+'</span></span></div>';
    }).join(''));
  return h;
}

}

/* ============================== 操作 ============================== */
function calAction(act, t){
  if(act==='cal-prev'){ readEvForm(); calYm = addMonths(calYm, -1); render(); return true; }
  if(act==='cal-next'){ readEvForm(); calYm = addMonths(calYm, 1); render(); return true; }
  if(act==='cal-today'){
    readEvForm(); calYm = thisYm(); calSel = today();
    if(evDraft && !calEdit) evDraft.date = calSel;
    render(); return true;
  }
  if(act==='cal-day'){
    readEvForm();
    calSel = t.dataset.d; calYm = calSel.slice(0,7);
    if(evDraft && !calEdit) evDraft.date = calSel;
    render(); return true;
  }
  if(act==='cal-view'){ readEvForm(); calView = t.dataset.v; render(); return true; }
  if(act==='cal-clearq'){ readEvForm(); calQ=''; render(); return true; }
  if(act==='cal-filter'){
    readEvForm();
    var f = t.dataset.f; calFilter[f] = calFilter[f] ? 0 : 1; render(); return true;
  }
  if(act==='ev-kind'){
    readEvForm();
    var k = t.dataset.k, prev = kindOf(evDraft.kind).color;
    evDraft.kind = k;
    if(evDraft.color === prev) evDraft.color = kindOf(k).color;
    render(); return true;
  }
  if(act==='ev-color'){
    readEvForm();
    evDraft.color = t.dataset.c;
    Array.prototype.forEach.call(t.parentNode.querySelectorAll('button'), function(b){ b.classList.remove('on'); });
    t.classList.add('on');
    return true;
  }
  if(act==='ev-move'){
    var f3 = findOne(t.dataset.src, t.dataset.id);
    if(!f3) return true;
    var o3 = f3.obj, n3 = toNum(t.dataset.n);
    var key = (t.dataset.src==='task') ? 'due' : 'date';
    if(!isYmd(o3[key])) { toast('日付が入っていません', true); return true; }
    o3[key] = shiftDate(o3[key], n3);
    if(o3.dateEnd && isYmd(o3.dateEnd)) o3.dateEnd = shiftDate(o3.dateEnd, n3);
    o3.mt = Date.now();
    calSel = o3[key]; calYm = calSel.slice(0,7);   /* 動かした先を表示する */
    toast(ymdLabel(o3[key])+'にずらしました'); commit(); return true;
  }
  if(act==='ev-save'){ saveEvent(); return true; }
  if(act==='ev-cancel'){ calEdit = null; evDraft = newDraft(calSel); render(); return true; }
  if(act==='ev-edit'){
    readEvForm();
    loadForEdit(t.dataset.src, t.dataset.id);
    appId='cal'; calTab='cal';
    if(calView==='todo') calView='month';
    render();
    var f = document.getElementById('evform');
    if(f) f.scrollIntoView({block:'center'});
    return true;
  }
  if(act==='ev-del'){
    var src = t.dataset.src, id = t.dataset.id;
    var f2 = findOne(src, id);
    if(f2 && f2.obj.rid){
      var group = f2.list.filter(function(x){ return x.rid === f2.obj.rid; });
      if(group.length > 1 && confirm('この繰り返しは'+group.length+'件あります。まとめて削除しますか？\n「キャンセル」ならこの1件だけ消します。')){
        group.slice().forEach(function(x){ removeItem(listNameOf(src), x.id); });
        if(calEdit && calEdit.src===src){ calEdit=null; evDraft=newDraft(calSel); }
        toast(group.length+'件を削除しました'); commit(); return true;
      }
    }
    removeItem(listNameOf(src), id);
    if(calEdit && calEdit.id===id){ calEdit=null; evDraft=newDraft(calSel); }
    toast('削除しました'); commit(); return true;
  }
  if(act==='add-health'){
    var n = val('hl_name').trim();
    if(!n){ toast('項目名を入れてください', true); return true; }
    S.health.push({ id:uid('hl'), name:n, date:val('hl_date'), next:val('hl_next'), memo:val('hl_memo'), mt:Date.now() });
    toast('追加しました'); commit(); return true;
  }
  if(act==='del-health'){ removeItem('health', t.dataset.id); toast('削除しました'); commit(); return true; }
  return false;
}

/* ============================== 設定 ============================== */

function settingsAction(act, t){
  if(act==='set-theme'){ S.ui.theme = t.dataset.v; touch('ui'); applyUi(); toast('テーマを変えました'); commit(); return true; }
  if(act==='set-fs'){ S.ui.fs = t.dataset.v; touch('ui'); applyUi(); toast('文字の大きさを変えました'); commit(); return true; }
  if(act==='save-commute'){
    S.commute.walk=toNum(val('cm_walk')); S.commute.bus=toNum(val('cm_bus'));
    S.commute.change=toNum(val('cm_change')); S.commute.train=toNum(val('cm_train'));
    S.commute.toSchool=toNum(val('cm_school')); S.commute.buffer=toNum(val('cm_buffer'));
    for(var i=0;i<7;i++){ var v=val('cm_p'+i); if(minutesOf(v)!=null) S.commute.periods[i]=v; }
    touch('commute'); toast('通学の設定を保存しました'); commit(); return true;
  }
  if(act==='save-days'){
    S.settings.smbcDay = Math.min(31, Math.max(1, toNum(val('sy_smbc'))||27));
    S.settings.rakutenDay = Math.min(31, Math.max(1, toNum(val('sy_rakuten'))||27));
    var rg = val('st_reg'); S.settings.regDeadline = isYmd(rg) ? rg : '';
    S.settings.wageWeekday = Math.max(0, toNum(val('st_wage1')));
    S.settings.wageWeekend = Math.max(0, toNum(val('st_wage2')));
    toast('保存しました'); commit(); return true;
  }
  if(act==='save-sync'){
    S.settings.room = val('sy_room').trim();
    S.settings.fbConfig = val('sy_cfg').trim();
    persist();
    if(!S.settings.room || !S.settings.fbConfig){
      syncState.on=false; syncState.msg='合言葉とFirebaseの設定の両方を入れてから押してください。'; render(); return true;
    }
    syncState.on=false; syncState.msg='接続しています…'; render(); initSync(); return true;
  }
  if(act==='save-key'){ S.settings.apiKey = val('sy_key').trim(); persist(); toast('保存しました'); render(); return true; }
  if(act==='export'){
    download(new Blob([JSON.stringify(Object.assign({ app:'kurashi', version:4 }, payload()))],{type:'application/json'}),
      'kurashi_'+thisYm()+'.json');
    toast('バックアップを保存しました'); return true;
  }
  if(act==='import'){ document.getElementById('imp').click(); return true; }
  return false;
}
/* ============================== 画面の切り替え ============================== */
var APPS = [['today','今日'],['money','お金'],['risyu','履修'],['cal','予定'],['set','設定']];
var MONEY_TABS = [['home','ホーム'],['schedule','予定'],['chart','グラフ'],['stmt','明細'],['in','収支'],['work','バイト']];
var RISYU_TABS = [['tt','時間割'],['task','課題'],['exam','テスト'],['att','出席'],['year','通年'],['plans','履修案']];
var CAL_TABS = [['cal','カレンダー'],['imp','重要'],['health','健康']];
var TITLES = { today:'今日', money:'お金', risyu:'履修', cal:'予定', set:'設定' };
var FOOTS = {
  today:'天気は Open-Meteo の予報です。バスや電車の運行状況は各社の公式情報も確認してください。',
  money:'金額に分割手数料（金利）は含まれていません。引き落とし日の前日までに入金しておくと安心です。',
  risyu:'単位数は「週1コマ＝1単位／週2コマ＝2単位」での推定です。申込者数は9月7日17時00分時点。正確な単位数と科目区分はシラバスと履修便覧で確認してください。',
  cal:'予定・課題・テスト・引き落としをまとめて表示しています。',
  set:'合言葉は他人に教えないでください。Firestoreのセキュリティルールを必ず設定してください。'
};

function render(){
  document.getElementById('apps').innerHTML = '<span class="pill"></span>' + APPS.map(function(a){
    return '<button data-app="'+a[0]+'" class="'+(appId===a[0]?'on':'')+'">'+a[1]+'</button>';
  }).join('');

  var nav = document.getElementById('nav');
  var tabs = appId==='money' ? MONEY_TABS : appId==='risyu' ? RISYU_TABS : appId==='cal' ? CAL_TABS : null;
  if(tabs){
    var cur = appId==='money' ? payTab : appId==='risyu' ? risyuTab : calTab;
    nav.className = '';
    nav.innerHTML = '<span class="pill"></span>' + tabs.map(function(t){
      return '<button data-tab="'+t[0]+'" class="'+(cur===t[0]?'on':'')+'">'+t[1]+'</button>';
    }).join('');
  }else{
    nav.className = 'hide'; nav.innerHTML = '';
  }

  var html = notice ? '<div class="msg '+notice.type+'">'+esc(notice.text)+'</div>' : '';
  if(appId==='today'){
    html += viewToday();
  }else if(appId==='money'){
    var d = derive();
    html += ({ home:viewHome, schedule:viewSchedule, chart:viewChart, stmt:viewStmt, in:viewIncome, work:viewShifts })[payTab](d);
  }else if(appId==='risyu'){
    html += ({ tt:viewRisyuTt, task:viewTasks, exam:viewExams, att:viewAttend, year:viewYear, plans:viewRisyuPlans })[risyuTab]();
  }else if(appId==='cal'){
    html += calTab==='health' ? viewHealth() : calTab==='imp' ? viewImportant() : viewCalendar();
  }else{
    html += viewSettings();
  }
  document.getElementById('app').innerHTML = html;
  document.getElementById('apptitle').textContent = TITLES[appId];
  document.getElementById('foot').textContent = FOOTS[appId];
  var fab = document.getElementById('fab');
  if(fab) fab.className = (appId==='cal' && calTab==='cal') ? 'fab' : 'fab hide';
  document.getElementById('synctag').textContent = syncState.on
    ? '同期中・合言葉 ' + S.settings.room
    : '支払い・履修・予定をひとつに';
  movePills();
}

/* 選ばれているタブの位置に丸をすべらせる */
function movePill(box){
  if(!box) return;
  var pill = box.querySelector('.pill');
  var on = box.querySelector('button.on');
  if(!pill || !on){ if(pill) pill.style.width = '0px'; return; }
  pill.style.width = on.offsetWidth + 'px';
  pill.style.transform = 'translateX(' + on.offsetLeft + 'px)';
}
function movePills(){
  movePill(document.getElementById('apps'));
  var nav = document.getElementById('nav');
  if(nav && !nav.classList.contains('hide')) movePill(nav);
}
window.addEventListener('resize', movePills);

/* ============================== イベント ============================== */
document.getElementById('apps').addEventListener('click', function(e){
  var b = e.target.closest('button[data-app]'); if(!b) return;
  appId = b.dataset.app; notice = null; closePicker(); render(); window.scrollTo(0,0);
});
document.getElementById('nav').addEventListener('click', function(e){
  var b = e.target.closest('button[data-tab]'); if(!b) return;
  if(appId==='money') payTab = b.dataset.tab;
  else if(appId==='risyu') risyuTab = b.dataset.tab;
  else if(appId==='cal') calTab = b.dataset.tab;
  notice = null; render(); window.scrollTo(0,0);
});

document.getElementById('app').addEventListener('click', function(e){
  var t = e.target.closest('[data-act]'); if(!t) return;
  var act = t.dataset.act;
  if(act==='go'){
    appId = t.dataset.app || appId;
    if(t.dataset.tab){
      if(appId==='money') payTab = t.dataset.tab;
      else if(appId==='risyu') risyuTab = t.dataset.tab;
      else if(appId==='cal') calTab = t.dataset.tab;
    }
    render(); window.scrollTo(0,0); return;
  }
  if(act.indexOf('cal-')===0 || act.indexOf('ev-')===0 || act==='add-health' || act==='del-health'){
    if(calAction(act, t)) return;
  }
  if(act.indexOf('r-')===0 || ['add-task','task-done','task-undone','del-task','add-exam','del-exam',
     'ab-plus','ab-minus','late-plus','set-limit','year-edit','course-add'].indexOf(act)>=0){
    if(risyuAction(act, t, e)) return;
  }
  if(act.indexOf('ev-')===0 || act.indexOf('cal-')===0){
    if(calAction(act, t)) return;
  }
  if(calAction(act, t)) return;
  if(moneyAction(act, t)) return;
  settingsAction(act, t);
});

document.getElementById('app').addEventListener('change', async function(e){
  var id = e.target.id;
  if(id==='cam' || id==='pickf'){ var f=e.target.files[0]; e.target.value=''; if(f) handlePhoto(f); }
  if(id==='tgOcc'){ rIncludeOcc = e.target.checked; render(); if(sheetOpen()) renderPicker(); }
  if(id==='cbWeather'){
    S.ui.weather = e.target.checked ? 1 : 0; touch('ui'); persist(); pushRemote();
    if(S.ui.weather){ weather.state='idle'; loadWeather(); } else { weather.state='off'; weather.alert=''; }
    render();
  }
  if(id==='imp'){
    var g=e.target.files[0]; e.target.value=''; if(!g) return;
    try{
      var txt = await g.text();
      var d = JSON.parse(txt);
      if(d.app!=='kurashi' && d.app!=='shiharai') throw new Error('形式');
      if(d.risyu) d.risyu.updatedAt = Date.now();
      var now = Date.now();
      d.meta = Object.assign({}, d.meta||{});
      ['attend','terms','commute','ui'].forEach(function(k){ if(d[k]) d.meta[k] = now; });
      mergeRemote(d);
      applyUi(); toast('読み込みました'); render();
    }catch(err){ toast('読み込めませんでした。書き出したファイルを選んでください', true); }
  }
});

/* 既修得単位は打っている途中で全体を描き直さない */
document.getElementById('app').addEventListener('input', function(e){
  if(e.target.id === 'cal_q'){
    calQ = e.target.value;
    clearTimeout(window.__calT);
    window.__calT = setTimeout(function(){
      readEvForm(); render();
      var q = document.getElementById('cal_q');
      if(q){ q.focus(); q.setSelectionRange(q.value.length, q.value.length); }
    }, 260);
    return;
  }
  var k = e.target.getAttribute('data-earn');
  if(!k) return;
  var v = parseInt(e.target.value, 10);
  if(isNaN(v) || v < 0) v = 0;
  if(k==='otherCr') S.risyu.otherCr = v; else S.risyu.earned[k] = v;
  touchRisyu();
  var m = document.getElementById('meters'); if(m) m.innerHTML = metersHtml();
  var w = document.getElementById('warns'); if(w) w.innerHTML = warnsHtml();
  persist(); pushRemote();
});

document.getElementById('shBody').addEventListener('click', function(e){

document.getElementById('shClose').addEventListener('click', closePicker);
document.getElementById('veil').addEventListener('click', closePicker);
document.addEventListener('keydown', function(e){ if(e.key === 'Escape') closePicker(); });

/* 右下の「＋」ボタン */
document.getElementById('fab').addEventListener('click', function(){
  readEvForm();
  calEdit = null;
  evDraft = newDraft(calSel);
  if(calView === 'todo') calView = 'month';
  render();
  var f = document.getElementById('evform');
  if(f) f.scrollIntoView({block:'center'});
  var ti = document.getElementById('ev_title');
  if(ti) ti.focus();

/* カレンダーを左右にはらって月を移す */
(function(){
  var x0=null, y0=null;
  var app = document.getElementById('app');
  app.addEventListener('touchstart', function(e){
    if(!e.target.closest('#calgrid')) { x0=null; return; }
    x0 = e.touches[0].clientX; y0 = e.touches[0].clientY;
  }, {passive:true});
  app.addEventListener('touchend', function(e){
    if(x0===null) return;
    var t = e.changedTouches[0];
    var dx = t.clientX - x0, dy = t.clientY - y0;
    x0 = null;
    if(Math.abs(dx) < 55 || Math.abs(dx) < Math.abs(dy)*1.5) return;
    readEvForm();
    calYm = addMonths(calYm, dx < 0 ? 1 : -1);
    render();
  }, {passive:true});
})();

applyUi();
render();
initSync();
loadWeather();
setTimeout(function(){
  var s = document.getElementById('splash');
  if(s) s.classList.add('out');
}, 700);
setTimeout(movePills, 60);
setTimeout(movePills, 400);
if(document.fonts && document.fonts.ready) document.fonts.ready.then(movePills)['catch'](function(){});
