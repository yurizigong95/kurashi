/* アプリの中身を、AIが読める形にまとめる */
function chatContext(){
  var td = today();
  var lim = shiftDate(td, 45);
  var L = [];
  L.push('【今日】' + td + '（' + WDAY[new Date().getDay()] + '）');
  L.push('【学期】' + curTerm().label);

  /* 時間割 */
  var tt = [];
  DAYS.forEach(function(d){
    var row = [];
    termCourses().forEach(function(c){
      c.slots.forEach(function(sl){
        if(sl.d === d) row.push(sl.p + '限 ' + c.name + (c.web ? '(遠隔)' : '') + (c.bi ? '(隔週)' : ''));
      });
    });
    row.sort();
    if(row.length) tt.push(d + '：' + row.join('、'));
  });
  L.push('【時間割】\n' + tt.join('\n'));
  L.push('【授業の時間】' + PERIODS.map(function(p){
    return p + '限 ' + S.commute.periods[p-1] + '〜' + S.commute.ends[p-1];
  }).join('、'));

  /* これからの予定 */
  var items = normItems().filter(function(x){
    return isYmd(x.date) && x.date >= td && x.date <= lim;
  }).sort(function(a,b){ return a.date.localeCompare(b.date); });
  var lines = items.map(function(x){
    var k = ({task:'課題', quiz:'小テスト', exam:'大テスト', kousa:'考査', work:'バイト', imp:'重要', other:'予定'})[x.src] || x.src;
    var done = (x.src==='task' && x.done) ? '【済】' : '';
    var t = x.time ? ' ' + x.time : '';
    return '・' + x.date + t + ' [' + k + ']' + done + ' ' + x.title + (x.sub ? '（' + x.sub + '）' : '');
  });
  L.push('【これからの予定（45日ぶん）】\n' + (lines.length ? lines.join('\n') : 'なし'));

  /* 日ごとの状況（14日ぶん）：通学の有無・帰宅時刻・バイトに入れる時間を先に計算しておく */
  var days = [];
  for(var i = 0; i < 14; i++){
    var d = shiftDate(td, i);
    var a = d.split('-'), dow = WDAY[new Date(+a[0], +a[1]-1, +a[2]).getDay()];
    var cls = schoolClassesForDate(d);
    var allCls = classesForDate(d).filter(function(c){ return !c.off; });
    var web = allCls.filter(function(c){ return c.web; });
    var line = '・' + d + '（' + dow + '）';
    var dayItems = items.filter(function(x){ return x.date === d; });
    var shiftsHere = S.shifts.filter(function(w){ return w.date === d; });
    var tests = dayItems.filter(function(x){ return x.src==='quiz' || x.src==='exam' || x.src==='kousa'; });
    var dues = dayItems.filter(function(x){ return x.src==='task' && !x.done; });
    if(holidayName(d)) line += ' 祝日「' + holidayName(d) + '」';
    if(cls.length){
      var first = cls[0], last = cls[cls.length-1];
      var st = S.commute.periods[first.period-1], en = S.commute.ends[last.period-1];
      var enMin = minutesOf(en);
      var homeMin = enMin != null ? enMin + 20 + 80 : null;      /* 授業後20分＋通学80分 */
      var workFrom = enMin != null ? enMin + 20 + 75 : null;     /* 大学→イオンモール神戸北はおよそ75分 */
      line += ' 通学あり：' + first.period + '限〜' + last.period + '限（' + st + '〜' + en + '、' +
        cls.map(function(c){ return c.period + '限' + c.name; }).join('・') + '）。' +
        '帰宅はおよそ' + hhmmOf(homeMin) + '。バイトに入れるのは' + hhmmOf(workFrom) + '以降のみ。';
      if(web.length) line += ' このほか遠隔' + web.map(function(c){ return c.period + '限' + c.name; }).join('・') + '（家で受講）。';
    }else if(web.length){
      line += ' 通学なし（遠隔' + web.map(function(c){ return c.period + '限' + c.name; }).join('・') + 'のみ）。バイトは終日入れる。';
    }else{
      line += ' 通学なし。バイトは終日入れる。';
    }
    if(shiftsHere.length) line += ' すでにバイトあり：' + shiftsHere.map(function(w){ return (w.start||'') + '〜' + (w.end||''); }).join('、') + '。';
    if(tests.length) line += ' テスト：' + tests.map(function(x){ return x.title; }).join('、') + '。';
    if(dues.length) line += ' 課題の締切：' + dues.map(function(x){ return x.title + (x.time ? ' ' + x.time : ''); }).join('、') + '。';
    /* 翌日1限の有無（前夜の遅いバイトを避ける判断に） */
    var nx = shiftDate(d, 1), nxCls = schoolClassesForDate(nx);
    if(nxCls.length && nxCls[0].period === 1) line += ' 翌日は1限あり（朝が早い）。';
    days.push(line);
  }
  L.push('【日ごとの状況（今日から14日）】\n' + days.join('\n'));

  /* 休講・遠隔・補講 */
  var chg = S.holidays.filter(function(h){ return h.date >= td; }).map(function(h){
    return '・' + h.date + ' ' + (h.course==='*'?'全休':h.course) + ' ' +
      ({cancel:'休講', online:'遠隔', makeup:'補講', holclass:'祝日でも授業あり'})[changeType(h)];
  });
  if(chg.length) L.push('【授業の変更】\n' + chg.join('\n'));

  /* バイトとお金 */
  var ym = openYm(), pp = payPeriod(ym);
  var inPeriod = shiftsInPeriod(ym);
  L.push('【バイト】分給 平日' + S.settings.minWeekday + '円／土日' + S.settings.minWeekend + '円、交通費' + S.settings.fare + '円/回、' +
    '15日締め25日払い。いまの締め期間（' + pp.from + '〜' + pp.to + '）は' + inPeriod.length + '回、見込み' + periodPay(ym) + '円。');
  var y = new Date().getFullYear();
  L.push('【扶養】' + y + '年の給与見込み合計 約' + yearPayTotal(y) + '円（上限の目安 ' + (toNum(S.settings.fuyouLimit)||1030000) + '円）');
  var bal = S.balances.reduce(function(a,b){ return a + toNum(b.amount); }, 0);
  if(bal) L.push('【口座の残高】合計 約' + bal + '円');

  /* 出欠 */
  var att = termCourses().map(function(c){
    var a = attendOf(c.name);
    return (a.ab || a.late) ? ('・' + c.name + '：欠' + a.ab + '・遅' + a.late + '（評価不可は' + a.limit + '回）') : '';
  }).filter(Boolean);
  if(att.length) L.push('【出欠】\n' + att.join('\n'));

  /* 通学 */
  L.push('【通学】家（三田・弥生ヶ丘五丁目）→ 神姫バス → 三ノ宮 → 阪神電車 → 鳴尾・武庫川女子大前。片道およそ1時間20分。' +
    'バイト先はイオンモール神戸北（三ノ宮からバス約50分）。');

  return L.join('\n\n');
}

    h += '<div class="bn amber"><span class="ic">!</span><span>' +

      '<div style="margin-top:8px">予定を見ながら相談できます。</div></div>';
  }

  }).join('') + '</div>';

  h += '<div class="pair">' +
    '<input id="chat_in" placeholder="きいてみる（例：来週のバイトいつがいい？）">' +
    '<button class="btn" style="flex:0 0 auto;padding:13px 20px" data-act="chat-send">送る</button></div>';
  if(msgs.length) h += '<button class="btn ghost" style="margin-top:10px" data-act="chat-clear">会話を消す</button>';
  h += '<p class="note">アプリに登録した予定・課題・テスト・バイト・お金の情報をもとに答えます。送った内容はGoogleのAIに送信されます。</p>';
  return '<section>' + h + '</section>';
}

async function chatSend(text){
  var key = (S.settings.geminiKey || '').trim();
  if(!key){ toast('先に設定タブでGemini APIキーを登録してください', true); return; }
  if(!text){ return; }
  S.chat = (S.chat || []).concat([{ role:'user', text:text, mt:Date.now() }]);
  if(S.chat.length > 40) S.chat = S.chat.slice(-40);
  chatBusy = true; persist(); render();
  var box = document.getElementById('chatwrap'); if(box) box.scrollTop = box.scrollHeight;

  try{
    var history = S.chat.slice(-12)
      .filter(function(m){ return !(m.role === 'ai' && /^つながりませんでした/.test(m.text)); })
      .map(function(m){ return { role: m.role === 'user' ? 'user' : 'model', parts:[{ text:m.text }] }; });
    /* 最初がAIの返事だと受け付けられないので、ユーザーの発言から始める */
    while(history.length && history[0].role !== 'user') history.shift();
    var body = {
      systemInstruction: { parts: [{ text: CHAT_SYSTEM + '\n\n===== アプリの中身 =====\n' + chatContext() }] },
      contents: history,
      generationConfig: { temperature: 0.3, maxOutputTokens: 2048 }
    };
    /* 使えるモデルを順に試す（1つ目がだめなら次へ） */
    var models = [S.settings.geminiModel].filter(Boolean)
      .concat(['gemini-3.6-flash','gemini-2.5-flash','gemini-flash-latest','gemini-2.0-flash']);
    var seen = {}, models2 = [];
    models.forEach(function(m){ if(!seen[m]){ seen[m]=1; models2.push(m); } });
    var j = null, lastErr = '';
    for(var mi = 0; mi < models2.length; mi++){
      var res = await fetch(
        'https://generativelanguage.googleapis.com/v1beta/models/' + models2[mi] + ':generateContent',
        { method:'POST',
          headers:{ 'Content-Type':'application/json', 'x-goog-api-key': key },
          body: JSON.stringify(body) });
      var jj = await res.json();
      if(res.ok){
        j = jj;
        /* うまくいったモデルを覚えておく */
        if(S.settings.geminiModel !== models2[mi]){ S.settings.geminiModel = models2[mi]; persist(); }
        break;
      }
      lastErr = (jj && jj.error && jj.error.message) ? jj.error.message : ('エラー ' + res.status);
      /* モデルが無い・使えない場合だけ次を試す。キーの問題ならすぐ止める */
      if(!/not available|not found|NOT_FOUND|unsupported|deprecated|update your code/i.test(lastErr)) break;
    }
    if(!j) throw new Error(lastErr || 'つながりませんでした');
    var out = '', fin = '';
    try{
      out = j.candidates[0].content.parts.map(function(p){ return p.text || ''; }).join('');
      fin = j.candidates[0].finishReason || '';
    }catch(e){ out = ''; }
    if(!out) out = 'うまく答えられませんでした。もう一度きいてみてください。';
    if(fin === 'MAX_TOKENS') out += '\n\n（長くなったので途中までです。「続きを教えて」と送ると続きが読めます）';
    S.chat.push({ role:'ai', text:out, mt:Date.now() });
  }catch(e){
    var msg = String(e.message || '');
    S.chat.push({ role:'ai', text:'つながりませんでした。\n' +
      (/API key not valid|API_KEY_INVALID|401|invalid_api_key/i.test(msg) ? 'APIキーが正しくないようです。設定タブで入れ直してください。'
       : /quota|RESOURCE_EXHAUSTED/i.test(msg) ? '今日の無料ぶんを使い切ったかもしれません。'
       : msg.slice(0, 120)), mt:Date.now() });
  }finally{
    chatBusy = false;
    persist(); pushRemote(); render();
    var b2 = document.getElementById('chatwrap'); if(b2) b2.scrollTop = b2.scrollHeight;
  }
}

function chatAction(act, t){
  if(act === 'chat-send'){
    var el = document.getElementById('chat_in');
    var v = el ? el.value.trim() : '';
    if(!v){ toast('きくことを入れてください', true); return true; }
    if(el) el.value = '';
    chatSend(v); return true;
  }
  if(act === 'chat-q'){ chatSend(t.dataset.q); return true; }
  if(act === 'chat-clear'){
    if(!confirm('会話を消しますか？')) return true;
    S.chat = []; persist(); pushRemote(); render(); return true;
  }
  return false;
}

  if(appId === 'course' && courseTemp && !APPS.some(function(a){ return a[0]==='course'; })){
    /* 何もしない（タブには出ないが、画面は授業のまま） */
  }else if(!APPS.some(function(a){ return a[0]===appId; })){
    appId = APPS[0] ? APPS[0][0] : 'today';
    courseTemp = false;
  }
  document.getElementById('apps').setAttribute('data-n', String(APPS.length));
  document.getElementById('apps').innerHTML = '<span class="pill"></span>' + APPS.map(function(a){
    return '<button data-app="'+a[0]+'" class="'+(appId===a[0]?'on':'')+(a[0]==='set'?' ico':'')+'">'+a[1]+'</button>';
  }).join('');

  var nav = document.getElementById('nav');
  var tabs = SUBTAB_DEFS[appId] ? subVisible(appId) : null;
  if(tabs && !tabs.length) tabs = null;
  if(tabs){
    var curMap = { money:payTab, risyu:risyuTab, cal:calTab, todo:todoTab, today:todayTab };
    var cur = curMap[appId];
    /* 今のサブタブが非表示なら最初のものへ */
    if(!tabs.some(function(t){ return t[0]===cur; })){
      cur = tabs[0][0];
      if(appId==='money') payTab=cur; else if(appId==='risyu') risyuTab=cur; else if(appId==='cal') calTab=cur; else if(appId==='todo') todoTab=cur; else if(appId==='today') todayTab=cur;
    }
    nav.className = '';
    nav.innerHTML = '<span class="pill"></span>' + tabs.map(function(t){
      return '<button data-tab="'+t[0]+'" class="'+(cur===t[0]?'on':'')+'">'+t[1]+'</button>';
    }).join('');
  }else{
    nav.className = 'hide'; nav.innerHTML = '';
  }

  var html = notice ? '<div class="msg '+notice.type+'">'+esc(notice.text)+'</div>' : '';
  if(appId==='today'){
    html += viewToday();
  }else if(appId==='money'){
    var d = derive();
    html += ({ home:viewHome, schedule:viewSchedule, chart:viewChart, stmt:viewStmt, in:viewIncome, work:viewShifts })[payTab](d);
  }else if(appId==='risyu'){
    html += ({ tt:viewRisyuTt, plans:viewRisyuPlans })[risyuTab==='plans'?'plans':'tt']();
  }else if(appId==='tt'){ html += viewTT(); }
  else if(appId==='course'){ html += viewCourse(); }
  else if(appId==='todo'){ html += viewTodo(); }
  else if(appId==='chat'){ html += viewChat(); }
  else if(appId==='notes'){ html += viewNotes(); }
  else if(appId==='news'){ html += viewNews(); }
  else if(appId==='cal'){
    html += calTab==='health' ? viewHealth() : calTab==='kind' ? viewKindTab() : calTab==='add' ? viewCalAdd() : viewCalendar();
  }else{
    html += viewSettings();
  }
  document.getElementById('app').innerHTML = html;
  var titleEl = document.getElementById('apptitle');
  titleEl.innerHTML = esc(TITLES[appId]) + '<span id="synctag"></span>';
  document.getElementById('foot').textContent = FOOTS[appId];
  var fab = document.getElementById('fab');
  if(fab) fab.className = (appId==='cal' && calTab!=='add') ? 'fab' : 'fab hide';
  var syncEl = document.getElementById('synctag');
  if(syncEl){
    /* 同期しているときだけ、部屋の名前を小さく出す */
    var rm = (S.settings && S.settings.room) ? String(S.settings.room) : '';
    syncEl.textContent = rm ? '同期中' : '';
  }
  movePills();
  if(typeof twInit==='function') twInit();
  var hd = document.querySelector('header');
  if(hd) document.documentElement.style.setProperty('--hdrh', Math.round(hd.getBoundingClientRect().height)+'px');
}

/* 選ばれているタブの位置に丸をすべらせる */
function movePill(box){
  if(!box) return;
  var pill = box.querySelector('.pill');
  var on = box.querySelector('button.on');
  if(!pill || !on){ if(pill) pill.style.width = '0px'; return; }
  pill.style.width = on.offsetWidth + 'px';
  pill.style.transform = 'translateX(' + on.offsetLeft + 'px)';
}
function movePills(){
  movePill(document.getElementById('apps'));
  var nav = document.getElementById('nav');
  if(nav && !nav.classList.contains('hide')) movePill(nav);
}
window.addEventListener('resize', movePills);

/* 左右にはらってタブを切り替える */
(function(){
  var root = document.body;
  var x0=0, y0=0, t0=0, decided=0, active=false, busy=false;
  var appEl = function(){ return document.getElementById('app'); };
  var inScroller = function(el){
    for(var n=el; n && n!==root; n=n.parentElement){
      if(n.scrollWidth > n.clientWidth + 4 && /auto|scroll/.test(getComputedStyle(n).overflowX)) return true;
    }
    return false;
  };
  var isInput = function(el){ return !!(el && el.closest && el.closest('input,textarea,select,button')); };
  var clear = function(){
    var a = appEl(); if(!a) return;
    a.style.transition = ''; a.style.transform = ''; a.style.opacity = '';
  };
  var settle = function(){
    var a = appEl(); if(!a) return;
    a.style.transition = 'transform .2s ease, opacity .2s ease';
    a.style.transform = ''; a.style.opacity = '';
    setTimeout(clear, 220);
  };
  root.addEventListener('touchstart', function(e){
    if(busy || e.touches.length !== 1 || isInput(e.target) || inScroller(e.target)){ t0 = 0; return; }
    clear();
    x0 = e.touches[0].clientX; y0 = e.touches[0].clientY; t0 = Date.now(); decided = 0; active = false;
  }, {passive:true});
  root.addEventListener('touchmove', function(e){
    if(!t0) return;
    var dx = e.touches[0].clientX - x0, dy = e.touches[0].clientY - y0;
    if(!decided){
      if(Math.abs(dx) < 8 && Math.abs(dy) < 8) return;
      decided = 1;
      active = Math.abs(dx) > Math.abs(dy) * 1.3;
      if(!active){ t0 = 0; return; }
    }
    var a = appEl();
    if(active && a){
      var shift = Math.max(-70, Math.min(70, dx * 0.35));
      a.style.transition = 'none';
      a.style.transform = 'translateX('+shift+'px)';
      a.style.opacity = String(1 - Math.min(0.3, Math.abs(dx)/1000));
    }
  }, {passive:true});
  root.addEventListener('touchend', function(e){
    if(!t0 || !active){ t0 = 0; settle(); return; }
    var dx = e.changedTouches[0].clientX - x0;
    var dt = Date.now() - t0;
    t0 = 0; active = false;
    if(Math.abs(dx) < 55 || dt > 800){ settle(); return; }
    busy = true;
    clear();
    switchTab(dx < 0 ? 1 : -1);
    setTimeout(function(){ busy = false; }, 380);
  }, {passive:true});
  root.addEventListener('touchcancel', function(){ t0=0; active=false; settle(); }, {passive:true});
})();
/* サブタブがあればサブタブ、なければ大きいタブを動かす */
function switchTab(dir){
  var a = document.getElementById('app');
  var finish = function(go){
    if(!a){ go(); return; }
    /* いまの画面をそっと送り出す */
    a.style.transition = 'transform .13s ease-in, opacity .13s ease-in';
    a.style.transform = 'translateX('+(dir>0?-26:26)+'px)';
    a.style.opacity = '0';
    setTimeout(function(){
      go();
      var b = document.getElementById('app');
      if(!b) return;
      b.style.transition = 'none';
      b.style.transform = 'translateX('+(dir>0?30:-30)+'px)';
      b.style.opacity = '0';
      requestAnimationFrame(function(){
        requestAnimationFrame(function(){
          b.style.transition = 'transform .2s cubic-bezier(.22,.9,.3,1), opacity .2s ease-out';
          b.style.transform = 'translateX(0)';
          b.style.opacity = '1';
          setTimeout(function(){ b.style.transition=''; b.style.transform=''; b.style.opacity=''; }, 220);
        });
      });
    }, 130);
  };
  var subs = SUBTAB_DEFS[appId] ? subVisible(appId) : null;
  if(subs && subs.length > 1){
    var cur = appId==='money' ? payTab : appId==='cal' ? calTab : appId==='todo' ? todoTab : appId==='risyu' ? risyuTab : todayTab;
    var i = subs.findIndex(function(t){ return t[0]===cur; });
    var j = i + dir;
    if(j >= 0 && j < subs.length){
      var v = subs[j][0];
      finish(function(){
        if(appId==='money') payTab=v; else if(appId==='cal') calTab=v; else if(appId==='todo') todoTab=v;
        else if(appId==='risyu') risyuTab=v; else if(appId==='today') todayTab=v;
        render(); window.scrollTo(0,0);
      });
      return;
    }
  }
  var apps = APPS_VISIBLE();
  var ai = apps.findIndex(function(a){ return a[0]===appId; });
  var aj = ai + dir;
  if(aj >= 0 && aj < apps.length){
    finish(function(){
      appId = apps[aj][0]; courseView=''; noteView='';
      render(); window.scrollTo(0,0);
    });
  }
}
