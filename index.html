<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="くらしの手帳">
<meta name="theme-color" content="#F6E8EC">
<title>くらしの手帳</title>
<style>
/* ================= テーマ ================= */
:root{
  --card:rgba(255,255,255,.62);
  --rule:rgba(255,255,255,.7); --soft:rgba(255,255,255,.45);
  --smbc:#2F8F6B; --smbcbg:rgba(220,245,235,.6); --rakuten:#C44A63; --rakutenbg:rgba(255,225,232,.7);
  --risyu:#B25C86; --risyubg:rgba(255,228,238,.65); --warn:#B8734A; --warnbg:rgba(255,236,222,.7);
  --ok:#2F8F6B; --okbg:rgba(223,245,235,.65);
  --e1:#E2664B; --e2:#E08A2E; --e3:#C79A18; --e4:#4E9A5B; --e5:#3FA89A;
  --e6:#5B84C4; --e7:#4C68C0; --e8:#8163B8; --e9:#D25F94; --e10:#7A8290;
  --todaybg:rgba(255,255,255,.35);
  /* ガラス */
  --glass:rgba(255,255,255,.44); --glass2:rgba(255,255,255,.30); --edge:rgba(255,255,255,.90);
  --blur:saturate(200%) blur(30px);
  --pill:rgba(255,255,255,.72); --pillbrd:rgba(255,255,255,.95);
  --spec:inset 0 1px 1px rgba(255,255,255,.95), inset 0 -1px 1px rgba(255,255,255,.35), inset 1px 0 0 rgba(255,255,255,.45);
  --lift:0 1px 2px rgba(0,0,0,.05), 0 12px 30px rgba(0,0,0,.10);
  --lift-lg:0 4px 12px rgba(0,0,0,.08), 0 26px 56px rgba(0,0,0,.16);
  --shadow:var(--lift); --shadow-lg:var(--lift-lg);
  --fs:15px;
  --paper:#EAD0D7; --tint1:rgba(232,168,190,.75); --tint2:rgba(255,214,226,.70); --tint3:rgba(216,188,232,.50); --accent:#D9738F; --accent2:#EDA6BB; --ink:#4A2B38; --sub:#9B7B87; --holi:#C2436A; --glasstint:rgba(237,166,187,.16); --glasstint2:rgba(217,115,143,.09);
}
body[data-theme="peach"]{ --paper:#F4DDD2; --tint1:rgba(255,186,160,.72); --tint2:rgba(255,222,206,.70); --tint3:rgba(255,205,180,.50); --accent:#E0876A; --accent2:#F1B49F; --ink:#4B3128; --sub:#9E7C6F; --holi:#C95A44;  --glasstint:rgba(241,180,159,.16); --glasstint2:rgba(224,135,106,.09);}
body[data-theme="lavender"]{ --paper:#E3DCF1; --tint1:rgba(190,170,235,.72); --tint2:rgba(222,212,248,.70); --tint3:rgba(236,196,220,.50); --accent:#8E74C9; --accent2:#B9A6E4; --ink:#352B4A; --sub:#7C7396; --holi:#7A5CB8;  --glasstint:rgba(185,166,228,.16); --glasstint2:rgba(142,116,201,.09);}
body[data-theme="lilac"]{ --paper:#EED9EA; --tint1:rgba(220,168,210,.72); --tint2:rgba(244,214,240,.70); --tint3:rgba(210,190,240,.50); --accent:#B36AA8; --accent2:#D5A2CC; --ink:#432B40; --sub:#8F7189; --holi:#A24E96;  --glasstint:rgba(213,162,204,.16); --glasstint2:rgba(179,106,168,.09);}
body[data-theme="sakura"]{ --paper:#F9E8EE; --tint1:rgba(255,190,210,.70); --tint2:rgba(255,228,236,.70); --tint3:rgba(255,220,196,.50); --accent:#C06090; --accent2:#E39DBC; --ink:#4A2B36; --sub:#9B7A87; --holi:#B4325A;  --glasstint:rgba(227,157,188,.16); --glasstint2:rgba(192,96,144,.09);}
body[data-theme="coral"]{ --paper:#F5D6D0; --tint1:rgba(255,160,150,.70); --tint2:rgba(255,212,204,.70); --tint3:rgba(255,200,170,.50); --accent:#D8695A; --accent2:#EE9C90; --ink:#4B2A26; --sub:#9E7570; --holi:#C4463A;  --glasstint:rgba(238,156,144,.16); --glasstint2:rgba(216,105,90,.09);}
body[data-theme="mint"]{ --paper:#D9EEE4; --tint1:rgba(160,230,200,.72); --tint2:rgba(212,244,230,.70); --tint3:rgba(200,236,180,.50); --accent:#3E9B78; --accent2:#84C7AC; --ink:#1F3A30; --sub:#6C8A7E; --holi:#2D8464;  --glasstint:rgba(132,199,172,.16); --glasstint2:rgba(62,155,120,.09);}
body[data-theme="sky"]{ --paper:#DAE8F5; --tint1:rgba(160,200,245,.72); --tint2:rgba(214,232,250,.70); --tint3:rgba(190,225,240,.50); --accent:#4E8BC4; --accent2:#8FB8E0; --ink:#1F2F45; --sub:#6E8298; --holi:#3C78B5;  --glasstint:rgba(143,184,224,.16); --glasstint2:rgba(78,139,196,.09);}
body[data-theme="lemon"]{ --paper:#F5EFD3; --tint1:rgba(255,232,150,.72); --tint2:rgba(252,244,208,.70); --tint3:rgba(255,220,180,.50); --accent:#C9A63A; --accent2:#E3C877; --ink:#413819; --sub:#8F8358; --holi:#B18D22;  --glasstint:rgba(227,200,119,.16); --glasstint2:rgba(201,166,58,.09);}
body[data-theme="cream"]{ --paper:#F7F1E6; --tint1:rgba(245,205,150,.62); --tint2:rgba(250,236,214,.70); --tint3:rgba(230,195,210,.45); --accent:#B98A46; --accent2:#D9B37E; --ink:#3B3222; --sub:#7D735F; --holi:#A67934;  --glasstint:rgba(217,179,126,.16); --glasstint2:rgba(185,138,70,.09);}
body[data-theme="mono"]{ --paper:#ECECEF; --tint1:rgba(200,200,210,.70); --tint2:rgba(232,232,238,.70); --tint3:rgba(215,215,225,.50); --accent:#5A5A66; --accent2:#8E8E9A; --ink:#24242C; --sub:#6B6B78; --holi:#8A3A4A;  --glasstint:rgba(142,142,154,.16); --glasstint2:rgba(90,90,102,.09);}
body[data-theme="navy"]{ --paper:#EDF1F6; --tint1:rgba(150,175,235,.62); --tint2:rgba(224,232,246,.70); --tint3:rgba(255,190,215,.40); --accent:#3C5A8A; --accent2:#7E9BC6; --ink:#17233A; --sub:#6B7686; --holi:#C2334D;  --glasstint:rgba(126,155,198,.16); --glasstint2:rgba(60,90,138,.09);}
body[data-theme="dark"]{
  --paper:#1B1720; --tint1:rgba(180,90,140,.42); --tint2:rgba(110,80,160,.38); --tint3:rgba(80,120,200,.30);
  --accent:#E38BA8; --accent2:#B96C88; --ink:#F0E8EC; --sub:#A896A0; --holi:#F2879B; --glasstint:rgba(227,139,168,.07); --glasstint2:rgba(185,108,136,.05);
  --card:rgba(60,50,64,.6); --rule:rgba(255,255,255,.14); --soft:rgba(255,255,255,.08);
  --glass:rgba(60,50,64,.46); --glass2:rgba(60,50,64,.32); --edge:rgba(255,255,255,.22);
  --pill:rgba(255,255,255,.18); --pillbrd:rgba(255,255,255,.30);
  --spec:inset 0 1px 1px rgba(255,255,255,.22), inset 0 -1px 1px rgba(255,255,255,.06);
  --lift:0 1px 2px rgba(0,0,0,.35), 0 12px 30px rgba(0,0,0,.45);
  --lift-lg:0 4px 12px rgba(0,0,0,.45), 0 26px 56px rgba(0,0,0,.6);
  --smbc:#4FBE7E; --smbcbg:rgba(31,49,41,.7); --rakuten:#F2726F; --rakutenbg:rgba(51,34,36,.7);
  --risyu:#D89AC0; --risyubg:rgba(70,40,60,.7); --warn:#E6A567; --warnbg:rgba(51,41,31,.7);
  --ok:#6FCB96; --okbg:rgba(30,49,40,.7); --todaybg:rgba(90,50,70,.6);
}
body[data-fs="s"]{--fs:13.5px}
body[data-fs="m"]{--fs:15px}
body[data-fs="l"]{--fs:16.5px}
body[data-fs="xl"]{--fs:18px}

*{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
body{
  margin:0; color:var(--ink); font-size:var(--fs);
  font-family:"Hiragino Maru Gothic ProN","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic Medium",sans-serif;
  line-height:1.55; -webkit-text-size-adjust:100%;
  transition:color .25s;
  background:var(--paper);
  min-height:100vh;
}
body::before{
  content:''; position:fixed; inset:0; z-index:-1; pointer-events:none;
  background:
    radial-gradient(64vw 46vh at 6% -2%,  var(--tint1), transparent 62%),
    radial-gradient(56vw 42vh at 104% 14%, var(--tint2), transparent 60%),
    radial-gradient(52vw 40vh at 84% 62%, var(--tint3), transparent 62%),
    radial-gradient(70vw 48vh at 16% 100%, var(--tint1), transparent 64%),
    radial-gradient(40vw 30vh at 50% 40%, rgba(255,255,255,.45), transparent 70%);
  opacity:1;
}
.num{font-variant-numeric:tabular-nums; letter-spacing:.01em}

/* ================= 起動アニメ ================= */
#splash{position:fixed; inset:0; background:var(--paper); z-index:90; display:flex;
  flex-direction:column; align-items:center; justify-content:center; gap:14px;
  transition:opacity .45s ease, visibility .45s}
#splash.out{opacity:0; visibility:hidden}
#splash .ttl{font-size:1.1em; font-weight:700; letter-spacing:.14em; opacity:0; animation:rise .6s .15s forwards}
#splash svg{opacity:0; animation:rise .6s forwards}
@keyframes rise{from{opacity:0; transform:translateY(10px)} to{opacity:1; transform:none}}
/* ================= iPad・パソコン ================= */
@media (min-width:760px){
  main{max-width:1000px; padding:22px 22px 40px}
  header{padding:calc(env(safe-area-inset-top) + 16px) 22px 0}
  #apps{max-width:1000px}
  nav{max-width:1000px}
  /* 2列に並べて、縦に長くならないように */
  main>section, main>.tsec{break-inside:avoid}
  #app{column-count:2; column-gap:20px}
  #app>section, #app>.tsec, #app>div{break-inside:avoid; -webkit-column-break-inside:avoid; page-break-inside:avoid; display:block; margin-bottom:18px}
  .hero{column-span:all}
  .cal td{height:auto}
  .cal .day{min-height:104px}
  table.tt2 td{height:112px}
  .themes{grid-template-columns:repeat(6,minmax(0,1fr))}
  .grid3{grid-template-columns:repeat(3,minmax(0,1fr))}
  .fab{right:28px; bottom:28px}
}
@media (min-width:1180px){
  main{max-width:1240px}
  #apps,nav{max-width:1240px}
  #app{column-count:3; column-gap:22px}
}
/* パソコンではタップ領域を少し詰める */
@media (hover:hover) and (pointer:fine){
  .mini{padding:5px 11px}
  .mini:hover,button.btn:hover,.pillrow button:hover,.kbtn:hover{filter:brightness(1.04)}
  .ccard:hover,.ncard:hover,.trplan:hover{transform:translateY(-1px); transition:transform .15s}
}
@media (prefers-reduced-motion:reduce){#splash svg,#splash .ttl{animation:none; opacity:1}}

header{
  position:sticky; top:0; z-index:20; color:var(--ink);
  background:linear-gradient(180deg, rgba(255,255,255,.62), rgba(255,255,255,.34));
  -webkit-backdrop-filter:saturate(180%) blur(30px); backdrop-filter:saturate(180%) blur(30px);
  padding:calc(env(safe-area-inset-top) + 14px) 14px 0;
  border-bottom:1px solid rgba(255,255,255,.6);
  box-shadow:0 6px 22px rgba(0,0,0,.10);
}
body[data-theme="dark"] header{background:linear-gradient(180deg, rgba(34,28,38,.95), rgba(34,28,38,.85)); border-bottom-color:rgba(255,255,255,.10)}
header h1{margin:0; font-size:1.05em; letter-spacing:.04em; font-weight:700; display:flex; align-items:center; gap:8px}
header p{margin:3px 0 10px; font-size:.76em; color:var(--sub)}
/* 上のアプリ切替：ガラスの丸がすべる */
#apps{position:relative; display:flex; gap:2px; max-width:620px; margin:0 auto 12px;
  overflow-x:auto; scrollbar-width:none; padding:4px; border-radius:999px;
  background:rgba(255,255,255,.26); border:1px solid rgba(255,255,255,.75);
  box-shadow:var(--spec), 0 2px 10px rgba(0,0,0,.10)}
#apps::-webkit-scrollbar{display:none}
#apps .pill{position:absolute; top:4px; left:0; height:calc(100% - 8px); border-radius:999px;
  background:linear-gradient(180deg, rgba(255,255,255,.98), rgba(255,255,255,.72));
  border:1px solid rgba(255,255,255,.95);
  box-shadow:0 3px 10px rgba(0,0,0,.22), inset 0 1px 0 rgba(255,255,255,1);
  transition:transform .38s cubic-bezier(.34,1.15,.4,1), width .38s cubic-bezier(.34,1.15,.4,1);
  pointer-events:none; z-index:0}
body[data-theme="dark"] #apps{background:rgba(255,255,255,.08); border-color:rgba(255,255,255,.14)}
body[data-theme="dark"] nav{background:linear-gradient(180deg, rgba(40,34,44,.92), rgba(40,34,44,.80))}
body[data-theme="dark"] #apps .pill{background:linear-gradient(180deg, rgba(255,255,255,.26), rgba(255,255,255,.12)); border-color:rgba(255,255,255,.3)}
#apps button{position:relative; z-index:1; flex:1 0 auto; min-width:62px; border:0; background:none;
  color:var(--sub); font:inherit; font-size:.82em; padding:9px 12px; border-radius:999px;
  font-weight:700; transition:color .25s}
#apps button.on{color:var(--ink)}

/* 下のタブ：同じく丸がすべる */
nav{position:sticky; top:var(--hdrh,116px); display:flex; gap:2px; z-index:15; overflow-x:auto; scrollbar-width:none;
  max-width:620px; margin:10px auto 0; padding:4px; border-radius:999px;
  background:linear-gradient(180deg, rgba(255,255,255,.64), rgba(255,255,255,.36)); border:1px solid var(--edge);
  -webkit-backdrop-filter:saturate(180%) blur(28px); backdrop-filter:saturate(180%) blur(28px);
  box-shadow:var(--spec), 0 6px 18px rgba(0,0,0,.12)}
nav::-webkit-scrollbar{display:none}
nav .pill{position:absolute; top:4px; left:0; height:calc(100% - 8px); border-radius:999px;
  background:linear-gradient(180deg, rgba(255,255,255,.98), rgba(255,255,255,.74));
  border:1px solid var(--pillbrd);
  box-shadow:0 3px 10px rgba(0,0,0,.18), inset 0 1px 0 rgba(255,255,255,1);
  transition:transform .34s cubic-bezier(.34,1.2,.4,1), width .34s cubic-bezier(.34,1.2,.4,1);
  pointer-events:none; z-index:0}
nav button{position:relative; z-index:1; flex:1 0 auto; min-width:60px; border:0; background:none;
  padding:8px 10px; font:inherit; font-size:.78em; color:var(--sub); white-space:nowrap;
  border-radius:999px; transition:color .25s}
nav button.on{color:var(--ink); font-weight:700}
nav.hide{display:none}

main{max-width:620px; margin:0 auto; padding:18px 14px}
nav+main{padding-top:14px}
footer{max-width:620px; margin:0 auto; padding:0 16px calc(env(safe-area-inset-bottom) + 34px); font-size:.74em; color:var(--sub); line-height:1.7}
section{margin-bottom:18px}
.head{display:flex; align-items:baseline; justify-content:space-between; margin-bottom:7px; gap:10px}
.head h2{margin:0; font-size:.85em; font-weight:700; letter-spacing:.02em}
.head span{font-size:.76em; color:var(--sub); text-align:right}
.box{position:relative; background:linear-gradient(150deg, rgba(255,255,255,.58), var(--glasstint), rgba(255,255,255,.26));
    border:1px solid var(--edge); border-radius:26px; padding:17px;
    -webkit-backdrop-filter:var(--blur); backdrop-filter:var(--blur);
    box-shadow:var(--spec), var(--lift); overflow:hidden}
.box::before{content:''; position:absolute; inset:0; pointer-events:none; border-radius:inherit;
    background:linear-gradient(118deg, rgba(255,255,255,.55) 0%, rgba(255,255,255,.12) 32%, rgba(255,255,255,0) 55%, rgba(255,255,255,.18) 100%)}
.box::after{content:''; position:absolute; left:6%; right:6%; top:0; height:1px; pointer-events:none;
    background:linear-gradient(90deg, transparent, rgba(255,255,255,1), transparent)}
.box>*{position:relative}
body[data-theme="dark"] .box{background:linear-gradient(150deg, rgba(70,58,74,.62), var(--glasstint), rgba(50,42,54,.40))}
body[data-theme="dark"] .box::before{background:linear-gradient(118deg, rgba(255,255,255,.14) 0%, rgba(255,255,255,.03) 35%, rgba(255,255,255,0) 60%)}
.row{display:flex; align-items:center; gap:11px; padding:10px 0; border-bottom:1px solid var(--rule);
  width:100%; text-align:left; background:none; border-left:0; border-right:0; border-top:0; font:inherit; color:inherit}
.row:last-child{border-bottom:0}
.tick{width:4px; height:32px; border-radius:2px; flex:none}
.grow{flex:1; min-width:0}
.t{font-size:.93em}
.s{font-size:.78em; color:var(--sub); overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .s.wrap{white-space:normal; overflow:visible; text-overflow:clip}
.s2{font-size:.78em; color:var(--sub)}
.amt{font-size:1em; font-weight:600}
.big{font-size:2.4em; font-weight:700; line-height:1.1}
.mid{font-size:1.5em; font-weight:700}
.accbar{display:flex; align-items:center; justify-content:space-between; padding:6px 9px; border-radius:7px; font-size:.78em; font-weight:700; margin-bottom:2px}
.smbc{color:var(--smbc)} .bg-smbc{background:var(--smbcbg)}
.rakuten{color:var(--rakuten)} .bg-rakuten{background:var(--rakutenbg)}
  .chk{width:22px;height:22px;border-radius:999px;border:1.5px solid var(--edge);display:flex;align-items:center;justify-content:center;
    color:#fff;font-size:.75em;flex:none;background:linear-gradient(180deg, rgba(255,255,255,.88), var(--glasstint2), rgba(255,255,255,.5));
    box-shadow:var(--spec), 0 2px 6px rgba(0,0,0,.14)}
.done .t{color:var(--sub); text-decoration:line-through}
button.btn{display:block; width:100%; padding:13px; border-radius:999px; border:1px solid rgba(255,255,255,.5);
    font:inherit; font-size:.92em; font-weight:700; color:#fff;
    background:linear-gradient(180deg, var(--accent2), var(--accent));
    box-shadow:0 6px 18px rgba(0,0,0,.32), inset 0 1px 0 rgba(255,255,255,.6), inset 0 -2px 6px rgba(0,0,0,.06);
    transition:transform .12s, box-shadow .2s}
  button.btn:active{transform:translateY(1px); box-shadow:0 3px 10px rgba(0,0,0,.28), inset 0 1px 0 rgba(255,255,255,.5)}
body[data-theme="dark"] button.btn{color:#111}
button.btn.ghost{background:linear-gradient(180deg, rgba(255,255,255,.70), var(--glasstint2), rgba(255,255,255,.36));
    color:var(--ink); border:1px solid var(--edge);
    -webkit-backdrop-filter:blur(10px); backdrop-filter:blur(10px);
    box-shadow:var(--spec), 0 4px 12px rgba(0,0,0,.14)}
  body[data-theme="dark"] button.btn.ghost{background:linear-gradient(180deg, rgba(255,255,255,.16), var(--glasstint2), rgba(255,255,255,.07))}
button.btn[disabled]{background:var(--rule); color:var(--card)}
.pair{display:flex; gap:8px; align-items:stretch}
.pair>*{flex:1 1 0; min-width:0}
.pair>button.btn{width:auto; white-space:nowrap}
label.f{display:block; font-size:.78em; color:var(--sub); margin:0 0 4px}
input,textarea,select{width:100%; padding:11px 14px; border:1px solid var(--edge); border-radius:18px;
  background:linear-gradient(180deg, rgba(255,255,255,.64), var(--glasstint2), rgba(255,255,255,.36));
  font:inherit; font-size:.92em; color:var(--ink);
  -webkit-backdrop-filter:blur(8px); backdrop-filter:blur(8px);
  box-shadow:inset 0 1px 2px rgba(0,0,0,.10), inset 0 -1px 0 rgba(255,255,255,.8); outline:none}
input:focus,textarea:focus,select:focus{border-color:var(--accent2); box-shadow:0 0 0 3px rgba(233,160,182,.30), inset 0 1px 2px rgba(0,0,0,.08)}

/* ============================== 日本の祝日 ============================== */
var _holCache = {};
function nthMonday(y, m, n){            /* m は 1〜12 */
  var d = new Date(y, m-1, 1);
  var first = 1 + ((8 - d.getDay()) % 7);   /* その月の最初の月曜 */
  return new Date(y, m-1, first + (n-1)*7);
}
function holidaysOf(y){
  if(_holCache[y]) return _holCache[y];
  var h = {};
  var put = function(d, name){ h[toYmd(d)] = name; };
  var fixed = [[1,1,'元日'],[2,11,'建国記念の日'],[2,23,'天皇誕生日'],[4,29,'昭和の日'],
    [5,3,'憲法記念日'],[5,4,'みどりの日'],[5,5,'こどもの日'],[8,11,'山の日'],
    [11,3,'文化の日'],[11,23,'勤労感謝の日']];
  fixed.forEach(function(f){ put(new Date(y, f[0]-1, f[1]), f[2]); });
  put(nthMonday(y,1,2),  '成人の日');
  put(nthMonday(y,7,3),  '海の日');
  put(nthMonday(y,9,3),  '敬老の日');
  put(nthMonday(y,10,2), 'スポーツの日');
  /* 春分・秋分（1980〜2099年で使える式） */
  var t = y - 1980;
  put(new Date(y, 2, Math.floor(20.8431 + 0.242194*t - Math.floor(t/4))), '春分の日');
  put(new Date(y, 8, Math.floor(23.2488 + 0.242194*t - Math.floor(t/4))), '秋分の日');

  /* 振替休日：日曜と重なったら、次の祝日でない日 */
  Object.keys(h).slice().sort().forEach(function(k){
    var a = k.split('-'), d = new Date(+a[0], +a[1]-1, +a[2]);
    if(d.getDay() !== 0) return;
    var n = new Date(d); var guard = 0;
    do { n.setDate(n.getDate()+1); guard++; } while(h[toYmd(n)] && guard < 10);
    if(!h[toYmd(n)]) h[toYmd(n)] = '振替休日';
  });
  /* 国民の休日：祝日と祝日にはさまれた平日 */
  Object.keys(h).slice().sort().forEach(function(k){
    var a = k.split('-'), d = new Date(+a[0], +a[1]-1, +a[2]);
    var mid = new Date(d); mid.setDate(mid.getDate()+1);
    var nxt = new Date(d); nxt.setDate(nxt.getDate()+2);
    if(h[toYmd(mid)] || !h[toYmd(nxt)]) return;
    if(mid.getDay() === 0 || mid.getDay() === 6) return;
    h[toYmd(mid)] = '国民の休日';
  });
  _holCache[y] = h;
  return h;
}
function holidayName(ymd){
  if(!isYmd(ymd)) return '';
  return holidaysOf(+ymd.slice(0,4))[ymd] || '';
}

function isWeekend(ymd){

/* 月と日だけから、いちばん近い年を選ぶ */
function guessYear(m, d){
  var now = new Date();
  var t0 = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  var best = now.getFullYear(), score = Infinity;
  [now.getFullYear()-1, now.getFullYear(), now.getFullYear()+1].forEach(function(yy){
    var dt = new Date(yy, m-1, d);
    if(dt.getMonth() !== m-1) return;
    var diff = Math.abs((dt - t0) / 86400000);
    var sc = (dt < t0) ? diff * 1.8 : diff;   /* これからの日を優先する */
    if(sc < score){ score = sc; best = yy; }
  });
  return best;
}
function mdToYmd(m, d){
  m = toNum(m); d = toNum(d);
  if(m < 1 || m > 12 || d < 1 || d > 31) return '';
  var y = guessYear(m, d);
  var dt = new Date(y, m-1, d);
  if(dt.getMonth() !== m-1) return '';
  return toYmd(dt);
}

function payPeriod(ym){

  var pm = m - 1, py = y;
  if(pm < 1){ pm = 12; py -= 1; }

function trTime(pair){ return { dep:pair[0], arr:pair[1], d:minutesOf(pair[0]), a:minutesOf(pair[1]) }; }
/* 目標の到着時刻までに着ける便のうち、いちばん遅いものを返す */
function lastArrivalBy(table, limitMin){
  var best = null;
  table.forEach(function(p){
    var t = trTime(p);
    if(t.a <= limitMin && (!best || t.a > best.a || (t.a === best.a && t.d > best.d))) best = t;
  });
  return best;
}
/* 指定時刻以降に出る便のうち、いちばん早いものを返す */
function firstDepartureFrom(table, fromMin){
  var best = null;
  table.forEach(function(p){
    var t = trTime(p);
    if(t.d >= fromMin && (!best || t.d < best.d)) best = t;
  });
  return best;
}
function sortedDeps(table){
  return table.map(trTime).sort(function(a,b){ return a.d - b.d; });
}

function goPlanFor(arriveByMin){
  var train = lastArrivalBy(tbl('trainGo'), arriveByMin);
  if(!train) return null;
  var margin = toNum(S.transit.sannomiyaTransfer) || 10;
  var bus = lastArrivalBy(tbl('busGo'), train.d - margin);
  return { train:train, bus:bus, arriveBy:arriveByMin };
}
/* 行き：本命と、バスを1本・2本遅らせた場合 */
function goPlans(arriveByMin, classStartMin){

  var base = goPlanFor(arriveByMin);
  if(!base) return [];
  var buses = sortedDeps(tbl('busGo'));
  var bi = -1;
  if(base.bus) for(var i=0;i<buses.length;i++) if(buses[i].d === base.bus.d) bi = i;
  var out = [{ bus:base.bus, train:base.train, tag:'おすすめ', ok:true }];
  [1,2].forEach(function(k){
    var b = (bi >= 0) ? buses[bi + k] : null;
    if(!b) return;
    var tr = firstDepartureFrom(tbl('trainGo'), b.a + margin);
    if(!tr) return;
    out.push({ bus:b, train:tr, tag:'バス'+k+'本あと',
      ok: (classStartMin == null) ? true : (tr.a <= classStartMin) });
  });
  return out;
}
/* 自分で足したダイヤも合わせて使う */
function tbl(name){
  var base = { busGo:BUS_GO, trainGo:TRAIN_GO, trainBack:TRAIN_BACK, busBack:BUS_BACK, busWork:BUS_WORK }[name] || [];
  var extra = ((S.transit.custom||{})[name]) || [];
  return base.concat(extra.filter(function(p){ return p && minutesOf(p[0])!=null && minutesOf(p[1])!=null; }));
}
/* バイトの日：大学を出て、開始に間に合う便（本命・1本前・1本後） */
function workPlans(leaveAfterMin, arriveByMin){
  var margin = toNum(S.transit.sannomiyaTransfer) || 10;
  var trains = sortedDeps(tbl('trainBack')).filter(function(t){ return t.d >= leaveAfterMin; });
  var out = [];
  trains.forEach(function(t){
    var b = firstDepartureFrom(tbl('busWork'), t.a + margin);
    if(!b) return;
    out.push({ train:t, bus:b, ok: b.a <= arriveByMin });
  });
  if(!out.length) return [];
  var idx = -1;
  for(var i=out.length-1;i>=0;i--){ if(out[i].ok){ idx=i; break; } }   /* 間に合う中でいちばん遅い */
  if(idx < 0) idx = 0;
  var pick = [];
  if(out[idx-1]) pick.push(Object.assign({tag:'1本前'}, out[idx-1]));
  pick.push(Object.assign({tag:'ちょうど'}, out[idx]));
  if(out[idx+1]) pick.push(Object.assign({tag:'1本後'}, out[idx+1]));
  return pick;
}
/* 帰り：鳴尾を出たい時刻から、1本前・本命・1本後 */
function backPlans(departAfterMin){
  var all = sortedDeps(tbl('trainBack'));
  var idx = -1;
  for(var i=0;i<all.length;i++){ if(all[i].d >= departAfterMin){ idx = i; break; } }
  if(idx < 0) return [];
  var margin = toNum(S.transit.sannomiyaTransfer) || 10;
  var mk = function(t, tag){
    if(!t) return null;
    return { train:t, bus:firstDepartureFrom(tbl('busBack'), t.a + margin), tag:tag };
  };
  return [mk(all[idx-1],'1本前'), mk(all[idx],'ちょうど'), mk(all[idx+1],'1本後')].filter(Boolean);
}

/* 休講 */
function isCancelled(name, ymd){
  return S.holidays.some(function(h){ return h.date===ymd && (h.course===name || h.course==='*'); });
}
/* 隔週：基準日を設定した科目は、基準日から2週ごとに「ある週」 */
function biweekOn(name, ymd){
  var c = courseByName(name);
  if(!c || !c.bi) return true;
  var anchor = S.biweek[name];
  if(!isYmd(anchor)) return true;      /* 基準日が無ければ毎週あるものとして扱う */
  var d = daysBetween(anchor, ymd);
  if(d === null) return true;
  var w = Math.floor(d / 7);
  return ((w % 2) + 2) % 2 === 0;
}
/* その日に実際にある授業（休講・隔週を考慮） */
function classesForDate(ymd){
  if(!isYmd(ymd)) return [];
  var a = ymd.split('-'), dch = WDAY[new Date(+a[0], +a[1]-1, +a[2]).getDay()];
  var map = {};
  termCourses().forEach(function(c){ c.slots.forEach(function(sl){ map[sl.d+sl.p] = c; }); });
  var out = [];
  PERIODS.forEach(function(p){
    var c = map[dch+p]; if(!c) return;
    var off = isCancelled(c.name, ymd) ? 'cancel' : (!biweekOn(c.name, ymd) ? 'biweek' : '');
    out.push({ period:p, name:c.name, room:courseRoom(c.name), web:c.web, req:courseReq(c.name), bi:c.bi, off:off });
  });
  return out;
}

function daysUntil(day){
  var now=new Date(), t0=new Date(now.getFullYear(),now.getMonth(),now.getDate());
  var t=new Date(now.getFullYear(),now.getMonth(),day);
  if(t<t0) t=new Date(now.getFullYear(),now.getMonth()+1,day);
  return Math.round((t-t0)/86400000);
}
async function resizeImage(file,maxSide,quality){
  var dataUrl = await new Promise(function(res,rej){ var r=new FileReader(); r.onload=function(){res(r.result);}; r.onerror=function(){rej(new Error('read'));}; r.readAsDataURL(file); });
  var img = await new Promise(function(res,rej){ var i=new Image(); i.onload=function(){res(i);}; i.onerror=function(){rej(new Error('img'));}; i.src=dataUrl; });
  var sc=Math.min(1,maxSide/Math.max(img.width,img.height));
  var cv=document.createElement('canvas');
  cv.width=Math.round(img.width*sc); cv.height=Math.round(img.height*sc);
  cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height);
  return cv.toDataURL('image/jpeg',quality);
}

  months.forEach(function(m){ byMonth[m] = { smbc:{plan:0,stmt:0,rows:[],stmts:[]}, rakuten:{plan:0,stmt:0,rows:[],stmts:[]} }; });
  rows.forEach(function(r){ var g=byMonth[r.month]; if(!g||!g[r.accountId]) return; g[r.accountId].plan+=r.amount; g[r.accountId].rows.push(r); });
  S.statements.forEach(function(s){ var g=byMonth[s.billingMonth]; if(!g||!g[s.accountId]) return; g[s.accountId].stmt += Number(s.amount)||0; g[s.accountId].stmts.push(s); });
  var monthTotal = function(m){ var g=byMonth[m]; if(!g) return 0; return g.smbc.plan+g.smbc.stmt+g.rakuten.plan+g.rakuten.stmt; };
  return { rows:rows, months:months, byMonth:byMonth, monthTotal:monthTotal };
}
function sumBy(arr, f){ return (arr||[]).reduce(function(a,x){ return a + (Number(f(x))||0); }, 0); }
function budget(){
  var d = derive(), cur = thisYm();
  var pay = d.monthTotal(cur);
  var fx  = sumBy(S.fixed, function(x){ return x.amount; });
  var inc = sumBy(S.income, function(x){ return x.amount; });
  var bal = sumBy(S.balances, function(x){ return x.amount; });
  var have = bal + inc;                 /* 口座にあるお金＋今月入るお金 */
  var out  = pay + fx;                  /* 今月出ていくお金 */
  var free = have - out;
  var rate = have > 0 ? free / have : (free >= 0 ? 1 : -1);
  var level, word;
  if(have === 0){ level='none'; word='口座残高か収入を登録すると判定できます'; }
  else if(free < 0){ level='bad';  word='今月は足りません'; }
  else if(rate < .12){ level='warn'; word='かなりギリギリです'; }
  else if(rate < .3){ level='ok';   word='やりくりすれば大丈夫'; }
  else { level='good'; word='余裕があります'; }
  return { pay:pay, fixed:fx, income:inc, balance:bal, have:have, free:free,
           level:level, word:word, month:cur };
}

var syncState = { on:false, msg:'', ref:null, setDoc:null, unsub:null, timer:null, last:'', connecting:false };

function parseFbConfig(txt){
  var s = String(txt == null ? '' : txt).trim();
  if(!s) throw new Error('EMPTY');
  s = s.replace(/^\s*\/\/.*$/gm, '');
  var a = s.indexOf('{'), b = s.lastIndexOf('}');
  s = (a >= 0 && b > a) ? s.slice(a, b + 1) : '{' + s + '}';
  s = s.replace(/([{,]\s*)([A-Za-z_$][A-Za-z0-9_$]*)\s*:/g, '$1"$2":');
  s = s.replace(/'([^'\\]*)'/g, '"$1"');
  s = s.replace(/,\s*([}\]])/g, '$1');
  var cfg = JSON.parse(s);
  if(!cfg || !cfg.apiKey || !cfg.projectId) throw new Error('MISSING');
  return cfg;
}
async function initSync(){
  var room = S.settings.room, fbConfig = S.settings.fbConfig;
  if(!room || !fbConfig) return;
  if(syncState.connecting) return;
  syncState.connecting = true;
  try{
    var cfg = parseFbConfig(fbConfig);
    var fa = await import('https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js');
    var fs = await import('https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js');
    if(room !== S.settings.room || fbConfig !== S.settings.fbConfig){ syncState.connecting=false; return; }
    if(syncState.unsub){ try{ syncState.unsub(); }catch(e){} syncState.unsub = null; }
    var app = fa.initializeApp(cfg, 'kurashi-' + Date.now());
    var ref = fs.doc(fs.getFirestore(app), 'shiharai', room);
    syncState.ref = ref; syncState.setDoc = fs.setDoc; syncState.on = true; syncState.msg = '';
    syncState.unsub = fs.onSnapshot(ref, function(snap){
      if(snap.exists()) mergeRemote(snap.data());
      else pushRemote(true);
    }, function(err){ syncState.on=false; syncState.msg='つながりませんでした：'+err.message; render(); });
    render();
  }catch(e){
    syncState.on=false;
    syncState.msg = (e.message === 'EMPTY')   ? 'Firebaseの設定が空です。コンソールの firebaseConfig を貼り付けてください。'
                  : (e.message === 'MISSING') ? 'apiKey と projectId が見当たりません。firebaseConfig 全体を貼り付けてください。'
                  : /Failed to fetch|dynamically imported/.test(e.message) ? 'ネットにつながらないか、ファイルを直接開いています。https:// のURLから開いてください。'
                  : '設定を読み取れませんでした。firebaseConfig の { から } までを貼り付けてください。';
    render();
  }finally{
    syncState.connecting = false;
  }
}

function pushRemote(now){
  if(!syncState.on || !syncState.ref) return;
  clearTimeout(syncState.timer);
  var go = async function(){
    var body = payload();
    var sig = JSON.stringify(Object.assign({}, body, {updatedAt:0}));
    if(sig === syncState.last) return;
    try{ await syncState.setDoc(syncState.ref, body); syncState.last = sig; }
    catch(e){ syncState.msg = '送信できませんでした：'+e.message; }
  };
  now ? go() : (syncState.timer = setTimeout(go, 600));
}
function mergeList(local, remote, dead){
  var m = {};
  (local||[]).forEach(function(x){ if(x && x.id) m[x.id] = x; });
  (remote||[]).forEach(function(x){
    if(!x || !x.id) return;
    var cur = m[x.id];
    if(!cur || (Number(x.mt)||0) > (Number(cur.mt)||0)) m[x.id] = x;
  });
  return Object.keys(m).map(function(k){ return m[k]; }).filter(function(x){ return !dead[x.id]; });
}
function mergeRemote(d){
  var before = JSON.stringify([S.plans,S.statements,S.paid,S.deleted,S.risyu,S.income,S.fixed,S.balances,S.events,S.tasks,S.exams,S.health,S.shifts,S.attend,S.terms,S.commute,S.ui]);
  var dead = {};
  (S.deleted||[]).concat(d.deleted||[]).forEach(function(x){ dead[x]=1; });

  var pm = {}; S.plans.forEach(function(p){ pm[p.id]=p; });
  (d.plans||[]).forEach(function(p){ if(!pm[p.id]) pm[p.id]=p; });
  var sm = {}; S.statements.forEach(function(s){ sm[s.id]=s; });
  (d.statements||[]).forEach(function(s){ if(!sm[s.id]) sm[s.id]=Object.assign({}, s, {hasImage:false}); });

  S.deleted = Object.keys(dead);
  S.plans = Object.keys(pm).map(function(k){ return pm[k]; }).filter(function(p){ return !dead[p.id]; });
  S.statements = Object.keys(sm).map(function(k){ return sm[k]; })
    .filter(function(s){ return !dead[s.id]; })
    .sort(function(a,b){ return (b.createdAt||0)-(a.createdAt||0); });

  LISTS.forEach(function(k){ S[k] = mergeList(S[k], d[k], dead); });

  var rp = d.paid || {};
  var planIdOf = function(k){ var i = k.indexOf(':'); return i < 0 ? k : k.slice(0, i); };
  Object.keys(rp).forEach(function(k){
    if(dead[planIdOf(k)]) return;
    var r = normPaid(rp[k]), l = normPaid(S.paid[k]);
    if(r && (!l || r.t > l.t)) S.paid[k] = r;
  });
  Object.keys(S.paid).forEach(function(k){ if(dead[planIdOf(k)]) delete S.paid[k]; });

  if(d.risyu && (Number(d.risyu.updatedAt)||0) > (Number(S.risyu.updatedAt)||0)){
    S.risyu.selected = Array.isArray(d.risyu.selected) ? d.risyu.selected.slice() : [];
    S.risyu.earned = Object.assign({ kyoyo:0, topic:0, lang:0, langEn:0, info:0, health:0, pe:0 }, d.risyu.earned||{});
    S.risyu.otherCr = Number(d.risyu.otherCr)||0;
    S.risyu.updatedAt = Number(d.risyu.updatedAt)||0;
  }
  var rm = d.meta || {};
  var uiChanged = false;
  [['attend','attend'],['terms','terms'],['commute','commute'],['ui','ui']].forEach(function(pair){
    var k = pair[0];
    if(d[k] && (Number(rm[k])||0) > (Number(S.meta[k])||0)){
      S[k] = d[k]; S.meta[k] = Number(rm[k])||0;
      if(k==='ui') uiChanged = true;
    }
  });
  if(uiChanged){ S.ui = Object.assign(JSON.parse(JSON.stringify(UI_DEFAULT)), S.ui||{}); applyUi(); }
  if(!Array.isArray(S.commute.periods) || S.commute.periods.length!==6) S.commute.periods = COMMUTE_DEFAULT.periods.slice();
  if(!Array.isArray(S.commute.ends) || S.commute.ends.length!==6) S.commute.ends = COMMUTE_DEFAULT.ends.slice();

  if(d.days){
    S.settings.smbcDay = d.days.smbc || S.settings.smbcDay;
    S.settings.rakutenDay = d.days.rakuten || S.settings.rakutenDay;
  }
  if(typeof d.regDeadline === 'string') S.settings.regDeadline = d.regDeadline;
  if(d.minWeekday != null) S.settings.minWeekday = Number(d.minWeekday)||0;
  if(d.minWeekend != null) S.settings.minWeekend = Number(d.minWeekend)||0;
  if(d.fare != null) S.settings.fare = toNum(d.fare);
  if(typeof d.shop === 'string') S.settings.shop = d.shop;
  if(typeof d.payBankId === 'string') S.settings.payBankId = d.payBankId;
  ['courseMeta','memos','transit','payApplied','attendLog','grades','biweek','termsList','termsDone'].forEach(function(k){
    if(d[k] !== undefined && (Number((d.meta||{})[k])||0) > (Number(S.meta[k])||0)){ S[k] = d[k]; S.meta[k] = Number(d.meta[k])||0; }
  });
  if(typeof d.termId === 'string' && (Number((d.meta||{}).termsList)||0) >= (Number(S.meta.termsList)||0)) S.termId = d.termId;
  if(typeof d.wage === 'number') S.settings.wage = d.wage;

  persist();
  if(before !== JSON.stringify([S.plans,S.statements,S.paid,S.deleted,S.risyu,S.income,S.fixed,S.balances,S.events,S.tasks,S.exams,S.health,S.shifts,S.attend,S.terms,S.commute,S.ui])) render();
  pushRemote();
}

function icsStamp(ymd, hhmm){
  var a = ymd.split('-');
  return a[0]+a[1]+a[2]+'T'+hhmm.replace(':','')+'00';
}
function icsEsc(t){
  return String(t==null?'':t).replace(/\\/g,'\\\\').replace(/;/g,'\\;').replace(/,/g,'\\,').replace(/[\r\n]+/g,' ');
}
function makeIcs(){
  var lines = ['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//kurashi//JP','CALSCALE:GREGORIAN','METHOD:PUBLISH',
    'X-WR-CALNAME:くらしの手帳',
    'BEGIN:VTIMEZONE','TZID:Asia/Tokyo','BEGIN:STANDARD','DTSTART:19700101T000000',
    'TZOFFSETFROM:+0900','TZOFFSETTO:+0900','TZNAME:JST','END:STANDARD','END:VTIMEZONE'];

  /* 時刻つきなら時間の予定、なければ終日の予定として書き出す */
  var ev = function(uid, title, ymd, hhmm, minutes, endYmd, note){
    if(!isYmd(ymd)) return;
    lines.push('BEGIN:VEVENT', 'UID:'+uid+'@kurashi', 'SUMMARY:'+icsEsc(title));
    if(hhmm && minutesOf(hhmm) != null){
      var endMin = minutesOf(hhmm) + (minutes || 60);
      var endDay = ymd;
      if(endMin >= 1440){ endMin -= 1440; endDay = shiftDate(ymd, 1); }
      lines.push('DTSTART;TZID=Asia/Tokyo:'+icsStamp(ymd, hhmm),
                 'DTEND;TZID=Asia/Tokyo:'+icsStamp(endDay, hhmmOf(endMin)));
    }else{
      var last = (isYmd(endYmd) && endYmd > ymd) ? endYmd : ymd;
      var a = ymd.split('-'), b = shiftDate(last, 1).split('-');   /* 終日は翌日が終わり */
      lines.push('DTSTART;VALUE=DATE:'+a[0]+a[1]+a[2], 'DTEND;VALUE=DATE:'+b[0]+b[1]+b[2]);
    }
    if(note) lines.push('DESCRIPTION:'+icsEsc(note));
    lines.push('END:VEVENT');
  };

  S.events.forEach(function(e){
    ev('ev-'+e.id, (e.kind==='imp'?'★ ':'')+(e.title||'予定'), e.date, e.time, 60, e.dateEnd, e.memo);
  });
  S.tasks.forEach(function(t){
    if(!t.done) ev('tk-'+t.id, '締切 '+(t.title||''), t.due, t.time, 60, '', t.subject);
  });
  S.exams.forEach(function(x){
    ev('ex-'+x.id, (x.kind==='quiz'?'小テスト ':'テスト ')+(x.subject||''), x.date, x.time, 60, '', x.room);
  });
  S.shifts.forEach(function(w){
    var mins = Math.round(shiftHours(w)*60) || 60;
    ev('wk-'+w.id, 'バイト '+(w.title||''), w.date, w.start, mins, '', w.memo);
  });
  S.health.forEach(function(h){
    ev('hl-'+h.id, (h.name||'')+' の期限', h.next, '', 0, '', h.memo);
  });
  var d = derive(), cur = thisYm();
  d.months.filter(function(m){ return m>=cur; }).forEach(function(m){
    [['smbc',S.settings.smbcDay],['rakuten',S.settings.rakutenDay]].forEach(function(pair){
      var g=d.byMonth[m][pair[0]], amt=g.plan+g.stmt; if(amt<=0) return;
      ev(pair[0]+'-'+m, ACCOUNTS[pair[0]].bank+' 引落 '+yen(amt), m+'-'+pad(pair[1]), '', 0, '', '前日までに入金');
    });
  });

  lines.push('END:VCALENDAR');
  download(new Blob([lines.join('\r\n')],{type:'text/calendar;charset=utf-8'}), 'kurashi.ics');
}

function departureFor(period){

        if(Number(h.visibility[i]) < 1000) lowVis = true;
        if(Number(h.snowfall[i]) > 0) snowHour = true;
      }
    }
    if(snowSum > 0 || snowHour || (code>=71&&code<=77) || code===85 || code===86)
      return '雪の予報です。三田からのバスが遅れることがあります。早めに出るか、電車への振り替えも考えてください。';
    if(lowVis || code===45 || code===48)
      return '朝は霧が出そうです。三田の山あいは見通しが悪くなり、バスが遅れることがあります。';
    if(code>=95) return '雷雨の予報です。バス・電車とも遅れる可能性があります。';
    return '';
  }catch(e){ return ''; }
}
function umbrellaInfo(){
  if(weather.state !== 'ok') return null;
  try{
    var a = weather.sanda, b = weather.school;
    var pa = a.daily.precipitation_probability_max ? a.daily.precipitation_probability_max[0] : 0;
    var pb = b.daily.precipitation_probability_max ? b.daily.precipitation_probability_max[0] : 0;
    var pop = Math.max(Number(pa)||0, Number(pb)||0);
    var rain = Math.max(Number((a.daily.precipitation_sum||[0])[0])||0, Number((b.daily.precipitation_sum||[0])[0])||0);
    /* 通学時間帯（6〜20時）にいちばん降りそうな時間 */
    var peak = null;
    [a,b].forEach(function(w){
      var h = w.hourly;
      if(!h || !h.time) return;
      for(var i=0;i<h.time.length;i++){
        var hh = Number(String(h.time[i]).slice(11,13));
        if(hh < 6 || hh > 20) continue;
        var v = Number(h.precipitation_probability[i]) || 0;
        if(!peak || v > peak.v) peak = { v:v, at:String(h.time[i]).slice(11,16) };
      }
    });
    var need = pop >= 50 || rain >= 1;
    var maybe = !need && pop >= 30;
    return { pop:pop, rain:rain, peak:peak, need:need, maybe:maybe };
  }catch(e){ return null; }
}
function weatherCard(){
  if(weather.state === 'loading') return '<div class="s2 wx" style="margin-top:6px">天気を確認しています…</div>';
  if(weather.state === 'ng') return '<div class="s2 wx" style="margin-top:6px">天気は取れませんでした</div>';
  if(weather.state !== 'ok') return '';
  try{
    var a = weather.sanda, b = weather.school;
    var u = umbrellaInfo();
    var cur = a.current ? Math.round(a.current.temperature_2m) : null;
    var curB = b.current ? Math.round(b.current.temperature_2m) : null;
    var h = '<div class="wxrow">'+
      wxCell('三田（家）', a, cur) +
      wxCell('西宮（大学）', b, curB) + '</div>';
    if(u){
      var cls = u.need ? 'red' : u.maybe ? 'amber' : 'green';
      var msg = u.need ? '<b>傘を持って行ってください。</b>'
              : u.maybe ? '雨が降るかもしれません。折りたたみ傘があると安心です。'
              : '傘は要りません。';
      h += '<div class="bn '+cls+'" style="margin:10px 0 0"><span class="ic">'+(u.need?'☔':u.maybe?'🌂':'☀')+'</span>'+
        '<span>'+msg+'　降水'+u.pop+'%'+(u.peak && u.peak.v>=30 ? '（'+u.peak.at+'ごろがいちばん高い）' : '')+'</span></div>';
    }
    h += rainGraph(a);
    return h;
  }catch(e){ return ''; }
}
/* 時間別の降水確率グラフ（6〜21時） */
function rainGraph(w){
  try{
    var h = w.hourly, td = today(), out = [];
    for(var i=0;i<h.time.length;i++){
      var t = String(h.time[i]); if(t.slice(0,10) !== td) continue;
      var hh = Number(t.slice(11,13)); if(hh < 6 || hh > 21) continue;
      out.push({ h:hh, v:Number(h.precipitation_probability[i])||0 });
    }
    if(!out.length) return '';
    return '<div class="rg">'+out.map(function(x){
      var col = x.v>=60 ? 'var(--rakuten)' : x.v>=30 ? 'var(--warn)' : 'var(--e6)';
      return '<div class="rgc"><div class="rgb" style="height:'+Math.max(3, Math.round(x.v*0.4))+'px;background:'+col+'"></div><div class="rgl">'+x.h+'</div></div>';
    }).join('')+'</div><div class="s2">時間ごとの降水確率（%）</div>';
  }catch(e){ return ''; }
}
/* 明日の雨予報（1本早い便を勧める） */
function tomorrowRain(){
  if(weather.state !== 'ok') return null;
  try{
    var w = weather.sanda, d = w.daily;
    if(!d.time || d.time.length < 2) return null;
    var pop = Number(d.precipitation_probability_max[1]) || 0;
    return { pop:pop, need: pop >= 50 };
  }catch(e){ return null; }
}
function wxCell(label, w, cur){
  var d = w.daily;
  var mx = Math.round(d.temperature_2m_max[0]), mn = Math.round(d.temperature_2m_min[0]);
  return '<div class="wxcell"><div class="k">'+esc(label)+'</div>'+
    '<div class="now">'+(cur!=null?cur+'℃':'—')+'</div>'+
    '<div class="k">'+esc(weatherWord(d.weather_code[0]))+'　最高'+mx+'／最低'+mn+'</div></div>';
}

function nextSchoolDay(){

    var d = shiftDate(today(), i);

  }

}
function transitCard(){

  if(!cls.length){
    var nx = nextSchoolDay();
    if(!nx) return '';

    header = '';
  }

function transitBody(ymd){
  var cls = schoolClassesForDate(ymd);
  if(!cls.length) return '';
  var first = cls[0], last = cls[cls.length-1];
  var startMin = minutesOf(S.commute.periods[first.period-1]);
  var endMin   = minutesOf(S.commute.ends[last.period-1]);
  if(startMin == null || endMin == null) return '';

  var shift = S.shifts.filter(function(w){ return w.date === ymd && minutesOf(w.start) != null; })[0];
  var isToday = (ymd === today());
  var nowMin = (new Date()).getHours()*60 + (new Date()).getMinutes();
  /* 今日なら時間で出し分け。授業開始までは「行き」、始まったら「帰り」 */
  var mode = 'go';
  if(isToday && nowMin >= startMin) mode = 'back';

  var line = function(p, kind){
    var busTxt = p.bus ? (p.bus.dep+' 発 → '+p.bus.arr+' 着') : 'この時間のバスは未登録';
    var head = kind==='go'
      ? '<span class="trtag'+(p.ok?'':' ng')+'">'+esc(p.tag)+'</span>'
      : '<span class="trtag'+(p.tag==='ちょうど'?' on':'')+'">'+esc(p.tag)+'</span>';
    var rows = kind==='go'
      ? '<div class="trline"><span class="trk">バス</span><span>弥生ヶ丘五丁目 '+busTxt+'</span></div>'+
        '<div class="trline"><span class="trk">電車</span><span>三ノ宮 '+p.train.dep+' 発 → 鳴尾 '+p.train.arr+' 着</span></div>'
      : '<div class="trline"><span class="trk">電車</span><span>鳴尾 '+p.train.dep+' 発 → 三ノ宮 '+p.train.arr+' 着</span></div>'+
        '<div class="trline"><span class="trk">バス</span><span>三ノ宮 '+busTxt+'</span></div>';
    var favKey = kind+':'+(p.bus?p.bus.dep:'')+':'+p.train.dep;
    var isFav = (S.transit.fav||[]).indexOf(favKey) >= 0;
    return '<div class="trplan'+(kind==='go'&&!p.ok?' ng':'')+'">'+head+
      '<button class="mini" style="float:right" data-act="tr-fav" data-key="'+favKey+'">'+(isFav?'★':'☆')+'</button>'+rows+
      (kind==='go'&&!p.ok?'<div class="trwarn">'+first.period+'限に間に合いません</div>':'')+'</div>';
  };

  var h = '';
  var rainTomorrow = tomorrowRain();
  var isTomorrow = (ymd === shiftDate(today(),1));
  if(isTomorrow && rainTomorrow && rainTomorrow.need){
    h += '<div class="bn amber"><span class="ic">☔</span><span>明日は雨の予報（'+rainTomorrow.pop+'%）。バスが遅れがちなので、15分早めに着く便で出しています。</span></div>';
  }
  var offs = classesForDate(ymd).filter(function(c){ return c.off; });

  if(mode === 'go'){
    var gos = goPlans(startMin - 30 - (isTomorrow && rainTomorrow && rainTomorrow.need ? 15 : 0), startMin);
    h += section(isToday ? '大学への行き方' : '次に大学へ行く日の行き方', ymdLabel(ymd),
      '<div class="stat" style="margin-bottom:12px">'+
        '<div class="k">最初は'+first.period+'限 '+S.commute.periods[first.period-1]+'開始（'+esc(first.room||'')+'）</div>'+
        '<div class="v">'+hhmmOf(startMin-30)+' までに鳴尾・武庫川女子大前へ</div></div>'+
      (gos.length ? gos.map(function(p){ return line(p,'go'); }).join('') : '<div class="empty">この時間のダイヤは未登録です。</div>')+
      (offs.length ? '<p class="note">'+offs.map(function(c){ return c.name+'（'+(c.off==='cancel'?'休講':'隔週で今週なし')+'）'; }).join('、')+' を除いて計算しています。</p>' : ''));
    return h;
  }

  /* 帰り：バイトがある日はバイト先まで、なければ家まで */
  if(shift){
    var need = minutesOf(shift.start) - (toNum(S.transit.workBuffer)||10);
    var wps = workPlans(endMin + 20, need);
    h += section('バイトへの行き方', esc(shift.title||S.settings.shop||'バイト')+' '+shift.start+'〜',
      '<div class="stat" style="margin-bottom:12px">'+
        '<div class="k">'+last.period+'限 '+S.commute.ends[last.period-1]+'終わり</div>'+
        '<div class="v">'+shift.start+' までにイオンモール神戸北へ</div></div>'+
      (wps.length ? wps.map(function(p){
        return '<div class="trplan'+(p.ok?'':' ng')+'"><span class="trtag'+(p.ok?' on':' ng')+'">'+esc(p.tag)+'</span>'+
          '<div class="trline"><span class="trk">電車</span><span>鳴尾・武庫川女子大前 '+p.train.dep+' 発 → 神戸三宮 '+p.train.arr+' 着</span></div>'+
          '<div class="trline"><span class="trk">バス</span><span>三ノ宮 '+p.bus.dep+' 発 → イオンモール神戸北 '+p.bus.arr+' 着</span></div>'+
          (p.ok?'':'<div class="trwarn">開始に間に合いません</div>')+'</div>';
      }).join('') : '<div class="empty">この時間のダイヤは未登録です。</div>')+
      '<p class="note">開始の'+(toNum(S.transit.workBuffer)||10)+'分前までに着く便を選んでいます。</p>');
    return h;
  }

  var backs = backPlans(endMin + 20);
  h += section('帰り方', ymdLabel(ymd),
    '<div class="stat" style="margin-bottom:12px">'+
      '<div class="k">'+last.period+'限 '+S.commute.ends[last.period-1]+'終わり</div>'+
      '<div class="v">'+hhmmOf(endMin+20)+' に鳴尾を出る</div></div>'+
    (backs.length ? backs.map(function(p){ return line(p,'back'); }).join('') : '<div class="empty">この時間のダイヤは未登録です。</div>'));
  return h;
}

/* ============================== バナー ============================== */
function banners(){
  var out = [], d = derive(), cur = thisYm(), td = today();

  /* 天気・バス遅延 */
  if(weather.alert) out.push({c:'amber', ic:'⚠', t:weather.alert});

  /* 支払い前日・当日 */
  [['smbc',S.settings.smbcDay],['rakuten',S.settings.rakutenDay]].forEach(function(p){
    var g = d.byMonth[cur] ? d.byMonth[cur][p[0]] : null;
    if(!g) return;
    var amt = g.plan + g.stmt; if(amt <= 0) return;
    var n = daysUntil(p[1]);
    if(n === 0) out.push({c:'red', ic:'●', t:'<b>今日は'+ACCOUNTS[p[0]].bank+'の引き落とし日</b>です。'+yen(amt)+' を用意してください。'});
    else if(n === 1) out.push({c:'red', ic:'●', t:'<b>明日は'+ACCOUNTS[p[0]].bank+'の引き落とし日</b>です。'+yen(amt)+' の入金を今日のうちに。'});
    else if(n <= 3) out.push({c:'amber', ic:'●', t:ACCOUNTS[p[0]].bank+'の引き落としまであと'+n+'日（'+yen(amt)+'）。'});
  });

  /* 課題の締切 */
  var near = S.tasks.filter(function(t){ return !t.done && isYmd(t.due); })
    .map(function(t){ return Object.assign({}, t, {left: daysFromToday(t.due)}); })
    .filter(function(t){ return t.left !== null && t.left <= 3; })
    .sort(function(a,b){ return a.left - b.left; });
  near.forEach(function(t){
    var w = t.left < 0 ? '<b>期限を過ぎています</b>' : t.left === 0 ? '<b>今日が締切</b>' : t.left === 1 ? '<b>明日が締切</b>' : 'あと'+t.left+'日';
    out.push({c: t.left <= 1 ? 'red' : 'amber', ic:'✎', t:'課題「'+esc(t.title)+'」'+(t.subject?'（'+esc(t.subject)+'）':'')+'は'+w+'です。'});
  });

  /* テスト */
  S.exams.filter(function(x){ return isYmd(x.date); }).forEach(function(x){
    var n = daysFromToday(x.date);
    if(n === null || n < 0 || n > 7) return;
    out.push({c: n <= 1 ? 'red' : 'blue', ic:'📖', t:(x.subject?esc(x.subject):'テスト')+'のテストは'+(n===0?'<b>今日</b>':n===1?'<b>明日</b>':'あと'+n+'日')+'です。'+(x.room?'（'+esc(x.room)+'）':'')});
  });

  /* 履修登録の締切 */
  if(isYmd(S.settings.regDeadline)){
    var r = daysFromToday(S.settings.regDeadline);
    if(r !== null && r >= 0 && r <= 7)
      out.push({c: r <= 2 ? 'red' : 'amber', ic:'🗓', t:'<b>履修登録の締切まであと'+r+'日</b>です（'+ymdLabel(S.settings.regDeadline)+'）。'});
  }

  /* 出席の残り */
  Object.keys(S.attend).forEach(function(k){
    var a = S.attend[k]; if(!a) return;
    var lim = toNum(a.limit)||5, ab = toNum(a.ab);
    if(ab >= lim) out.push({c:'red', ic:'△', t:'<b>'+esc(k)+'</b> の欠席が'+ab+'回で上限（'+lim+'回）に達しています。'});
    else if(lim - ab <= 1) out.push({c:'amber', ic:'△', t:esc(k)+' の欠席はあと'+(lim-ab)+'回で上限です。'});
  });

  /* 健康の期限 */
  S.health.filter(function(h){ return isYmd(h.next); }).forEach(function(h){
    var n = daysFromToday(h.next);
    if(n === null || n > 30) return;
    out.push({c: n < 0 ? 'red' : n <= 7 ? 'amber' : 'green', ic:'＋',
      t: esc(h.name)+'の期限は'+ymdLabel(h.next)+(n<0?'（<b>過ぎています</b>）':'（あと'+n+'日）')+'です。'});
  });

  /* 引き落とし前日：口座に足りるか */
  [['smbc',S.settings.smbcDay],['rakuten',S.settings.rakutenDay]].forEach(function(p){
    var n = daysUntil(p[1]); if(n !== 1) return;
    var g = d.byMonth[cur] ? d.byMonth[cur][p[0]] : null; if(!g) return;
    var amt = g.plan + g.stmt; if(amt <= 0) return;
    var bank = S.balances.filter(function(x){ return norm(x.name).indexOf(norm(ACCOUNTS[p[0]].bank.slice(0,2)))>=0; })[0];
    if(bank && toNum(bank.amount) < amt)
      out.push({c:'red', ic:'¥', t:'<b>'+esc(bank.name)+'の残高が'+yen(amt-toNum(bank.amount))+'足りません。</b>明日の引き落としまでに入金してください。'});
  });
  /* お金の状態 */
  var b = budget();
  if(b.level === 'bad') out.push({c:'red', ic:'¥', t:'<b>今月は'+yen(-b.free)+'足りません。</b>収入と支払いの登録を見直してください。'});
  else if(b.level === 'warn') out.push({c:'amber', ic:'¥', t:'口座と収入を合わせても、今月自由に使えるのは'+yen(b.free)+'。かなりギリギリです。'});

  return out;
}

/* これから10日間 */
function next10Card(){
  var td = today(), limit = shiftDate(td, 10);

/* ============================== お金：グラフ ============================== */
function viewChart(d){
  var cur=thisYm(), future=d.months.filter(function(m){ return m>=cur; });
  var use = chartRange===0?d.months:future.slice(0,chartRange);
  var data = use.map(function(m){ var g=d.byMonth[m]; return { m:m, a:g.smbc.plan+g.smbc.stmt, b:g.rakuten.plan+g.rakuten.stmt }; });
  var max = Math.max(1, Math.max.apply(null, data.map(function(x){ return x.a+x.b; })));
  var W=340, H=190, bottom=H-24, top=8, gap=3;
  var bw = Math.max(4, (W-8)/data.length - gap);
  var unit = Math.ceil(max/10000)*10000 || 1;
  var scale = function(v){ return (bottom-top) * v / unit; };
  var bars = data.map(function(x,i){
    var px = 4 + i*((W-8)/data.length);
    var ha = scale(x.a), hb = scale(x.b);
    var showLabel = data.length<=8 || i%2===0;
    return '<rect x="'+px.toFixed(1)+'" y="'+(bottom-ha).toFixed(1)+'" width="'+bw.toFixed(1)+'" height="'+ha.toFixed(1)+'" fill="var(--smbc)"/>'+
      '<rect x="'+px.toFixed(1)+'" y="'+(bottom-ha-hb).toFixed(1)+'" width="'+bw.toFixed(1)+'" height="'+hb.toFixed(1)+'" fill="var(--rakuten)"/>'+
      (showLabel?'<text x="'+(px+bw/2).toFixed(1)+'" y="'+(H-8)+'" font-size="9" fill="var(--sub)" text-anchor="middle">'+ymShort(x.m)+'</text>':'');
  }).join('');
  var manLabel = function(v){
    var man = v/10000;
    if(man === 0) return '0';
    return (man < 1 || man % 1 !== 0) ? man.toFixed(1) : String(man);
  };
  var grid = [0,.5,1].map(function(f){ var y=bottom-(bottom-top)*f;
    return '<line x1="0" y1="'+y+'" x2="'+W+'" y2="'+y+'" stroke="var(--rule)"/>'+
      '<text x="0" y="'+(y-3)+'" font-size="9" fill="var(--sub)">'+manLabel(unit*f)+'万</text>'; }).join('');

  return section('口座別の必要額', data.length+'ヶ月',
    '<div class="chips">'+[[6,'6ヶ月'],[12,'12ヶ月'],[0,'全期間']].map(function(v){
      return '<button data-act="range" data-v="'+v[0]+'" class="'+(chartRange===v[0]?'on':'')+'">'+v[1]+'</button>'; }).join('')+'</div>'+
    '<svg viewBox="0 0 '+W+' '+H+'" style="width:100%;height:auto">'+grid+bars+'</svg>'+
    '<div class="s" style="margin-top:6px"><span class="dot" style="background:var(--smbc)"></span>三井住友　<span class="dot" style="background:var(--rakuten)"></span>楽天</div>')
  + section('口座ごとの残り総額', null, ['smbc','rakuten'].map(function(acc){
      var sum = future.reduce(function(s,m){ return s+d.byMonth[m][acc].plan+d.byMonth[m][acc].stmt; },0);
      return accRow(acc, sum, '今月以降の合計');
    }).join(''));
}

      messages:[{ role:'user', content:[
        { type:'image', source:{ type:'base64', media_type:'image/jpeg', data:dataUrl.split(',')[1] } },
        { type:'text', text:'これはクレジットカードの利用明細の写真です。次のJSONだけを返してください。前置きやコードフェンスは不要です。\n{"issuer":"三井住友カード|楽天カード|不明","billing_month":"YYYY-MM または null","total_amount":請求合計の数値,"items":[{"name":"店名など","amount":数値}]}\ntotal_amount はその月の請求合計。読み取れない値は null に。' }
      ]}]
    })
  });
  if(!res.ok) throw new Error('API ' + res.status);
  var data = await res.json();
  var text = (data.content||[]).map(function(c){ return c.type==='text'?c.text:''; }).join('\n').replace(/```json|```/g,'').trim();
  return JSON.parse(text.slice(text.indexOf('{'), text.lastIndexOf('}')+1));
}

/* ============================== 履修：索引 ============================== */
var byCode = {};
COURSES.forEach(function(c){
  byCode[c.code] = c;
  c.key = norm(c.name + ' ' + c.teacher + ' ' + c.code);
});
var fixedMap = {};
FIXED.forEach(function(f){ f.slots.forEach(function(s){ fixedMap[s.d + s.p] = f; }); });
var slotHas = {};
COURSES.forEach(function(c){ c.slots.forEach(function(s){ var k=s.d+s.p; slotHas[k]=(slotHas[k]||0)+1; }); });

function rSelected(){ return S.risyu.selected.map(function(code){ return byCode[code]; }).filter(Boolean); }
function rIsSelected(code){ return S.risyu.selected.indexOf(code) >= 0; }
function selectedSlotMap(exceptCode){
  var m = {};
  rSelected().forEach(function(c){
    if(c.code === exceptCode) return;
    c.slots.forEach(function(s){ m[s.d + s.p] = c; });
  });
  return m;
}
function hardBlockers(c){
  var out = [];
  c.slots.forEach(function(s){
    var k = s.d + s.p;
    if(fixedMap[k] && !rIncludeOcc) out.push(k + '「' + fixedMap[k].name + '」と重複');
  });
  return out;
}
function swapTargets(c){
  var m = selectedSlotMap(c.code), out = [];
  c.slots.forEach(function(s){
    var o = m[s.d + s.p];
    if(o && out.indexOf(o) < 0) out.push(o);
  });
  return out;
}
function conflicts(c){
  return hardBlockers(c).concat(swapTargets(c).map(function(o){ return '「' + o.name + '」と重複'; }));
}
function ratioClass(r){ return r < 0.5 ? 'r0' : r < 1 ? 'r1' : r < 2 ? 'r2' : 'r3'; }
function ratioText(r){
  var t = r < 0.5 ? '◎ 余裕' : r < 1 ? '○ 定員内' : r < 2 ? '△ 半々' : '▲ 激戦';
  return t + ' ' + r.toFixed(2) + '倍';
}

}

/* ============================== 履修：選択シート ============================== */
function openPicker(k){
  var m = k.match(/^([月火水木金土])([1-7])$/);
  if(!m) return;
  pick.d = m[1]; pick.p = parseInt(m[2],10); pick.cat = 'all'; pick.q = '';
  document.getElementById('shSearch').value = '';
  document.getElementById('veil').classList.add('on');
  document.getElementById('sheet').classList.add('on');
  renderPicker();
}
function closePicker(){
  document.getElementById('veil').classList.remove('on');
  document.getElementById('sheet').classList.remove('on');
}
function sheetOpen(){ return document.getElementById('sheet').classList.contains('on'); }
function renderPicker(){
  document.getElementById('shTitle').textContent = pick.d + '曜 ' + pick.p + '限';
  document.getElementById('shDays').innerHTML = DAYS.map(function(d){
    return '<button type="button" class="'+(d===pick.d?'on':'')+'" data-day="'+d+'">'+d+'</button>'; }).join('');
  document.getElementById('shPeriods').innerHTML = PERIODS.map(function(p){
    return '<button type="button" class="'+(p===pick.p?'on':'')+'" data-period="'+p+'">'+p+'限</button>'; }).join('');

  var all = COURSES.filter(function(c){
    return c.slots.some(function(s){ return s.d===pick.d && s.p===pick.p; });
  });
  var cats = [];
  all.forEach(function(c){ if(cats.indexOf(c.cat)<0) cats.push(c.cat); });
  var ch = '<button type="button" class="'+(pick.cat==='all'?'on':'')+'" data-cat="all">すべて '+all.length+'</button>';
  cats.forEach(function(ct){
    var n = all.filter(function(c){ return c.cat===ct; }).length;
    ch += '<button type="button" class="'+(pick.cat===ct?'on':'')+'" data-cat="'+ct+'">'+esc(CAT_INFO[ct].label)+' '+n+'</button>';
  });
  document.getElementById('shCats').innerHTML = ch;

  var q = norm(pick.q.trim());
  var list = all.filter(function(c){
    if(pick.cat !== 'all' && c.cat !== pick.cat) return false;
    if(!q) return true;
    return c.key.indexOf(q) >= 0;
  });
  list.sort(function(a,b){
    var ba = hardBlockers(a).length?1:0, bb = hardBlockers(b).length?1:0;
    if(rIsSelected(a.code)) ba = -1;
    if(rIsSelected(b.code)) bb = -1;
    return (ba-bb) || (a.ratio-b.ratio);
  });

  var body = '';
  var cur = selectedSlotMap(null)[pick.d + pick.p];
  if(cur) body += '<div class="msg ok">この枠には「'+esc(cur.name)+'」が入っています。別の講座の「差し替え」を押すと入れ替わります。</div>';
  var fk = fixedMap[pick.d + pick.p];
  if(fk) body += '<div class="msg ng">この枠は「'+esc(fk.name)+'」で埋まっています。'+

function rToggle(code){

  if(i >= 0){
    S.risyu.selected.splice(i,1);

    swapTargets(c).forEach(function(o){
      var j = S.risyu.selected.indexOf(o.code);
      if(j >= 0) S.risyu.selected.splice(j,1);
    });

  }
  if(act==='add-task'){
    var ti = val('tk_title').trim();

    S.tasks.push({ id:uid('tk'), title:ti, subject:val('tk_subject'), due:readMd('tk_due'), time:val('tk_time'), done:0, memo:'', color:kindOf('task').color, mt:Date.now() });
    toast('追加しました'); commit(); return true;
  }
  if(act==='task-done' || act==='task-undone'){
    var tk = S.tasks.filter(function(x){ return x.id===t.dataset.id; })[0];
    if(tk){ tk.done = act==='task-done'?1:0; tk.mt=Date.now(); if(tk.done) toast('おつかれさま！'); commit(); }
    return true;

  if(act==='del-task'){ removeItem('tasks', t.dataset.id); toast('削除しました'); commit(); return true; }
  if(act==='add-exam'){

    if(!isYmd(dt)){ toast('日付を選んでください', true); return true; }
    S.exams.push({ id:uid('ex'), subject:sb, date:dt, time:val('ex_time'), room:val('ex_room'), memo:'', quiz:0, color:'c8', mt:Date.now() });

  if(act==='del-exam'){ removeItem('exams', t.dataset.id); toast('削除しました'); commit(); return true; }
  if(act==='ab-plus' || act==='ab-minus' || act==='late-plus'){
    var key = t.dataset.key;
    var a = S.attend[key] || { ab:0, late:0, limit:5 };
    if(act==='ab-plus') a.ab = toNum(a.ab)+1;

  if(act==='set-limit'){
    var lim = toNum(val('at_limit'));

  }
  if(act==='year-edit'){
    var slot = t.dataset.slot;
    var cur = S.terms.first[slot] || '';
    var v = prompt(slot + ' の科目名（空にすると削除）', cur);

    touch('terms'); commit(); return true;
  }

/* ============================== 予定の正規化 ============================== */
function shiftHours(s){
  return Math.round((shiftMinutes(s) - shiftBreak(s) + (toNum(s.ot)||0)) / 6) / 10;
}
function shiftMinutes(s){
  var a = minutesOf(s.start), b = minutesOf(s.end);
  if(a == null || b == null) return 0;
  var m = b - a; if(m < 0) m += 1440;
  return m;
}
function shiftBreak(s){ return (shiftMinutes(s) >= 420) ? 60 : 0; }   /* 7時間以上は休憩1時間を引く */
function shiftPay(s){
  var mins = shiftMinutes(s) - shiftBreak(s) + (toNum(s.ot) || 0);
  var rate = (Number(s.rate) > 0) ? Number(s.rate) : minRate(s.date);
  var fare = mins > 0 ? (toNum(S.settings.fare) || 0) : 0;
  return Math.round(mins * rate) + fare;
}
function normItems(){
  var out = [];
  S.tasks.forEach(function(t){
    out.push({ src:'task', id:t.id, date:t.due, title:t.title, sub:t.subject||'',
      time:t.time||'', colorRaw:taskColor(t), done:t.done, rid:t.rid, edit:1, photos:t.photos||[] });
  });
  S.exams.forEach(function(x){
    var k = (x.kind==='quiz'||x.kind==='kousa'||x.kind==='exam') ? x.kind : 'exam';
    out.push({ src:k, id:x.id, date:x.date, title:(x.subject||kindOf(k).name),
      sub:kindOf(k).name+(x.room?'・'+x.room:''), time:x.time||'',
      colorRaw:kindHex(k), rid:x.rid, edit:1, photos:x.photos||[] });
  });
  S.shifts.forEach(function(s){
    var h = shiftHours(s), ot = toNum(s.ot);
    out.push({ src:'work', id:s.id, date:s.date, title:s.title || S.settings.shop || 'バイト',
      sub:(h?h+'時間'+(ot?'（残業'+ot+'分込み）':'')+(shiftPay(s)?'・'+yen(shiftPay(s)):''):'')+(s.memo?'　'+s.memo:''),
      time:s.start||'', colorRaw:kindHex('work'), rid:s.rid, edit:1, photos:s.photos||[] });
  });
  S.events.forEach(function(e){
    var end = (isYmd(e.dateEnd) && e.dateEnd > e.date) ? e.dateEnd : e.date;
    var k = e.kind==='imp' ? 'imp' : 'other';
    out.push({ src:k, id:e.id, date:e.date, end:end, span:(end>e.date)?1:0,
      title:e.title, sub:(e.subject?e.subject+(e.memo?'・':''):'')+(e.memo||''), time:e.time||'',
      colorRaw:kindHex(k), rid:e.rid, edit:1, photos:e.photos||[] });
  });
  S.health.forEach(function(h){
    if(!isYmd(h.next)) return;
    out.push({ src:'health', id:h.id, date:h.next, title:h.name+'（期限）', sub:h.memo||'', time:'', colorRaw:colorOf('c5') });
  });
  return out;
}
function payItemsOn(ymd){
  var out = [], d = derive(), ym = ymd.slice(0,7), day = Number(ymd.slice(8,10));
  [['smbc',S.settings.smbcDay],['rakuten',S.settings.rakutenDay]].forEach(function(p){
    if(day !== Number(p[1])) return;
    var g = d.byMonth[ym] ? d.byMonth[ym][p[0]] : null;
    if(!g) return;
    var amt = g.plan + g.stmt;
    if(amt > 0) out.push({ src:'pay', id:p[0]+ym, date:ymd, title:ACCOUNTS[p[0]].bank+' 引き落とし',
      sub:yen(amt), time:'', colorRaw:DEEPGREEN });
  });
  return out;
}
function classItemsOn(ymd){
  if(!isYmd(ymd)) return [];
  var a = ymd.split('-'), dch = WDAY[new Date(+a[0], +a[1]-1, +a[2]).getDay()];
  return classesOn(dch).map(function(c){
    return { src:'cls', id:'cls'+ymd+c.period, date:ymd, title:c.name,
      sub:c.period+'限', time:S.commute.periods[c.period-1]||'', colorRaw:'var(--risyu)' };
  });
}
function matchQ(x){ return true; }
function coversDay(x, ymd){
  var e = x.end || x.date;
  return x.date <= ymd && ymd <= e;
}
function itemsOn(ymd){
  var out = normItems().filter(function(x){ return coversDay(x, ymd) && calFilter[x.src] && matchQ(x); });
  if(calFilter.pay) out = out.concat(payItemsOn(ymd).filter(matchQ));
  if(calFilter.cls) out = out.concat(classItemsOn(ymd).filter(matchQ));
  return out.sort(function(a,b){
    /* 期間の予定を先に並べると、帯が横につながって見える */
    if((b.span?1:0) !== (a.span?1:0)) return (b.span?1:0) - (a.span?1:0);
    if(a.span && b.span) return String(a.date).localeCompare(String(b.date)) || String(a.id).localeCompare(String(b.id));
    var ta = a.time || '99:99', tb = b.time || '99:99';
    return ta.localeCompare(tb);
  });
}
function itemColor(x){ return x.colorRaw || kindHex(x.src); }
function itemFg(x){ var k=kindOf(x.src); return (x.src==='task'||x.src==='pay'||x.src==='cls'||x.src==='health') ? '#fff' : k.fg; }

  d.title = title;

  if(calEdit){
    updateOne(calEdit.src, calEdit.id, d);
    toast('更新しました');
    calEdit = null; evDraft = newDraft(d.date);
  }else{
    var rep = Math.max(0, toNum(d.rep));
    var rid = rep > 1 ? uid('rp') : '';
    var n = rep > 1 ? rep : 1;
    for(var i=0;i<n;i++){
      createOne(d.kind, Object.assign({}, d, { date:shiftDate(d.date, i*7) }), rid);
    }
    toast(n>1 ? n+'件を追加しました' : '追加しました');
    evDraft = newDraft(d.date);
  }
  calSel = d.date; calYm = d.date.slice(0,7);
  if(appId==='cal' && calTab==='add'){ calTab='cal'; window.scrollTo(0,0); }
  commit();
}

function monthGrid(){
  var a = calYm.split('-'), y = +a[0], mo = +a[1];
  var first = new Date(y, mo-1, 1);
  var startDow = first.getDay();
  var td = today();

  /* 前後の月の日も薄く出して、マスを埋める */
  var cells = [];
  for(var i=startDow-1;i>=0;i--){
    var d0 = new Date(y, mo-1, -i);
    cells.push({ ymd:toYmd(d0), out:1 });
  }
  var lastDay = new Date(y, mo, 0).getDate();
  for(var dn=1;dn<=lastDay;dn++) cells.push({ ymd:y+'-'+pad(mo)+'-'+pad(dn), out:0 });
  var extra = 1;
  while(cells.length % 7 !== 0 || cells.length < 35){
    cells.push({ ymd:toYmd(new Date(y, mo, extra++)), out:1 });
  }

  var h = '<table class="cal" id="calgrid"><thead><tr>'+
    WDAY.map(function(w,i){ return '<th class="'+(i===0?'sun':i===6?'sat':'')+'">'+w+'</th>'; }).join('')+
    '</tr></thead><tbody>';

  for(var r=0;r<cells.length/7;r++){
    h += '<tr>';
    for(var c=0;c<7;c++){
      var cell = cells[r*7+c], ymd = cell.ymd;
      var its = itemsOn(ymd);
      var hol = holidayName(ymd);
      var dow = new Date(+ymd.slice(0,4), +ymd.slice(5,7)-1, +ymd.slice(8,10)).getDay();
      var cls = [];
      if(cell.out) cls.push('out');
      if(ymd === td) cls.push('today');
      if(ymd === calSel) cls.push('sel');
      if(hol) cls.push('holi');
      else if(dow === 0) cls.push('sunday');
      else if(dow === 6) cls.push('saturday');

      h += '<td class="'+cls.join(' ')+'"><div class="day" role="button" tabindex="0" data-act="cal-day" data-d="'+ymd+'">'+
        '<span class="dhead"><span class="dn">'+Number(ymd.slice(8,10))+'</span>'+
        (hol ? '<span class="holname">'+esc(hol)+'</span>' : '')+'</span>';

      if(its.length){
        h += '<span class="evs">';
        its.forEach(function(x){
          var col = itemColor(x), fg = itemFg(x);
          if(x.span){
            var isStart = x.date === ymd, isEnd = (x.end||x.date) === ymd;
            var label = (isStart || dow === 0) ? esc(x.title) : '&nbsp;';
            h += '<span class="ev band'+(isStart?' s':'')+(isEnd?' e':'')+'" style="--c:'+col+';color:'+fg+'" data-act="ev-open" data-src="'+x.src+'" data-id="'+x.id+'">'+label+'</span>';
          }else{
            h += '<span class="ev chip'+(x.done?' done':'')+'" style="background:'+col+';color:'+fg+'" data-act="ev-open" data-src="'+x.src+'" data-id="'+x.id+'">'+esc(x.title)+'</span>';
          }
        });
        h += '</span>';
      }
      h += '</div></td>';
    }
    h += '</tr>';
  }
  return h + '</tbody></table>';
}
function weekList(){
  var a = calSel.split('-');
  var base = new Date(+a[0], +a[1]-1, +a[2]);
  var start = new Date(base); start.setDate(base.getDate() - base.getDay());
  var h = '';

}
/* 同じ日で時間が重なっていないか調べる */
function clashOn(ymd){
  var list = itemsOn(ymd).filter(function(x){ return minutesOf(x.time) != null; });
  var out = [];
  for(var i=0;i<list.length;i++){
    for(var j=i+1;j<list.length;j++){
      var a=list[i], b=list[j];
      var as=minutesOf(a.time), ae=as+60, bs=minutesOf(b.time), be=bs+60;
      if(a.src==='work'){ var w=S.shifts.filter(function(z){return z.id===a.id;})[0]; if(w) ae=as+shiftHours(w)*60; }
      if(b.src==='work'){ var w2=S.shifts.filter(function(z){return z.id===b.id;})[0]; if(w2) be=bs+shiftHours(w2)*60; }
      if(as < be && bs < ae) out.push(a.title+' と '+b.title);
    }
  }
  return out;
}

  return h;

function calAction(act, t){
  if(act==='cal-prev'){ readEvForm(); calYm = addMonths(calYm, -1); render(); return true; }
  if(act==='cal-next'){ readEvForm(); calYm = addMonths(calYm, 1); render(); return true; }
  if(act==='cal-today'){
    readEvForm(); calYm = thisYm(); calSel = today();
    if(evDraft && !calEdit) evDraft.date = calSel;
    render(); return true;
  }
  if(act==='cal-day'){
    readEvForm();
    calSel = t.dataset.d; calYm = calSel.slice(0,7);
    if(evDraft && !calEdit) evDraft.date = calSel;
    render(); return true;
  }
  if(act==='cal-view'){ readEvForm(); calView = t.dataset.v; render(); return true; }
  if(act==='cal-filter'){
    readEvForm();
    var f = t.dataset.f; calFilter[f] = calFilter[f] ? 0 : 1; render(); return true;
  }
  if(act==='ev-kind'){
    readEvForm();
    evDraft.kind = t.dataset.k;
    var fm = document.getElementById('evform');
    if(fm){ var y=window.scrollY; fm.innerHTML = evFormBody(); window.scrollTo(0,y); }
    else render();
    return true;
  }

  if(act==='ev-move'){
    var f3 = findOne(t.dataset.src, t.dataset.id);
    if(!f3) return true;
    var o3 = f3.obj, n3 = toNum(t.dataset.n);
    var key = (t.dataset.src==='task') ? 'due' : 'date';
    if(!isYmd(o3[key])) { toast('日付が入っていません', true); return true; }
    o3[key] = shiftDate(o3[key], n3);
    if(o3.dateEnd && isYmd(o3.dateEnd)) o3.dateEnd = shiftDate(o3.dateEnd, n3);
    o3.mt = Date.now();
    calSel = o3[key]; calYm = calSel.slice(0,7);   /* 動かした先を表示する */
    toast(ymdLabel(o3[key])+'にずらしました'); commit(); return true;
  }
  if(act==='ev-photo'){ readEvForm(); memoTarget = 'draft'; var inp=document.getElementById('memoimg'); if(inp) inp.click(); return true; }
  if(act==='ev-photo-del'){
    readEvForm();
    evDraft.photos = (evDraft.photos||[]).filter(function(x){ return x!==t.dataset.pid; });
    var fm2 = document.getElementById('evform');
    if(fm2){ var y2=window.scrollY; fm2.innerHTML = evFormBody(); window.scrollTo(0,y2); } else render();
    return true;
  }
  if(act==='ev-open'){ openDetail(t.dataset.src, t.dataset.id); return true; }
  if(act==='ev-close'){ closeDetail(); return true; }
  if(act==='ev-edit-from-detail'){
    closeDetail(); readEvForm(); loadForEdit(t.dataset.src, t.dataset.id);
    appId='cal'; calTab='add'; render(); window.scrollTo(0,0); return true;
  }
  if(act==='ev-del-from-detail'){
    closeDetail();
    removeWithUndo(listNameOf(t.dataset.src), t.dataset.id, '削除しました'); commit(); return true;
  }
  if(act==='cal-addopen'){
    calEdit = null; evDraft = newDraft(t.dataset.d || calSel);
    appId='cal'; calTab='add'; render(); window.scrollTo(0,0); return true;
  }
  if(act==='ev-save'){ saveEvent(); return true; }
  if(act==='ev-cancel'){ calEdit = null; evDraft = newDraft(calSel); if(calTab==='add') calTab='cal'; render(); window.scrollTo(0,0); return true; }
  if(act==='ev-edit'){
    readEvForm();
    loadForEdit(t.dataset.src, t.dataset.id);
    appId='cal'; calTab='add';
    render(); window.scrollTo(0,0);
    return true;
  }
  if(act==='ev-del'){
    var src = t.dataset.src, id = t.dataset.id;
    var f2 = findOne(src, id);
    if(f2 && f2.obj.rid){
      var group = f2.list.filter(function(x){ return x.rid === f2.obj.rid; });
      if(group.length > 1 && confirm('この繰り返しは'+group.length+'件あります。まとめて削除しますか？\n「キャンセル」ならこの1件だけ消します。')){
        group.slice().forEach(function(x){ removeItem(listNameOf(src), x.id); });
        if(calEdit && calEdit.src===src){ calEdit=null; evDraft=newDraft(calSel); }
        toast(group.length+'件を削除しました'); commit(); return true;
      }
    }
    removeWithUndo(listNameOf(src), id, '削除しました');
    if(calEdit && calEdit.id===id){ calEdit=null; evDraft=newDraft(calSel); }
    commit(); return true;
  }
  if(act==='memo-save'){
    var k = t.dataset.k;
    var cur = memoOf(k);
    S.memos[k] = { text: val('memo_'+k), mt: Date.now(), photos: cur.photos || [] };
    touch('memos'); toast('メモを保存しました'); commit(); return true;
  }
  if(act==='memo-photo'){
    memoTarget = t.dataset.k;
    var inp = document.getElementById('memoimg');
    if(inp) inp.click();
    return true;
  }
  if(act==='memo-photo-del'){
    var k2 = t.dataset.k, id2 = t.dataset.id;
    var m2 = memoOf(k2);
    m2.photos = (m2.photos||[]).filter(function(x){ return x !== id2; });
    m2.mt = Date.now(); S.memos[k2] = m2;
    try{ localStorage.removeItem('shiharai:memoimg:'+id2); }catch(e){}
    touch('memos'); toast('写真を外しました'); commit(); return true;
  }
  if(act==='memo-photo-view'){
    var src = null;
    try{ src = localStorage.getItem('shiharai:memoimg:'+t.dataset.id); }catch(e){}
    if(!src){ toast('この端末に写真がありません'); return true; }
    var box = el('<div id="lightbox"><img src="'+src+'" alt="メモの写真"></div>');
    box.addEventListener('click', function(){ box.remove(); });
    document.body.appendChild(box);
    return true;
  }
  if(act==='add-health'){
    var n = val('hl_name').trim();
    if(!n){ toast('項目名を入れてください', true); return true; }
    S.health.push({ id:uid('hl'), name:n, date:val('hl_date'), next:val('hl_next'), memo:val('hl_memo'), mt:Date.now() });
    toast('追加しました'); commit(); return true;
  }
  if(act==='del-health'){ removeWithUndo('health', t.dataset.id, '削除しました'); commit(); return true; }
  return false;
}

function settingsAction(act, t){
  if(act==='set-theme'){ S.ui.theme = t.dataset.v; touch('ui'); applyUi(); toast('テーマを変えました'); commit(); return true; }
  if(act==='set-fs'){ S.ui.fs = t.dataset.v; touch('ui'); applyUi(); toast('文字の大きさを変えました'); commit(); return true; }
  if(act==='save-commute'){
    S.commute.walk=toNum(val('cm_walk')); S.commute.bus=toNum(val('cm_bus'));
    S.commute.change=toNum(val('cm_change')); S.commute.train=toNum(val('cm_train'));
    S.commute.toSchool=toNum(val('cm_school')); S.commute.buffer=toNum(val('cm_buffer'));
    for(var i=0;i<6;i++){
      var v=val('cm_p'+i); if(minutesOf(v)!=null) S.commute.periods[i]=v;
      var e=val('cm_e'+i); if(minutesOf(e)!=null) S.commute.ends[i]=e;
    }
    touch('commute'); toast('通学の設定を保存しました'); commit(); return true;
  }
  if(act==='save-days'){
    S.settings.smbcDay = Math.min(31, Math.max(1, toNum(val('sy_smbc'))||27));
    S.settings.rakutenDay = Math.min(31, Math.max(1, toNum(val('sy_rakuten'))||27));
    var rg = val('st_reg'); S.settings.regDeadline = isYmd(rg) ? rg : '';
    S.settings.minWeekday = Math.max(0, Number(val('st_min1'))||0);
    S.settings.minWeekend = Math.max(0, Number(val('st_min2'))||0);
    S.settings.fare = Math.max(0, toNum(val('st_fare')));
    S.settings.shop = val('st_shop').trim() || 'デリフランス';
    S.transit.sannomiyaTransfer = Math.max(0, toNum(val('st_tr'))); S.transit.workBuffer = Math.max(0, toNum(val('st_wb'))); touch('transit');
    toast('保存しました'); commit(); return true;
  }
  if(act==='save-sync'){
    S.settings.room = val('sy_room').trim();
    S.settings.fbConfig = val('sy_cfg').trim();
    persist();
    if(!S.settings.room || !S.settings.fbConfig){
      syncState.on=false; syncState.msg='合言葉とFirebaseの設定の両方を入れてから押してください。'; render(); return true;
    }
    syncState.on=false; syncState.msg='接続しています…'; render(); initSync(); return true;
  }
  if(act==='save-key'){ S.settings.apiKey = val('sy_key').trim(); persist(); toast('保存しました'); render(); return true; }
  if(act==='export'){
    download(new Blob([JSON.stringify(Object.assign({ app:'kurashi', version:4 }, payload()))],{type:'application/json'}),
      'kurashi_'+thisYm()+'.json');
    toast('バックアップを保存しました'); return true;
  }
  if(act==='import'){ document.getElementById('imp').click(); return true; }
  return false;
}

function settingsAction2(act, t){
  var mv = function(arr, i, d){ var j=i+d; if(j<0||j>=arr.length) return; var x=arr[i]; arr[i]=arr[j]; arr[j]=x; };
  if(act==='tab-up'){ mv(S.ui.tabs, toNum(t.dataset.i), -1); touch('ui'); commit(); return true; }
  if(act==='tab-down'){ mv(S.ui.tabs, toNum(t.dataset.i), 1); touch('ui'); commit(); return true; }
  if(act==='tab-toggle'){ var tb=S.ui.tabs[toNum(t.dataset.i)]; if(tb && tb[0]!=='set'){ tb[1]=tb[1]?0:1; touch('ui'); commit(); } return true; }
  if(act==='tsec-up'){ mv(S.ui.todayOrder, toNum(t.dataset.i), -1); touch('ui'); commit(); return true; }
  if(act==='tsec-down'){ mv(S.ui.todayOrder, toNum(t.dataset.i), 1); touch('ui'); commit(); return true; }
  if(act==='pg-up' || act==='pg-down'){
    var pg = t.dataset.p, arr = pageOrder(pg), i = toNum(t.dataset.i), j = i + (act==='pg-up'?-1:1);
    if(j>=0 && j<arr.length){ var tmp=arr[i]; arr[i]=arr[j]; arr[j]=tmp; S.ui.pageOrder[pg]=arr; touch('ui'); commit(); }
    return true;
  }
  if(act==='pg-toggle'){
    var pg2 = t.dataset.p, id2 = t.dataset.id;
    S.ui.pageHide[pg2] = S.ui.pageHide[pg2] || {};
    S.ui.pageHide[pg2][id2] = S.ui.pageHide[pg2][id2] ? 0 : 1;
    touch('ui'); commit(); return true;
  }
  if(act==='today-toggle'){ var id=t.dataset.id; S.ui.todayClosed[id] = S.ui.todayClosed[id]?0:1; touch('ui'); persist(); pushRemote(); render(); return true; }
  if(act==='tr-fav'){
    var k=t.dataset.key, f=S.transit.fav||[]; var i=f.indexOf(k);
    if(i>=0) f.splice(i,1); else f.push(k);
    S.transit.fav=f; touch('transit'); toast(i>=0?'お気に入りから外しました':'お気に入りに入れました'); commit(); return true;
  }
  if(act==='dia-add'){
    var k2=val('dia_kind'), dep=val('dia_dep'), arr=val('dia_arr');
    if(minutesOf(dep)==null||minutesOf(arr)==null){ toast('発と着の時刻を入れてください', true); return true; }
    S.transit.custom = S.transit.custom||{}; S.transit.custom[k2]=(S.transit.custom[k2]||[]).concat([[dep,arr]]);
    touch('transit'); toast('ダイヤを足しました'); commit(); return true;
  }
  if(act==='dia-del'){
    var k3=t.dataset.k, i3=toNum(t.dataset.i);
    if(S.transit.custom && S.transit.custom[k3]){ S.transit.custom[k3].splice(i3,1); touch('transit'); commit(); }
    return true;
  }
  if(act==='news-clear'){ S.notices=[]; commit(); return true; }
  return false;
}

/* GPA（学期ごと・累積） */
function gpaOf(termIds){
  var pts = { S:4, A:3, B:2, C:1, D:0 };
  var sum = 0, cr = 0, earned = 0;
  termIds.forEach(function(id){
    var t = termOf(id);
    (t.courses||[]).forEach(function(c){
      var g = S.grades[c.name];
      if(!g || !g.grade) return;
      var p = pts[String(g.grade).toUpperCase().charAt(0)];
      if(p == null) return;
      sum += p * (Number(c.cr)||0); cr += (Number(c.cr)||0);
      if(p > 0) earned += (Number(c.cr)||0);
    });
  });
  return { gpa: cr ? Math.round(sum/cr*100)/100 : null, credits: cr, earned: earned };
}

function viewTodo(){
  var open = S.tasks.filter(function(t){ return !t.done; })
    .map(function(t){ return Object.assign({}, t, {left:isYmd(t.due)?daysFromToday(t.due):null}); })
    .sort(function(a,b){ if(a.left===null) return 1; if(b.left===null) return -1; return a.left-b.left; });
  var done = S.tasks.filter(function(t){ return t.done; }).sort(function(a,b){ return (b.mt||0)-(a.mt||0); });
  var late = open.filter(function(t){ return t.left!==null && t.left<0; });
  var soon = open.filter(function(t){ return t.left===null || t.left>=0; });

  if(todoTab==='done'){
    return section('終わったもの', done.length+'件',
      done.length ? done.slice(0,50).map(taskRow).join('') : '<div class="empty">まだありません。</div>');
  }
  var parts = {
    late: function(){ return late.length ? section('期限が過ぎているもの', late.length+'件', late.map(taskRow).join('')) : ''; },
    open: function(){ return section('やること', soon.length ? soon.length+'件' : '片付いています',
        soon.length ? soon.map(taskRow).join('') : '<div class="empty">'+ART.empty+'<div style="margin-top:8px">やることはありません。</div></div>'); },
    add: function(){ return section('追加', null,
        '<div class="field"><label class="f">やること</label><input id="td_title" placeholder="例：看護過程レポート"></div>'+
        '<div class="pair" style="margin-bottom:11px">'+
          '<div><label class="f">科目（任意）</label><select id="td_subject">'+subjectOptions('')+'</select></div>'+
          '<div style="flex:0 0 150px">'+mdPicker('td_due', today(), '締切', false)+'</div></div>'+
        '<div class="field">'+timeSelect('td_time','','締切の時刻（任意）',true)+'</div>'+
        '<div class="field"><label class="f">小項目（1行に1つ・任意）</label><textarea id="td_subs" placeholder="資料を集める&#10;下書き&#10;清書"></textarea></div>'+
        '<button class="btn" data-act="td-add">追加する</button>'+
        '<p class="note">科目を選ぶと、その科目の色（必修は赤・選択は青）になります。</p>'); }
  };
  var out = '';
  pageOrder('todo').forEach(function(id){ if(parts[id] && !pageHidden('todo', id)) out += parts[id](); });
  return out;
}
