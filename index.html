function chatContext(){
  var td = today();
  var lim = shiftDate(td, 45);
  var L = [];
  L.push('【今日】' + td + '（' + WDAY[new Date().getDay()] + '）　いまは' + pad(new Date().getHours()) + '時ごろ');
  L.push('【学期】' + curTerm().label);

  /* 時間割 */
  var tt = [];
  DAYS.forEach(function(d){
    var row = [];
    termCourses().forEach(function(c){
      c.slots.forEach(function(sl){
        if(sl.d === d) row.push(sl.p + '限 ' + c.name + (c.web ? '(遠隔)' : '') + (c.bi ? '(隔週)' : ''));
      });
    });
    row.sort();
    if(row.length) tt.push(d + '：' + row.join('、'));
  });
  L.push('【時間割】\n' + tt.join('\n'));
  L.push('【授業の時間】' + PERIODS.map(function(p){
    return p + '限 ' + S.commute.periods[p-1] + '〜' + S.commute.ends[p-1];
  }).join('、'));

  /* これからの予定 */
  var items = normItems().filter(function(x){
    return isYmd(x.date) && x.date >= td && x.date <= lim;
  }).sort(function(a,b){ return a.date.localeCompare(b.date); });
  var lines = items.map(function(x){
    var k = ({task:'課題', quiz:'小テスト', exam:'大テスト', kousa:'考査', work:'バイト', imp:'重要', other:'予定'})[x.src] || x.src;
    var done = (x.src==='task' && x.done) ? '【済】' : '';
    var t = x.time ? ' ' + x.time : '';
    return '・' + x.date + t + ' [' + k + ']' + done + ' ' + x.title + (x.sub ? '（' + x.sub + '）' : '');
  });
  L.push('【これからの予定（45日ぶん）】\n' + (lines.length ? lines.join('\n') : 'なし'));

  /* 日ごとの状況（14日ぶん）：通学の有無・帰宅時刻・バイトに入れる時間を先に計算しておく */
  var days = [];
  for(var i = 0; i < 14; i++){
    var d = shiftDate(td, i);
    var a = d.split('-'), dow = WDAY[new Date(+a[0], +a[1]-1, +a[2]).getDay()];
    var cls = schoolClassesForDate(d);
    var allCls = classesForDate(d).filter(function(c){ return !c.off; });
    var web = allCls.filter(function(c){ return c.web; });
    var line = '・' + d + '（' + dow + '）';
    var dayItems = items.filter(function(x){ return x.date === d; });
    var shiftsHere = S.shifts.filter(function(w){ return w.date === d; });
    var tests = dayItems.filter(function(x){ return x.src==='quiz' || x.src==='exam' || x.src==='kousa'; });
    var dues = dayItems.filter(function(x){ return x.src==='task' && !x.done; });
    if(holidayName(d)) line += ' 祝日「' + holidayName(d) + '」';
    if(cls.length){
      var first = cls[0], last = cls[cls.length-1];
      var st = S.commute.periods[first.period-1], en = S.commute.ends[last.period-1];
      var enMin = minutesOf(en);
      var homeMin = enMin != null ? enMin + 20 + 80 : null;      /* 授業後20分＋通学80分 */
      var workFrom = enMin != null ? enMin + 20 + 75 : null;     /* 大学→イオンモール神戸北はおよそ75分 */
      line += ' 通学あり：' + first.period + '限〜' + last.period + '限（' + st + '〜' + en + '、' +
        cls.map(function(c){ return c.period + '限' + c.name; }).join('・') + '）。' +
        '帰宅はおよそ' + hhmmOf(homeMin) + '。バイトに入れるのは' + hhmmOf(workFrom) + '以降のみ。';
      if(web.length) line += ' このほか遠隔' + web.map(function(c){ return c.period + '限' + c.name; }).join('・') + '（家で受講）。';
    }else if(web.length){
      line += ' 通学なし（遠隔' + web.map(function(c){ return c.period + '限' + c.name; }).join('・') + 'のみ）。バイトは終日入れる。';
    }else{
      line += ' 通学なし。バイトは終日入れる。';
    }
    if(shiftsHere.length) line += ' すでにバイトあり：' + shiftsHere.map(function(w){ return (w.start||'') + '〜' + (w.end||''); }).join('、') + '。';
    if(tests.length) line += ' テスト：' + tests.map(function(x){ return x.title; }).join('、') + '。';
    if(dues.length) line += ' 課題の締切：' + dues.map(function(x){ return x.title + (x.time ? ' ' + x.time : ''); }).join('、') + '。';
    /* 翌日1限の有無（前夜の遅いバイトを避ける判断に） */
    var nx = shiftDate(d, 1), nxCls = schoolClassesForDate(nx);
    if(nxCls.length && nxCls[0].period === 1) line += ' 翌日は1限あり（朝が早い）。';
    days.push(line);
  }
  L.push('【日ごとの状況（今日から14日）】\n' + days.join('\n'));

  /* 休講・遠隔・補講 */
  var chg = S.holidays.filter(function(h){ return h.date >= td; }).map(function(h){
    return '・' + h.date + ' ' + (h.course==='*'?'全休':h.course) + ' ' +
      ({cancel:'休講', online:'遠隔', makeup:'補講', holclass:'祝日でも授業あり'})[changeType(h)];
  });
  if(chg.length) L.push('【授業の変更】\n' + chg.join('\n'));

  /* バイトとお金 */
  var ym = openYm(), pp = payPeriod(ym);
  var inPeriod = shiftsInPeriod(ym);
  L.push('【バイト】分給 平日' + S.settings.minWeekday + '円／土日' + S.settings.minWeekend + '円、交通費' + S.settings.fare + '円/回、' +
    '15日締め25日払い。いまの締め期間（' + pp.from + '〜' + pp.to + '）は' + inPeriod.length + '回、見込み' + periodPay(ym) + '円。');
  var y = new Date().getFullYear();
  var limF = toNum(S.settings.fuyouLimit)||1030000, totF = yearPayTotal(y);
  L.push('【扶養】' + y + '年の給与見込み合計 約' + totF + '円（上限 ' + limF + '円、残り 約' + Math.max(0, limF-totF) + '円）');
  var bal = S.balances.reduce(function(a,b){ return a + toNum(b.amount); }, 0);
  if(bal) L.push('【口座の残高】合計 約' + bal + '円');

  /* 出欠 */
  var att = termCourses().map(function(c){
    var a = attendOf(c.name);
    return (a.ab || a.late) ? ('・' + c.name + '：欠' + a.ab + '・遅' + a.late + '（あと' + Math.max(0, a.limit - a.ab) + '回で単位不可）') : '';
  }).filter(Boolean);
  if(att.length) L.push('【出欠】\n' + att.join('\n'));

  /* 通学 */
  if((S.aiMemo||[]).length) L.push('【覚えておくこと】\n' + S.aiMemo.map(function(m){ return '・' + m.text; }).join('\n'));
  if(chatRoom !== 'main') L.push('【いまの話題】' + chatRoom.slice(2) + ' のこと');

  /* ===== ここから、アプリの中にあるものを全部わたす ===== */

  /* 課題の中身（メモ・小分け・出し方） */
  var tkDetail = S.tasks.filter(function(t){ return !t.done && isYmd(t.due); })
    .sort(function(a,b){ return a.due.localeCompare(b.due); }).slice(0, 30)
    .map(function(t){
      var how = ({form:'Googleフォーム', classroom:'クラスルーム', other:(t.how2||'そのほか')})[t.how] || '';
      var subs = (t.subs||[]).map(function(x){ return (x.done?'済:':'')+x.text; }).join('／');
      return '・' + t.due + (t.time?' '+t.time:'') + ' ' + t.title +
        (t.subject?'（'+t.subject+'）':'') +
        (t.pri===2?' 【大事】':t.pri===0?' 【あとでOK】':'') +
        (how?' 出し方:'+how:'') + (t.url?' 提出先あり':'') +
        (subs?' 小分け:'+subs:'') + (t.memo?' メモ:'+t.memo.slice(0,60):'');
    });
  if(tkDetail.length) L.push('【課題のくわしい中身】\n' + tkDetail.join('\n'));

  /* テストの中身 */
  var exDetail = S.exams.filter(function(e){ return isYmd(e.date) && e.date >= td; })
    .sort(function(a,b){ return a.date.localeCompare(b.date); }).slice(0, 20)
    .map(function(e){
      var pr = toNum(S.progress[e.id]);
      return '・' + e.date + (e.time?' '+e.time:'') + ' ' + e.subject +
        '（' + (kindOf(e.kind).name) + '）' + (e.room?' 教室:'+e.room:'') +
        ' 準備の進み:' + pr + '/' + (toNum(S.ui.progScale)===3?3:4) +
        (e.memo?' メモ:'+e.memo.slice(0,60):'');
    });
  if(exDetail.length) L.push('【テストのくわしい中身】\n' + exDetail.join('\n'));

  /* 科目ごとの評価方法・シラバス */
  var syl = termCourses().map(function(c){
    var y2 = S.syllabus[c.name];
    if(!y2) return '';
    var parts = [];
    if(toNum(y2.exam)) parts.push('試験'+y2.exam+'%');
    if(toNum(y2.rep)) parts.push('レポート'+y2.rep+'%');
    if(toNum(y2.att)) parts.push('出席'+y2.att+'%');
    if(toNum(y2.other)) parts.push('その他'+y2.other+'%');
    return parts.length ? ('・' + c.name + '：' + parts.join('、')) : '';
  }).filter(Boolean);
  if(syl.length) L.push('【成績の付き方】\n' + syl.join('\n'));

  /* かかった時間の記録 */
  var logs = Object.keys(S.taskLog||{}).map(function(id){
    var t3 = S.tasks.filter(function(x){ return x.id === id; })[0];
    var mn = toNum((S.taskLog[id]||{}).min);
    return (t3 && mn) ? ('・' + t3.title + '：' + mn + '分') : '';
  }).filter(Boolean).slice(0, 15);
  if(logs.length) L.push('【課題にかかった時間】\n' + logs.join('\n'));

  /* メモ */
  var nt = (S.notes||[]).slice(0, 12).map(function(n){
    var ck = (n.checks||[]).map(function(c){ return (c.done?'済:':'')+c.text; }).join('／');
    return '・' + (n.pinned?'【ピン】':'') + (n.title||'（無題）') +
      (n.body?'：'+n.body.slice(0,80):'') + (ck?' やること:'+ck:'') +
      ((n.photos||[]).length?' 写真'+n.photos.length+'枚':'');
  });
  if(nt.length) L.push('【メモ】\n' + nt.join('\n'));

  /* 健康の記録 */
  var hl = (S.health||[]).filter(function(h){ return isYmd(h.date); })
    .sort(function(a,b){ return b.date.localeCompare(a.date); }).slice(0, 8)
    .map(function(h){ return '・' + h.date + ' ' + (h.title||h.kind||'') + (h.memo?'：'+h.memo.slice(0,40):''); });
  if(hl.length) L.push('【健康の記録】\n' + hl.join('\n'));

  /* お金のこまかいところ */
  var inc = (S.income||[]).map(function(i2){ return '・' + (i2.name||'収入') + ' ' + toNum(i2.amount) + '円'; });
  if(inc.length) L.push('【毎月の収入】\n' + inc.join('\n'));
  var fx = (S.fixed||[]).map(function(f2){ return '・' + (f2.name||'固定費') + ' ' + toNum(f2.amount) + '円' + (f2.day?'（'+f2.day+'日）':''); });
  if(fx.length) L.push('【毎月の固定費】\n' + fx.join('\n'));
  var bl = (S.balances||[]).map(function(b2){ return '・' + (b2.name||'口座') + ' ' + toNum(b2.amount) + '円'; });
  if(bl.length) L.push('【口座ごとの残高】\n' + bl.join('\n'));

  /* 分割払い */
  var pl = (S.plans||[]).filter(function(x){ return !x.done; }).slice(0, 12)
    .map(function(x){ return '・' + (x.name||'支払い') + ' 毎月' + toNum(x.monthly) + '円・残り' + toNum(x.rest) + '回'; });
  if(pl.length) L.push('【分割払い】\n' + pl.join('\n'));

  /* 最近の出発の記録 */
  var tl = (S.transitLog||[]).slice(-6).map(function(x){
    return '・' + x.date + ' ' + x.at + 'に家を出た' + (x.min?'（目安より'+x.min+'分）':'');
  });
  if(tl.length) L.push('【最近いつ家を出たか】\n' + tl.join('\n'));

  /* 長いお休み */
  var bk = (S.breaks||[]).map(function(x){ return '・' + (x.name||'お休み') + '：' + x.from + '〜' + x.to; });
  if(bk.length) L.push('【長いお休み】\n' + bk.join('\n'));

  /* ふりかえりの記録 */
  var rv = Object.keys(S.dayReview||{}).filter(function(k){ return (S.dayReview[k]||{}).grade; })
    .sort().reverse().slice(0, 10)
    .map(function(k){ var r2 = S.dayReview[k];
      return '・' + k + ' ' + r2.grade + '（' + toNum(r2.point) + '点）' + (r2.memo?'：'+r2.memo:''); });
  if(rv.length) L.push('【最近のふりかえり】\n' + rv.join('\n'));

  /* 予定の種類 */
  L.push('【予定の種類】' + kindsAll().map(function(k){ return k.name; }).join('、'));

  L.push('【通学】家（三田・弥生ヶ丘五丁目）→ 神姫バス → 三ノ宮 → 阪神電車 → 鳴尾・武庫川女子大前。片道およそ1時間20分。' +
    'バイト先はイオンモール神戸北（三ノ宮からバス約50分）。');

  return L.join('\n\n');
}

function chatSuggest(){
  var now = new Date().getHours(), out = [];
  var soonTest = normItems().filter(function(x){
    return (x.src==='exam'||x.src==='quiz'||x.src==='kousa') && isYmd(x.date) && daysFromToday(x.date) >= 0 && daysFromToday(x.date) <= 14;
  });
  var soonTask = S.tasks.filter(function(t){ return !t.done && isYmd(t.due) && daysFromToday(t.due) >= 0 && daysFromToday(t.due) <= 3; });
  var y = new Date().getFullYear();
  var restF = (toNum(S.settings.fuyouLimit)||1030000) - yearPayTotal(y);
  if(soonTask.length) out.push('今いちばん先にやるべき課題は？');
  if(soonTest.length) out.push('テスト勉強はいつやればいい？');
  if(now >= 21) out.push('今から寝ると何時間眠れる？');
  if(now <= 9) out.push('今日は何時に家を出ればいい？');
  if(restF < 200000) out.push('扶養の上限まであと何回働ける？');
  out.push('来週バイトを入れるならいつがいい？');
  out.push('今週いちばん気をつけることは？');
  out.push('今月あと何回バイトできる？');
  out.push('来週の予定をまとめて教えて');
  var seen = {}, uniq = [];
  out.forEach(function(q){ if(!seen[q]){ seen[q]=1; uniq.push(q); } });
  return uniq.slice(0, 5);
}

    '<button class="btn" style="flex:0 0 auto;padding:13px 20px" data-act="chat-send">送る</button></div>';

  var n = aiCountToday();

    (n >= AI_FREE_LIMIT ? '　<b style="color:var(--rakuten)">（無料の目安をこえています）</b>'
     : n >= AI_FREE_LIMIT*0.8 ? '　<span style="color:var(--warn)">（そろそろ無料の目安）</span>' : '') + '</div>';
  if(msgs.length) h += '<button class="btn ghost" style="margin-top:10px" data-act="chat-clear">この話を消す</button>';
  h += '<p class="note">アプリに登録した予定・課題・テスト・バイト・お金の情報をもとに答えます。' +
    '送った内容はGoogleのAIに送信されます。患者さんの個人情報は書かないでください。</p>';
  return '<section>' + h + '</section>';
}

async function chatSend(text, opt){
  opt = opt || {};
  var key = (S.settings.geminiKey || '').trim();
  if(!key){ toast('先に設定タブでGemini APIキーを登録してください', true); return; }
  /* 患者さんや実習先の個人情報は外に出さない */
  if(/患者|受け持ち|カルテ|バイタル.*さん|入院|病棟の.*さん|既往歴|主訴/.test(text)){
    roomSet(roomMsgs().concat([
      { role:'user', text:text, mt:Date.now() },
      { role:'ai', text:'患者さんに関わることは、外には送れません。実習の記録はアプリのメモ（この端末の中）に書いてください。\n\n書き方や考え方の相談なら、個人が分からない形でお答えできます。', mt:Date.now() }
    ]));
    persist(); render();
    var bx = document.getElementById('chatwrap'); if(bx) bx.scrollTop = bx.scrollHeight;
    return;
  }
  if(!text) return;
  if(!opt.silent && /患者(さん)?(の)?(氏名|名前|カルテ|ID)|受け持ち.*(氏名|本名)/.test(text)){
    if(!confirm('患者さんの個人情報は送らないでください。このまま送りますか？')) return;
  }
  var sendFiles = chatFiles.slice();
  chatFiles = [];
  var list = roomMsgs().concat([{ role:'user', text:text,
    atts: sendFiles.map(function(f){ return { name:f.name, kind:f.kind, data:(f.kind==='image'?f.data:'') }; }),
    mt:Date.now() }]);
  if(list.length > 60) list = list.slice(-60);
  roomSet(list);
  chatBusy = true; persist(); render();
  var box = document.getElementById('chatwrap'); if(box) box.scrollTop = box.scrollHeight;

  try{
    var history = roomMsgs().slice(-14)
      .filter(function(m){ return !(m.role === 'ai' && /^つながりませんでした|^とちゅうでやめました/.test(m.text)); })
      .map(function(m){ return { role: m.role === 'user' ? 'user' : 'model', parts:[{ text:m.text }] }; });
    /* いちばん新しい発言に、写真やファイルをつける */
    if(sendFiles.length && history.length){
      var last = history[history.length - 1];
      sendFiles.forEach(function(f){
        var b64 = String(f.data).split(',')[1] || '';
        if(!b64) return;
        if(f.kind === 'image') last.parts.unshift({ inline_data:{ mime_type:f.mime, data:b64 } });
        else last.parts.unshift({ inline_data:{ mime_type:f.mime, data:b64 } });
      });
    }
    while(history.length && history[0].role !== 'user') history.shift();

    var body = {
      systemInstruction: { parts: [{ text: chatSystem() + '\n\n===== アプリの中身 =====\n' + chatContext() }] },
      contents: history,
      generationConfig: { temperature: 0.3, maxOutputTokens: (S.ui.aiLen==='long' ? 3000 : 2048) }
    };
    var picked = S.ui.aiModel || S.settings.geminiModel;
    var models = [picked].filter(Boolean)
      .concat(['gemini-3.6-flash','gemini-2.5-flash','gemini-flash-latest','gemini-2.0-flash']);
    var seen = {}, models2 = [];
    models.forEach(function(m){ if(!seen[m]){ seen[m]=1; models2.push(m); } });

    chatAbort = (typeof AbortController !== 'undefined') ? new AbortController() : null;
    var j = null, lastErr = '';
    for(var mi = 0; mi < models2.length; mi++){
      var res = await fetch(
        'https://generativelanguage.googleapis.com/v1beta/models/' + models2[mi] + ':generateContent',
        { method:'POST',
          headers:{ 'Content-Type':'application/json', 'x-goog-api-key': key },
          body: JSON.stringify(body),
          signal: chatAbort ? chatAbort.signal : undefined });
      var jj = await res.json();
      if(res.ok){
        j = jj;
        S.settings.aiLastModel = models2[mi]; persist();
        break;
      }
      lastErr = (jj && jj.error && jj.error.message) ? jj.error.message : ('エラー ' + res.status);
      if(!/not available|not found|NOT_FOUND|unsupported|deprecated|update your code/i.test(lastErr)) break;
      if(S.ui.aiModel === models2[mi]){ S.ui.aiModel = ''; touch('ui'); }
    }
    if(!j) throw new Error(lastErr || 'つながりませんでした');

    var out = '', fin = '';
    try{
      out = j.candidates[0].content.parts.map(function(p){ return p.text || ''; }).join('');
      fin = j.candidates[0].finishReason || '';
    }catch(e){ out = ''; }
    if(!out) out = 'うまく答えられませんでした。もう一度きいてみてください。';
    /* AIが「予定に入れるとよい」と書いた行を取り出す */
    var adds = [];
    out = out.replace(/\[\[ADD\|([^\]]*)\]\]/g, function(_, body2){
      var q = body2.split('|');
      var kind = (q[0]||'').trim(), title = (q[1]||'').trim(), date = (q[2]||'').trim();
      var tm = (q[3]||'').trim(), en = (q[4]||'').trim();
      if(!isYmd(date) || !title) return '';
      if(!kindsAll().some(function(k){ return k.id === kind; })) kind = 'other';
      adds.push({ kind:kind, title:title, date:date,
        time:/^\d{1,2}:\d{2}$/.test(tm)?tm:'', end:/^\d{1,2}:\d{2}$/.test(en)?en:'' });
      return '';
    }).replace(/\n{3,}/g, '\n\n').trim();
    if(fin === 'MAX_TOKENS') out += '\n\n（長くなったので途中までです。「続きを教えて」と送ると続きが読めます）';
    aiCountAdd();
    roomSet(roomMsgs().concat([{ role:'ai', text:out, adds:adds, mt:Date.now() }]));
    if(window.__revCatch){
      window.__revCatch = false;
      S.dayReview = S.dayReview || {};
      var tdr = today();
      var jj = dayGrade(tdr);
      var pr = S.dayReview[tdr] || {};
      S.dayReview[tdr] = { grade: pr.grade || jj.grade, point: pr.point || jj.point,
        memo: pr.memo || '', ai: out, mt: Date.now() };
      touch('dayReview'); persist();
    }
  }catch(e){
    var msg = String(e.message || '');
    if(/abort/i.test(msg)){
      roomSet(roomMsgs().concat([{ role:'ai', text:'とちゅうでやめました。', mt:Date.now() }]));
    }else{
      roomSet(roomMsgs().concat([{ role:'ai', text:'つながりませんでした。\n' +
        (/API key not valid|API_KEY_INVALID|401|invalid_api_key/i.test(msg) ? 'APIキーが正しくないようです。設定タブで入れ直してください。'
         : /quota|RESOURCE_EXHAUSTED|429/i.test(msg) ? '今日の無料ぶんを使い切ったかもしれません。'
         : msg.slice(0, 140)), mt:Date.now() }]));
    }
  }finally{
    chatBusy = false; chatAbort = null;
    persist(); pushRemote(); render();
    var b2 = document.getElementById('chatwrap'); if(b2) b2.scrollTop = b2.scrollHeight;
  }
}

/* 予定から自分で作る（AIを使わないので、キーがなくても動く） */
function dayScore(ymd){
  var tasks = S.tasks.filter(function(t){ return isYmd(t.due) && t.due === ymd; });
  var done = tasks.filter(function(t){ return t.done; }).length;
  var late = S.tasks.filter(function(t){ return !t.done && isYmd(t.due) && t.due < ymd; }).length;
  var cls = schoolClassesForDate(ymd);
  var att = 0, ab = 0;
  Object.keys(S.attendLog||{}).forEach(function(nm){
    (S.attendLog[nm]||[]).forEach(function(r){ if(r.date === ymd){ if(r.st === '欠') ab++; else att++; } });
  });
  var work = S.shifts.filter(function(w){ return w.date === ymd; }).length;
  var studied = 0;
  Object.keys(S.taskLog||{}).forEach(function(id){ studied += toNum((S.taskLog[id]||{}).min); });
  return { tasks:tasks.length, done:done, late:late, cls:cls.length, att:att, ab:ab, work:work, studied:studied };
}
/* SABCDE で評価する */
var GRADE_COLOR = { S:'#C9A227', A:'#E0876A', B:'#6FA8DC', C:'#84C7AC', D:'#B0A0C0', E:'#9AA0A6' };
function dayGrade(ymd){
  var sc = dayScore(ymd);
  var p = 0;
  /* 課題をどれだけ片付けたか（最大40点） */
  if(sc.tasks) p += Math.round(sc.done / sc.tasks * 40);
  else p += 24;                                   /* 締切がない日は標準点 */
  /* 出席（最大30点） */
  if(sc.cls){
    if(sc.ab) p += Math.max(0, 30 - sc.ab * 20);
    else if(sc.att) p += 30;
    else p += 20;                                 /* 記録していないだけかも */
  }else p += 20;
  /* 期限切れをためていないか（最大15点） */
  p += Math.max(0, 15 - sc.late * 5);
  /* 勉強した時間（最大10点） */
  p += Math.min(10, Math.round(sc.studied / 30) * 2);
  /* バイト（最大5点） */
  if(sc.work) p += 5;
  p = Math.max(0, Math.min(100, p));
  var g = p >= 90 ? 'S' : p >= 78 ? 'A' : p >= 64 ? 'B' : p >= 50 ? 'C' : p >= 35 ? 'D' : 'E';
  return { grade:g, point:p, sc:sc };
}
function gradeNote(g){
  return ({ S:'文句なし', A:'よくできた', B:'ふつうにできた', C:'もう少し', D:'手をつけられていない', E:'今日はお休みみたいな日' })[g] || '';
}
function reviewWords(sc){
  var tone = S.ui.aiTone || 'friendly';
  var hard = (tone === 'coach' || tone === 'spartan');
  var allDone = sc.tasks > 0 && sc.done === sc.tasks;
  var noneDone = sc.tasks > 0 && sc.done === 0;
  if(allDone){
    return hard ? '今日のぶんは全部終わった。えらい。この調子を明日も続けること。'
                : '今日のぶんは全部終わりました。よくがんばりましたね。';
  }
  if(noneDone && sc.tasks > 0){
    return hard ? '今日の課題、ひとつも終わってない。明日にまわすほど重くなるよ。今から10分でもやろう。'
                : '今日の課題がまだ残っています。10分だけでも手をつけてみませんか。';
  }
  if(sc.late >= 3){
    return hard ? '期限切れが' + sc.late + '件たまってる。まずいちばん古いのから片づけよう。'
                : '期限が過ぎたものが' + sc.late + '件あります。ひとつずつ片づけましょう。';
  }
  if(sc.done > 0){
    return hard ? sc.tasks + '件中' + sc.done + '件。残りもやってから寝よう。'
                : sc.tasks + '件のうち' + sc.done + '件おわりました。いいペースです。';
  }
  if(sc.cls > 0){
    return hard ? '今日は' + sc.cls + 'コマ。おつかれ。明日の準備だけはしておくこと。'
                : '今日は' + sc.cls + 'コマおつかれさまでした。ゆっくり休んでください。';
  }
  return hard ? '今日は予定なし。こういう日にこそ進めておこう。'
              : '今日はゆっくりできましたか。明日にそなえて休んでください。';
}

function morningBriefCard(){
  if(S.ui.morningBrief === 0) return '';

  if(h >= 12) return '';
  var td = today();
  var cls = schoolClassesForDate(td);
  var items = focusItemsFor(td);
  var lines = [];
  if(cls.length){
    var st = S.commute.periods[cls[0].period-1];
    var leave = minutesOf(st) != null ? hhmmOf(minutesOf(st) - 30 - 80) : null;
    lines.push('きょうは' + cls.length + 'コマ。' + cls[0].period + '限 ' + st + '開始。' +
      (leave ? '<b>' + leave + 'ごろ家を出る</b>と間に合います。' : ''));
  }else{
    lines.push('きょうは通学なしです。');
  }
  var tests = items.filter(function(x){ return x.src==='exam'||x.src==='quiz'||x.src==='kousa'; });
  var dues = items.filter(function(x){ return x.src==='task' && !x.done; });
  if(tests.length) lines.push('テスト：' + tests.map(function(x){ return x.title; }).join('、'));
  if(dues.length) lines.push('締切：' + dues.map(function(x){ return x.title + (x.time?' '+x.time:''); }).join('、'));
  var u = umbrellaInfo();
  if(u && u.need) lines.push('雨の予報です。傘を持ってください。');
  var wk = S.shifts.filter(function(w){ return w.date === td; });
  if(wk.length) lines.push('バイト：' + wk.map(function(w){ return (w.start||'')+'〜'+(w.end||''); }).join('、'));

function reviewAction(act, t){
  if(act === 'rev-open'){ reviewOpen = true; render(); return true; }
  if(act === 'rev-close'){ reviewOpen = false; render(); return true; }
  if(act === 'rev-hist'){ reviewHistOpen = true; revHistOff = 0; render(); return true; }
  if(act === 'rh-off'){ revHistOff += toNum(t.dataset.v); render(); return true; }
  if(act === 'rh-set'){ revHistOff = toNum(t.dataset.v); render(); return true; }
  if(act === 'rev-hist-close'){ reviewHistOpen = false; render(); return true; }
  if(act === 'rev-star'){
    Array.prototype.forEach.call(t.parentNode.querySelectorAll('button'), function(b){ b.classList.remove('on'); });
    t.classList.add('on'); return true;
  }
  if(act === 'rev-judge'){ reviewOpen = true; render(); return true; }
  if(act === 'go-review'){
    appId = 'today'; todayTab = 'today'; reviewOpen = true; reviewHistOpen = false;
    render();
    setTimeout(function(){
      var el = [].slice.call(document.querySelectorAll('section')).filter(function(s){ return /ふりかえり/.test(s.textContent); })[0];
      if(el) el.scrollIntoView({ block:'center', behavior:'smooth' });
    }, 60);

  }
  if(act === 'rev-save'){
    var td2 = today();
    var prev = (S.dayReview||{})[td2] || {};
    S.dayReview = S.dayReview || {};
    S.dayReview[td2] = { grade: t.dataset.g, point: toNum(t.dataset.p),
      memo: val('rev_memo'), ai: prev.ai || '', mt: Date.now() };
    touch('dayReview'); reviewOpen = false; toast(t.dataset.g + ' で記録しました'); commit(); return true;
  }
  if(act === 'rev-ai'){

    var jd2 = dayGrade(today());
    var sc2 = jd2.sc;
    var ask = '今日の評価は '+jd2.grade+'（'+jd2.point+'点）でした。' +
      '課題 '+sc2.done+'/'+sc2.tasks+'件、授業 '+sc2.cls+'コマ' + (sc2.ab?'（欠席'+sc2.ab+'）':'') +
      '、期限切れ '+sc2.late+'件、勉強 '+sc2.studied+'分、バイト' + (sc2.work?'あり':'なし') + '。' +
      (len === 'short' ? 'ひとことで（1行）。'
       : len === 'long' ? 'くわしく（できたこと・できなかったこと・明日の一歩を、それぞれ2〜3行で）。'
       : '3〜4行で、よかった点と明日の一歩を。') +
      (S.ui.aiTone === 'coach' ? '甘やかさずに。' : '');
    /* 返事を振り返りにも残す */
    window.__revCatch = true;
    /* 相談タブに移って、そこで答えを見せる */
    appId = 'chat';
    if(chatRoom === 'main'){
      /* 振り返り用の会話をつくる（なければ） */
      S.chatMeta = S.chatMeta || {};
      var rid = 'review';
      if(!S.chatMeta[rid]){ S.chatMeta[rid] = { name:'ふりかえり', mt:Date.now() }; }
      S.chatRooms = S.chatRooms || {};
      if(!S.chatRooms[rid]) S.chatRooms[rid] = [];
      chatRoom = rid;
    }

}

document.getElementById('chatfile').addEventListener('change', async function(e){
  var files = Array.prototype.slice.call(e.target.files || []);
  e.target.value = '';
  if(!files.length) return;
  for(var i = 0; i < files.length; i++){
    var f = files[i];
    if(chatFiles.length >= 4){ toast('いちどに送れるのは4つまでです', true); break; }
    try{
      if(/^image\//.test(f.type)){
        var data = await resizeImage(f, 1200, 0.75);
        chatFiles.push({ name:f.name, kind:'image', mime:'image/jpeg', data:data });
      }else{
        if(f.size > 3 * 1024 * 1024){ toast(f.name + ' は大きすぎます（3MBまで）', true); continue; }
        var d2 = await new Promise(function(res, rej){
          var r = new FileReader();
          r.onload = function(){ res(r.result); };
          r.onerror = function(){ rej(new Error('読めません')); };
          r.readAsDataURL(f);
        });
        chatFiles.push({ name:f.name, kind:'file', mime:f.type || 'application/octet-stream', data:d2 });
      }
    }catch(err){ toast(f.name + ' を読めませんでした', true); }
  }
  render();
});

document.getElementById('app').addEventListener('keydown', function(e){
  var el = e.target;
  if(!el || !el.classList || !el.classList.contains('tnum')) return;
  if(e.key !== 'Enter') return;
  e.preventDefault();
  var order = ['ev_time_h','ev_time_m','ev_end_h','ev_end_m','ev_real_h','ev_real_m'];
  var i = order.indexOf(el.id);
  for(var j = i + 1; j < order.length; j++){
    var nx = document.getElementById(order[j]);
    if(nx){ nx.focus(); nx.select && nx.select(); return; }
  }
  el.blur();
});
document.getElementById('app').addEventListener('input', function(e){
  if(e.target.id === 'note_q'){
    noteQ = e.target.value;
    clearTimeout(window.__nqT);
    window.__nqT = setTimeout(function(){ render(); var q=document.getElementById('note_q'); if(q){ q.focus(); q.setSelectionRange(q.value.length,q.value.length); } }, 260);
    return;
  }
  var k = e.target.getAttribute('data-earn');
  if(!k) return;
  var v = parseInt(e.target.value, 10);
  if(isNaN(v) || v < 0) v = 0;
  if(k==='otherCr') S.risyu.otherCr = v; else S.risyu.earned[k] = v;
  touchRisyu();
  var m = document.getElementById('meters'); if(m) m.innerHTML = metersHtml();
  var w = document.getElementById('warns'); if(w) w.innerHTML = warnsHtml();
  persist(); pushRemote();
});

/* 右下の「＋」ボタン（長押しで種類を選ぶ） */
(function(){
  var fab = document.getElementById('fab'), timer = null, longed = false;
  var openMenu = function(){
    longed = true;
    var m = document.getElementById('fabmenu');
    m.innerHTML = kindsAll().map(function(k){
      return '<button data-k="'+k.id+'" style="--kc:'+k.hex+'"><span class="kdot2"></span>'+k.name+'</button>';
    }).join('');
    m.classList.add('on');
  };
  fab.addEventListener('touchstart', function(){ longed=false; timer=setTimeout(openMenu, 450); }, {passive:true});
  fab.addEventListener('touchend', function(){ clearTimeout(timer); }, {passive:true});
  fab.addEventListener('mousedown', function(){ longed=false; timer=setTimeout(openMenu, 450); });
  fab.addEventListener('mouseup', function(){ clearTimeout(timer); });
  fab.addEventListener('contextmenu', function(e){ e.preventDefault(); openMenu(); });
  document.getElementById('fabmenu').addEventListener('click', function(e){
    var b = e.target.closest('button[data-k]'); if(!b) return;
    document.getElementById('fabmenu').classList.remove('on');
    readEvForm(); calEdit=null; evDraft=newDraft(calSel); evDraft.kind=b.dataset.k;
    appId='cal'; calTab='add'; render(); window.scrollTo(0,0);
  });
  document.addEventListener('click', function(e){
    var m = document.getElementById('fabmenu');
    if(m.classList.contains('on') && !e.target.closest('#fabmenu') && !e.target.closest('#fab')) m.classList.remove('on');
  });
})();
document.getElementById('fab').addEventListener('click', function(){
  if(document.getElementById('fabmenu').classList.contains('on')) return;
  readEvForm();
  calEdit = null;
  evDraft = newDraft(calSel);
  appId='cal'; calTab='add';
  render(); window.scrollTo(0,0);
});


/* 左右にはらってタブを切り替える */
(function(){
  var root = document.body;
  var x0=0, y0=0, t0=0, decided=0, active=false, busy=false;
  var appEl = function(){ return document.getElementById('app'); };
  var inScroller = function(el){
    for(var n=el; n && n!==root; n=n.parentElement){
      if(n.scrollWidth > n.clientWidth + 4 && /auto|scroll/.test(getComputedStyle(n).overflowX)) return true;
    }
    return false;
  };
  var isInput = function(el){ return !!(el && el.closest && el.closest('input,textarea,select,button')); };
  var clear = function(){
    var a = appEl(); if(!a) return;
    a.style.transition = ''; a.style.transform = ''; a.style.opacity = '';
  };
  var settle = function(){
    var a = appEl(); if(!a) return;
    a.style.transition = 'transform .2s ease, opacity .2s ease';
    a.style.transform = ''; a.style.opacity = '';
    setTimeout(clear, 220);
  };
  root.addEventListener('touchstart', function(e){
    if(busy || e.touches.length !== 1 || isInput(e.target) || inScroller(e.target)){ t0 = 0; return; }
    clear();
    x0 = e.touches[0].clientX; y0 = e.touches[0].clientY; t0 = Date.now(); decided = 0; active = false;
  }, {passive:true});
  root.addEventListener('touchmove', function(e){
    if(!t0) return;
    var dx = e.touches[0].clientX - x0, dy = e.touches[0].clientY - y0;
    if(!decided){
      if(Math.abs(dx) < 8 && Math.abs(dy) < 8) return;
      decided = 1;
      active = Math.abs(dx) > Math.abs(dy) * 1.3;
      if(!active){ t0 = 0; return; }
    }
    var a = appEl();
    if(active && a){
      var shift = Math.max(-70, Math.min(70, dx * 0.35));
      a.style.transition = 'none';
      a.style.transform = 'translateX('+shift+'px)';
      a.style.opacity = String(1 - Math.min(0.3, Math.abs(dx)/1000));
    }
  }, {passive:true});
  root.addEventListener('touchend', function(e){
    if(!t0 || !active){ t0 = 0; settle(); return; }
    var dx = e.changedTouches[0].clientX - x0;
    var dt = Date.now() - t0;
    t0 = 0; active = false;
    if(Math.abs(dx) < 55 || dt > 800){ settle(); return; }
    busy = true;
    clear();
    switchTab(dx < 0 ? 1 : -1);
    setTimeout(function(){ busy = false; }, 380);
  }, {passive:true});
  root.addEventListener('touchcancel', function(){ t0=0; active=false; settle(); }, {passive:true});
})();
/* サブタブがあればサブタブ、なければ大きいタブを動かす */
function switchTab(dir){
  var a = document.getElementById('app');
  var finish = function(go){
    if(!a){ go(); return; }
    /* いまの画面をそっと送り出す */
    a.style.transition = 'transform .13s ease-in, opacity .13s ease-in';
    a.style.transform = 'translateX('+(dir>0?-26:26)+'px)';
    a.style.opacity = '0';
    setTimeout(function(){
      go();
      var b = document.getElementById('app');
      if(!b) return;
      b.style.transition = 'none';
      b.style.transform = 'translateX('+(dir>0?30:-30)+'px)';
      b.style.opacity = '0';
      requestAnimationFrame(function(){
        requestAnimationFrame(function(){
          b.style.transition = 'transform .2s cubic-bezier(.22,.9,.3,1), opacity .2s ease-out';
          b.style.transform = 'translateX(0)';
          b.style.opacity = '1';
          setTimeout(function(){ b.style.transition=''; b.style.transform=''; b.style.opacity=''; }, 220);
        });
      });
    }, 130);
  };
  var subs = SUBTAB_DEFS[appId] ? subVisible(appId) : null;
  if(subs && subs.length > 1){
    var cur = appId==='money' ? payTab : appId==='cal' ? calTab : appId==='todo' ? todoTab : appId==='risyu' ? risyuTab : todayTab;
    var i = subs.findIndex(function(t){ return t[0]===cur; });
    var j = i + dir;
    if(j >= 0 && j < subs.length){
      var v = subs[j][0];
      finish(function(){
        if(appId==='money') payTab=v; else if(appId==='cal') calTab=v; else if(appId==='todo') todoTab=v;
        else if(appId==='risyu') risyuTab=v; else if(appId==='today') todayTab=v;
        render(); window.scrollTo(0,0);
      });
      return;
    }
  }
  var apps = APPS_VISIBLE();
  var ai = apps.findIndex(function(a){ return a[0]===appId; });
  var aj = ai + dir;
  if(aj >= 0 && aj < apps.length){
    finish(function(){
      appId = apps[aj][0]; courseView=''; noteView='';
      render(); window.scrollTo(0,0);
    });
  }
}

/* オフラインでも開けるように（https のときだけ） */
if('serviceWorker' in navigator && location.protocol === 'https:'){
  navigator.serviceWorker.register('sw.js', { updateViaCache:'none' }).then(function(reg){
    reg.update();
    /* 新しい版が来たら、次に開いたときに切り替わる */
    reg.addEventListener('updatefound', function(){
      var w = reg.installing;
      if(!w) return;
      w.addEventListener('statechange', function(){
        if(w.state === 'installed' && navigator.serviceWorker.controller){
          notice_('新しい版があります。アプリを開き直すと新しくなります。', 'amber');
          render();
        }
      });
    });
  }).catch(function(){});
}
