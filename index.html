<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="くらしの手帳">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<meta name="theme-color" content="#EAD0D7">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" sizes="180x180" href="icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<title>くらしの手帳</title>
<link rel="stylesheet" href="css/app.css">
</head>
<body data-theme="pink" data-fs="m">

<div id="splash">
  <svg width="96" height="72" viewBox="0 0 96 72" fill="none" xmlns="http://www.w3.org/2000/svg" style="animation-delay:0s">
    <rect x="14" y="16" width="52" height="34" rx="7" fill="#D9738F"/>
    <rect x="20" y="22" width="18" height="13" rx="3" fill="#fff" opacity=".9"/>
    <rect x="42" y="22" width="18" height="13" rx="3" fill="#fff" opacity=".9"/>
    <circle cx="26" cy="53" r="6" fill="#4A2B38"/><circle cx="56" cy="53" r="6" fill="#4A2B38"/>
    <path d="M70 40h14M70 46h10" stroke="#E9A0B6" stroke-width="3" stroke-linecap="round"/>
  </svg>
  <div class="ttl">くらしの手帳</div>
</div>

<header>
  <h1 id="apptitle">今日<span id="synctag"></span></h1>
  <div id="apps"></div>
</header>
<nav id="nav"></nav>
<div id="decor" class="decor"></div>
<main id="app"></main>
<footer id="foot"></footer>

<input type="file" accept="image/*" id="memoimg" class="hide" multiple>
<input type="file" accept="image/*" id="shiftimg" class="hide">
<input type="file" accept="image/*,.pdf,.txt,.csv" id="chatfile" class="hide" multiple>
<div class="sheet" id="detail" role="dialog" aria-modal="true">
  <div class="sheet-hd"><div class="rowline"><h3>予定の詳細</h3><button type="button" class="mini" id="dtClose">閉じる</button></div></div>
  <div class="sheet-bd"></div>
</div>
<div id="fabmenu"></div>
<button class="fab hide" id="fab" aria-label="予定を追加">＋</button>
<div id="toast" role="status" aria-live="polite"></div>
<div id="viewer" role="dialog" aria-modal="true" aria-label="写真"><button type="button" class="vclose">とじる</button><img alt="写真"></div>

<div class="veil" id="veil"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="shTitle">
  <div class="sheet-hd">
    <div class="rowline"><h3 id="shTitle">月曜1限</h3><button type="button" class="mini" id="shClose">閉じる</button></div>
    <div class="chips" id="shDays" style="margin:10px 0 0"></div>
    <div class="chips" id="shPeriods" style="margin:8px 0 0"></div>
    <input type="search" id="shSearch" placeholder="科目名・先生名でしぼりこむ" style="margin-top:8px">
    <div class="chips" id="shCats" style="margin:8px 0 0"></div>
  </div>
  <div class="sheet-bd" id="shBody"></div>
</div>

<!-- 読みこむ順番に意味があります（上のファイルの関数を下で使う） -->
<script src="js/data.js"></script>
<script src="js/core.js"></script>
<script src="js/sync.js"></script>
<script src="js/ai.js"></script>
<script src="js/common.js"></script>
<script src="js/decor.js"></script>
<script src="js/commute.js"></script>
<script src="js/today.js"></script>
<script src="js/money.js"></script>
<script src="js/risyu.js"></script>
<script src="js/calendar.js"></script>
<script src="js/settings.js"></script>
<script src="js/google.js"></script>
<script src="js/timetable.js"></script>
<script src="js/todo.js"></script>
<script src="js/chat.js"></script>
<script src="js/review.js"></script>
<script src="js/whatsnew.js"></script>
<script src="js/main.js"></script>
</body>
</html>
