<style>

  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  body{
    margin:0; background:var(--paper); color:var(--ink);

  }
  .num{font-variant-numeric:tabular-nums; letter-spacing:.01em}
  header{background:var(--ink); color:#fff; padding:calc(env(safe-area-inset-top) + 16px) 16px 0}
  header h1{margin:0; font-size:16px; letter-spacing:.04em}
  header p{margin:4px 0 12px; font-size:12px; color:#B9C4D4}
  #apps{display:flex; gap:6px; max-width:560px; margin:0 auto; padding-bottom:0}
  #apps button{flex:1; border:0; background:rgba(255,255,255,.12); color:#C7D2E0; font:inherit; font-size:13px;

  nav{display:flex; background:var(--card); border-bottom:1px solid var(--rule); position:sticky; top:0; z-index:5}
  nav button{flex:1; border:0; background:none; padding:12px 0; font:inherit; font-size:12px; color:var(--sub); border-bottom:2px solid transparent}
  nav button.on{color:var(--ink); font-weight:700; border-bottom-color:var(--ink)}

  main{max-width:560px; margin:0 auto; padding:20px 16px}
  footer{max-width:560px; margin:0 auto; padding:0 16px calc(env(safe-area-inset-bottom) + 32px); font-size:11.5px; color:var(--sub); line-height:1.7}
  section{margin-bottom:20px}
  .head{display:flex; align-items:baseline; justify-content:space-between; margin-bottom:8px; gap:10px}
  .head h2{margin:0; font-size:13px; font-weight:700}
  .head span{font-size:12px; color:var(--sub); text-align:right}
  .box{background:var(--card); border-radius:10px; padding:16px; box-shadow:0 1px 2px rgba(23,35,58,.06)}
  .row{display:flex; align-items:center; gap:12px; padding:11px 0; border-bottom:1px solid var(--rule); width:100%; text-align:left; background:none; border-left:0; border-right:0; border-top:0; font:inherit; color:inherit}

  .tick{width:4px; height:34px; border-radius:2px; flex:none}
  .grow{flex:1; min-width:0}
  .t{font-size:14px}
  .s{font-size:12px; color:var(--sub); overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .amt{font-size:15px; font-weight:600}
  .big{font-size:38px; font-weight:700; line-height:1.1}
  .accbar{display:flex; align-items:center; justify-content:space-between; padding:6px 8px; border-radius:6px; font-size:12px; font-weight:700; margin-bottom:2px}
  .smbc{color:var(--smbc)} .bg-smbc{background:var(--smbcbg)}
  .rakuten{color:var(--rakuten)} .bg-rakuten{background:var(--rakutenbg)}
  .chk{width:20px;height:20px;border-radius:5px;border:1.5px solid var(--rule);display:flex;align-items:center;justify-content:center;color:#fff;font-size:12px;flex:none}
  .done .t{color:var(--sub); text-decoration:line-through}
  button.btn{display:block; width:100%; padding:11px; border-radius:8px; border:0; font:inherit; font-size:14px; font-weight:600; background:var(--ink); color:#fff}
  button.btn.ghost{background:var(--paper); color:var(--ink); border:1px solid var(--rule)}

  .pair>*{flex:1 1 0; min-width:0}
  .pair>button.btn{width:auto; white-space:nowrap}
  label.f{display:block; font-size:12px; color:var(--sub); margin:0 0 4px}

var DAYS = ["月","火","水","木","金","土"];
var PERIODS = [1,2,3,4,5,6,7];

function parseSlots(s){
  var out = [], last = "月";
  s.split(",").forEach(function(t){
    t = t.trim();
    var m = t.match(/^([月火水木金土])?([1-7])$/);
    if(!m) return;
    var d = m[1] || last; last = d;
    out.push({d:d, p:parseInt(m[2],10)});
  });
  return out;
}

function mk(code, slots, name, teacher, cap, apps, cat, opt){
  opt = opt || {};
  var sl = parseSlots(slots);
  return {
    code:code, slotText:slots, slots:sl, name:name, teacher:teacher,
    cap:cap, apps:apps, cat:cat,
    cr: opt.cr || (sl.length > 1 ? 2 : 1),
    en: !!opt.en,
    ratio: cap > 0 ? apps/cap : 99
  };
}

function planRows(p){

function daysUntil(day){

  var t=new Date(now.getFullYear(),now.getMonth(),day);
  if(t<today) t=new Date(now.getFullYear(),now.getMonth()+1,day);
  return Math.round((t-today)/86400000);
}
async function resizeImage(file,maxSide,quality){
  var dataUrl = await new Promise(function(res,rej){ var r=new FileReader(); r.onload=function(){res(r.result);}; r.onerror=function(){rej(new Error('read'));}; r.readAsDataURL(file); });
  var img = await new Promise(function(res,rej){ var i=new Image(); i.onload=function(){res(i);}; i.onerror=function(){rej(new Error('img'));}; i.src=dataUrl; });
  var sc=Math.min(1,maxSide/Math.max(img.width,img.height));
  var cv=document.createElement('canvas');
  cv.width=Math.round(img.width*sc); cv.height=Math.round(img.height*sc);
  cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height);
  return cv.toDataURL('image/jpeg',quality);
}

function normPaid(p){
  if(p === true) return { v:1, t:0 };
  if(p === false || p == null) return null;
  if(typeof p === 'object') return { v: p.v ? 1 : 0, t: Number(p.t)||0 };
  return { v:1, t:0 };
}
function isPaid(k){ var p = normPaid(S.paid[k]); return !!(p && p.v); }

function derive(){
  var rows = S.plans.reduce(function(a,p){ return a.concat(planRows(p)); }, []);
  var set = {};
  rows.forEach(function(r){ set[r.month]=1; });
  S.statements.forEach(function(s){ if(s.billingMonth) set[s.billingMonth]=1; });
  set[thisYm()]=1;
  var months = Object.keys(set).sort();
  var byMonth = {};
  months.forEach(function(m){ byMonth[m] = { smbc:{plan:0,stmt:0,rows:[],stmts:[]}, rakuten:{plan:0,stmt:0,rows:[],stmts:[]} }; });
  rows.forEach(function(r){ var g=byMonth[r.month]; if(!g||!g[r.accountId]) return; g[r.accountId].plan+=r.amount; g[r.accountId].rows.push(r); });
  S.statements.forEach(function(s){ var g=byMonth[s.billingMonth]; if(!g||!g[s.accountId]) return; g[s.accountId].stmt += Number(s.amount)||0; g[s.accountId].stmts.push(s); });
  var monthTotal = function(m){ var g=byMonth[m]; return g.smbc.plan+g.smbc.stmt+g.rakuten.plan+g.rakuten.stmt; };
  return { rows:rows, months:months, byMonth:byMonth, monthTotal:monthTotal };
}

var syncState = { on:false, msg:'', ref:null, setDoc:null, unsub:null, timer:null, last:'', connecting:false };

/* Firebaseコンソールの表示は JSON ではなく JavaScript の書き方なので、
   波かっこ無し・const付き・キーに引用符無しなど、どの貼り方でも読めるようにする */
function parseFbConfig(txt){
  var s = String(txt == null ? '' : txt).trim();
  if(!s) throw new Error('EMPTY');
  s = s.replace(/^\s*\/\/.*$/gm, '');                 /* 行頭のコメントを除去 */
  var a = s.indexOf('{'), b = s.lastIndexOf('}');
  s = (a >= 0 && b > a) ? s.slice(a, b + 1) : '{' + s + '}';
  s = s.replace(/([{,]\s*)([A-Za-z_$][A-Za-z0-9_$]*)\s*:/g, '$1"$2":'); /* キーに引用符を補う */
  s = s.replace(/'([^'\\]*)'/g, '"$1"');               /* シングルクォートを直す */
  s = s.replace(/,\s*([}\]])/g, '$1');                  /* 末尾のカンマを除去 */
  var cfg = JSON.parse(s);
  if(!cfg || !cfg.apiKey || !cfg.projectId) throw new Error('MISSING');
  return cfg;
}

async function initSync(){
  var room = S.settings.room, fbConfig = S.settings.fbConfig;
  if(!room || !fbConfig) return;
  if(syncState.connecting) return;
  syncState.connecting = true;
  try{
    var cfg = parseFbConfig(fbConfig);
    var fa = await import('https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js');
    var fs = await import('https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js');
    /* 待っている間に別の接続要求が割り込んでいたら、こちらは中断する */
    if(room !== S.settings.room || fbConfig !== S.settings.fbConfig){ syncState.connecting=false; return; }
    if(syncState.unsub){ try{ syncState.unsub(); }catch(e){} syncState.unsub = null; }
    var app = fa.initializeApp(cfg, 'kurashi-' + Date.now());
    var ref = fs.doc(fs.getFirestore(app), 'shiharai', room);
    syncState.ref = ref; syncState.setDoc = fs.setDoc; syncState.on = true; syncState.msg = '';
    syncState.unsub = fs.onSnapshot(ref, function(snap){
      if(snap.exists()) mergeRemote(snap.data());
      else pushRemote(true);
    }, function(err){ syncState.on=false; syncState.msg='つながりませんでした：'+err.message; render(); });
    render();
  }catch(e){
    syncState.on=false;
    syncState.msg = (e.message === 'EMPTY')   ? 'Firebaseの設定が空です。コンソールの firebaseConfig を貼り付けてください。'
                  : (e.message === 'MISSING') ? 'apiKey と projectId が見当たりません。firebaseConfig 全体を貼り付けてください。'
                  : /Failed to fetch|dynamically imported/.test(e.message) ? 'ネットにつながらないか、ファイルを直接開いています。https:// のURLから開いてください。'
                  : '設定を読み取れませんでした。firebaseConfig の { から } までを貼り付けてください。';
    render();
  }finally{
    syncState.connecting = false;
  }
}
function payload(){
  return {
    plans: S.plans,
    statements: S.statements.map(function(s){
      return { id:s.id, accountId:s.accountId, billingMonth:s.billingMonth, amount:s.amount, memo:s.memo||'', createdAt:s.createdAt||0 };
    }),
    paid: S.paid,
    deleted: S.deleted||[],
    risyu: { selected:S.risyu.selected, earned:S.risyu.earned, otherCr:S.risyu.otherCr, updatedAt:S.risyu.updatedAt||0 },
    days: { smbc:S.settings.smbcDay, rakuten:S.settings.rakutenDay },
    updatedAt: Date.now()
  };
}
function pushRemote(now){
  if(!syncState.on || !syncState.ref) return;
  clearTimeout(syncState.timer);
  var go = async function(){
    var body = payload();
    var sig = JSON.stringify(Object.assign({}, body, {updatedAt:0}));
    if(sig === syncState.last) return;
    try{ await syncState.setDoc(syncState.ref, body); syncState.last = sig; }
    catch(e){ syncState.msg = '送信できませんでした：'+e.message; }
  };
  now ? go() : (syncState.timer = setTimeout(go, 600));
}
function mergeRemote(d){
  var before = JSON.stringify([S.plans, S.statements, S.paid, S.deleted, S.risyu]);
  var dead = {};
  (S.deleted||[]).concat(d.deleted||[]).forEach(function(x){ dead[x]=1; });

  var pm = {}; S.plans.forEach(function(p){ pm[p.id]=p; });
  (d.plans||[]).forEach(function(p){ if(!pm[p.id]) pm[p.id]=p; });
  var sm = {}; S.statements.forEach(function(s){ sm[s.id]=s; });
  (d.statements||[]).forEach(function(s){ if(!sm[s.id]) sm[s.id]=Object.assign({}, s, {hasImage:false}); });

  S.deleted = Object.keys(dead);
  S.plans = Object.keys(pm).map(function(k){ return pm[k]; }).filter(function(p){ return !dead[p.id]; });
  S.statements = Object.keys(sm).map(function(k){ return sm[k]; })
    .filter(function(s){ return !dead[s.id]; })
    .sort(function(a,b){ return (b.createdAt||0)-(a.createdAt||0); });

  var rp = d.paid || {};
  var planIdOf = function(k){ var i = k.indexOf(':'); return i < 0 ? k : k.slice(0, i); };
  Object.keys(rp).forEach(function(k){
    if(dead[planIdOf(k)]) return;               /* 削除済みプランの記録は取り込まない */
    var r = normPaid(rp[k]), l = normPaid(S.paid[k]);
    if(r && (!l || r.t > l.t)) S.paid[k] = r;
  });
  /* 手元に残っている削除済みプランの記録も掃除する */
  Object.keys(S.paid).forEach(function(k){ if(dead[planIdOf(k)]) delete S.paid[k]; });

  if(d.risyu && (Number(d.risyu.updatedAt)||0) > (Number(S.risyu.updatedAt)||0)){
    S.risyu.selected = Array.isArray(d.risyu.selected) ? d.risyu.selected.slice() : [];
    S.risyu.earned = Object.assign({ kyoyo:0, topic:0, lang:0, langEn:0, info:0, health:0, pe:0 }, d.risyu.earned||{});
    S.risyu.otherCr = Number(d.risyu.otherCr)||0;
    S.risyu.updatedAt = Number(d.risyu.updatedAt)||0;
  }
  if(d.days){
    S.settings.smbcDay = d.days.smbc || S.settings.smbcDay;
    S.settings.rakutenDay = d.days.rakuten || S.settings.rakutenDay;
  }
  persist();
  if(before !== JSON.stringify([S.plans, S.statements, S.paid, S.deleted, S.risyu])) render();
  pushRemote();
}

function viewChart(d){
  var cur=thisYm(), future=d.months.filter(function(m){ return m>=cur; });
  var use = chartRange===0?d.months:future.slice(0,chartRange);
  var data = use.map(function(m){ var g=d.byMonth[m]; return { m:m, a:g.smbc.plan+g.smbc.stmt, b:g.rakuten.plan+g.rakuten.stmt }; });
  var max = Math.max(1, Math.max.apply(null, data.map(function(x){ return x.a+x.b; })));
  var W=340, H=190, bottom=H-24, top=8, gap=3;
  var bw = Math.max(4, (W-8)/data.length - gap);
  var unit = Math.ceil(max/10000)*10000 || 1;
  var scale = function(v){ return (bottom-top) * v / unit; };
  var bars = data.map(function(x,i){
    var px = 4 + i*((W-8)/data.length);
    var ha = scale(x.a), hb = scale(x.b);
    var showLabel = data.length<=8 || i%2===0;
    return '<rect x="'+px.toFixed(1)+'" y="'+(bottom-ha).toFixed(1)+'" width="'+bw.toFixed(1)+'" height="'+ha.toFixed(1)+'" fill="var(--smbc)"/>'+
      '<rect x="'+px.toFixed(1)+'" y="'+(bottom-ha-hb).toFixed(1)+'" width="'+bw.toFixed(1)+'" height="'+hb.toFixed(1)+'" fill="var(--rakuten)"/>'+
      (showLabel?'<text x="'+(px+bw/2).toFixed(1)+'" y="'+(H-8)+'" font-size="9" fill="var(--sub)" text-anchor="middle">'+ymShort(x.m)+'</text>':'');
  }).join('');
  var manLabel = function(v){
    var man = v/10000;
    if(man === 0) return '0';
    return (man < 1 || man % 1 !== 0) ? man.toFixed(1) : String(man);
  };
  var grid = [0,.5,1].map(function(f){ var y=bottom-(bottom-top)*f;
    return '<line x1="0" y1="'+y+'" x2="'+W+'" y2="'+y+'" stroke="var(--rule)"/>'+
      '<text x="0" y="'+(y-3)+'" font-size="9" fill="var(--sub)">'+manLabel(unit*f)+'万</text>'; }).join('');

  return section('口座別の必要額', data.length+'ヶ月',
    '<div class="chips">'+[[6,'6ヶ月'],[12,'12ヶ月'],[0,'全期間']].map(function(v){
      return '<button data-act="range" data-v="'+v[0]+'" class="'+(chartRange===v[0]?'on':'')+'">'+v[1]+'</button>'; }).join('')+'</div>'+
    '<svg viewBox="0 0 '+W+' '+H+'" style="width:100%;height:auto">'+grid+bars+'</svg>'+
    '<div class="s" style="margin-top:6px"><span class="dot" style="background:var(--smbc)"></span>三井住友　<span class="dot" style="background:var(--rakuten)"></span>楽天</div>')
  + section('口座ごとの残り総額', null, ['smbc','rakuten'].map(function(acc){
      var sum = future.reduce(function(s,m){ return s+d.byMonth[m][acc].plan+d.byMonth[m][acc].stmt; },0);
      return accRow(acc, sum, '今月以降の合計');
    }).join(''));
}

/* ============================== 明細の写真読み取り ============================== */
async function readStatement(dataUrl){
  var res = await fetch('https://api.anthropic.com/v1/messages', {
    method:'POST',
    headers:{
      'content-type':'application/json',
      'x-api-key':S.settings.apiKey,
      'anthropic-version':'2023-06-01',
      'anthropic-dangerous-direct-browser-access':'true'
    },
    body: JSON.stringify({
      model:'claude-sonnet-5', max_tokens:1000,
      messages:[{ role:'user', content:[
        { type:'image', source:{ type:'base64', media_type:'image/jpeg', data:dataUrl.split(',')[1] } },
        { type:'text', text:'これはクレジットカードの利用明細の写真です。次のJSONだけを返してください。前置きやコードフェンスは不要です。\n{"issuer":"三井住友カード|楽天カード|不明","billing_month":"YYYY-MM または null","total_amount":請求合計の数値,"items":[{"name":"店名など","amount":数値}]}\ntotal_amount はその月の請求合計。読み取れない値は null に。' }
      ]}]
    })
  });
  if(!res.ok) throw new Error('API ' + res.status);
  var data = await res.json();
  var text = (data.content||[]).map(function(c){ return c.type==='text'?c.text:''; }).join('\n').replace(/```json|```/g,'').trim();
  return JSON.parse(text.slice(text.indexOf('{'), text.lastIndexOf('}')+1));
}
async function handlePhoto(file){
  notice = { type:'ok', text:'写真を読み込んでいます…' }; render();
  try{
    var thumb = await resizeImage(file, 480, 0.5);

      try{

        notice = null;
      }catch(e){ notice = { type:'ng', text:'金額を読み取れませんでした。手で入力してください。' }; }
    }else{ notice = null; }
    draft = {
      id:'s_'+Date.now(),
      accountId:(parsed.issuer||'').indexOf('楽天')>=0 ? 'rakuten' : 'smbc',
      billingMonth: isYm(parsed.billing_month) ? parsed.billing_month : thisYm(),
      amount: parsed.total_amount ? String(parsed.total_amount) : '',
      memo: (Array.isArray(parsed.items) ? parsed.items : []).slice(0,2)
              .map(function(i){ return i && i.name ? String(i.name) : ''; })
              .filter(Boolean).join('、'),
      thumb: thumb
    };
  }catch(e){ notice = { type:'ng', text:'写真を読み込めませんでした。別の写真で試してください。' }; }

/* ============================== 支払い：操作 ============================== */
function payAction(act, t){
  if(act==='go-stmt'){ payTab='stmt'; render(); window.scrollTo(0,0); }
  else if(act==='paid'){ var k=t.dataset.key; setPaid(k, !isPaid(k)); commit(); }
  else if(act==='toggle-past'){ hidePast=!hidePast; render(); }
  else if(act==='range'){ chartRange=Number(t.dataset.v); render(); }
  else if(act==='toggle-plan-form'){ showPlanForm=!showPlanForm; render(); }
  else if(act==='pf-acc'){ Array.prototype.forEach.call(t.parentNode.querySelectorAll('button'), function(b){ b.classList.remove('on'); }); t.classList.add('on'); }
  else if(act==='del-plan'){
    var id=t.dataset.id;
    S.deleted=(S.deleted||[]).concat([id]);
    S.plans=S.plans.filter(function(p){ return p.id!==id; });
    Object.keys(S.paid).forEach(function(key){ if(key.indexOf(id+':')===0) delete S.paid[key]; });
    commit();
  }
  else if(act==='add-plan'){
    var name=document.getElementById('pf_name').value.trim();
    var total=Number(document.getElementById('pf_total').value.replace(/[^0-9]/g,''));
    var count=Number(document.getElementById('pf_count').value.replace(/[^0-9]/g,''));
    var start=document.getElementById('pf_start').value;
    var accBtn=document.querySelector('#planform .pick button.on');
    if(!name||!total||!count){ notice={type:'ng',text:'名前・総額・回数を入れてください。'}; render(); return; }
    if(!isYm(start)) start=addMonths(thisYm(),1);
    var monthly=Math.floor(total/count), rem=total-monthly*count;
    S.plans.push({ id:'p_'+Date.now(), name:name, accountId:accBtn?accBtn.dataset.id:'smbc', count:count, monthly:monthly, firstAmount:rem>0?monthly+rem:null, start:start });
    showPlanForm=false; notice={type:'ok',text:name+' を追加しました。月々 '+yen(monthly)+'。'}; commit();
  }
  else if(act==='cam'){ document.getElementById('cam').click(); }
  else if(act==='pick'){ document.getElementById('pickf').click(); }
  else if(act==='manual'){ draft={ id:'s_'+Date.now(), accountId:'smbc', billingMonth:thisYm(), amount:'', memo:'', thumb:null }; notice=null; render(); }
  else if(act==='df-acc'){ readDraftFields(); draft.accountId=t.dataset.id; render(); }
  else if(act==='cancel-stmt'){ draft=null; render(); }
  else if(act==='save-stmt'){
    readDraftFields();
    if(!draft.amount){ notice={type:'ng',text:'金額を入れてください。'}; render(); return; }
    var s={ id:draft.id, accountId:draft.accountId, billingMonth:draft.billingMonth, amount:Number(draft.amount), memo:draft.memo, hasImage:!!draft.thumb, createdAt:Date.now() };
    if(draft.thumb){ try{ localStorage.setItem(imgKey(s.id), draft.thumb); }catch(err){ s.hasImage=false; } }
    S.statements.unshift(s); draft=null;
    notice={type:'ok',text:ymLabel(s.billingMonth)+'に '+yen(s.amount)+' を加算しました。'}; commit();
  }
  else if(act==='del-stmt'){
    var sid=t.dataset.id;
    S.deleted=(S.deleted||[]).concat([sid]);
    S.statements=S.statements.filter(function(x){ return x.id!==sid; });
    try{ localStorage.removeItem(imgKey(sid)); }catch(err){}
    commit();
  }
  else if(act==='view-img'){
    var src=null; try{ src=localStorage.getItem(imgKey(t.dataset.id)); }catch(err){}
    if(!src){ notice={type:'ok',text:'この端末に写真は保存されていません。'}; render(); return; }
    var box=el('<div id="lightbox"><img src="'+src+'" alt="明細"></div>');
    box.addEventListener('click',function(){ box.remove(); });
    document.body.appendChild(box);
  }
  else if(act==='ics'){ makeIcs(); }
  else return false;
  return true;
}
/* ============================== 履修：索引 ============================== */
var byCode = {};
COURSES.forEach(function(c){
  byCode[c.code] = c;
  c.key = norm(c.name + ' ' + c.teacher + ' ' + c.code);
});
var fixedMap = {};
FIXED.forEach(function(f){ f.slots.forEach(function(s){ fixedMap[s.d + s.p] = f; }); });
var slotHas = {};
COURSES.forEach(function(c){ c.slots.forEach(function(s){ var k=s.d+s.p; slotHas[k]=(slotHas[k]||0)+1; }); });

function rSelected(){ return S.risyu.selected.map(function(code){ return byCode[code]; }).filter(Boolean); }
function rIsSelected(code){ return S.risyu.selected.indexOf(code) >= 0; }
function selectedSlotMap(exceptCode){
  var m = {};
  rSelected().forEach(function(c){
    if(c.code === exceptCode) return;
    c.slots.forEach(function(s){ m[s.d + s.p] = c; });
  });
  return m;
}
function hardBlockers(c){
  var out = [];
  c.slots.forEach(function(s){
    var k = s.d + s.p;
    if(fixedMap[k] && !rIncludeOcc) out.push(k + '「' + fixedMap[k].name + '」と重複');
  });
  return out;
}
function swapTargets(c){
  var m = selectedSlotMap(c.code), out = [];
  c.slots.forEach(function(s){
    var o = m[s.d + s.p];
    if(o && out.indexOf(o) < 0) out.push(o);
  });
  return out;
}
function conflicts(c){
  return hardBlockers(c).concat(swapTargets(c).map(function(o){ return '「' + o.name + '」と重複'; }));
}
function ratioClass(r){ return r < 0.5 ? 'r0' : r < 1 ? 'r1' : r < 2 ? 'r2' : 'r3'; }
function ratioText(r){
  var t = r < 0.5 ? '◎ 余裕' : r < 1 ? '○ 定員内' : r < 2 ? '△ 半々' : '▲ 激戦';
  return t + ' ' + r.toFixed(2) + '倍';
}

/* ============================== 履修：単位集計 ============================== */
function tally(){
  var t = { kyoyo:0, topic:0, lang:0, langEn:0, info:0, health:0, pe:0, term:0 };
  FIXED.forEach(function(f){
    if(!f.cat) return;
    var g = CAT_INFO[f.cat] ? CAT_INFO[f.cat].group : null;
    if(g) t[g] += f.cr;
  });
  rSelected().forEach(function(c){
    t[CAT_INFO[c.cat].group] += c.cr;
    if(c.en) t.langEn += c.cr;
    t.term += c.cr;
  });
  return t;
}

function courseRow(c){
  var hard = hardBlockers(c), swap = swapTargets(c), sel = rIsSelected(c.code);
  var b = '<span class="b cat">'+esc(CAT_INFO[c.cat].label)+'</span>'+
          '<span class="b cr">'+c.cr+'単位</span>'+
          '<span class="b '+ratioClass(c.ratio)+'">'+ratioText(c.ratio)+'</span>'+
          (c.en ? '<span class="b en">英語</span>' : '');
  if(sel && conflicts(c).length) b += '<span class="b warn">重複あり</span>';
  else if(!sel && hard.length) b += '<span class="b warn">'+esc(hard[0])+'</span>';
  else if(!sel && swap.length) b += '<span class="b r2">'+esc(swap.map(function(o){return o.name;}).join('・'))+'と差し替え</span>';

  return '<div class="crs'+(!sel && hard.length ? ' dis' : '')+'">'+
    '<div class="body"><div class="ct">'+esc(c.name)+'</div>'+
    '<div class="cm">'+esc(c.slotText)+'\u3000'+esc(c.teacher)+'<br>コード '+c.code+'\u3000定員'+c.cap+'／申込'+c.apps+'</div>'+
    '<div class="badges">'+b+'</div></div>'+
    '<button type="button" class="add'+(sel?' rm':'')+'" data-act="r-toggle" data-code="'+c.code+'"'+
      (!sel && hard.length ? ' disabled' : '')+'>'+(sel?'外す':(swap.length?'差し替え':'入れる'))+'</button></div>';
}

function gridHtml(){
  var selMap = selectedSlotMap(null);
  var h = '<thead><tr><th class="pd"></th>';
  DAYS.forEach(function(d){ h += '<th>'+d+'</th>'; });
  h += '</tr></thead><tbody>';
  PERIODS.forEach(function(p){
    h += '<tr><th class="pd">'+p+'</th>';
    DAYS.forEach(function(d){
      var k = d + p, f = fixedMap[k], s = selMap[k];
      if(f){
        h += '<td class="fx"><span class="cell none"><span class="nm">'+esc(f.name)+'</span><span class="tag">登録済み</span></span></td>';
      }else if(s){
        h += '<td class="sel"><button type="button" class="cell" data-act="r-slot" data-slot="'+k+'">'+
             '<span class="x" data-x="1">外す</span><span class="nm">'+esc(s.name)+'</span>'+
             '<span class="tag">'+esc(s.code)+'・'+s.cr+'単位</span></button></td>';
      }else if(slotHas[k]){
        h += '<td><button type="button" class="cell free" data-act="r-slot" data-slot="'+k+'">＋ '+slotHas[k]+'件</button></td>';
      }else{
        h += '<td><span class="cell none free">—</span></td>';
      }
    });
    h += '</tr>';
  });
  return h + '</tbody>';
}

function selListHtml(){
  var cs = rSelected();
  if(!cs.length) return '<div class="empty">まだ何も選んでいません。上の時間割のマスをタップするか、「履修案」から読み込んでください。</div>';
  var order = {'月':0,'火':1,'水':2,'木':3,'金':4,'土':5};
  cs = cs.slice().sort(function(a,b){
    var A=a.slots[0], B=b.slots[0];
    return (order[A.d]-order[B.d]) || (A.p-B.p);
  });
  return cs.map(courseRow).join('');
}
function codeText(){
  return rSelected().map(function(c){ return c.code + '  ' + c.slotText + '  ' + c.name; }).join('\n');
}

function viewRisyuTt(){
  var cs = rSelected();
  var e = S.risyu.earned;
  return section('卒業要件の埋まりぐあい', '選択中の科目を足した状態',
      '<div id="meters">'+metersHtml()+'</div>'+
      '<details style="margin-top:10px;border-top:1px solid var(--rule);padding-top:10px">'+
      '<summary style="font-size:13px;color:var(--risyu);font-weight:600">すでに修得した単位を入力する</summary>'+
      '<div class="earn-grid">'+
        earnInput('基礎教養科目群','kyoyo',e.kyoyo)+earnInput('トピック等4群','topic',e.topic)+
        earnInput('言語リテラシー','lang',e.lang)+earnInput('うち英語','langEn',e.langEn)+
        earnInput('情報リテラシー','info',e.info)+earnInput('健康・スポーツ科学','health',e.health)+
        earnInput('スポーツ実技ほか','pe',e.pe)+earnInput('今学期の専門・基礎教育','otherCr',S.risyu.otherCr)+
      '</div><p class="note">「今学期の専門・基礎教育」はキャップ制（25単位以下）の計算に使います。</p></details>')
    + '<section><div class="head"><h2>時間割</h2><span>マスをタップして講座を選ぶ</span></div>'+
      '<div class="scroll"><table class="tt" id="tt">'+gridHtml()+'</table></div>'+
      '<p class="note">横にスクロールすると木・金・土が見えます。入れた科目は「外す」で削除、マス本体をタップすると差し替えられます。</p>'+
      '<label class="tg"><input type="checkbox" id="tgOcc"'+(rIncludeOcc?' checked':'')+'>登録済み科目と重なる講座も選べるようにする（隔週・半期科目の確認用）</label></section>'
    + section('選択中の科目', cs.length ? cs.length+'科目 / 計'+cs.reduce(function(a,c){return a+c.cr;},0)+'単位' : null,
      '<div id="warns">'+warnsHtml()+'</div><div id="selList">'+selListHtml()+'</div>'+
      '<div class="pair" style="margin-top:12px"><button class="btn ghost" data-act="r-clear">すべて外す</button>'+
      '<button class="btn ghost" data-act="r-copy">コードをコピー</button></div>'+
      '<textarea class="codebox" id="codebox" readonly>'+esc(codeText())+'</textarea>'+
      '<p class="note">MUSESの抽選登録は「時間割コード」で申し込みます。</p>');
}
function earnInput(label, key, val){
  return '<label>'+esc(label)+'<input type="number" min="0" step="1" data-earn="'+key+'" value="'+(Number(val)||0)+'"></label>';
}

function viewRisyuPlans(){
  return '<section><div class="head"><h2>履修案</h2><span>タップで時間割に読み込み</span></div>'+
    RISYU_PLANS.map(function(p){
      var cs = p.codes.map(function(c){ return byCode[c]; }).filter(Boolean);
      var cr = cs.reduce(function(a,c){ return a+c.cr; },0);
      var worst = cs.reduce(function(a,c){ return Math.max(a,c.ratio); },0);
      return '<div class="plancard"><h3><em>案'+p.id+'</em>'+esc(p.name)+'</h3>'+
        '<p>'+esc(p.note)+'</p>'+
        '<div class="codes">'+cs.map(function(c){
          return c.slotText+'　'+esc(c.name)+'（'+c.code+'・'+c.ratio.toFixed(2)+'倍）'; }).join('<br>')+'</div>'+
        '<div class="badges" style="margin-top:7px"><span class="b cr">'+cs.length+'科目・'+cr+'単位</span>'+
        '<span class="b '+ratioClass(worst)+'">いちばん高い倍率 '+worst.toFixed(2)+'倍</span></div>'+
        '<button class="btn ghost" style="margin-top:10px" data-act="r-plan" data-plan="'+p.id+'">この案を読み込む</button></div>';
    }).join('')+'</section>';
}

/* ============================== 履修：選択シート ============================== */
function openPicker(k){
  var m = k.match(/^([月火水木金土])([1-7])$/);
  if(!m) return;
  pick.d = m[1]; pick.p = parseInt(m[2],10); pick.cat = 'all'; pick.q = '';
  document.getElementById('shSearch').value = '';
  document.getElementById('veil').classList.add('on');
  document.getElementById('sheet').classList.add('on');
  renderPicker();
}
function closePicker(){
  document.getElementById('veil').classList.remove('on');
  document.getElementById('sheet').classList.remove('on');
}
function sheetOpen(){ return document.getElementById('sheet').classList.contains('on'); }

function renderPicker(){
  document.getElementById('shTitle').textContent = pick.d + '曜 ' + pick.p + '限';
  document.getElementById('shDays').innerHTML = DAYS.map(function(d){
    return '<button type="button" class="'+(d===pick.d?'on':'')+'" data-day="'+d+'">'+d+'</button>'; }).join('');
  document.getElementById('shPeriods').innerHTML = PERIODS.map(function(p){
    return '<button type="button" class="'+(p===pick.p?'on':'')+'" data-period="'+p+'">'+p+'限</button>'; }).join('');

  var all = COURSES.filter(function(c){
    return c.slots.some(function(s){ return s.d===pick.d && s.p===pick.p; });
  });
  var cats = [];
  all.forEach(function(c){ if(cats.indexOf(c.cat)<0) cats.push(c.cat); });
  var ch = '<button type="button" class="'+(pick.cat==='all'?'on':'')+'" data-cat="all">すべて '+all.length+'</button>';
  cats.forEach(function(ct){
    var n = all.filter(function(c){ return c.cat===ct; }).length;
    ch += '<button type="button" class="'+(pick.cat===ct?'on':'')+'" data-cat="'+ct+'">'+esc(CAT_INFO[ct].label)+' '+n+'</button>';
  });
  document.getElementById('shCats').innerHTML = ch;

  var q = norm(pick.q.trim());
  var list = all.filter(function(c){
    if(pick.cat !== 'all' && c.cat !== pick.cat) return false;
    if(!q) return true;
    return c.key.indexOf(q) >= 0;
  });
  list.sort(function(a,b){
    var ba = hardBlockers(a).length?1:0, bb = hardBlockers(b).length?1:0;
    if(rIsSelected(a.code)) ba = -1;
    if(rIsSelected(b.code)) bb = -1;
    return (ba-bb) || (a.ratio-b.ratio);
  });

  var body = '';
  var cur = selectedSlotMap(null)[pick.d + pick.p];
  if(cur) body += '<div class="msg ok">この枠には「'+esc(cur.name)+'」が入っています。別の講座の「差し替え」を押すと入れ替わります。</div>';
  var fk = fixedMap[pick.d + pick.p];
  if(fk) body += '<div class="msg ng">この枠は「'+esc(fk.name)+'」で埋まっています。'+
    (rIncludeOcc ? '重複を許可する設定なので選べますが、実際に登録できるか必ず確認してください。' : '下の科目は週2コマ科目の片方としてこの枠を使うものです。')+'</div>';
  if(!list.length) body += '<div class="empty">この条件に合う講座はありません。</div>';
  body += list.map(courseRow).join('');
  var bd = document.getElementById('shBody');
  bd.innerHTML = body;
  bd.scrollTop = 0;
}

/* ============================== 履修：操作 ============================== */
function touchRisyu(){ S.risyu.updatedAt = Date.now(); }
function rToggle(code){
  var c = byCode[code];
  if(!c) return;
  var i = S.risyu.selected.indexOf(code);
  if(i >= 0){
    S.risyu.selected.splice(i,1);
  }else{
    if(hardBlockers(c).length) return;
    swapTargets(c).forEach(function(o){
      var j = S.risyu.selected.indexOf(o.code);
      if(j >= 0) S.risyu.selected.splice(j,1);
    });
    S.risyu.selected.push(code);
  }
  touchRisyu();
  commit();
  if(sheetOpen()) renderPicker();
}
function risyuAction(act, t, ev){
  if(act==='r-slot'){
    var k = t.dataset.slot;
    var selMap = selectedSlotMap(null);
    if(selMap[k] && ev.target.closest('[data-x]')){ rToggle(selMap[k].code); return true; }
    openPicker(k); return true;
  }
  if(act==='r-toggle'){ if(!t.disabled) rToggle(t.dataset.code); return true; }
  if(act==='r-clear'){ S.risyu.selected = []; touchRisyu(); commit(); return true; }
  if(act==='r-plan'){
    var p = RISYU_PLANS.filter(function(x){ return x.id === t.dataset.plan; })[0];
    if(!p) return true;
    S.risyu.selected = p.codes.filter(function(c){ return byCode[c]; });
    touchRisyu(); closePicker(); risyuTab = 'tt'; commit(); window.scrollTo(0,0);
    return true;
  }
  if(act==='r-copy'){
    var box = document.getElementById('codebox');
    if(box){ box.focus(); box.select(); }
    var manual = function(){
      notice = {type:'ok', text:'下の欄が選択されています。長押しか右クリックで「コピー」を選んでください。'};
      render();
    };
    try{
      if(navigator.clipboard && navigator.clipboard.writeText){
        navigator.clipboard.writeText(codeText()).then(function(){
          notice = {type:'ok', text:'時間割コードをコピーしました。'};
          render();
        })['catch'](manual);
      }else{ manual(); }
    }catch(e){ manual(); }
    return true;
  }
  return false;
}
/* ============================== 画面の切り替え ============================== */
var APPS = [['pay','支払い'],['risyu','履修'],['set','設定']];
var PAY_TABS = [['home','ホーム'],['schedule','予定'],['chart','グラフ'],['stmt','明細']];
var RISYU_TABS = [['tt','時間割'],['plans','履修案']];
var TITLES = { pay:'分割払い 支払い管理', risyu:'後期 履修シミュレーター', set:'設定' };
var FOOTS = {
  pay:'金額に分割手数料（金利）は含まれていません。引き落とし日の前日までに入金しておくと安心です。',
  risyu:'単位数は「週1コマ＝1単位／週2コマ＝2単位」での推定です。申込者数は9月7日17時00分時点。正確な単位数と科目区分はシラバスと履修便覧で確認してください。',
  set:'合言葉は他人に教えないでください。Firestoreのセキュリティルールを必ず設定してください。'
};

function render(){
  document.getElementById('apps').innerHTML = APPS.map(function(a){
    return '<button data-app="'+a[0]+'" class="'+(appId===a[0]?'on':'')+'">'+a[1]+'</button>';
  }).join('');

  var nav = document.getElementById('nav');
  var tabs = appId==='pay' ? PAY_TABS : appId==='risyu' ? RISYU_TABS : null;
  if(tabs){
    var cur = appId==='pay' ? payTab : risyuTab;
    nav.className = '';
    nav.innerHTML = tabs.map(function(t){
      return '<button data-tab="'+t[0]+'" class="'+(cur===t[0]?'on':'')+'">'+t[1]+'</button>';
    }).join('');
  }else{
    nav.className = 'hide'; nav.innerHTML = '';
  }

  var html = notice ? '<div class="msg '+notice.type+'">'+esc(notice.text)+'</div>' : '';
  if(appId==='pay'){
    var d = derive();
    html += ({ home:viewHome, schedule:viewSchedule, chart:viewChart, stmt:viewStmt })[payTab](d);
  }else if(appId==='risyu'){
    html += risyuTab==='plans' ? viewRisyuPlans() : viewRisyuTt();
  }else{
    html += viewSettings();
  }
  document.getElementById('app').innerHTML = html;
  document.getElementById('apptitle').textContent = TITLES[appId];
  document.getElementById('foot').textContent = FOOTS[appId];
  document.getElementById('synctag').textContent = syncState.on
    ? '同期中・合言葉 ' + S.settings.room
    : '支払いと履修をひとつに。同期は設定タブから';
}

/* ============================== イベント ============================== */
document.getElementById('apps').addEventListener('click', function(e){
  var b = e.target.closest('button[data-app]'); if(!b) return;
  appId = b.dataset.app; notice = null; closePicker(); render(); window.scrollTo(0,0);
});
document.getElementById('nav').addEventListener('click', function(e){
  var b = e.target.closest('button[data-tab]'); if(!b) return;
  if(appId==='pay') payTab = b.dataset.tab; else risyuTab = b.dataset.tab;
  notice = null; render(); window.scrollTo(0,0);
});

document.getElementById('app').addEventListener('click', function(e){
  var t = e.target.closest('[data-act]'); if(!t) return;
  var act = t.dataset.act;
  if(act.indexOf('r-') === 0){ risyuAction(act, t, e); return; }
  if(payAction(act, t)) return;
  settingsAction(act, t);
});

function settingsAction(act, t){
  if(act==='save-sync'){
    S.settings.room = document.getElementById('sy_room').value.trim();
    S.settings.fbConfig = document.getElementById('sy_cfg').value.trim();
    persist();
    if(!S.settings.room || !S.settings.fbConfig){
      syncState.on=false;
      syncState.msg='合言葉とFirebaseの設定の両方を入れてから押してください。';
      render();
      return;
    }
    syncState.on=false; syncState.msg='接続しています…'; render(); initSync();
  }
  else if(act==='save-days'){
    S.settings.smbcDay = Math.min(31, Math.max(1, Number(document.getElementById('sy_smbc').value)||27));
    S.settings.rakutenDay = Math.min(31, Math.max(1, Number(document.getElementById('sy_rakuten').value)||27));
    notice={type:'ok',text:'引き落とし日を保存しました。'}; commit();
  }
  else if(act==='save-key'){
    S.settings.apiKey = document.getElementById('sy_key').value.trim();
    persist(); notice={type:'ok',text:'保存しました。'}; render();
  }
  else if(act==='export'){
    download(new Blob([JSON.stringify(Object.assign({ app:'kurashi', version:2 }, payload()))],{type:'application/json'}),
      'kurashi_'+thisYm()+'.json');
  }
  else if(act==='import'){ document.getElementById('imp').click(); }
}

document.getElementById('app').addEventListener('change', async function(e){
  var id = e.target.id;
  if(id==='cam' || id==='pickf'){ var f=e.target.files[0]; e.target.value=''; if(f) handlePhoto(f); }
  if(id==='tgOcc'){ rIncludeOcc = e.target.checked; render(); if(sheetOpen()) renderPicker(); }
  if(id==='imp'){
    var g=e.target.files[0]; e.target.value=''; if(!g) return;
    try{
      var txt = await g.text();
      var d = JSON.parse(txt);
      if(d.app!=='kurashi' && d.app!=='shiharai') throw new Error('形式');
      if(d.risyu) d.risyu.updatedAt = Date.now();
      mergeRemote(d);
      notice={type:'ok',text:'読み込みました。'}; render();
    }catch(err){ notice={type:'ng',text:'読み込めませんでした。書き出したファイルを選んでください。'}; render(); }
  }
});

/* 既修得単位は打っている途中で全体を描き直さない（入力欄からカーソルが外れるため） */
document.getElementById('app').addEventListener('input', function(e){
  var k = e.target.getAttribute('data-earn');
  if(!k) return;
  var v = parseInt(e.target.value, 10);
  if(isNaN(v) || v < 0) v = 0;
  if(k==='otherCr') S.risyu.otherCr = v; else S.risyu.earned[k] = v;
  touchRisyu();
  var m = document.getElementById('meters'); if(m) m.innerHTML = metersHtml();
  var w = document.getElementById('warns'); if(w) w.innerHTML = warnsHtml();
  persist(); pushRemote();
});

/* 選択シート */
document.getElementById('shBody').addEventListener('click', function(e){
  var b = e.target.closest('[data-act]');
  if(b && !b.disabled) risyuAction(b.dataset.act, b, e);
});
document.getElementById('shDays').addEventListener('click', function(e){
  var b = e.target.closest('[data-day]'); if(!b) return;
  pick.d = b.dataset.day; pick.cat='all'; renderPicker();
});
document.getElementById('shPeriods').addEventListener('click', function(e){
  var b = e.target.closest('[data-period]'); if(!b) return;
  pick.p = parseInt(b.dataset.period,10); pick.cat='all'; renderPicker();
});
document.getElementById('shCats').addEventListener('click', function(e){
  var b = e.target.closest('[data-cat]'); if(!b) return;
  pick.cat = b.dataset.cat; renderPicker();
});
document.getElementById('shSearch').addEventListener('input', function(e){ pick.q = e.target.value; renderPicker(); });
document.getElementById('shClose').addEventListener('click', closePicker);
document.getElementById('veil').addEventListener('click', closePicker);
document.addEventListener('keydown', function(e){ if(e.key === 'Escape') closePicker(); });

render();
initSync();
</script>
