/* ============================== バナー ============================== */
function banners(){
  var out = [], d = derive(), cur = thisYm(), td = today();

  /* 天気・バス遅延 */
  if(weather.alert) out.push({c:'amber', ic:'⚠', t:weather.alert});

  /* 支払い前日・当日 */
  [['smbc',S.settings.smbcDay],['rakuten',S.settings.rakutenDay]].forEach(function(p){
    var g = d.byMonth[cur] ? d.byMonth[cur][p[0]] : null;
    if(!g) return;
    var amt = g.plan + g.stmt; if(amt <= 0) return;
    var n = daysUntil(p[1]);
    if(n === 0) out.push({c:'red', ic:'●', t:'<b>今日は'+ACCOUNTS[p[0]].bank+'の引き落とし日</b>です。'+yen(amt)+' を用意してください。'});
    else if(n === 1) out.push({c:'red', ic:'●', t:'<b>明日は'+ACCOUNTS[p[0]].bank+'の引き落とし日</b>です。'+yen(amt)+' の入金を今日のうちに。'});
    else if(n <= 3) out.push({c:'amber', ic:'●', t:ACCOUNTS[p[0]].bank+'の引き落としまであと'+n+'日（'+yen(amt)+'）。'});
  });

  /* 課題の締切 */
  var near = S.tasks.filter(function(t){ return !t.done && isYmd(t.due); })
    .map(function(t){ return Object.assign({}, t, {left: daysFromToday(t.due)}); })
    .filter(function(t){ return t.left !== null && t.left <= 3; })
    .sort(function(a,b){ return a.left - b.left; });
  near.forEach(function(t){
    var w = t.left < 0 ? '<b>期限を過ぎています</b>' : t.left === 0 ? '<b>今日が締切</b>' : t.left === 1 ? '<b>明日が締切</b>' : 'あと'+t.left+'日';
    out.push({c: t.left <= 1 ? 'red' : 'amber', ic:'✎', t:'課題「'+esc(t.title)+'」'+(t.subject?'（'+esc(t.subject)+'）':'')+'は'+w+'です。'});
  });

  /* テスト */
  S.exams.filter(function(x){ return isYmd(x.date); }).forEach(function(x){
    var n = daysFromToday(x.date);
    if(n === null || n < 0 || n > 7) return;
    out.push({c: n <= 1 ? 'red' : 'blue', ic:'📖', t:(x.subject?esc(x.subject):'テスト')+'のテストは'+(n===0?'<b>今日</b>':n===1?'<b>明日</b>':'あと'+n+'日')+'です。'+(x.room?'（'+esc(x.room)+'）':'')});
  });

  /* 履修登録の締切 */
  if(isYmd(S.settings.regDeadline)){
    var r = daysFromToday(S.settings.regDeadline);
    if(r !== null && r >= 0 && r <= 7)
      out.push({c: r <= 2 ? 'red' : 'amber', ic:'🗓', t:'<b>履修登録の締切まであと'+r+'日</b>です（'+ymdLabel(S.settings.regDeadline)+'）。'});
  }

  /* 出席の残り */
  Object.keys(S.attend).forEach(function(k){
    var a = S.attend[k]; if(!a) return;
    var lim = toNum(a.limit)||5, ab = toNum(a.ab);
    if(ab >= lim) out.push({c:'red', ic:'△', t:'<b>'+esc(k)+'</b> の欠席が'+ab+'回で上限（'+lim+'回）に達しています。'});
    else if(lim - ab <= 1) out.push({c:'amber', ic:'△', t:esc(k)+' の欠席はあと'+(lim-ab)+'回で上限です。'});
  });

  /* 健康の期限 */
  S.health.filter(function(h){ return isYmd(h.next); }).forEach(function(h){
    var n = daysFromToday(h.next);
    if(n === null || n > 30) return;
    out.push({c: n < 0 ? 'red' : n <= 7 ? 'amber' : 'green', ic:'＋',
      t: esc(h.name)+'の期限は'+ymdLabel(h.next)+(n<0?'（<b>過ぎています</b>）':'（あと'+n+'日）')+'です。'});
  });

  /* 引き落とし前日：口座に足りるか */
  [['smbc',S.settings.smbcDay],['rakuten',S.settings.rakutenDay]].forEach(function(p){
    var n = daysUntil(p[1]); if(n !== 1) return;
    var g = d.byMonth[cur] ? d.byMonth[cur][p[0]] : null; if(!g) return;
    var amt = g.plan + g.stmt; if(amt <= 0) return;
    var bank = S.balances.filter(function(x){ return norm(x.name).indexOf(norm(ACCOUNTS[p[0]].bank.slice(0,2)))>=0; })[0];
    if(bank && toNum(bank.amount) < amt)
      out.push({c:'red', ic:'¥', t:'<b>'+esc(bank.name)+'の残高が'+yen(amt-toNum(bank.amount))+'足りません。</b>明日の引き落としまでに入金してください。'});
  });
  /* 写真の容量 */
  try{
    var si = storageInfo();
    if(si.pct >= 85) out.push({c:'red', ic:'!', t:'<b>写真の保存がいっぱいに近づいています（'+si.pct+'%）。</b>設定から古い写真を消してください。'});
    else if(si.pct >= 70) out.push({c:'amber', ic:'!', t:'写真の保存が'+si.pct+'%になりました。'});
  }catch(e){}
  /* 締切が近い課題（50）*/
  var lead = toNum(S.ui.dueLead);
  if(lead > 0){
    var soon = S.tasks.filter(function(t){
      if(t.done || !isYmd(t.due)) return false;
      var n = daysFromToday(t.due);
      return n >= 0 && n <= lead;
    });
    if(soon.length) out.push({c:'amber', ic:'✎', t:'あと'+lead+'日以内の課題が<b>'+soon.length+'件</b>あります。'});
  }
  /* お金の状態 */
  var b = budget();
  if(b.level === 'bad') out.push({c:'red', ic:'¥', t:'<b>今月は'+yen(-b.free)+'足りません。</b>収入と支払いの登録を見直してください。'});
  else if(b.level === 'warn') out.push({c:'amber', ic:'¥', t:'口座と収入を合わせても、今月自由に使えるのは'+yen(b.free)+'。かなりギリギリです。'});

  return out;
}

/* ============================== 今日ページ ============================== */
/* その日にやること・注意・重要を1つにまとめる（カレンダー・時間割から拾う） */
function focusItemsFor(ymd){
  var out = [];
  var show = function(src){
    var h = S.ui.weekHide || {};
    return !h[src];
  };
  /* カレンダーに入れた予定を全部（種類でしぼれる） */
  normItems().forEach(function(x){
    if(!isYmd(x.date)) return;
    if(x.plain) return;                                   /* ToDoで足したものは出さない */
    if(!show(x.src)) return;
    if(x.date === ymd || (x.span && coversDay(x, ymd))) out.push(x);
  });
  /* 休講・遠隔・補講 */
  if(show('chg')){
    changesOn(ymd).forEach(function(h){
      var ty = changeType(h), nm = ({cancel:'休講',online:'遠隔',makeup:'補講',holclass:'祝日でも授業あり'})[ty];
      out.push({ src:'chg', id:h.id, date:ymd, title:(h.course==='*'?'全休':h.course)+'　'+nm,
        sub:(ty==='makeup'&&h.period?h.period+'限':'')+(h.room?' '+h.room:''), time:'',
        colorRaw: ty==='cancel'?'var(--rakuten)':ty==='online'?'var(--e6)':ty==='holclass'?'var(--holi)':'var(--ok)', mt:h.mt||0 });
    });
    classesForDate(ymd).forEach(function(c){
      if(c.off==='biweek') out.push({ src:'chg', id:'bw'+c.name, date:ymd, title:c.name+'　今週なし（隔週）', sub:'', time:'', colorRaw:'var(--sub)', mt:0 });
    });
  }
  /* 引き落とし */
  if(show('pay')) payItemsOn(ymd).forEach(function(x){ out.push(x); });
  /* 健康の期限 */
  if(show('health')) S.health.forEach(function(h){ if(h.next===ymd) out.push({ src:'health', id:h.id, date:ymd, title:h.name+'（期限）', sub:h.memo||'', time:'', colorRaw:colorOf('c5'), mt:h.mt||0 }); });
  return out.sort(function(a,b){
    var ta = a.time || '99:99', tb = b.time || '99:99';
    if(ta !== tb) return ta.localeCompare(tb);
    return (Number(a.mt)||0) - (Number(b.mt)||0);
  });
}
function focusRow(x){
  var label = ({imp:'重要',exam:'大テスト',kousa:'考査',quiz:'小テスト',task:'課題',chg:'授業の変更',work:'バイト',pay:'引落',health:'期限'})[x.src] || '';
  var isTask = (x.src === 'task');
  var isTest = (x.src==='quiz' || x.src==='exam' || x.src==='kousa');
  var showProg = isTest && S.ui.showProg !== 0;
  var clickable = x.edit || ['task','quiz','exam','kousa','imp'].indexOf(x.src)>=0;
  var sb = String(x.sub||''); if(sb && sb.indexOf(label)===0) sb = sb.slice(label.length).replace(/^・/,'');
  /* 時刻の言い方を予定の種類に合わせる */
  var tl = isTask ? (x.time ? x.time+' まで' : '締切')
         : isTest ? (x.time ? x.time+' 開始' : '')
         : (x.src==='work' ? '' : (x.time ? x.time+' 〜' : '終日'));
  if(x.src==='work'){
    var w0 = S.shifts.filter(function(z){ return z.id===x.id; })[0];
    if(w0){ var hh0 = shiftHours(w0), ot0 = toNum(w0.ot);
      tl = (w0.start||'')+'〜'+(w0.end||'')+(hh0?'（'+hh0+'時間'+(ot0?'・残業'+ot0+'分':'')+'）':''); sb = ''; }
  }
  var meta = [label, tl, sb].filter(Boolean).join('・');
  return '<div class="frow'+(isTask&&x.done?' isdone':'')+'">'+
    '<span class="fdot'+(isTask&&x.done?' done':'')+'" style="'+((isTask&&x.done)?'border-color:'+itemColor(x):'background:'+itemColor(x))+'"></span>'+
    (isTask ? '<button class="chk sm'+(x.done?' on':'')+'" data-act="'+(x.done?'task-undone':'task-done')+'" data-id="'+x.id+'" aria-label="終わった">'+(x.done?'✓':'')+'</button>' : '')+
    (showProg ? '<button class="progb sm" data-act="prog-step" data-id="'+x.id+'" title="'+esc(progLabel(x.id))+'">'+progIcon(x.id)+'</button>' : '')+
    '<span class="grow" '+(clickable?'data-act="ev-open" data-src="'+x.src+'" data-id="'+x.id+'" role="button"':'')+'>'+
      '<span class="ft">'+esc(x.title)+'</span>'+
      '<span class="fs">'+esc(meta)+(showProg?'・'+esc(progLabel(x.id)):'')+'</span></span>'+
    (clickable?'<span class="s2">›</span>':'')+'</div>';
}
/* 今日の「やること・注意」カード（一番上に置く） */
function focusCard(ymd, title){
  var items = focusItemsFor(ymd);
  var late = S.tasks.filter(function(t){ return !t.done && isYmd(t.due) && t.due < today(); });
  var head = '';
  if(ymd === today() && late.length) head += '<div class="bn red"><span class="ic">!</span><span><b>期限切れの課題が'+late.length+'件</b>あります。ToDoから確認してください。</span></div>';
  if(!items.length && !head) return section(title, '', '<div class="empty" style="padding:10px 0">特に注意することはありません。</div>');
  return section(title, items.length?items.length+'件':'', head + items.map(focusRow).join(''));
}

/* 「今週」：月〜日のやること・注意を1画面で */
var weekOff = null;   /* null なら自動（土日は翌週） */
function viewWeekTab(){
  var now = new Date(), dow = now.getDay();
  if(weekOff === null) weekOff = (dow===0 || dow===6) ? 1 : 0;
  var mon = new Date(now); mon.setDate(now.getDate() - ((dow+6)%7) + weekOff*7);
  var sun = new Date(mon); sun.setDate(mon.getDate()+6);
  var all = []; for(var i=0;i<7;i++){ all = all.concat(focusItemsFor(toYmd(new Date(mon.getFullYear(),mon.getMonth(),mon.getDate()+i)))); }
  var n = function(src){ return all.filter(function(x){ return x.src===src; }).length; };
  var label = weekOff===0?'今週':weekOff===1?'来週':weekOff===-1?'先週':(weekOff>0?weekOff+'週あと':(-weekOff)+'週前');
  var html = '<div class="head"><h2>'+label+'</h2><span>'+(mon.getMonth()+1)+'/'+mon.getDate()+'〜'+(sun.getMonth()+1)+'/'+sun.getDate()+'</span></div>';
  html += '<div class="pillrow"><button class="mini" data-act="wk-off" data-v="-1">‹ 前週</button>'+
    '<button data-act="wk-set" data-v="0" class="'+(weekOff===0?'on':'')+'">今週</button>'+
    '<button data-act="wk-set" data-v="1" class="'+(weekOff===1?'on':'')+'">来週</button>'+
    '<button class="mini" data-act="wk-off" data-v="1">次週 ›</button></div>';
  var parts = {};
  parts.days = function(){ return '<div class="box">'+weekFocus(mon)+'</div>'; };
  parts.notes = function(){
    var dates = {}; DAYS.forEach(function(d,i){ var x=new Date(mon); x.setDate(mon.getDate()+i); dates[d]=toYmd(x); });
    return weekNotes(dates);
  };
  pageOrder('week').forEach(function(id){ if(parts[id] && !pageHidden('week', id)) html += parts[id](); });
  return html;
}

/* ============================== お金：グラフ ============================== */
function viewChart(d){
  var cur=thisYm(), future=d.months.filter(function(m){ return m>=cur; });
  var use = chartRange===0?d.months:future.slice(0,chartRange);
  var data = use.map(function(m){ var g=d.byMonth[m]; return { m:m, a:g.smbc.plan+g.smbc.stmt, b:g.rakuten.plan+g.rakuten.stmt }; });
  var max = Math.max(1, Math.max.apply(null, data.map(function(x){ return x.a+x.b; })));
  var W=340, H=190, bottom=H-24, top=8, gap=3;
  var bw = Math.max(4, (W-8)/data.length - gap);
  var unit = Math.ceil(max/10000)*10000 || 1;
  var scale = function(v){ return (bottom-top) * v / unit; };
  var bars = data.map(function(x,i){
    var px = 4 + i*((W-8)/data.length);
    var ha = scale(x.a), hb = scale(x.b);
    var showLabel = data.length<=8 || i%2===0;
    return '<rect x="'+px.toFixed(1)+'" y="'+(bottom-ha).toFixed(1)+'" width="'+bw.toFixed(1)+'" height="'+ha.toFixed(1)+'" fill="var(--smbc)"/>'+
      '<rect x="'+px.toFixed(1)+'" y="'+(bottom-ha-hb).toFixed(1)+'" width="'+bw.toFixed(1)+'" height="'+hb.toFixed(1)+'" fill="var(--rakuten)"/>'+
      (showLabel?'<text x="'+(px+bw/2).toFixed(1)+'" y="'+(H-8)+'" font-size="9" fill="var(--sub)" text-anchor="middle">'+ymShort(x.m)+'</text>':'');
  }).join('');
  var manLabel = function(v){
    var man = v/10000;
    if(man === 0) return '0';
    return (man < 1 || man % 1 !== 0) ? man.toFixed(1) : String(man);
  };
  var grid = [0,.5,1].map(function(f){ var y=bottom-(bottom-top)*f;
    return '<line x1="0" y1="'+y+'" x2="'+W+'" y2="'+y+'" stroke="var(--rule)"/>'+
      '<text x="0" y="'+(y-3)+'" font-size="9" fill="var(--sub)">'+manLabel(unit*f)+'万</text>'; }).join('');

  return section('口座別の必要額', data.length+'ヶ月',
    '<div class="chips">'+[[6,'6ヶ月'],[12,'12ヶ月'],[0,'全期間']].map(function(v){
      return '<button data-act="range" data-v="'+v[0]+'" class="'+(chartRange===v[0]?'on':'')+'">'+v[1]+'</button>'; }).join('')+'</div>'+
    '<svg viewBox="0 0 '+W+' '+H+'" style="width:100%;height:auto">'+grid+bars+'</svg>'+
    '<div class="s" style="margin-top:6px"><span class="dot" style="background:var(--smbc)"></span>三井住友　<span class="dot" style="background:var(--rakuten)"></span>楽天</div>')
  + section('口座ごとの残り総額', null, ['smbc','rakuten'].map(function(acc){
      var sum = future.reduce(function(s,m){ return s+d.byMonth[m][acc].plan+d.byMonth[m][acc].stmt; },0);
      return accRow(acc, sum, '今月以降の合計');
    }).join(''));
}

/* ============================== 明細の写真読み取り ============================== */
async function readStatement(dataUrl){
  var res = await fetch('https://api.anthropic.com/v1/messages', {
    method:'POST',
    headers:{
      'content-type':'application/json',
      'x-api-key':S.settings.apiKey,
      'anthropic-version':'2023-06-01',
      'anthropic-dangerous-direct-browser-access':'true'
    },
    body: JSON.stringify({
      model:'claude-sonnet-5', max_tokens:1000,
      messages:[{ role:'user', content:[
        { type:'image', source:{ type:'base64', media_type:'image/jpeg', data:dataUrl.split(',')[1] } },
        { type:'text', text:'これはクレジットカードの利用明細の写真です。次のJSONだけを返してください。前置きやコードフェンスは不要です。\n{"issuer":"三井住友カード|楽天カード|不明","billing_month":"YYYY-MM または null","total_amount":請求合計の数値,"items":[{"name":"店名など","amount":数値}]}\ntotal_amount はその月の請求合計。読み取れない値は null に。' }
      ]}]
    })
  });
  if(!res.ok) throw new Error('API ' + res.status);
  var data = await res.json();
  var text = (data.content||[]).map(function(c){ return c.type==='text'?c.text:''; }).join('\n').replace(/```json|```/g,'').trim();
  return JSON.parse(text.slice(text.indexOf('{'), text.lastIndexOf('}')+1));
}
async function handlePhoto(file){
  toast('写真を読み込んでいます…');
  try{
    var thumb = await resizeImage(file, 480, 0.5);
    var parsed = {};
    if(S.settings.apiKey){
      try{
        var big = await resizeImage(file, 1400, 0.8);
        parsed = await readStatement(big);
      }catch(e){ toast('金額を読み取れませんでした。手で入力してください。', true); }
    }
    draft = {
      id:uid('s'),
      accountId:(parsed.issuer||'').indexOf('楽天')>=0 ? 'rakuten' : 'smbc',
      billingMonth: isYm(parsed.billing_month) ? parsed.billing_month : thisYm(),
      amount: parsed.total_amount ? String(parsed.total_amount) : '',
      memo: (Array.isArray(parsed.items) ? parsed.items : []).slice(0,2)
              .map(function(i){ return i && i.name ? String(i.name) : ''; }).filter(Boolean).join('、'),
      thumb: thumb
    };
  }catch(e){ toast('写真を読み込めませんでした。別の写真で試してください。', true); }
  render();
}

  else if(act==='edit-bal'){
    var b=S.balances.filter(function(x){ return x.id===t.dataset.id; })[0];

  else return false;
  return true;
}

/* ===== 扶養の壁（91）===== */
function yearPayTotal(y){
  /* その年に「支払われた」ぶん（25日払い基準） */
  var total = 0;
  Object.keys(S.payApplied||{}).forEach(function(ym){
    var rec = S.payApplied[ym];
    var p = payPeriod(ym);
    if(String(p.payDay).slice(0,4) === String(y)) total += toNum(rec.amount);
  });
  /* まだ入れていない期間は見込みで足す */
  for(var m=1;m<=12;m++){
    var ym2 = y+'-'+pad(m);
    if(S.payApplied && S.payApplied[ym2]) continue;
    var amt = periodPay(ym2);
    if(amt) total += amt;
  }
  return total;
}
function fuyouCard(){
  var y = new Date().getFullYear();
  var total = yearPayTotal(y);
  var walls = [[1030000,'103万'],[1300000,'130万']];
  var limit = toNum(S.settings.fuyouLimit) || 1030000;
  var pct = Math.min(100, Math.round(total/limit*100));
  var rest = limit - total;
  var cls = pct>=90 ? 'over' : pct>=75 ? '' : 'done';
  var msg = rest > 0
    ? 'あと '+yen(rest)+' で '+(limit===1030000?'103万':'130万')+' に届きます。'
    : '<b>'+(limit===1030000?'103万':'130万')+'を超えています。</b>おうちの人に相談してください。';
  return section('扶養の壁', y+'年の見込み '+yen(total),
    '<div class="bar" style="margin-bottom:8px"><i class="'+cls+'" style="width:'+pct+'%"></i></div>'+
    '<div class="msg '+(pct>=90?'ng':'ok')+'" style="margin-bottom:12px">'+msg+'</div>'+
    '<div class="pillrow">'+walls.map(function(w){
      return '<button data-act="fuyou-set" data-v="'+w[0]+'" class="'+(limit===w[0]?'on':'')+'">'+w[1]+'で見る</button>';
    }).join('')+'</div>'+
    '<p class="note">25日に振り込まれた実際の額と、これからのシフトの見込みを足しています。交通費も含みます。</p>');
}

  return section('年間の給与', y+'年',

var byCode = {};
COURSES.forEach(function(c){
  byCode[c.code] = c;
  c.key = norm(c.name + ' ' + c.teacher + ' ' + c.code);
});
var fixedMap = {};
FIXED.forEach(function(f){ f.slots.forEach(function(s){ fixedMap[s.d + s.p] = f; }); });
var slotHas = {};
COURSES.forEach(function(c){ c.slots.forEach(function(s){ var k=s.d+s.p; slotHas[k]=(slotHas[k]||0)+1; }); });

function rSelected(){ return S.risyu.selected.map(function(code){ return byCode[code]; }).filter(Boolean); }
function rIsSelected(code){ return S.risyu.selected.indexOf(code) >= 0; }
function selectedSlotMap(exceptCode){
  var m = {};
  rSelected().forEach(function(c){
    if(c.code === exceptCode) return;
    c.slots.forEach(function(s){ m[s.d + s.p] = c; });
  });
  return m;
}
function hardBlockers(c){
  var out = [];
  c.slots.forEach(function(s){
    var k = s.d + s.p;
    if(fixedMap[k] && !rIncludeOcc) out.push(k + '「' + fixedMap[k].name + '」と重複');
  });
  return out;
}
function swapTargets(c){
  var m = selectedSlotMap(c.code), out = [];
  c.slots.forEach(function(s){
    var o = m[s.d + s.p];
    if(o && out.indexOf(o) < 0) out.push(o);
  });
  return out;
}
function conflicts(c){
  return hardBlockers(c).concat(swapTargets(c).map(function(o){ return '「' + o.name + '」と重複'; }));
}
function ratioClass(r){ return r < 0.5 ? 'r0' : r < 1 ? 'r1' : r < 2 ? 'r2' : 'r3'; }
function ratioText(r){
  var t = r < 0.5 ? '◎ 余裕' : r < 1 ? '○ 定員内' : r < 2 ? '△ 半々' : '▲ 激戦';
  return t + ' ' + r.toFixed(2) + '倍';
}

function tally(){
  var t = { kyoyo:0, topic:0, lang:0, langEn:0, info:0, health:0, pe:0, term:0 };
  FIXED.forEach(function(f){
    if(!f.cat) return;
    var g = CAT_INFO[f.cat] ? CAT_INFO[f.cat].group : null;
    if(g) t[g] += f.cr;
  });
  rSelected().forEach(function(c){
    t[CAT_INFO[c.cat].group] += c.cr;
    if(c.en) t.langEn += c.cr;
    t.term += c.cr;
  });
  return t;
}

function openPicker(k){
  var m = k.match(/^([月火水木金土])([1-7])$/);
  if(!m) return;
  pick.d = m[1]; pick.p = parseInt(m[2],10); pick.cat = 'all'; pick.q = '';
  document.getElementById('shSearch').value = '';
  document.getElementById('veil').classList.add('on');
  document.getElementById('sheet').classList.add('on');
  renderPicker();
}
function closePicker(){
  document.getElementById('veil').classList.remove('on');
  document.getElementById('sheet').classList.remove('on');
}
function sheetOpen(){ return document.getElementById('sheet').classList.contains('on'); }
function renderPicker(){
  document.getElementById('shTitle').textContent = pick.d + '曜 ' + pick.p + '限';
  document.getElementById('shDays').innerHTML = DAYS.map(function(d){
    return '<button type="button" class="'+(d===pick.d?'on':'')+'" data-day="'+d+'">'+d+'</button>'; }).join('');
  document.getElementById('shPeriods').innerHTML = PERIODS.map(function(p){
    return '<button type="button" class="'+(p===pick.p?'on':'')+'" data-period="'+p+'">'+p+'限</button>'; }).join('');

  var all = COURSES.filter(function(c){
    return c.slots.some(function(s){ return s.d===pick.d && s.p===pick.p; });
  });
  var cats = [];
  all.forEach(function(c){ if(cats.indexOf(c.cat)<0) cats.push(c.cat); });
  var ch = '<button type="button" class="'+(pick.cat==='all'?'on':'')+'" data-cat="all">すべて '+all.length+'</button>';
  cats.forEach(function(ct){
    var n = all.filter(function(c){ return c.cat===ct; }).length;
    ch += '<button type="button" class="'+(pick.cat===ct?'on':'')+'" data-cat="'+ct+'">'+esc(CAT_INFO[ct].label)+' '+n+'</button>';
  });
  document.getElementById('shCats').innerHTML = ch;

  var q = norm(pick.q.trim());
  var list = all.filter(function(c){
    if(pick.cat !== 'all' && c.cat !== pick.cat) return false;
    if(!q) return true;
    return c.key.indexOf(q) >= 0;
  });
  list.sort(function(a,b){
    var ba = hardBlockers(a).length?1:0, bb = hardBlockers(b).length?1:0;
    if(rIsSelected(a.code)) ba = -1;
    if(rIsSelected(b.code)) bb = -1;
    return (ba-bb) || (a.ratio-b.ratio);
  });

  var body = '';
  var cur = selectedSlotMap(null)[pick.d + pick.p];
  if(cur) body += '<div class="msg ok">この枠には「'+esc(cur.name)+'」が入っています。別の講座の「差し替え」を押すと入れ替わります。</div>';
  var fk = fixedMap[pick.d + pick.p];
  if(fk) body += '<div class="msg ng">この枠は「'+esc(fk.name)+'」で埋まっています。'+
    (rIncludeOcc ? '重複を許可する設定なので選べますが、実際に登録できるか必ず確認してください。' : '下の科目は週2コマ科目の片方としてこの枠を使うものです。')+'</div>';
  if(!list.length) body += '<div class="empty">この条件に合う講座はありません。</div>';
  body += list.map(courseRow).join('');
  var bd = document.getElementById('shBody');
  bd.innerHTML = body;
  bd.scrollTop = 0;
}

/* ============================== 履修：操作 ============================== */
function touchRisyu(){ S.risyu.updatedAt = Date.now(); }
function rToggle(code){
  var c = byCode[code];
  if(!c) return;
  var i = S.risyu.selected.indexOf(code);
  if(i >= 0){
    S.risyu.selected.splice(i,1);
  }else{
    if(hardBlockers(c).length) return;
    swapTargets(c).forEach(function(o){
      var j = S.risyu.selected.indexOf(o.code);
      if(j >= 0) S.risyu.selected.splice(j,1);
    });
    S.risyu.selected.push(code);
  }
  touchRisyu();
  commit();
  if(sheetOpen()) renderPicker();
}
function risyuAction(act, t, ev){
  if(act==='r-slot'){
    var k = t.dataset.slot;
    var selMap = selectedSlotMap(null);
    if(selMap[k] && ev.target.closest('[data-x]')){ rToggle(selMap[k].code); return true; }
    openPicker(k); return true;
  }
  if(act==='r-toggle'){ if(!t.disabled) rToggle(t.dataset.code); return true; }
  if(act==='r-clear'){ S.risyu.selected = []; touchRisyu(); toast('すべて外しました'); commit(); return true; }
  if(act==='r-plan'){
    var p = RISYU_PLANS.filter(function(x){ return x.id === t.dataset.plan; })[0];
    if(!p) return true;
    S.risyu.selected = p.codes.filter(function(c){ return byCode[c]; });
    touchRisyu(); closePicker(); risyuTab = 'tt'; toast('案'+p.id+'を読み込みました'); commit(); window.scrollTo(0,0);
    return true;
  }
  if(act==='r-copy'){
    var box = document.getElementById('codebox');
    if(box){ box.focus(); box.select(); }
    var manual = function(){ toast('下の欄が選択されています。長押しか右クリックでコピーしてください'); };
    try{
      if(navigator.clipboard && navigator.clipboard.writeText){
        navigator.clipboard.writeText(codeText()).then(function(){ toast('時間割コードをコピーしました'); })['catch'](manual);
      }else{ manual(); }
    }catch(e){ manual(); }
    return true;
  }
  if(act==='course-req'){
    var nm = t.dataset.name;
    var f0 = FIXED.filter(function(x){ return x.name===nm; })[0];
    var cm = S.courseMeta[nm] || {};
    var cur = (cm.req != null) ? cm.req : (f0 ? f0.req : 0);
    cm.req = cur ? 0 : 1; S.courseMeta[nm] = cm;
    touch('courseMeta'); toast(nm+' を'+(cm.req?'必修':'選択')+'にしました'); commit(); return true;
  }
  if(act==='course-room'){
    var nm2 = t.dataset.name;
    var f1 = FIXED.filter(function(x){ return x.name===nm2; })[0];
    var cm2 = S.courseMeta[nm2] || {};
    var v2 = prompt(nm2+' の教室', cm2.room || (f1 ? f1.room : '') || '');
    if(v2 === null) return true;
    cm2.room = v2.trim(); S.courseMeta[nm2] = cm2;
    touch('courseMeta'); commit(); return true;
  }
  if(act==='course-tap'){ return risyuAction('course-add', t, ev); }
  if(act==='course-add'){
    evDraft = newDraft(today());
    evDraft.kind = 'task';
    evDraft.color = kindOf('task').color;
    evDraft.subject = t.dataset.name;
    evDraft.title = '';
    calEdit = null;
    appId = 'cal'; calTab = 'cal'; if(calView === 'todo') calView = 'month';
    render();
    var f = document.getElementById('evform');
    if(f) f.scrollIntoView({block:'center'});
    var ti = document.getElementById('ev_title');
    if(ti) ti.focus();
    toast(t.dataset.name+' の課題を追加します');
    return true;
  }
  if(act==='add-task'){
    var ti = val('tk_title').trim();
    if(!ti){ toast('やることの名前を入れてください', true); return true; }
    S.tasks.push({ id:uid('tk'), title:ti, subject:val('tk_subject'), due:readMd('tk_due'), time:val('tk_time'), done:0, memo:'', color:kindOf('task').color, mt:Date.now() });
    toast('追加しました'); commit(); return true;
  }
  if(act==='task-done' || act==='task-undone'){
    var tk = S.tasks.filter(function(x){ return x.id===t.dataset.id; })[0];
    if(tk){ tk.done = act==='task-done'?1:0; tk.mt=Date.now(); if(tk.done) toast('おつかれさま！'); commit(); }
    return true;
  }
  if(act==='del-task'){ removeItem('tasks', t.dataset.id); toast('削除しました'); commit(); return true; }
  if(act==='add-exam'){
    var sb = val('ex_subject'), dt = readMd('ex_date');
    if(!sb && !val('ex_room')){ toast('科目か教室を入れてください', true); return true; }
    if(!isYmd(dt)){ toast('日付を選んでください', true); return true; }
    S.exams.push({ id:uid('ex'), subject:sb, date:dt, time:val('ex_time'), room:val('ex_room'), memo:'', quiz:0, color:'c8', mt:Date.now() });
    toast('テストを登録しました'); commit(); return true;
  }
  if(act==='del-exam'){ removeItem('exams', t.dataset.id); toast('削除しました'); commit(); return true; }
  if(act==='ab-plus' || act==='ab-minus' || act==='late-plus'){
    var key = t.dataset.key;
    var a = S.attend[key] || { ab:0, late:0, limit:5 };
    if(act==='ab-plus') a.ab = toNum(a.ab)+1;
    if(act==='ab-minus') a.ab = Math.max(0, toNum(a.ab)-1);
    if(act==='late-plus') a.late = toNum(a.late)+1;
    S.attend[key] = a; touch('attend'); commit(); return true;
  }
  if(act==='set-limit'){
    var lim = toNum(val('at_limit'));
    if(lim < 1){ toast('1以上の数字を入れてください', true); return true; }
    courseList().forEach(function(c){
      var a = S.attend[c.key] || { ab:0, late:0, limit:5 };
      a.limit = lim; S.attend[c.key] = a;
    });
    touch('attend'); toast('上限を'+lim+'回にしました'); commit(); return true;
  }
  if(act==='year-edit'){
    var slot = t.dataset.slot;
    var cur = S.terms.first[slot] || '';
    var v = prompt(slot + ' の科目名（空にすると削除）', cur);
    if(v === null) return true;
    v = v.trim();
    if(v) S.terms.first[slot] = v; else delete S.terms.first[slot];
    touch('terms'); commit(); return true;
  }
  return false;
}
/* ============================== 予定の正規化 ============================== */
function shiftHours(s){
  return Math.round((shiftMinutes(s) - shiftBreak(s) + (toNum(s.ot)||0)) / 6) / 10;
}
function shiftMinutes(s){
  var a = minutesOf(s.start), b = minutesOf(s.end);
  if(a == null || b == null) return 0;
  var m = b - a; if(m < 0) m += 1440;
  return m;
}
/* 実際に終わった時間から、残業（マイナスなら早上がり）を出す */
function otFromReal(d){
  var st = minutesOf(d.time), en = minutesOf(d.end), re = minutesOf(d.realEnd);
  if(st == null || en == null || re == null) return toNum(d.ot);
  var base = en - st; if(base < 0) base += 1440;
  var real = re - st; if(real < 0) real += 1440;
  return real - base;
}
function shiftBreak(s){ return (shiftMinutes(s) >= 420) ? 60 : 0; }   /* 7時間以上は休憩1時間を引く */
function shiftPay(s){
  var mins = shiftMinutes(s) - shiftBreak(s) + (toNum(s.ot) || 0);
  var rate = (Number(s.rate) > 0) ? Number(s.rate) : minRate(s.date);
  var fare = mins > 0 ? (toNum(S.settings.fare) || 0) : 0;
  return Math.round(mins * rate) + fare;
}
function normItems(){
  var out = [];
  S.tasks.forEach(function(t){
    out.push({ src:'task', id:t.id, date:t.due, title:t.title, sub:t.subject||'',
      time:t.time||'', colorRaw:taskColor(t), done:t.done, rid:t.rid, edit:1, photos:t.photos||[], plain:t.plain?1:0, mt:t.mt||0 });
  });
  S.exams.forEach(function(x){
    var k = (x.kind==='quiz'||x.kind==='kousa'||x.kind==='exam') ? x.kind : 'exam';
    out.push({ src:k, id:x.id, date:x.date, title:(x.subject||kindOf(k).name),
      sub:kindOf(k).name+(x.room?'・'+x.room:''), time:x.time||'',
      colorRaw:kindHex(k), rid:x.rid, edit:1, photos:x.photos||[], mt:x.mt||0 });
  });
  S.shifts.forEach(function(s){
    var h = shiftHours(s), ot = toNum(s.ot);
    out.push({ src:'work', id:s.id, date:s.date, title:'バイト',
      sub:(h?h+'時間'+(ot?'（残業'+ot+'分込み）':'')+(shiftPay(s)?'・'+yen(shiftPay(s)):''):'')+(s.memo?'　'+s.memo:''),
      time:s.start||'', colorRaw:kindHex('work'), rid:s.rid, edit:1, photos:s.photos||[], mt:s.mt||0 });
  });
  S.events.forEach(function(e){
    var end = (isYmd(e.dateEnd) && e.dateEnd > e.date) ? e.dateEnd : e.date;
    var k = e.kind==='imp' ? 'imp' : 'other';
    out.push({ src:k, id:e.id, date:e.date, end:end, span:(end>e.date)?1:0,
      title:e.title, sub:(e.subject?e.subject+(e.memo?'・':''):'')+(e.memo||''), time:e.time||'',
      colorRaw:kindHex(k), rid:e.rid, edit:1, photos:e.photos||[], mt:e.mt||0 });
  });
  S.health.forEach(function(h){
    if(!isYmd(h.next)) return;
    out.push({ src:'health', id:h.id, date:h.next, title:h.name+'（期限）', sub:h.memo||'', time:'', colorRaw:colorOf('c5') });
  });
  return out;
}
function payItemsOn(ymd){
  var out = [], d = derive(), ym = ymd.slice(0,7), day = Number(ymd.slice(8,10));
  [['smbc',S.settings.smbcDay],['rakuten',S.settings.rakutenDay]].forEach(function(p){
    if(day !== Number(p[1])) return;
    var g = d.byMonth[ym] ? d.byMonth[ym][p[0]] : null;
    if(!g) return;
    var amt = g.plan + g.stmt;
    if(amt > 0) out.push({ src:'pay', id:p[0]+ym, date:ymd, title:ACCOUNTS[p[0]].bank+' 引き落とし',
      sub:yen(amt), time:'', colorRaw:DEEPGREEN });
  });
  return out;
}
function classItemsOn(ymd){
  if(!isYmd(ymd)) return [];
  var a = ymd.split('-'), dch = WDAY[new Date(+a[0], +a[1]-1, +a[2]).getDay()];
  return classesOn(dch).map(function(c){
    return { src:'cls', id:'cls'+ymd+c.period, date:ymd, title:c.name,
      sub:c.period+'限', time:S.commute.periods[c.period-1]||'', colorRaw:'var(--risyu)' };
  });
}
function matchQ(x){ return true; }
function coversDay(x, ymd){
  var e = x.end || x.date;
  return x.date <= ymd && ymd <= e;
}
function itemsOn(ymd, noPlain){
  var out = normItems().filter(function(x){
    if(noPlain && x.plain) return false;                 /* ToDoで足したものはカレンダーに出さない */
    return coversDay(x, ymd) && calFilter[x.src] && matchQ(x);
  });
  if(calFilter.pay) out = out.concat(payItemsOn(ymd).filter(matchQ));
  if(calFilter.cls) out = out.concat(classItemsOn(ymd).filter(matchQ));
  return out.sort(function(a,b){
    /* 期間の予定を先に並べると、帯が横につながって見える */
    if((b.span?1:0) !== (a.span?1:0)) return (b.span?1:0) - (a.span?1:0);
    /* 同じ時刻なら、追加した順（古いものが上） */
    if(a.span && b.span) return String(a.date).localeCompare(String(b.date)) || String(a.id).localeCompare(String(b.id));
    var ta = a.time || '99:99', tb = b.time || '99:99';
    if(ta !== tb) return ta.localeCompare(tb);
    return (Number(a.mt)||0) - (Number(b.mt)||0);   /* 同じ時刻なら追加した順 */
  });
}
function itemColor(x){ return x.colorRaw || kindHex(x.src); }
function itemFg(x){ var k=kindOf(x.src); return (x.src==='task'||x.src==='pay'||x.src==='cls'||x.src==='health') ? '#fff' : k.fg; }

/* 時刻は数字で入力（時・分を直接打つ） */
function timeSelect(id, val_, label, allowEmpty){
  var has = /^\d{1,2}:\d{2}$/.test(val_||'');
  var hv = has ? String(+val_.split(':')[0]) : '';
  var mv = has ? val_.split(':')[1] : '';
  return '<label class="f">'+esc(label)+'</label>'+
    '<div class="timerow" id="'+id+'_row">'+
      '<input id="'+id+'_h" class="tnum" inputmode="numeric" pattern="[0-9]*" maxlength="2" placeholder="--" value="'+esc(hv)+'" data-tp="'+id+'">'+
      '<span class="tsep">：</span>'+
      '<input id="'+id+'_m" class="tnum" inputmode="numeric" pattern="[0-9]*" maxlength="2" placeholder="--" value="'+esc(mv)+'" data-tp="'+id+'">'+
      (allowEmpty ? '<button type="button" class="mini" data-act="tw-clear" data-id="'+id+'">消す</button>' : '')+
    '</div>';
}
function readTime(id){
  var h = document.getElementById(id+'_h'), m = document.getElementById(id+'_m');
  if(!h || !m) return null;
  var hs = String(h.value).replace(/[^0-9]/g,''), ms = String(m.value).replace(/[^0-9]/g,'');
  if(hs === '' && ms === '') return '';
  var hh = Math.max(0, Math.min(23, toNum(hs)));
  var mm = Math.max(0, Math.min(59, toNum(ms)));
  return pad(hh) + ':' + pad(mm);
}

function shiftDate(ymd, days){
  var a = ymd.split('-');
  return toYmd(new Date(+a[0], +a[1]-1, +a[2] + days));
}
function createOne(kind, d, rid){
  var now = Date.now(), ph = (d.photos||[]).slice();
  if(kind==='task'){
    S.tasks.push({ id:uid('tk'), title:d.title, subject:d.subject||'', due:d.date, time:d.time||'',
      done:0, memo:d.memo||'', subs:[], photos:ph, rid:rid,
      pri:toNum(d.pri), how:d.how||'', url:d.url||'', mt:now });
  }else if(kind==='quiz'||kind==='exam'||kind==='kousa'){
    S.exams.push({ id:uid('ex'), subject:d.subject||'', title:d.title||'', date:d.date, time:d.time||'', room:d.memo||'',
      kind:kind, photos:ph, rid:rid, mt:now });
  }else if(kind==='work'){
    S.shifts.push({ id:uid('wk'), title:'バイト', date:d.date,
      start:d.time||'', end:d.end||'', realEnd:d.realEnd||'', ot:otFromReal(d), rate:0,
      memo:d.memo||'', photos:ph, rid:rid, mt:now });
  }else{
    S.events.push({ id:uid('ev'), date:d.date, dateEnd:(isYmd(d.dateEnd)&&d.dateEnd>d.date)?d.dateEnd:'',
      title:d.title, subject:d.subject||'', time:d.time||'',
      memo:d.memo||'', photos:ph, kind:(kind==='imp'?'imp':'other'), rid:rid, mt:now });
  }
}
function listNameOf(src){
  return src==='task' ? 'tasks' : (src==='quiz'||src==='exam'||src==='kousa') ? 'exams' : src==='work' ? 'shifts' : 'events';
}
function findOne(src, id){
  var name = listNameOf(src), list = S[name];
  for(var i=0;i<list.length;i++) if(list[i].id===id) return { name:name, list:list, obj:list[i] };
  return null;
}
function srcOfKind(k){ return k; }
function updateOne(src, id, d){
  var newSrc = srcOfKind(d.kind);
  if(listNameOf(src) !== listNameOf(newSrc)){
    removeItem(listNameOf(src), id);
    createOne(d.kind, d, '');
    return;
  }
  var f = findOne(src, id); if(!f) return;
  var o = f.obj, ph = (d.photos||[]).slice();
  if(src==='task'){ o.title=d.title; o.subject=d.subject||''; o.due=d.date; o.time=d.time||''; o.memo=d.memo||''; o.photos=ph;
    o.pri=toNum(d.pri); o.how=d.how||''; o.url=d.url||''; }
  else if(listNameOf(src)==='exams'){ o.subject=d.subject||''; o.title=d.title||''; o.date=d.date; o.time=d.time||''; o.room=d.memo||''; o.kind=d.kind; o.photos=ph; }
  else if(src==='work'){ o.title='バイト'; o.date=d.date;
    o.start=d.time||''; o.end=d.end||''; o.realEnd=d.realEnd||''; o.ot=otFromReal(d); o.memo=d.memo||''; o.photos=ph; }
  else { o.date=d.date; o.dateEnd=(isYmd(d.dateEnd)&&d.dateEnd>d.date)?d.dateEnd:'';
         o.title=d.title; o.subject=d.subject||''; o.time=d.time||''; o.memo=d.memo||''; o.photos=ph; o.kind=(d.kind==='imp'?'imp':'other'); }
  o.mt = Date.now();
}
function saveEvent(){
  readEvForm();
  var d = evDraft;
  var title = String(d.title||'').trim();
  var isTest = (d.kind==='quiz'||d.kind==='exam'||d.kind==='kousa');
  if(d.kind === 'work') title = 'バイト';
  if(isTest && !d.subject){ toast('科目を選んでください', true); return; }
  if(d.kind==='imp' && !title && d.subject) title = d.subject;
  if(!title && !isTest){ toast('予定の名前を入れてください', true); return; }
  if(!isYmd(d.date)){ toast('日付を選んでください', true); return; }
  d.title = title;

  if(calEdit){
    updateOne(calEdit.src, calEdit.id, d);
    toast('更新しました');
    calEdit = null; evDraft = newDraft(d.date);
  }else{
    var rep = Math.max(0, toNum(d.rep));
    var rid = rep > 1 ? uid('rp') : '';
    var n = rep > 1 ? rep : 1;
    for(var i=0;i<n;i++){
      createOne(d.kind, Object.assign({}, d, { date:shiftDate(d.date, i*7) }), rid);
    }
    toast(n>1 ? n+'件を追加しました' : '追加しました');
    evDraft = newDraft(d.date);
  }
  calSel = d.date; calYm = d.date.slice(0,7);
  if(appId==='cal' && calTab==='add'){ calTab='cal'; window.scrollTo(0,0); }
  commit();
}
function loadForEdit(src, id){
  var f = findOne(src, id); if(!f) return;
  var o = f.obj, base = { wage:'', ot:'', end:'', dateEnd:'', rep:0, subject:'', photos:(o.photos||[]).slice() };
  if(src==='task') evDraft = Object.assign(base, { kind:'task', title:o.title, subject:o.subject||'', date:o.due, time:o.time||'', memo:o.memo||'',
    pri:toNum(o.pri), how:o.how||'', url:o.url||'' });
  else if(listNameOf(src)==='exams') evDraft = Object.assign(base, { kind:(o.kind||'exam'), title:o.title||'', subject:o.subject||'', date:o.date, time:o.time||'', memo:o.room||'' });
  else if(src==='work') evDraft = Object.assign(base, { kind:'work', title:o.title||'', date:o.date, time:o.start||'', end:o.end||'',
    realEnd:o.realEnd||'', ot:(toNum(o.ot)?String(toNum(o.ot)):''), memo:o.memo||'' });
  else evDraft = Object.assign(base, { kind:(o.kind==='imp'?'imp':'other'), title:o.title, subject:o.subject||'', date:o.date, dateEnd:o.dateEnd||'', time:o.time||'', memo:o.memo||'' });
  calEdit = { src:src, id:id };
  if(isYmd(evDraft.date)){ calSel = evDraft.date; calYm = evDraft.date.slice(0,7); }
}

function timeLabelOf(x){
  if(x.src === 'work'){
    var w = S.shifts.filter(function(z){ return z.id === x.id; })[0];
    if(w && w.start && w.end) return w.start+'〜'+w.end+(toNum(w.ot)?'＋残業'+toNum(w.ot)+'分':'');
    if(w && w.start) return w.start+'〜';
    return '時間未設定';
  }
  if(x.src === 'task') return x.time ? x.time+' まで' : '締切（時間未設定）';
  if(x.src === 'quiz' || x.src === 'exam' || x.src === 'kousa') return x.time ? x.time+' 開始' : '時間未設定';
  if(x.span) return '終日（'+ymdLabel(x.date)+'〜'+ymdLabel(x.end)+'）';
  return x.time ? x.time+' 〜' : '終日';
}

function monthGrid(){
  var a = calYm.split('-'), y = +a[0], mo = +a[1];
  var first = new Date(y, mo-1, 1);
  var startDow = first.getDay();
  var td = today();

  /* 前後の月の日も薄く出して、マスを埋める */
  var cells = [];
  for(var i=startDow-1;i>=0;i--){
    var d0 = new Date(y, mo-1, -i);
    cells.push({ ymd:toYmd(d0), out:1 });
  }
  var lastDay = new Date(y, mo, 0).getDate();
  for(var dn=1;dn<=lastDay;dn++) cells.push({ ymd:y+'-'+pad(mo)+'-'+pad(dn), out:0 });
  var extra = 1;
  while(cells.length % 7 !== 0 || cells.length < 35){
    cells.push({ ymd:toYmd(new Date(y, mo, extra++)), out:1 });
  }

  var h = '<table class="cal" id="calgrid"><thead><tr>'+
    WDAY.map(function(w,i){ return '<th class="'+(i===0?'sun':i===6?'sat':'')+'">'+w+'</th>'; }).join('')+
    '</tr></thead><tbody>';

  for(var r=0;r<cells.length/7;r++){
    h += '<tr>';
    for(var c=0;c<7;c++){
      var cell = cells[r*7+c], ymd = cell.ymd;
      var its = itemsOn(ymd, 1);
      var hol = holidayName(ymd);
      var dow = new Date(+ymd.slice(0,4), +ymd.slice(5,7)-1, +ymd.slice(8,10)).getDay();
      var cls = [];
      if(cell.out) cls.push('out');
      if(ymd === td) cls.push('today');
      if(ymd === calSel) cls.push('sel');
      if(hol) cls.push('holi');
      else if(dow === 0) cls.push('sunday');
      else if(dow === 6) cls.push('saturday');

      h += '<td class="'+cls.join(' ')+'"><div class="day" role="button" tabindex="0" data-act="cal-day" data-d="'+ymd+'">'+
        '<span class="dhead"><span class="dn">'+Number(ymd.slice(8,10))+'</span>'+
        (hol ? '<span class="holname">'+esc(hol)+'</span>' : '')+'</span>';

      if(its.length){
        h += '<span class="evs">';
        its.forEach(function(x){
          var col = itemColor(x), fg = itemFg(x);
          if(x.span){
            var isStart = x.date === ymd, isEnd = (x.end||x.date) === ymd;
            var label = (isStart || dow === 0) ? esc(x.title) : '&nbsp;';
            h += '<span class="ev band'+(isStart?' s':'')+(isEnd?' e':'')+'" style="--c:'+col+';color:'+fg+'" data-act="ev-open" data-src="'+x.src+'" data-id="'+x.id+'">'+label+'</span>';
          }else{
            h += '<span class="ev chip'+(x.done?' done':'')+'" style="background:'+col+';color:'+fg+'" data-act="ev-open" data-src="'+x.src+'" data-id="'+x.id+'">'+esc(x.title)+'</span>';
          }
        });
        h += '</span>';
      }
      h += '</div></td>';
    }
    h += '</tr>';
  }
  return h + '</tbody></table>';
}

/* 同じ日で時間が重なっていないか調べる */
function clashOn(ymd){
  var list = itemsOn(ymd, 1).filter(function(x){ return minutesOf(x.time) != null; });
  /* 授業とも見比べる */
  schoolClassesForDate(ymd).forEach(function(c){
    var st = S.commute.periods[c.period-1], en = S.commute.ends[c.period-1];
    if(minutesOf(st)!=null) list.push({ src:'cls', id:'c'+c.period, title:c.name, time:st, endMin:minutesOf(en) });
  });
  var out = [];
  for(var i=0;i<list.length;i++){
    for(var j=i+1;j<list.length;j++){
      var a=list[i], b=list[j];
      var as=minutesOf(a.time), ae=(a.endMin!=null?a.endMin:as+60), bs=minutesOf(b.time), be=(b.endMin!=null?b.endMin:bs+60);
      if(a.src==='work'){ var w=S.shifts.filter(function(z){return z.id===a.id;})[0]; if(w) ae=as+shiftHours(w)*60; }
      if(b.src==='work'){ var w2=S.shifts.filter(function(z){return z.id===b.id;})[0]; if(w2) be=bs+shiftHours(w2)*60; }
      if(as < be && bs < ae) out.push(a.title+' と '+b.title);
    }
  }
  return out;
}

  var all = normItems().filter(function(x){
    if(!isYmd(x.date) || !calFilter[x.src] || !matchQ(x)) return false;
    if(x.src === 'task') return !x.done;
    return ['quiz','imp','health'].indexOf(x.src) >= 0 && (x.end||x.date) >= td;
  }).sort(function(a,b){ return a.date.localeCompare(b.date); });

  var late = all.filter(function(x){ return x.date < td; });
  var soon = all.filter(function(x){ return x.date >= td; });
  var rowOf = function(x){
    var n = daysFromToday(x.date);
    return '<div class="evrow"><span class="cbar" style="background:'+itemColor(x)+'"></span>'+
      (x.src==='task' ? '<button class="chk" data-act="task-done" data-id="'+x.id+'" aria-label="完了"></button>' : '')+
      '<span class="grow"><span class="t">'+esc(x.title)+'</span>'+
      '<span class="s">'+ymdLabel(x.date)+(x.sub?'・'+esc(x.sub):'')+'</span></span>'+
      '<span class="due '+dueClass(n)+'">'+dueText(n)+'</span>'+
      (x.edit?'<button class="mini" data-act="ev-edit" data-src="'+x.src+'" data-id="'+x.id+'">直す</button>':'')+'</div>';
  };
  var h = '';
  if(late.length) h += section('期限が過ぎているもの', late.length+'件', late.map(rowOf).join(''));
  h += section('やること・大事な予定', soon.length?soon.length+'件':null,
    soon.length ? soon.map(rowOf).join('')
      : '<div class="empty">'+ART.empty+'<div style="margin-top:8px">やることは片付いています。</div></div>');
  var doneTasks = S.tasks.filter(function(t){ return t.done; });

    doneTasks.slice(-12).reverse().map(function(t){

        '<button class="chk" style="background:var(--smbc);border-color:var(--smbc)" data-act="task-undone" data-id="'+t.id+'">✓</button>'+
        '<span class="grow"><span class="t" style="text-decoration:line-through;color:var(--sub)">'+esc(t.title)+'</span></span></div>';
    }).join(''));
  return h;
}

function weekMonday(){
  var now = new Date(), dow = now.getDay();
  var mon = new Date(now); mon.setDate(now.getDate() - ((dow+6)%7) + calWeekOff*7);
  return mon;
}
function weekRangeLabel(){
  var mon = weekMonday(), sun = new Date(mon); sun.setDate(mon.getDate()+6);
  var lbl = calWeekOff===0?'今週':calWeekOff===1?'次週':calWeekOff===-1?'先週':(calWeekOff>0?calWeekOff+'週あと':(-calWeekOff)+'週前');
  return lbl+'　'+(mon.getMonth()+1)+'/'+mon.getDate()+'〜'+(sun.getMonth()+1)+'/'+sun.getDate();
}

/* ============================== 操作 ============================== */
function calAction(act, t){
  if(act==='cal-prev'){ readEvForm(); calYm = addMonths(calYm, -1); render(); return true; }
  if(act==='cal-next'){ readEvForm(); calYm = addMonths(calYm, 1); render(); return true; }
  if(act==='cal-today'){
    readEvForm(); calYm = thisYm(); calSel = today();
    if(evDraft && !calEdit) evDraft.date = calSel;
    render(); return true;
  }
  if(act==='cal-day'){
    readEvForm();
    calSel = t.dataset.d; calYm = calSel.slice(0,7);
    if(evDraft && !calEdit) evDraft.date = calSel;
    render(); return true;
  }
  if(act==='cal-mode'){ readEvForm(); calTab = t.dataset.v; calView = (t.dataset.v==='week')?'week':'month'; render(); window.scrollTo(0,0); return true; }
  if(act==='wstyle'){ weekStyle = t.dataset.v; render(); return true; }
  if(act==='cw-off'){ calWeekOff += toNum(t.dataset.v); render(); return true; }
  if(act==='cal-mset'){ calYm = addMonths(thisYm(), toNum(t.dataset.v)); render(); return true; }
  if(act==='cw-set'){ calWeekOff = toNum(t.dataset.v); render(); return true; }
  if(act==='km-off'){ kindMonthOff += toNum(t.dataset.v); render(); return true; }
  if(act==='km-set'){ kindMonthOff = toNum(t.dataset.v); render(); return true; }
  if(act==='kind-pick'){ kindPick = t.dataset.k; render(); return true; }
  if(act==='cal-view'){ readEvForm(); calView = t.dataset.v; render(); return true; }
  if(act==='cal-filter'){
    readEvForm();
    var f = t.dataset.f; calFilter[f] = calFilter[f] ? 0 : 1; render(); return true;
  }
  if(act==='ev-kind'){
    readEvForm();
    evDraft.kind = t.dataset.k;
    redrawForm();
    return true;
  }

  if(act==='ev-move'){
    var f3 = findOne(t.dataset.src, t.dataset.id);
    if(!f3) return true;
    var o3 = f3.obj, n3 = toNum(t.dataset.n);
    var key = (t.dataset.src==='task') ? 'due' : 'date';
    if(!isYmd(o3[key])) { toast('日付が入っていません', true); return true; }
    o3[key] = shiftDate(o3[key], n3);
    if(o3.dateEnd && isYmd(o3.dateEnd)) o3.dateEnd = shiftDate(o3.dateEnd, n3);
    o3.mt = Date.now();
    calSel = o3[key]; calYm = calSel.slice(0,7);   /* 動かした先を表示する */
    toast(ymdLabel(o3[key])+'にずらしました'); commit(); return true;
  }
  if(act==='ev-photo'){ readEvForm(); memoTarget = 'draft'; var inp=document.getElementById('memoimg'); if(inp) inp.click(); return true; }
  if(act==='ev-photo-del'){
    readEvForm();
    evDraft.photos = (evDraft.photos||[]).filter(function(x){ return x!==t.dataset.pid; });
    var fm2 = document.getElementById('evform');
    if(fm2){ var y2=window.scrollY; fm2.innerHTML = evFormBody(); window.scrollTo(0,y2); } else render();
    return true;
  }
  if(act==='ev-open'){ openDetail(t.dataset.src, t.dataset.id); return true; }
  if(act==='ev-close'){ closeDetail(); return true; }
  if(act==='ev-edit-from-detail'){
    closeDetail(); readEvForm(); loadForEdit(t.dataset.src, t.dataset.id);
    appId='cal'; calTab='add'; render(); window.scrollTo(0,0); return true;
  }
  if(act==='ev-del-from-detail'){
    closeDetail();
    removeWithUndo(listNameOf(t.dataset.src), t.dataset.id, '削除しました'); commit(); return true;
  }
  if(act==='cal-addopen'){
    calEdit = null; evDraft = newDraft(t.dataset.d || calSel);
    appId='cal'; calTab='add'; render(); window.scrollTo(0,0); return true;
  }
  if(act==='ot-step'){
    readEvForm();
    evDraft.ot = String(toNum(evDraft.ot) + toNum(t.dataset.n));
    var inp = document.getElementById('ev_ot');
    if(inp) inp.value = evDraft.ot; else render();
    return true;
  }
  if(act==='prog-step'){
    var max = progScale().length - 1;
    setProg(t.dataset.id, (progOf(t.dataset.id) + 1) > max ? 0 : progOf(t.dataset.id) + 1);
    commit(); return true;
  }
  if(act==='ev-pri'){ readEvForm(); evDraft.pri = toNum(t.dataset.v); redrawForm(); return true; }
  if(act==='ev-how'){ readEvForm(); evDraft.how = (evDraft.how===t.dataset.v ? '' : t.dataset.v); redrawForm(); return true; }
  if(act==='tw-clear'){
    var wid = t.dataset.id;
    ['h','m'].forEach(function(w){ var i=document.getElementById(wid+'_'+w); if(i) i.value=''; });
    return true;
  }
  if(act==='ev-save'){ saveEvent(); return true; }
  if(act==='ev-cancel'){ calEdit = null; evDraft = newDraft(calSel); if(calTab==='add') calTab='cal'; render(); window.scrollTo(0,0); return true; }
  if(act==='ev-edit'){
    readEvForm();
    loadForEdit(t.dataset.src, t.dataset.id);
    appId='cal'; calTab='add';
    render(); window.scrollTo(0,0);
    return true;
  }
  if(act==='ev-del'){
    var src = t.dataset.src, id = t.dataset.id;
    var f2 = findOne(src, id);
    if(f2 && f2.obj.rid){
      var group = f2.list.filter(function(x){ return x.rid === f2.obj.rid; });
      if(group.length > 1 && confirm('この繰り返しは'+group.length+'件あります。まとめて削除しますか？\n「キャンセル」ならこの1件だけ消します。')){
        group.slice().forEach(function(x){ removeItem(listNameOf(src), x.id); });
        if(calEdit && calEdit.src===src){ calEdit=null; evDraft=newDraft(calSel); }
        toast(group.length+'件を削除しました'); commit(); return true;
      }
    }
    removeWithUndo(listNameOf(src), id, '削除しました');
    if(calEdit && calEdit.id===id){ calEdit=null; evDraft=newDraft(calSel); }
    commit(); return true;
  }
  if(act==='memo-save'){
    var k = t.dataset.k;
    var cur = memoOf(k);
    S.memos[k] = { text: val('memo_'+k), mt: Date.now(), photos: cur.photos || [] };
    touch('memos'); toast('メモを保存しました'); commit(); return true;
  }
  if(act==='memo-photo'){
    memoTarget = t.dataset.k;
    var inp = document.getElementById('memoimg');
    if(inp) inp.click();
    return true;
  }
  if(act==='memo-photo-del'){
    var k2 = t.dataset.k, id2 = t.dataset.id;
    var m2 = memoOf(k2);
    m2.photos = (m2.photos||[]).filter(function(x){ return x !== id2; });
    m2.mt = Date.now(); S.memos[k2] = m2;
    try{ localStorage.removeItem('shiharai:memoimg:'+id2); }catch(e){}
    touch('memos'); toast('写真を外しました'); commit(); return true;
  }
  if(act==='memo-photo-view'){
    var src = null;
    try{ src = localStorage.getItem('shiharai:memoimg:'+t.dataset.id); }catch(e){}
    if(!src){ toast('この端末に写真がありません'); return true; }
    var box = el('<div id="lightbox"><img src="'+src+'" alt="メモの写真"></div>');
    box.addEventListener('click', function(){ box.remove(); });
    document.body.appendChild(box);
    return true;
  }
  if(act==='add-health'){
    var n = val('hl_name').trim();
    if(!n){ toast('項目名を入れてください', true); return true; }
    S.health.push({ id:uid('hl'), name:n, date:val('hl_date'), next:val('hl_next'), memo:val('hl_memo'), mt:Date.now() });
    toast('追加しました'); commit(); return true;
  }
  if(act==='del-health'){ removeWithUndo('health', t.dataset.id, '削除しました'); commit(); return true; }
  return false;
}

function settingsAction(act, t){
  if(act==='set-theme'){ S.ui.theme = t.dataset.v; touch('ui'); applyUi(); toast('テーマを変えました'); commit(); return true; }
  if(act==='mycolor-add'){
    var v0 = val('cc_pick');
    if(!/^#[0-9a-fA-F]{6}$/.test(v0)){ toast('上の色えらびで色を決めてから押してください', true); return true; }
    S.ui.myColors = (S.ui.myColors||[]);
    if(S.ui.myColors.length >= 5){ toast('お気に入りは5個までです', true); return true; }
    if(S.ui.myColors.indexOf(v0) >= 0){ toast('もう入っています', true); return true; }
    S.ui.myColors.push(v0); touch('ui'); toast('お気に入りに入れました'); commit(); return true;
  }
  if(act==='mycolor-use'){
    S.ui.customColor = t.dataset.c; S.ui.theme = 'custom'; touch('ui'); applyUi(); toast('色を変えました'); commit(); return true;
  }
  if(act==='mycolor-del'){
    S.ui.myColors.splice(toNum(t.dataset.i), 1); touch('ui'); toast('消しました'); commit(); return true;
  }
  if(act==='hol-class'){ S.settings.classOnHoliday = toNum(t.dataset.v) ? 1 : 0; toast(S.settings.classOnHoliday?'祝日も授業ありにしました':'祝日は休みにしました'); commit(); return true; }
  if(act==='due-lead'){ S.ui.dueLead = toNum(t.dataset.v); touch('ui'); commit(); return true; }
  if(act==='todo-sort'){ S.ui.todoByPri = toNum(t.dataset.v) ? 1 : 0; touch('ui'); commit(); return true; }
  if(act==='prog-scale'){ S.ui.progScale = toNum(t.dataset.v); touch('ui'); commit(); return true; }
  if(act==='prog-show'){ S.ui.showProg = (S.ui.showProg===0) ? 1 : 0; touch('ui'); commit(); return true; }
  if(act==='img-clean'){
    if(!confirm('古い明細の写真を消します。金額の記録は残ります。よろしいですか？')) return true;
    var keep = {}; S.statements.slice(0,10).forEach(function(x){ keep[x.id]=1; });
    var n = 0;
    S.statements.forEach(function(x){ if(!keep[x.id]){ try{ localStorage.removeItem(imgKey(x.id)); x.hasImage=false; n++; }catch(e){} } });
    toast(n+'件の写真を消しました'); commit(); return true;
  }
  if(act==='set-custom'){
    var v = val('cc_pick');
    if(!/^#[0-9a-fA-F]{6}$/.test(v)){ toast('色を選んでください', true); return true; }
    S.ui.customColor = v; S.ui.theme = 'custom'; touch('ui'); applyUi(); toast('色を変えました'); commit(); return true;
  }
  if(act==='set-fs'){ S.ui.fs = t.dataset.v; touch('ui'); applyUi(); toast('文字の大きさを変えました'); commit(); return true; }
  if(act==='save-commute'){
    S.commute.walk=toNum(val('cm_walk')); S.commute.bus=toNum(val('cm_bus'));
    S.commute.change=toNum(val('cm_change')); S.commute.train=toNum(val('cm_train'));
    S.commute.toSchool=toNum(val('cm_school')); S.commute.buffer=toNum(val('cm_buffer'));
    for(var i=0;i<6;i++){
      var v=val('cm_p'+i); if(minutesOf(v)!=null) S.commute.periods[i]=v;
      var e=val('cm_e'+i); if(minutesOf(e)!=null) S.commute.ends[i]=e;
    }
    touch('commute'); toast('通学の設定を保存しました'); commit(); return true;
  }
  if(act==='save-days'){
    S.settings.smbcDay = Math.min(31, Math.max(1, toNum(val('sy_smbc'))||27));
    S.settings.rakutenDay = Math.min(31, Math.max(1, toNum(val('sy_rakuten'))||27));
    var rg = val('st_reg'); S.settings.regDeadline = isYmd(rg) ? rg : '';
    S.settings.minWeekday = Math.max(0, Number(val('st_min1'))||0);
    S.settings.minWeekend = Math.max(0, Number(val('st_min2'))||0);
    S.settings.fare = Math.max(0, toNum(val('st_fare')));
    S.settings.shop = val('st_shop').trim() || 'デリフランス';
    S.transit.sannomiyaTransfer = Math.max(0, toNum(val('st_tr'))); S.transit.workBuffer = Math.max(0, toNum(val('st_wb'))); touch('transit');
    toast('保存しました'); commit(); return true;
  }
  if(act==='sync-now'){ syncNow(); return true; }
  if(act==='sync-retry'){
    syncState.retry = 0; syncState.connecting = false; fbLoad = null;
    syncState.msg = '接続しています…'; render(); initSync(); return true;
  }
  if(act==='save-key'){ S.settings.geminiKey = val('sy_key').trim(); persist(); toast('保存しました'); render(); return true; }
  if(act==='export'){
    download(new Blob([JSON.stringify(Object.assign({ app:'kurashi', version:4 }, payload()))],{type:'application/json'}),
      'kurashi_'+thisYm()+'.json');
    toast('バックアップを保存しました'); return true;
  }
  if(act==='import'){ document.getElementById('imp').click(); return true; }
  return false;
}

function storageInfo(){
  var total = 0, imgs = 0, other = 0;
  try{
    for(var i=0;i<localStorage.length;i++){
      var k = localStorage.key(i), v = localStorage.getItem(k) || '';
      var b = (k.length + v.length) * 2;          /* 1文字=2バイトで概算 */
      total += b;
      if(k.indexOf('shiharai:img:')===0 || k.indexOf('shiharai:memoimg:')===0) imgs += b; else other += b;
    }
  }catch(e){}
  var limit = 5 * 1024 * 1024;
  return { total:total, imgs:imgs, other:other, limit:limit, pct:Math.min(100, Math.round(total/limit*100)) };
}

/* ===== 週を時間軸で見る（121）===== */
function weekTimeline(){
  var start = weekMonday();
  var H0 = 7, H1 = 23;                       /* 7時〜23時 */
  var rowH = 30;
  var days = [];
  for(var i=0;i<7;i++){ var d=new Date(start); d.setDate(start.getDate()+i); days.push(toYmd(d)); }
  var h = '<div class="wtl"><div class="wtl-head"><span class="wtl-hcol"></span>'+
    days.map(function(ymd,i){
      var d = new Date(start); d.setDate(start.getDate()+i);
      var isT = ymd===today();
      return '<span class="wtl-d'+(isT?' now':'')+'">'+WDAY[d.getDay()]+'<b>'+d.getDate()+'</b></span>';
    }).join('')+'</div><div class="wtl-body" style="height:'+((H1-H0)*rowH)+'px">'+
    '<div class="wtl-hours">'+(function(){
      var o=''; for(var hh=H0;hh<H1;hh++) o += '<span style="height:'+rowH+'px">'+hh+'</span>'; return o;
    })()+'</div>';
  days.forEach(function(ymd){
    h += '<div class="wtl-col">';
    /* 授業 */
    schoolClassesForDate(ymd).forEach(function(c){
      var st = minutesOf(S.commute.periods[c.period-1]), en = minutesOf(S.commute.ends[c.period-1]);
      if(st==null||en==null) return;
      var top = (st - H0*60)/60*rowH, hgt = (en-st)/60*rowH;
      if(top < -hgt) return;
      h += '<div class="wtl-ev cls" style="top:'+top+'px;height:'+Math.max(14,hgt)+'px;background:'+courseColor(c.name)+'22;border-color:'+courseColor(c.name)+'" title="'+esc(c.name)+'">'+
        '<span>'+esc(shortName(c.name))+'</span></div>';
    });
    /* 予定 */
    itemsOn(ymd, 1).forEach(function(x){
      var st2 = minutesOf(x.time);
      if(st2==null) return;
      var dur = 60;
      if(x.src==='work'){ var w=S.shifts.filter(function(z){return z.id===x.id;})[0]; if(w) dur = Math.max(30, shiftHours(w)*60); }
      var top2 = (st2 - H0*60)/60*rowH, hgt2 = dur/60*rowH;
      h += '<div class="wtl-ev" style="top:'+top2+'px;height:'+Math.max(14,hgt2)+'px;background:'+itemColor(x)+';color:'+itemFg(x)+'" '+
        'data-act="ev-open" data-src="'+x.src+'" data-id="'+x.id+'" title="'+esc(x.title)+'"><span>'+esc(x.title)+'</span></div>';
    });
    h += '</div>';
  });
  return h + '</div></div>';
}

          '<div class="s">'+(x.courses||[]).length+'科目・'+(x.courses||[]).reduce(function(a,c){return a+(Number(c.cr)||0);},0)+'単位'+
          (S.termsDone[x.id] ? '・修了' : '')+'</div></div>'+
          (x.id===S.termId ? '<span class="b cat">表示中</span>' : '<button class="mini" data-act="tt-use" data-id="'+x.id+'">表示</button>')+

      }).join('')+
      '<div style="margin-top:12px;padding-top:12px;border-top:1px solid var(--rule)">'+
      '<div class="pair" style="margin-bottom:8px">'+
        '<div><label class="f">年次</label><select id="tm_year">'+[1,2,3,4].map(function(y){ return '<option value="'+y+'"'+(y===t.year?' selected':'')+'>'+y+'年</option>'; }).join('')+'</select></div>'+
        '<div><label class="f">学期</label><select id="tm_half"><option value="1">前期</option><option value="2" selected>後期</option></select></div>'+
        '<div><label class="f">年度</label><input id="tm_y" inputmode="numeric" value="'+new Date().getFullYear()+'"></div></div>'+

      '<p class="note">科目の追加・削除は「授業」タブからできます。</p></div></div>';
  }

  h += '<div class="scroll" style="overflow-x:hidden"><table class="tt tt2"><thead><tr><th class="pd"></th>'+
    DAYS.map(function(d){ var hn=holidayName(dates[d]); return '<th'+(dates[d]===td?' class="today"':'')+(hn?' style="color:var(--holi)"':'')+'>'+d+'<span class="dsub">'+Number(dates[d].slice(8,10))+(hn?'<br><span style="font-size:.85em">'+esc(hn.slice(0,4))+'</span>':'')+'</span></th>'; }).join('')+
    '</tr></thead><tbody>';
  PERIODS.forEach(function(p){
    h += '<tr><th class="pd"><span class="pdn">'+p+'</span><span class="pdt">'+esc(S.commute.periods[p-1]||'')+'<br>'+esc(S.commute.ends[p-1]||'')+'</span></th>';
    DAYS.forEach(function(d){
      var c = map[d+p];
      var ymd0 = dates[d];
      var mk = makeupsOn(ymd0).filter(function(x){ return toNum(x.period)===p; })[0];
      if(!c && mk){
        h += '<td class="'+(courseReq(mk.course)?'reqd':'elec')+' mkup"><div class="cell2" role="button" tabindex="0" data-act="course-open" data-name="'+esc(mk.course)+'">'+
          '<span class="nm2">'+esc(shortName(mk.course))+'</span><span class="tag2 mk">補講</span>'+
          '<span class="room2">'+esc(mk.room||courseRoom(mk.course)||'')+'</span></div></td>';
        return;
      }
      if(!c){ h += '<td class="empty-cell"></td>'; return; }
      var ymd = dates[d];
      var holOn = changesOn(ymd).some(function(h){ return changeType(h)==='holclass'; });
      var off = (holidayName(ymd) && !S.settings.classOnHoliday && !holOn) ? 'holiday' : isCancelled(c.name, ymd) ? 'cancel' : (c.bi && !biweekOn(c.name, ymd) ? 'skip' : '');
      var online = isOnlineOn(c.name, ymd);
      var isWeb = c.web || online;
      var cls = (courseReq(c.name) ? 'reqd' : 'elec') + (off ? ' off' : '') + (isWeb ? ' web' : '');
      h += '<td class="'+cls+'"><div class="cell2" role="button" tabindex="0" data-act="course-open" data-name="'+esc(c.name)+'">'+
        '<span class="nm2">'+esc(shortName(c.name))+'</span>'+
        (c.bi ? '<span class="tag2">'+(off==='skip' ? '今週なし' : '隔週')+'</span>' : '')+
        (off==='cancel' ? '<span class="tag2 cx">休講</span>' : '')+
        (off==='holiday' ? '<span class="tag2 cx">祝日</span>' : '')+
        (online ? '<span class="tag2 ol">遠隔</span>' : '')+
        (function(){
          var its = itemsForCourseOn(c.name, ymd);
          /* 予定がある日だけ、数に関係なく同じ形で丸を出す */
          return '<span class="cev">'+its.slice(0,4).map(function(x){
            var done = (x.src==='task' && x.done);
            return '<span class="cevd'+(done?' done':'')+'" style="'+(done?'border-color:'+itemColor(x):'background:'+itemColor(x))+'" title="'+esc(x.title)+(done?'（終わった）':'')+'"></span>';
          }).join('')+(its.length>4?'<span class="cevn">+'+(its.length-4)+'</span>':'')+'</span>';
        })()+
        '<span class="room2">'+esc(courseRoom(c.name)||(isWeb?'WEB':''))+'</span>'+
        '</div></td>';
    });
    h += '</tr>';
  });
  h += '</tbody></table></div>';
  h += '<p class="note">赤は必修、青は選択。科目をタップすると詳しい情報が開きます。隔週の科目は基準日を設定すると「今週なし」が自動で出ます（授業タブから）。</p>';
  var out = '';
  var parts = { grid: function(){ return '<section>'+h+'</section>'; }, notes: function(){ return weekNotes(dates); }, cancel: cancelBox };
  pageOrder('tt').forEach(function(id){ if(parts[id] && !pageHidden('tt', id)) out += parts[id](); });
  return out;
}

/* その週の連絡事項（課題・テスト・重要・遠隔など） */
function weekNotes(dates){
  var days = DAYS.map(function(d){ return dates[d]; });
  var from = days[0], to = days[days.length-1];
  var items = normItems().filter(function(x){
    if(!isYmd(x.date) || x.date < from || x.date > to) return false;
    if(x.src === 'task' && x.done) return false;
    return ['task','quiz','exam','kousa','imp'].indexOf(x.src) >= 0;
  }).sort(function(a,b){ return a.date.localeCompare(b.date); });
  var chg = S.holidays.filter(function(h){ return h.date >= from && h.date <= to; })
    .sort(function(a,b){ return a.date.localeCompare(b.date); });
  var typeName = { cancel:'休講', online:'遠隔', makeup:'補講', holclass:'祝日でも授業あり' };
  if(!items.length && !chg.length) return '';
  return section('この週の連絡事項', (items.length+chg.length)+'件',
    chg.map(function(x){
      var ty = changeType(x);
      return '<div class="evrow"><span class="cbar" style="background:'+(ty==='cancel'?'var(--rakuten)':ty==='online'?'var(--e6)':ty==='holclass'?'var(--holi)':'var(--ok)')+'"></span>'+
        '<span class="grow"><span class="t">'+(x.course==='*'?(ty==='holclass'?'':'全休'):esc(x.course))+(x.course==='*'&&ty==='holclass'?'':'　')+typeName[ty]+'</span>'+
        '<span class="s">'+ymdLabel(x.date)+(ty==='makeup'&&x.period?'　'+x.period+'限':'')+'</span></span></div>';
    }).join('')+
    items.map(function(x){
      return '<div class="evrow" data-act="ev-open" data-src="'+x.src+'" data-id="'+x.id+'" role="button">'+
        '<span class="cbar" style="background:'+itemColor(x)+'"></span>'+
        '<span class="grow"><span class="t">'+esc(x.title)+'</span>'+
        '<span class="s">'+ymdLabel(x.date)+(x.time?' '+x.time:'')+(x.sub?'・'+esc(x.sub):'')+'</span></span>'+
        '<span class="s2">›</span></div>';
    }).join(''));
}

      }).join('')+'</div>'+
    '<div class="field"><label class="f">科目</label><select id="cx_course"><option value="*">その日ぜんぶ（全休・全部遠隔）</option>'+
      termCourses().map(function(c){ return '<option value="'+esc(c.name)+'">'+esc(c.name)+'</option>'; }).join('')+'</select></div>'+
    mdPicker('cx_date', today(), '日付', false)+
    '<div class="pair" style="margin-bottom:11px">'+

        PERIODS.map(function(p){ return '<option value="'+p+'">'+p+'限</option>'; }).join('')+'</select></div>'+

}

function courseDetail(name){
  var c = courseByName(name);
  var cm = S.courseMeta[name] || {};
  var at = attendOf(name);
  var td = today();
  var tasks = S.tasks.filter(function(t){ return t.subject===name; }).sort(function(a,b){ return String(a.due).localeCompare(String(b.due)); });
  var exams = S.exams.filter(function(x){ return x.subject===name; }).sort(function(a,b){ return String(a.date).localeCompare(String(b.date)); });
  var imps = S.events.filter(function(e){ return e.kind==='imp' && e.subject===name; });
  var notes = S.notes.filter(function(n){ return n.link && n.link.type==='course' && n.link.id===name; });
  var gr = S.grades[name] || {};
  var todayCls = classesForDate(td).some(function(x){ return x.name===name && !x.off; });

  var h = '<button class="mini" data-act="course-back" style="margin-bottom:10px">'+(courseTemp?'‹ 時間割にもどる':'‹ 科目一覧')+'</button>';
  h += '<div class="box" style="border-left:6px solid '+courseColor(name)+';margin-bottom:14px">'+
    '<div class="ct" style="font-size:1.15em">'+esc(name)+'</div>'+
    '<div class="cm">'+esc(c.slotText)+'　'+esc(courseRoom(name)||(c.web?'WEB':''))+'　'+c.cr+'単位'+(c.code?'　コード'+esc(c.code):'')+'</div>'+
    '<div class="pillrow" style="margin-top:10px">'+
      '<button data-act="course-req" data-name="'+esc(name)+'" class="'+(courseReq(name)?'on':'')+'" style="'+(courseReq(name)?'background:#B0311A;border-color:#B0311A;color:#fff':'')+'">必修</button>'+
      '<button data-act="course-req" data-name="'+esc(name)+'" class="'+(!courseReq(name)?'on':'')+'" style="'+(!courseReq(name)?'background:#0D2B7A;border-color:#0D2B7A;color:#fff':'')+'">選択</button>'+
      '<button data-act="course-room" data-name="'+esc(name)+'">教室を直す</button>'+
      '<button data-act="course-alias" data-name="'+esc(name)+'">略称</button>'+
    '</div>'+
    (c.bi ? '<div class="pair" style="margin-top:10px"><div>'+mdPicker('bw_'+name, S.biweek[name]||'', '隔週の基準日（授業がある日を1回選ぶ）', true)+'</div>'+
      '<button class="btn ghost" style="flex:0 0 auto;align-self:flex-end" data-act="biweek-save" data-name="'+esc(name)+'">保存</button></div>'+
      (isYmd(S.biweek[name]) ? '<p class="note">今週は'+(biweekOn(name, td)?'あります':'ありません')+'。</p>' : '') : '')+
    '</div>';

  /* 出欠 */
  var restAb = at.limit - at.ab;
  h += section('出欠', '出'+at.pres+'・欠'+at.ab+'・遅'+at.late+'／全'+at.total+'回',
    '<div class="'+(restAb<=0?'msg ng':restAb<=1?'bn red':restAb<=2?'bn amber':'msg ok')+'" style="margin-bottom:12px">'+
      (restAb<=0 ? '<b>欠席が上限に達しています。</b>先生に相談してください。'
       : (restAb<=2?'<span class="ic">!</span><span>':'')+
         '<b>あと'+restAb+'回休むと単位不可</b>です。'+
         (restAb<=2?'</span>':''))+'</div>'+
    '<div class="grid3 keep3" style="margin-bottom:10px">'+
      '<div class="stat"><div class="k">欠席</div><div class="v" style="color:'+(at.ab>=at.limit?'var(--rakuten)':'inherit')+'">'+at.ab+'</div></div>'+
      '<div class="stat"><div class="k">評価不可まで</div><div class="v">あと'+Math.max(0, at.limit-at.ab)+'</div></div>'+
      '<div class="stat"><div class="k">出席率</div><div class="v">'+(at.pres+at.ab+at.late ? Math.round((at.pres+at.late)/(at.pres+at.ab+at.late)*100) : '—')+'%</div></div></div>'+
    '<div class="bar" style="margin-bottom:12px"><i class="'+(at.ab>=at.limit?'over':'done')+'" style="width:'+Math.min(100,Math.round(at.ab/at.limit*100))+'%"></i></div>'+
    '<div class="pillrow"><span class="s2" style="align-self:center">今日（'+ymdLabel(td)+'）：</span>'+
      ['出','欠','遅'].map(function(st){
        var cur = (S.attendLog[name]||[]).filter(function(x){ return x.date===td; })[0];
        var on = cur && cur.st===st;
        return '<button data-act="att-set" data-name="'+esc(name)+'" data-date="'+td+'" data-st="'+st+'" class="'+(on?'on':'')+'">'+({出:'出席',欠:'欠席',遅:'遅刻'})[st]+'</button>';
      }).join('')+
      '<button data-act="att-set" data-name="'+esc(name)+'" data-date="'+td+'" data-st="">取消</button></div>'+
    (!todayCls ? '<p class="note">今日はこの授業の日ではありません。別の日を記録するには下の欄で日付を選んでください。</p>' : '')+
    '<div class="pair" style="margin-top:8px"><div>'+mdPicker('at_'+name, td, '別の日を記録', false)+'</div>'+
      '<select id="atst_'+esc(name)+'" style="flex:0 0 90px;align-self:flex-end;margin-bottom:11px"><option value="出">出席</option><option value="欠">欠席</option><option value="遅">遅刻</option></select>'+

    (at.log.length ? '<div style="margin-top:6px">'+at.log.slice().reverse().slice(0,15).map(function(x){
      return '<div class="tline"><span class="pd-badge" style="'+(x.st==='欠'?'background:var(--rakutenbg);color:var(--rakuten)':x.st==='遅'?'background:var(--warnbg);color:var(--warn)':'')+'">'+x.st+'</span>'+
        '<span class="grow"><span class="t">'+ymdLabel(x.date)+'</span></span>'+
        '<button class="mini" data-act="att-set" data-name="'+esc(name)+'" data-date="'+x.date+'" data-st="">消す</button></div>';
    }).join('')+'</div>' : '')+
    '<div class="pair" style="margin-top:12px">'+
      '<div><label class="f">総授業回数</label><input id="cm_total" inputmode="numeric" value="'+at.total+'"></div>'+
      '<div><label class="f">評価不可になる欠席回数</label><input id="cm_limit" inputmode="numeric" value="'+at.limit+'"></div>'+
      '<button class="btn ghost" style="flex:0 0 auto;align-self:flex-end" data-act="course-meta-save" data-name="'+esc(name)+'">保存</button></div>');

  /* 課題・テスト・重要 */
  var rowT = function(t){
    var n = isYmd(t.due) ? daysFromToday(t.due) : null;
    return '<div class="evrow"><span class="cbar" style="background:'+kindHex('task')+'"></span>'+
      (t.done ? '' : '<button class="chk" data-act="task-done" data-id="'+t.id+'" aria-label="完了"></button>')+
      '<span class="grow"><span class="t"'+(t.done?' style="text-decoration:line-through;color:var(--sub)"':'')+'>'+esc(t.title)+'</span>'+
      '<span class="s">'+(isYmd(t.due)?ymdLabel(t.due):'期限なし')+(t.time?' '+esc(t.time)+'まで':'')+(t.memo?'・'+esc(t.memo):'')+'</span></span>'+
      (!t.done && n!==null ? '<span class="due '+dueClass(n)+'">'+dueText(n)+'</span>' : '')+
      '<button class="mini" data-act="ev-open" data-src="task" data-id="'+t.id+'">詳細</button></div>';
  };
  h += section('課題', tasks.filter(function(t){return !t.done;}).length+'件',
    (tasks.length ? tasks.map(rowT).join('') : '<div class="empty">この科目の課題はありません。</div>')+
    '<button class="btn ghost" style="margin-top:10px" data-act="course-add" data-name="'+esc(name)+'">この科目の課題を追加</button>');

  h += section('テスト', exams.length ? exams.length+'件' : null,
    (exams.length ? exams.map(function(x){
      var n = isYmd(x.date) ? daysFromToday(x.date) : null;
      var k = kindOf(x.kind==='quiz'?'quiz':x.kind==='kousa'?'kousa':'exam');
      return '<div class="evrow"><span class="cbar" style="background:'+k.hex+'"></span>'+
        '<span class="grow"><span class="t">'+esc(k.name)+(x.room?'・'+esc(x.room):'')+'</span>'+
        '<span class="s">'+(isYmd(x.date)?ymdLabel(x.date):'')+(x.time?' '+esc(x.time):'')+'</span></span>'+
        (n!==null?'<span class="due '+dueClass(n)+'">'+(n<0?'終了':dueText(n))+'</span>':'')+
        '<button class="mini" data-act="ev-open" data-src="quiz" data-id="'+x.id+'">詳細</button></div>';
    }).join('') : '<div class="empty">テストの予定はありません。</div>')+

/* GPA（学期ごと・累積） */
function gpaOf(termIds){
  var pts = { S:4, A:3, B:2, C:1, D:0 };
  var sum = 0, cr = 0, earned = 0;
  termIds.forEach(function(id){
    var t = termOf(id);
    (t.courses||[]).forEach(function(c){
      var g = S.grades[c.name];
      if(!g || !g.grade) return;
      var p = pts[String(g.grade).toUpperCase().charAt(0)];
      if(p == null) return;
      sum += p * (Number(c.cr)||0); cr += (Number(c.cr)||0);
      if(p > 0) earned += (Number(c.cr)||0);
    });
  });
  return { gpa: cr ? Math.round(sum/cr*100)/100 : null, credits: cr, earned: earned };
}

function viewTodo(){
  var all = S.tasks.slice()
    .map(function(t){ return Object.assign({}, t, {left: isYmd(t.due) ? daysFromToday(t.due) : null}); })
    .sort(function(a,b){
      if((a.done?1:0) !== (b.done?1:0)) return (a.done?1:0) - (b.done?1:0);   /* 未完が上 */
      if(S.ui.todoByPri){
        var pa = toNum(a.pri==null?1:a.pri), pb = toNum(b.pri==null?1:b.pri);
        if(pa !== pb) return pb - pa;                                          /* 大事さが高い順 */
      }
      if(a.left===null) return 1; if(b.left===null) return -1; return a.left-b.left;
    });
  var late = all.filter(function(t){ return !t.done && t.left!==null && t.left<0; });
  var rest = all.filter(function(t){ return late.indexOf(t) < 0; });
  var openN = all.filter(function(t){ return !t.done; }).length;

  var parts = {
    late: function(){ return late.length ? section('期限が過ぎているもの', late.length+'件', late.map(taskRow).join('')) : ''; },
    open: function(){ return section('やること', openN ? '残り'+openN+'件' : '片付いています',
        rest.length ? rest.map(taskRow).join('') : '<div class="empty">'+ART.empty+'<div style="margin-top:8px">やることはありません。</div></div>'); },
    add: function(){ return section('追加', null,
        '<div class="field"><label class="f">やること</label><input id="td_title" placeholder="例：看護過程レポート"></div>'+
        '<div class="pair" style="margin-bottom:11px">'+
          '<div><label class="f">科目（任意）</label><select id="td_subject">'+subjectOptions('')+'</select></div>'+
          '<div style="flex:0 0 150px">'+mdPicker('td_due', today(), '締切', false)+'</div></div>'+
        '<div class="field">'+timeSelect('td_time','','締切の時刻（任意）',true)+'</div>'+
        '<label class="f">大事さ</label><div class="pillrow" id="td_prirow">'+
          [['2','高'],['1','ふつう'],['0','低']].map(function(o,i){
            return '<button data-act="td-pri" data-v="'+o[0]+'" class="'+(i===1?'on':'')+'">'+o[1]+'</button>';
          }).join('')+'</div>'+
        '<div class="field"><label class="f">小項目（1行に1つ・任意）</label><textarea id="td_subs" placeholder="資料を集める&#10;下書き&#10;清書"></textarea></div>'+
        '<button class="btn" data-act="td-add">追加する</button>'+
        '<p class="note">ここで足したものは白色で、今日・明日・ToDoにだけ出ます。カレンダーには出ません。</p>'); }
  };
  var out = '';
  pageOrder('todo').forEach(function(id){ if(parts[id] && !pageHidden('todo', id)) out += parts[id](); });
  return out;
}

function readNoteForm(n){
  var t=document.getElementById('nt_title'), b=document.getElementById('nt_body'), l=document.getElementById('nt_link');
  if(t) n.title = t.value; if(b) n.body = b.value;
  if(l){ var v=l.value; n.link = v ? { type:v.split(':')[0], id:v.slice(v.indexOf(':')+1) } : null; }
}

function todoAction(act, t){
  if(act==='td-add'){
    var ti = val('td_title').trim(); if(!ti){ toast('やることを入れてください', true); return true; }
    var subs = val('td_subs').split(/\n/).map(function(x){ return x.trim(); }).filter(Boolean).map(function(x){ return { text:x, done:0 }; });
    var pb = document.querySelector('#td_prirow button.on');
    S.tasks.push({ id:uid('tk'), plain:1, pri:pb?toNum(pb.dataset.v):1, title:ti, subject:val('td_subject'), due:readMd('td_due'), time:(readTime('td_time')||''), done:0, memo:'', subs:subs, photos:[], mt:Date.now() });
    toast('追加しました'); commit(); return true;
  }
  if(act==='sub-toggle'){
    var tk = S.tasks.filter(function(x){ return x.id===t.dataset.id; })[0]; if(!tk) return true;
    var i = toNum(t.dataset.i); if(tk.subs && tk.subs[i]){ tk.subs[i].done = tk.subs[i].done?0:1; tk.mt=Date.now(); commit(); }
    return true;
  }
  if(act==='td-pri'){
    Array.prototype.forEach.call(t.parentNode.querySelectorAll('button'), function(b){ b.classList.remove('on'); });
    t.classList.add('on'); return true;
  }
  if(act==='task-timer'){
    var id = t.dataset.id;
    S.taskLog = S.taskLog || {};
    var l = S.taskLog[id] || { min:0, start:0 };
    if(l.start){ l.min = toNum(l.min) + Math.max(1, Math.round((Date.now()-l.start)/60000)); l.start = 0; toast(l.min+'分になりました'); }
    else { l.start = Date.now(); toast('はかり始めました'); }
    S.taskLog[id] = l; touch('taskLog'); commit(); return true;
  }
  if(act==='todo-tab'){ todoTab = t.dataset.v; render(); return true; }
  if(act==='note-new'){
    var n = { id:uid('nt'), title:'', body:'', pinned:0, checks:[], photos:[], link:null, ct:Date.now(), mt:Date.now() };
    if(t.dataset.linkType) n.link = { type:t.dataset.linkType, id:t.dataset.linkId };
    S.notes.push(n); noteView = n.id; appId='notes'; commit(); window.scrollTo(0,0); return true;
  }
  if(act==='note-open'){ noteView = t.dataset.id; appId='notes'; render(); window.scrollTo(0,0); return true; }
  if(act==='note-back'){ var cur=noteOf(noteView); if(cur){ readNoteForm(cur); cur.mt=Date.now(); persist(); pushRemote(); } noteView=''; render(); return true; }
  if(act==='note-save'){ var n1=noteOf(t.dataset.id); if(!n1) return true; readNoteForm(n1); n1.mt=Date.now(); toast('保存しました'); commit(); return true; }
  if(act==='note-pin'){ var n2=noteOf(t.dataset.id); if(!n2) return true; readNoteForm(n2); n2.pinned=n2.pinned?0:1; n2.mt=Date.now(); commit(); return true; }
  if(act==='note-del'){ removeWithUndo('notes', t.dataset.id, 'メモを削除しました'); noteView=''; commit(); return true; }
  if(act==='note-check-add'){
    var n3=noteOf(t.dataset.id), txt=val('nt_check').trim(); if(!n3||!txt) return true;
    readNoteForm(n3); n3.checks=(n3.checks||[]).concat([{text:txt,done:0}]); n3.mt=Date.now(); commit(); return true;
  }
  if(act==='note-check'){ var n4=noteOf(t.dataset.id); if(!n4) return true; readNoteForm(n4); var i4=toNum(t.dataset.i); if(n4.checks[i4]){ n4.checks[i4].done=n4.checks[i4].done?0:1; n4.mt=Date.now(); commit(); } return true; }
  if(act==='note-check-del'){ var n5=noteOf(t.dataset.id); if(!n5) return true; readNoteForm(n5); n5.checks.splice(toNum(t.dataset.i),1); n5.mt=Date.now(); commit(); return true; }
  if(act==='note-photo'){ var n6=noteOf(t.dataset.id); if(n6) readNoteForm(n6); memoTarget = 'note:'+t.dataset.id; var inp=document.getElementById('memoimg'); if(inp) inp.click(); return true; }
  if(act==='note-photo-del'){
    var n7=noteOf(t.dataset.id); if(!n7) return true; readNoteForm(n7);
    n7.photos=(n7.photos||[]).filter(function(x){ return x!==t.dataset.pid; });
    try{ localStorage.removeItem('shiharai:memoimg:'+t.dataset.pid); }catch(e){}
    n7.mt=Date.now(); commit(); return true;
  }
  return false;
}
