/* ================= テーマ ================= */

  --card:rgba(255,255,255,.62);
  --rule:rgba(255,255,255,.7); --soft:rgba(255,255,255,.45);
  --smbc:#2F8F6B; --smbcbg:rgba(220,245,235,.6); --rakuten:#C44A63; --rakutenbg:rgba(255,225,232,.7);
  --risyu:#B25C86; --risyubg:rgba(255,228,238,.65); --warn:#B8734A; --warnbg:rgba(255,236,222,.7);
  --ok:#2F8F6B; --okbg:rgba(223,245,235,.65);
  --e1:#E2664B; --e2:#E08A2E; --e3:#C79A18; --e4:#4E9A5B; --e5:#3FA89A;
  --e6:#5B84C4; --e7:#4C68C0; --e8:#8163B8; --e9:#D25F94; --e10:#7A8290;
  --todaybg:rgba(255,255,255,.35);
  /* ガラス */
  --glass:rgba(255,255,255,.44); --glass2:rgba(255,255,255,.30); --edge:rgba(255,255,255,.90);
  --blur:saturate(200%) blur(30px);
  --pill:rgba(255,255,255,.72); --pillbrd:rgba(255,255,255,.95);
  --spec:inset 0 1px 1px rgba(255,255,255,.95), inset 0 -1px 1px rgba(255,255,255,.35), inset 1px 0 0 rgba(255,255,255,.45);
  --lift:0 1px 2px rgba(0,0,0,.05), 0 12px 30px rgba(0,0,0,.10);
  --lift-lg:0 4px 12px rgba(0,0,0,.08), 0 26px 56px rgba(0,0,0,.16);
  --shadow:var(--lift); --shadow-lg:var(--lift-lg);
  --fs:15px;
  --paper:#EAD0D7; --tint1:rgba(232,168,190,.75); --tint2:rgba(255,214,226,.70); --tint3:rgba(216,188,232,.50); --accent:#D9738F; --accent2:#EDA6BB; --ink:#4A2B38; --sub:#9B7B87; --holi:#C2436A; --glasstint:rgba(237,166,187,.16); --glasstint2:rgba(217,115,143,.09);
}

body[data-theme="lilac"]{ --paper:#EED9EA; --tint1:rgba(220,168,210,.72); --tint2:rgba(244,214,240,.70); --tint3:rgba(210,190,240,.50); --accent:#B36AA8; --accent2:#D5A2CC; --ink:#432B40; --sub:#8F7189; --holi:#A24E96;  --glasstint:rgba(213,162,204,.16); --glasstint2:rgba(179,106,168,.09);}
body[data-theme="sakura"]{ --paper:#F9E8EE; --tint1:rgba(255,190,210,.70); --tint2:rgba(255,228,236,.70); --tint3:rgba(255,220,196,.50); --accent:#C06090; --accent2:#E39DBC; --ink:#4A2B36; --sub:#9B7A87; --holi:#B4325A;  --glasstint:rgba(227,157,188,.16); --glasstint2:rgba(192,96,144,.09);}
body[data-theme="coral"]{ --paper:#F5D6D0; --tint1:rgba(255,160,150,.70); --tint2:rgba(255,212,204,.70); --tint3:rgba(255,200,170,.50); --accent:#D8695A; --accent2:#EE9C90; --ink:#4B2A26; --sub:#9E7570; --holi:#C4463A;  --glasstint:rgba(238,156,144,.16); --glasstint2:rgba(216,105,90,.09);}
body[data-theme="mint"]{ --paper:#D9EEE4; --tint1:rgba(160,230,200,.72); --tint2:rgba(212,244,230,.70); --tint3:rgba(200,236,180,.50); --accent:#3E9B78; --accent2:#84C7AC; --ink:#1F3A30; --sub:#6C8A7E; --holi:#2D8464;  --glasstint:rgba(132,199,172,.16); --glasstint2:rgba(62,155,120,.09);}
body[data-theme="sky"]{ --paper:#DAE8F5; --tint1:rgba(160,200,245,.72); --tint2:rgba(214,232,250,.70); --tint3:rgba(190,225,240,.50); --accent:#4E8BC4; --accent2:#8FB8E0; --ink:#1F2F45; --sub:#6E8298; --holi:#3C78B5;  --glasstint:rgba(143,184,224,.16); --glasstint2:rgba(78,139,196,.09);}
body[data-theme="lemon"]{ --paper:#F5EFD3; --tint1:rgba(255,232,150,.72); --tint2:rgba(252,244,208,.70); --tint3:rgba(255,220,180,.50); --accent:#C9A63A; --accent2:#E3C877; --ink:#413819; --sub:#8F8358; --holi:#B18D22;  --glasstint:rgba(227,200,119,.16); --glasstint2:rgba(201,166,58,.09);}
body[data-theme="cream"]{ --paper:#F7F1E6; --tint1:rgba(245,205,150,.62); --tint2:rgba(250,236,214,.70); --tint3:rgba(230,195,210,.45); --accent:#B98A46; --accent2:#D9B37E; --ink:#3B3222; --sub:#7D735F; --holi:#A67934;  --glasstint:rgba(217,179,126,.16); --glasstint2:rgba(185,138,70,.09);}
body[data-theme="mono"]{ --paper:#ECECEF; --tint1:rgba(200,200,210,.70); --tint2:rgba(232,232,238,.70); --tint3:rgba(215,215,225,.50); --accent:#5A5A66; --accent2:#8E8E9A; --ink:#24242C; --sub:#6B6B78; --holi:#8A3A4A;  --glasstint:rgba(142,142,154,.16); --glasstint2:rgba(90,90,102,.09);}
body[data-theme="navy"]{ --paper:#EDF1F6; --tint1:rgba(150,175,235,.62); --tint2:rgba(224,232,246,.70); --tint3:rgba(255,190,215,.40); --accent:#3C5A8A; --accent2:#7E9BC6; --ink:#17233A; --sub:#6B7686; --holi:#C2334D;  --glasstint:rgba(126,155,198,.16); --glasstint2:rgba(60,90,138,.09);}
body[data-theme="custom"]{ /* 変数は設定画面で選んだ色からJSが作ります */ }
body[data-theme="dark"]{
  --paper:#1B1720; --tint1:rgba(180,90,140,.42); --tint2:rgba(110,80,160,.38); --tint3:rgba(80,120,200,.30);
  --accent:#E38BA8; --accent2:#B96C88; --ink:#F0E8EC; --sub:#A896A0; --holi:#F2879B; --glasstint:rgba(227,139,168,.07); --glasstint2:rgba(185,108,136,.05);
  --card:rgba(60,50,64,.6); --rule:rgba(255,255,255,.14); --soft:rgba(255,255,255,.08);
  --glass:rgba(60,50,64,.46); --glass2:rgba(60,50,64,.32); --edge:rgba(255,255,255,.22);
  --pill:rgba(255,255,255,.18); --pillbrd:rgba(255,255,255,.30);
  --spec:inset 0 1px 1px rgba(255,255,255,.22), inset 0 -1px 1px rgba(255,255,255,.06);
  --lift:0 1px 2px rgba(0,0,0,.35), 0 12px 30px rgba(0,0,0,.45);
  --lift-lg:0 4px 12px rgba(0,0,0,.45), 0 26px 56px rgba(0,0,0,.6);
  --smbc:#4FBE7E; --smbcbg:rgba(31,49,41,.7); --rakuten:#F2726F; --rakutenbg:rgba(51,34,36,.7);
  --risyu:#D89AC0; --risyubg:rgba(70,40,60,.7); --warn:#E6A567; --warnbg:rgba(51,41,31,.7);
  --ok:#6FCB96; --okbg:rgba(30,49,40,.7); --todaybg:rgba(90,50,70,.6);
}
body[data-fs="m"]{--fs:15px}

*{box-sizing:border-box; -webkit-tap-highlight-color:transparent; touch-action:manipulation}
body{
  margin:0; color:var(--ink); font-size:var(--fs);
  font-family:"Hiragino Maru Gothic ProN","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic Medium",sans-serif;
  line-height:1.55; -webkit-text-size-adjust:100%;
  transition:color .25s;
  background:var(--paper);
  min-height:100vh;
}
body::before{
  content:''; position:fixed; inset:0; z-index:-1; pointer-events:none;
  background:
    radial-gradient(64vw 46vh at 6% -2%,  var(--tint1), transparent 62%),
    radial-gradient(56vw 42vh at 104% 14%, var(--tint2), transparent 60%),
    radial-gradient(52vw 40vh at 84% 62%, var(--tint3), transparent 62%),
    radial-gradient(70vw 48vh at 16% 100%, var(--tint1), transparent 64%),
    radial-gradient(40vw 30vh at 50% 40%, rgba(255,255,255,.45), transparent 70%);
  opacity:1;
}
.num{font-variant-numeric:tabular-nums; letter-spacing:.01em}

/* ================= 起動アニメ ================= */
#splash{position:fixed; inset:0; background:var(--paper); z-index:90; display:flex;
  flex-direction:column; align-items:center; justify-content:center; gap:14px;
  transition:opacity .45s ease, visibility .45s}
#splash.out{opacity:0; visibility:hidden}
#splash .ttl{font-size:1.1em; font-weight:700; letter-spacing:.14em; opacity:0; animation:rise .6s .15s forwards}
#splash svg{opacity:0; animation:rise .6s forwards}
@keyframes rise{from{opacity:0; transform:translateY(10px)} to{opacity:1; transform:none}}
/* ホーム画面のアイコンから開いた時 */
@media (display-mode: standalone){
  header{padding-top:calc(env(safe-area-inset-top) + 8px)}
}
/* ================= iPad・パソコン ================= */
@media (min-width:760px){
  body{font-size:calc(var(--fs) * 1.05)}
  main{max-width:100%; padding:24px 28px 48px}
  header{padding:calc(env(safe-area-inset-top) + 10px) 28px 0}
  #apps{max-width:100%; margin-bottom:14px}
  #apps button{font-size:.86em; padding:11px 16px}
  nav{max-width:100%}
  #app{column-count:2; column-gap:24px}
  #app>section, #app>.tsec, #app>div{break-inside:avoid; -webkit-column-break-inside:avoid; page-break-inside:avoid; display:block; margin-bottom:20px}
  .hero{column-span:all; padding:26px 28px 20px}
  .hero .greet{font-size:1.5em}
  .cal td{height:auto}
  .cal .day{min-height:118px}
  .cal .ev{font-size:.62em}
  table.tt2 td{height:124px}
  .cell2 .nm2{font-size:.68em}
  .cell2 .room2{font-size:.58em}
  .themes{grid-template-columns:repeat(7,minmax(0,1fr))}
  .fab{right:32px; bottom:32px; width:64px; height:64px; font-size:1.9em}
  .sheet{max-width:680px; margin:0 auto; border-radius:28px; bottom:4vh; left:0; right:0}
}
@media (min-width:1100px){
  main{padding:26px 40px 56px}
  header{padding:calc(env(safe-area-inset-top) + 20px) 40px 0}
  #app{column-count:3; column-gap:26px}
  .cal .day{min-height:132px}
  table.tt2 td{height:136px}
}
@media (min-width:1500px){
  main{padding:28px 6vw 60px}
  #app{column-count:4; column-gap:26px}
}
/* 時間割・カレンダーは大画面では1列ぶち抜きで大きく見せる */
@media (min-width:760px){
  #app>section:has(table.tt2), #app>section:has(table.cal){ column-span:all }
  #app>.scroll{ column-span:all }
  /* 表は横スクロールせずに収める */
  .scroll{overflow-x:visible}
  table.tt,table.tt2{min-width:0; width:100%}
  .cal{width:100%}
}
/* パソコンではタップ領域を少し詰める */
@media (hover:hover) and (pointer:fine){
  .mini{padding:5px 11px}
  .mini:hover,button.btn:hover,.pillrow button:hover,.kbtn:hover{filter:brightness(1.04)}
  .ccard:hover,.ncard:hover,.trplan:hover{transform:translateY(-1px); transition:transform .15s}
  .cal .day:hover{background:rgba(255,255,255,.22)}
  .cell2:hover{filter:brightness(1.03)}
}
/* 入力欄は必ず16px以上（iPhoneの自動拡大を防ぐ） */
input, textarea, select{font-size:16px !important}
input[type="color"]{font-size:16px !important}
@media (prefers-reduced-motion:reduce){#splash svg,#splash .ttl{animation:none; opacity:1}}

header{
  position:sticky; top:0; z-index:20; color:var(--ink);
  background:linear-gradient(180deg, rgba(255,255,255,.62), rgba(255,255,255,.34));
  -webkit-backdrop-filter:saturate(180%) blur(30px); backdrop-filter:saturate(180%) blur(30px);
  padding:calc(env(safe-area-inset-top) + 6px) 14px 0;
  border-bottom:1px solid rgba(255,255,255,.6);
  box-shadow:0 6px 22px rgba(0,0,0,.10);
}
body[data-theme="dark"] header{background:linear-gradient(180deg, rgba(34,28,38,.95), rgba(34,28,38,.85)); border-bottom-color:rgba(255,255,255,.10)}
header h1{margin:0; font-size:1.0em; letter-spacing:.03em; font-weight:700; display:flex; align-items:center; gap:8px; min-height:0}
header h1 #synctag{font-size:.72em; font-weight:400; color:var(--sub); letter-spacing:0}

/* 上のアプリ切替：ガラスの丸がすべる */
#apps{position:relative; display:flex; gap:1px; max-width:620px; margin:6px auto 8px;
  overflow:hidden; padding:3px; border-radius:999px;
  background:rgba(255,255,255,.26); border:1px solid rgba(255,255,255,.75);
  box-shadow:var(--spec), 0 2px 10px rgba(0,0,0,.10)}
#apps::-webkit-scrollbar{display:none}
#apps .pill{position:absolute; top:4px; left:0; height:calc(100% - 8px); border-radius:999px;
  background:linear-gradient(180deg, rgba(255,255,255,.98), rgba(255,255,255,.72));
  border:1px solid rgba(255,255,255,.95);
  box-shadow:0 3px 10px rgba(0,0,0,.22), inset 0 1px 0 rgba(255,255,255,1);
  transition:transform .38s cubic-bezier(.34,1.15,.4,1), width .38s cubic-bezier(.34,1.15,.4,1);
  pointer-events:none; z-index:0}
body[data-theme="dark"] #apps{background:rgba(255,255,255,.08); border-color:rgba(255,255,255,.14)}
body[data-theme="dark"] nav{background:linear-gradient(180deg, rgba(40,34,44,.92), rgba(40,34,44,.80))}
body[data-theme="dark"] #apps .pill{background:linear-gradient(180deg, rgba(255,255,255,.26), rgba(255,255,255,.12)); border-color:rgba(255,255,255,.3)}
#apps button{position:relative; z-index:1; flex:1 1 0; min-width:0; border:0; background:none;
  color:var(--sub); font:inherit; font-size:.74em; padding:9px 0; border-radius:999px; letter-spacing:0;
  font-weight:700; transition:color .25s; white-space:nowrap; overflow:visible}
/* タブが多いときは文字を少し小さく */
#apps[data-n="8"] button{font-size:.7em}
#apps[data-n="9"] button{font-size:.64em}
#apps[data-n="10"] button{font-size:.6em}
#apps[data-n="11"] button{font-size:.56em}
@media (max-width:360px){
  #apps[data-n="8"] button{font-size:.64em}
  #apps[data-n="9"] button{font-size:.58em}
}
#apps button.on{color:var(--ink)}

/* 下のタブ：同じく丸がすべる */
nav{position:sticky; top:var(--hdrh,104px); display:flex; gap:2px; z-index:15; overflow-x:auto; scrollbar-width:none;
  max-width:620px; margin:10px auto 0; padding:4px; border-radius:999px;
  background:linear-gradient(180deg, rgba(255,255,255,.64), rgba(255,255,255,.36)); border:1px solid var(--edge);
  -webkit-backdrop-filter:saturate(180%) blur(28px); backdrop-filter:saturate(180%) blur(28px);
  box-shadow:var(--spec), 0 6px 18px rgba(0,0,0,.12)}
nav::-webkit-scrollbar{display:none}
nav .pill{position:absolute; top:4px; left:0; height:calc(100% - 8px); border-radius:999px;
  background:linear-gradient(180deg, rgba(255,255,255,.98), rgba(255,255,255,.74));
  border:1px solid var(--pillbrd);
  box-shadow:0 3px 10px rgba(0,0,0,.18), inset 0 1px 0 rgba(255,255,255,1);
  transition:transform .34s cubic-bezier(.34,1.2,.4,1), width .34s cubic-bezier(.34,1.2,.4,1);
  pointer-events:none; z-index:0}
nav button{position:relative; z-index:1; flex:1 0 auto; min-width:60px; border:0; background:none;
  padding:8px 10px; font:inherit; font-size:.78em; color:var(--sub); white-space:nowrap;
  border-radius:999px; transition:color .25s}
nav button.on{color:var(--ink); font-weight:700}
nav.hide{display:none}

.box{position:relative; background:linear-gradient(150deg, rgba(255,255,255,.58), var(--glasstint), rgba(255,255,255,.26));
    border:1px solid var(--edge); border-radius:26px; padding:17px;
    -webkit-backdrop-filter:var(--blur); backdrop-filter:var(--blur);
    box-shadow:var(--spec), var(--lift); overflow:hidden}
.box::before{content:''; position:absolute; inset:0; pointer-events:none; border-radius:inherit;
    background:linear-gradient(118deg, rgba(255,255,255,.55) 0%, rgba(255,255,255,.12) 32%, rgba(255,255,255,0) 55%, rgba(255,255,255,.18) 100%)}

.row{display:flex; align-items:center; gap:11px; padding:10px 0; border-bottom:1px solid var(--rule);

.s2{font-size:.78em; color:var(--sub)}
.amt{font-size:1em; font-weight:600}

.mid{font-size:1.5em; font-weight:700}

.smbc{color:var(--smbc)} .bg-smbc{background:var(--smbcbg)}
.rakuten{color:var(--rakuten)} .bg-rakuten{background:var(--rakutenbg)}
  .chk{position:relative; width:23px;height:23px;border-radius:999px;border:1px solid rgba(255,255,255,.8);
    display:flex;align-items:center;justify-content:center; color:#fff;font-size:.78em;flex:none;
    background:linear-gradient(160deg, rgba(255,255,255,.72), var(--glasstint2), rgba(255,255,255,.36));

    background:linear-gradient(150deg, rgba(255,255,255,.7) 0%, rgba(255,255,255,0) 55%)}
.done .t{color:var(--sub); text-decoration:line-through}
button.btn{display:block; width:100%; padding:13px; border-radius:999px; border:1px solid rgba(255,255,255,.5);

    color:var(--ink); border:1px solid var(--edge);

    box-shadow:var(--spec), 0 4px 12px rgba(0,0,0,.14)}

.pair{display:flex; gap:8px; align-items:stretch}
.pair>*{flex:1 1 0; min-width:0}
.pair>button.btn{width:auto; white-space:nowrap}
label.f{display:block; font-size:.78em; color:var(--sub); margin:0 0 4px}
input,textarea,select{width:100%; padding:11px 14px; border:1px solid var(--edge); border-radius:18px;
  background:linear-gradient(180deg, rgba(255,255,255,.64), var(--glasstint2), rgba(255,255,255,.36));

  -webkit-backdrop-filter:blur(8px); backdrop-filter:blur(8px);

input:focus,textarea:focus,select:focus{border-color:var(--accent2); box-shadow:0 0 0 3px rgba(233,160,182,.30), inset 0 1px 2px rgba(0,0,0,.08)}
body[data-theme="dark"] input,body[data-theme="dark"] textarea,body[data-theme="dark"] select{background:linear-gradient(180deg, rgba(255,255,255,.12), rgba(255,255,255,.06))}
textarea{min-height:80px}
.field{margin-bottom:11px}
.pick{display:flex; gap:8px; margin-bottom:11px}

.pick button.on.smbc{background:var(--smbcbg); border-color:var(--smbc); color:var(--smbc)}
.pick button.on.rakuten{background:var(--rakutenbg); border-color:var(--rakuten); color:var(--rakuten)}
.pick .b{display:block; font-size:.92em}
.pick .c{display:block; font-size:.72em; opacity:.75}
.chips{display:flex; gap:7px; margin-bottom:11px; flex-wrap:wrap}
  .chips button{padding:7px 14px; border-radius:999px; border:1px solid var(--edge); font:inherit; font-size:.78em; color:var(--sub);
    background:linear-gradient(180deg, rgba(255,255,255,.70), var(--glasstint2), rgba(255,255,255,.34)); box-shadow:var(--spec), 0 3px 10px rgba(0,0,0,.07)}

.note{font-size:.78em; color:var(--sub); line-height:1.7; margin-top:8px}
.msg{border-radius:16px; padding:11px 14px; font-size:.83em; margin-bottom:12px; line-height:1.5; border:1px solid rgba(255,255,255,.6)}
.ok{background:var(--okbg); color:var(--ok)}
.ng{background:var(--warnbg); color:var(--warn)}
.mini{font-size:.72em; padding:6px 12px; border-radius:999px; border:1px solid var(--edge);
    background:linear-gradient(180deg, rgba(255,255,255,.74), var(--glasstint2), rgba(255,255,255,.40)); color:var(--sub); font-family:inherit;
    -webkit-backdrop-filter:blur(10px); backdrop-filter:blur(10px); box-shadow:var(--spec), 0 3px 8px rgba(0,0,0,.08)}

.hide{display:none}
img.shot{width:100%; max-height:190px; object-fit:cover; border-radius:9px; margin-bottom:11px}
#lightbox{position:fixed; inset:0; background:rgba(10,14,22,.9); display:flex; align-items:center; justify-content:center; padding:24px; z-index:60}
#lightbox img{max-width:100%; max-height:80vh; border-radius:10px}
.dot{display:inline-block; width:7px; height:7px; border-radius:50%; margin-right:5px}
code{background:var(--soft); padding:1px 5px; border-radius:4px; font-size:.8em}

/* ================= トースト ================= */
#toast{-webkit-backdrop-filter:var(--blur); backdrop-filter:var(--blur); border:1px solid rgba(255,255,255,.35); position:fixed; left:50%; bottom:calc(env(safe-area-inset-bottom) + 22px); transform:translate(-50%,20px);
  background:var(--ink); color:var(--card); padding:11px 18px; border-radius:999px; font-size:.83em; font-weight:600;
  box-shadow:var(--shadow-lg); z-index:70; opacity:0; visibility:hidden; transition:.25s; max-width:88vw; text-align:center}

#toast.on{opacity:1; visibility:visible; transform:translate(-50%,0)}
#toast.bad{background:var(--rakuten); color:#fff}

/* ================= バナー ================= */
  .bn{display:flex; gap:10px; align-items:flex-start; border-radius:18px; padding:12px 14px; margin-bottom:9px; font-size:.83em; line-height:1.5;
    border:1px solid rgba(255,255,255,.6); box-shadow:var(--spec), 0 3px 10px rgba(0,0,0,.10);
    -webkit-backdrop-filter:blur(10px); backdrop-filter:blur(10px)}
.bn .ic{flex:none; font-size:1.05em; line-height:1.3}
.bn.red{background:var(--rakutenbg); color:var(--rakuten)}
.bn.amber{background:var(--warnbg); color:var(--warn)}
.bn.green{background:var(--okbg); color:var(--ok)}
.bn.blue{background:var(--risyubg); color:var(--risyu)}
.bn b{font-weight:700}

/* ================= イラスト ================= */
.illus{display:block; margin:0 auto}
.hero{background:linear-gradient(150deg, rgba(255,255,255,.60), var(--glasstint), rgba(255,255,255,.24));
  border:1px solid var(--edge); border-radius:28px; padding:20px 18px 14px;
  -webkit-backdrop-filter:var(--blur); backdrop-filter:var(--blur);
  box-shadow:var(--spec), var(--lift-lg); margin-bottom:16px; position:relative; overflow:hidden}
.hero::before{content:''; position:absolute; inset:0; pointer-events:none; border-radius:inherit;
  background:linear-gradient(118deg, rgba(255,255,255,.55) 0%, rgba(255,255,255,.1) 34%, rgba(255,255,255,0) 58%)}
body[data-theme="dark"] .hero{background:linear-gradient(150deg, rgba(70,58,74,.66), var(--glasstint), rgba(50,42,54,.40))}
body[data-theme="dark"] .hero::before{background:linear-gradient(118deg, rgba(255,255,255,.14), rgba(255,255,255,0) 55%)}
.hero .date{font-size:.78em; color:var(--sub)}
.hero .greet{font-size:1.25em; font-weight:700; margin-top:2px}
.hero .art{position:absolute; right:8px; bottom:0; opacity:.9; pointer-events:none; z-index:0}
  .hero .date,.hero .greet,.hero .wx{position:relative; z-index:1; padding-right:86px}

/* ================= 履修 ================= */
.met{display:flex; align-items:center; gap:10px; padding:7px 0; border-bottom:1px dotted var(--rule)}
.met:last-child{border-bottom:0}
.met-n{flex:0 0 40%; font-size:.85em}
.met-n small{display:block; color:var(--sub); font-size:.72em}
  .bar{flex:1; height:10px; background:rgba(255,255,255,.5); border-radius:999px; overflow:hidden; box-shadow:inset 0 1px 3px rgba(0,0,0,.18)}
  .bar i{display:block; height:100%; border-radius:999px; transition:width .3s; position:relative;
    background:linear-gradient(90deg, var(--accent2), var(--accent));
    box-shadow:inset 0 1px 1px rgba(255,255,255,.7), 0 1px 4px rgba(0,0,0,.16)}
  .bar i::after{content:''; position:absolute; inset:0; border-radius:inherit;
    background:linear-gradient(180deg, rgba(255,255,255,.45), rgba(255,255,255,0) 60%)}
.bar i.done{background:var(--smbc)}
.bar i.over{background:var(--rakuten)}
.met-v{flex:0 0 66px; text-align:right; font-size:.78em; color:var(--sub); font-variant-numeric:tabular-nums}
.met-v b{color:var(--ink); font-size:.95em}
.earn-grid{display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:4px}
.earn-grid label{font-size:.78em; color:var(--sub); display:flex; flex-direction:column; gap:3px}
  .scroll{overflow-x:auto; -webkit-overflow-scrolling:touch; border:1px solid var(--edge); border-radius:26px;
    background:linear-gradient(150deg, rgba(255,255,255,.60), var(--glasstint), rgba(255,255,255,.30));
    -webkit-backdrop-filter:var(--blur); backdrop-filter:var(--blur); box-shadow:var(--spec), var(--lift)}
table.tt{border-collapse:collapse; width:100%; min-width:600px; table-layout:fixed}
table.tt th,table.tt td{border:1px solid rgba(255,255,255,.55); padding:0; vertical-align:top}
table.tt thead th{background:rgba(255,255,255,.45); font-size:.78em; font-weight:600; padding:6px 0; text-align:center}
table.tt th.pd{width:30px; background:var(--risyubg); font-size:.78em; text-align:center; vertical-align:middle}
.cell{width:100%; min-height:48px; border:0; background:transparent; font:inherit; text-align:left; padding:6px; display:block; color:inherit}
.cell .nm{font-size:.72em; line-height:1.3; word-break:break-word; display:block}
.cell .tag{font-size:.68em; color:var(--sub); display:block; margin-top:2px}
.cell.free{color:var(--sub); font-size:.78em}
.cell.none{color:var(--rule)}
td.fx{background:var(--soft)}
td.fx .nm{color:var(--sub)}
td.sel{background:var(--risyubg)}
td.sel .nm{color:var(--risyu); font-weight:700}
.cell .x{float:right; font-size:.7em; color:var(--risyu); border:1px solid var(--risyu); border-radius:4px; padding:2px 7px; margin-left:4px; background:var(--card)}
  .veil{position:fixed; inset:0; background:rgba(60,30,45,.32); display:none; z-index:40;
    -webkit-backdrop-filter:blur(6px); backdrop-filter:blur(6px)}
.veil.on{display:block}
.sheet{position:fixed; left:0; right:0; bottom:0; max-height:88vh;
  background:linear-gradient(160deg, rgba(255,255,255,.58), var(--glasstint), rgba(255,255,255,.30));
  -webkit-backdrop-filter:saturate(200%) blur(34px); backdrop-filter:saturate(200%) blur(34px);
  border-top:1px solid var(--edge);
  border-radius:28px 28px 0 0; z-index:41; display:none; flex-direction:column; box-shadow:var(--lift-lg)}
body[data-theme="dark"] .sheet{background:linear-gradient(160deg, rgba(60,50,64,.72), var(--glasstint), rgba(46,40,50,.46))}
.sheet.on{display:flex}
@media(min-width:700px){.sheet{max-width:620px; margin:0 auto; border-radius:16px; bottom:3vh}}
.sheet-hd{padding:12px 14px 10px; border-bottom:1px solid var(--edge); background:var(--glass2); border-radius:24px 24px 0 0}
.sheet-hd .rowline{display:flex; align-items:center; justify-content:space-between; gap:10px}
.sheet-hd h3{margin:0; font-size:1em}
.sheet-bd{overflow-y:auto; padding:10px 14px 24px; -webkit-overflow-scrolling:touch}
  .crs{background:linear-gradient(160deg, rgba(255,255,255,.7), rgba(255,255,255,.4)); border:1px solid var(--edge); border-radius:20px; box-shadow:var(--spec); -webkit-backdrop-filter:blur(10px); backdrop-filter:blur(10px); padding:10px 11px; margin-bottom:8px; display:flex; gap:10px; align-items:flex-start}
.crs.dis{opacity:.5}
.crs .body{flex:1; min-width:0}
.crs .ct{font-size:.93em; font-weight:600; line-height:1.35}

.badges{display:flex; flex-wrap:wrap; gap:5px; margin-top:6px}
.b{font-size:.68em; padding:3px 9px; border-radius:999px; white-space:nowrap}
.b.cat{background:var(--risyubg); color:var(--risyu)}
.b.cr{background:var(--soft); color:var(--sub)}
.b.r0{background:var(--okbg); color:var(--ok)}
.b.r1{background:var(--okbg); color:var(--ok)}
.b.r2{background:var(--warnbg); color:var(--warn)}
.b.r3{background:var(--rakutenbg); color:var(--rakuten)}
.b.warn{background:var(--rakutenbg); color:var(--rakuten)}
.b.en{background:var(--risyubg); color:var(--risyu)}
.add{flex:0 0 auto; border:1px solid var(--risyu); background:var(--risyu); color:#fff; border-radius:8px; font:inherit; font-size:.85em; font-weight:600; padding:7px 12px; align-self:center}
.add.rm{background:var(--card); color:var(--rakuten); border-color:var(--rakuten)}
.add[disabled]{background:var(--rule); border-color:var(--rule); color:var(--card)}
.empty{color:var(--sub); font-size:.83em; padding:16px 2px; text-align:center}
.plancard{background:var(--glass2); border:1px solid var(--edge); border-radius:16px; padding:11px 12px; margin-bottom:8px}
.plancard h3{margin:0; font-size:.93em; display:flex; gap:7px; align-items:baseline}
.plancard h3 em{font-style:normal; color:var(--risyu); font-weight:700; font-size:.8em; background:var(--risyubg); border-radius:5px; padding:1px 6px}
.plancard p{margin:5px 0 7px; font-size:.78em; color:var(--sub); line-height:1.5}
.plancard .codes{font-size:.76em; color:var(--sub); line-height:1.6; font-variant-numeric:tabular-nums}
.codebox{width:100%; font-variant-numeric:tabular-nums; min-height:60px; margin-top:9px; background:var(--card)}
label.tg{display:flex; align-items:flex-start; gap:7px; font-size:.78em; color:var(--sub); margin-top:9px; line-height:1.45}
label.tg input{width:auto; margin-top:2px}

/* ================= 天気・交通・メモ ================= */
  .wxrow{display:grid; grid-template-columns:1fr 1fr; gap:8px}
    .wxcell{background:linear-gradient(150deg, rgba(255,255,255,.70), var(--glasstint2), rgba(255,255,255,.36)); border:1px solid var(--edge);
    border-radius:18px; padding:11px 12px; box-shadow:var(--spec), 0 3px 10px rgba(0,0,0,.10)}
  .wxcell .k{font-size:.72em; color:var(--sub)}
  .wxcell .now{font-size:1.6em; font-weight:700; line-height:1.15; font-variant-numeric:tabular-nums}
    .trplan{border:1px solid var(--edge); border-radius:18px; padding:11px 13px; margin-bottom:9px;
    background:linear-gradient(150deg, rgba(255,255,255,.64), var(--glasstint2), rgba(255,255,255,.30)); box-shadow:var(--spec), 0 4px 12px rgba(0,0,0,.07)}
  .trplan.ng{opacity:.7; border-color:var(--rakuten)}
  .trtag{display:inline-block; font-size:.7em; font-weight:700; padding:2px 9px; border-radius:999px;
    background:var(--soft); color:var(--sub); margin-bottom:6px}
  .trtag.on,.trplan:first-child .trtag{background:linear-gradient(180deg, var(--accent2), var(--accent)); color:#fff}
  body[data-theme="dark"] .trtag.on{color:#111}
  .trtag.ng{background:var(--rakutenbg); color:var(--rakuten)}
  .trline{display:flex; gap:8px; align-items:baseline; font-size:.82em; line-height:1.5}
  .trk{flex:none; width:2.6em; font-size:.86em; color:var(--sub)}
  .trwarn{font-size:.74em; color:var(--rakuten); margin-top:4px}
  .mphotos{display:flex; gap:8px; flex-wrap:wrap; margin-top:10px}
  .mphoto{position:relative; width:76px; height:76px}
  .mphoto img{width:100%; height:100%; object-fit:cover; border-radius:10px; border:1px solid var(--edge)}
  .mphoto .mini{position:absolute; top:-6px; right:-6px; padding:1px 7px; background:var(--card)}

/* ================= テーマ選択 ================= */
  .themes{display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:10px; margin-bottom:6px}
  .themes button{display:flex; flex-direction:column; align-items:center; gap:5px; padding:8px 4px 6px; border-radius:18px;
    border:1px solid var(--edge); background:linear-gradient(150deg, rgba(255,255,255,.62), rgba(255,255,255,.28));
    font:inherit; font-size:.7em; color:var(--sub); box-shadow:var(--spec)}
  .themes button.on{color:var(--ink); font-weight:700; box-shadow:var(--spec), 0 0 0 2px var(--accent)}
  .themes .sw{width:34px; height:34px; border-radius:50%; border:2px solid rgba(255,255,255,.9);
    box-shadow:inset 0 2px 4px rgba(255,255,255,.7), 0 3px 8px rgba(0,0,0,.14)}

/* ================= 時刻のスライド選択 ================= */
  .twrap{margin-bottom:11px}
  .tvals{display:flex; align-items:center; gap:10px; margin-bottom:6px}
  .tv{font-size:1.2em; font-weight:700; font-variant-numeric:tabular-nums}
  .tcols{display:flex; gap:8px}
  .tcol{flex:1; height:118px; overflow-y:auto; scroll-snap-type:y mandatory;
    border:1px solid var(--edge); border-radius:16px; padding:44px 0;
    background:linear-gradient(150deg, rgba(255,255,255,.62), var(--glasstint2), rgba(255,255,255,.32));
    -webkit-backdrop-filter:blur(12px); backdrop-filter:blur(12px);
    box-shadow:var(--spec), inset 0 8px 12px -8px rgba(0,0,0,.12), inset 0 -8px 12px -8px rgba(0,0,0,.12);
    scrollbar-width:none}
  .tcol::-webkit-scrollbar{display:none}
  .twi{display:block; width:100%; border:0; background:none; font:inherit; font-size:1em; color:var(--sub);
    padding:5px 0; scroll-snap-align:center; font-variant-numeric:tabular-nums; opacity:.6}
  .twi.on{color:#fff; font-weight:700; opacity:1;
    background:linear-gradient(180deg, var(--accent2), var(--accent));
    border-radius:999px; box-shadow:inset 0 1px 0 rgba(255,255,255,.6), 0 3px 8px rgba(0,0,0,.16)}

/* ================= 週の時間わり ================= */
  .wtl{border:1px solid var(--edge); border-radius:20px; overflow:hidden;
    background:linear-gradient(150deg, rgba(255,255,255,.62), var(--glasstint), rgba(255,255,255,.32));
    -webkit-backdrop-filter:var(--blur); backdrop-filter:var(--blur); box-shadow:var(--spec), var(--lift)}
  .wtl-head{display:flex; padding:6px 0; border-bottom:1px solid var(--rule)}
  .wtl-hcol{flex:0 0 26px}
  .wtl-d{flex:1; text-align:center; font-size:.6em; color:var(--sub); line-height:1.2}
  .wtl-d b{display:block; font-size:1.2em; color:var(--ink)}
  .wtl-d.now b{color:var(--accent)}
  .wtl-body{position:relative; display:flex; overflow-y:auto}
  .wtl-hours{flex:0 0 26px; display:flex; flex-direction:column}
  .wtl-hours span{font-size:.52em; color:var(--sub); text-align:right; padding-right:3px; line-height:1}
  .wtl-col{flex:1; position:relative; border-left:1px solid var(--rule)}
  .wtl-ev{position:absolute; left:1px; right:1px; border-radius:5px; overflow:hidden;
    font-size:.5em; line-height:1.15; padding:1px 2px; border:1px solid rgba(255,255,255,.6);
    box-shadow:inset 0 1px 1px rgba(255,255,255,.7), 0 1px 3px rgba(0,0,0,.16); cursor:pointer}
  .wtl-ev.cls{border-width:1px; border-style:solid; color:var(--ink); cursor:default}
  .wtl-ev span{display:block; overflow:hidden}

/* ================= 季節のかざり ================= */

/* ================= たためる設定 ================= */
  .fold .foldhd{cursor:pointer; user-select:none; margin-bottom:0; padding:12px 14px; border-radius:20px;
    border:1px solid var(--edge);
    background:linear-gradient(150deg, rgba(255,255,255,.58), var(--glasstint2), rgba(255,255,255,.30));
    -webkit-backdrop-filter:blur(12px); backdrop-filter:blur(12px); box-shadow:var(--spec)}
  .fold .foldhd h2{font-size:.95em}
  .fold.on .foldhd{border-bottom-left-radius:0; border-bottom-right-radius:0; border-bottom:0}
  .fold.on .box{border-top-left-radius:0; border-top-right-radius:0}
  .fold{margin-bottom:10px}

  #revbtn{margin-left:auto; border:0; background:none; padding:0 2px; cursor:pointer; line-height:1}
  #revbtn .rgb{display:inline-flex; align-items:center; justify-content:center; min-width:30px; height:26px;
    padding:0 7px; border-radius:9px; font-size:.72em; font-weight:800; color:#fff;
    border:1px solid rgba(255,255,255,.7); background:linear-gradient(160deg, color-mix(in srgb, var(--gc) 74%, white), var(--gc));
    box-shadow:inset 0 1px 1px rgba(255,255,255,.75), 0 2px 7px rgba(0,0,0,.14)}
  #revbtn .rgb.none{color:var(--sub); font-weight:700; font-size:.64em;
    background:linear-gradient(160deg, rgba(255,255,255,.7), rgba(255,255,255,.4)); border-color:var(--edge)}
  #revbtn:active{transform:scale(.93)}
  .kbtn .ksl{font-size:.82em; opacity:.85; margin-right:4px; font-weight:700}

/* ================= カレンダーの追加ボタン ================= */
  .calfab{position:fixed; right:16px; bottom:calc(env(safe-area-inset-bottom) + 84px); z-index:25;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    width:60px; height:60px; border-radius:50%; border:1px solid rgba(255,255,255,.75); cursor:pointer;
    color:#fff; background:linear-gradient(160deg, var(--accent2), var(--accent));
    box-shadow:inset 0 1px 2px rgba(255,255,255,.7), 0 6px 18px rgba(0,0,0,.25);
    -webkit-backdrop-filter:blur(10px); backdrop-filter:blur(10px)}
  .calfab .pl{font-size:1.35em; font-weight:700; line-height:1}
  .calfab .dd{font-size:.56em; font-weight:700; margin-top:1px; opacity:.95}
  .calfab:active{transform:scale(.94)}

/* ================= タブを上に固定 ================= */
  /* 文字や数字を入れているときは、固定をやめて入力を優先する */
  body[data-kb="1"] header, body[data-kb="1"] nav{ position:static!important }

/* ================= かざり（背景の絵） ================= */
  .decor{position:fixed; inset:0; z-index:0; pointer-events:none; overflow:hidden}
  .decor.off{display:none}
  .decor-art{position:absolute; left:0; right:0; bottom:0; height:min(38vh, 300px); opacity:.9}
  .decor-art svg{width:100%; height:100%; display:block}
  .decor-marks{position:absolute; inset:0}
  .decor-marks span{position:absolute; animation:dfloat ease-in-out infinite alternate; will-change:transform}
  @keyframes dfloat{ from{ transform:translateY(0) rotate(-6deg) } to{ transform:translateY(-10px) rotate(6deg) } }
  .decor.lv1 .decor-art{opacity:.55}
  .decor.lv3 .decor-art{opacity:1}
  .decor-fall{position:absolute; inset:0}
  .decor-fall span{position:absolute; top:-24px; animation:dfall linear infinite; will-change:transform}
  @keyframes dfall{
    0%{ transform:translate3d(0,-24px,0) rotate(0deg); opacity:0 }
    8%{ opacity:1 }
    92%{ opacity:1 }
    100%{ transform:translate3d(18px,102vh,0) rotate(220deg); opacity:0 }
  }
  @media (prefers-reduced-motion: reduce){ .decor-fall{display:none} }
  #app, #apps, #subs, #fab{ position:relative; z-index:1 }
  header{ z-index:20 }

/* ================= 乗換の検索結果 ================= */
  .routes{display:flex; flex-direction:column; gap:10px; margin-top:4px}
  .rt{position:relative; border-radius:20px; padding:12px 14px; overflow:hidden;
    border:1px solid var(--edge);
    background:linear-gradient(150deg, rgba(255,255,255,.58), var(--glasstint2), rgba(255,255,255,.30));
    -webkit-backdrop-filter:blur(14px); backdrop-filter:blur(14px);
    box-shadow:var(--spec), 0 3px 10px rgba(0,0,0,.08)}
  .rt.best{border-color:var(--accent);
    background:linear-gradient(150deg, rgba(255,255,255,.66), var(--glasstint), rgba(255,255,255,.36));
    box-shadow:var(--spec), 0 5px 16px rgba(0,0,0,.13)}
  .rt::before{content:''; position:absolute; inset:0; pointer-events:none; border-radius:inherit;
    background:linear-gradient(160deg, rgba(255,255,255,.45) 0%, rgba(255,255,255,0) 52%)}
  .rt>*{position:relative}
  .rthd{display:flex; align-items:baseline; gap:8px; flex-wrap:wrap; margin-bottom:8px}
  .rtag{flex:none; font-size:.68em; font-weight:700; padding:3px 9px; border-radius:999px;
    color:var(--sub); border:1px solid var(--edge); background:rgba(255,255,255,.5)}
  .rtag.on{color:#fff; border-color:rgba(255,255,255,.7);
    background:linear-gradient(160deg, var(--accent2), var(--accent));
    box-shadow:inset 0 1px 1px rgba(255,255,255,.6)}
  .rtime{font-size:1.12em; font-weight:800; font-variant-numeric:tabular-nums; letter-spacing:.01em}
  .rtime .ar{margin:0 5px; font-weight:400; color:var(--sub)}
  .rmin{margin-left:auto; font-size:.72em; color:var(--sub); white-space:nowrap}
  .rtleg{display:flex; align-items:center; gap:8px; padding:5px 0; border-top:1px solid var(--rule)}
  .rtleg:first-of-type{border-top:0}
  .rkind{flex:none; width:34px; font-size:.64em; font-weight:700; color:var(--accent);
    text-align:center; padding:2px 0; border-radius:7px; background:var(--glasstint)}
  .rname{flex:1 1 auto; min-width:0; font-size:.72em; color:var(--sub);
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .rtype{margin-left:5px; font-size:.9em; padding:1px 5px; border-radius:5px;
    background:rgba(255,255,255,.55); border:1px solid var(--edge); color:var(--ink)}
  .rtimes{flex:none; font-size:.78em; font-weight:700; font-variant-numeric:tabular-nums}
  @media (max-width:360px){
    .rname{font-size:.66em}
    .rtimes{font-size:.72em}
  }

/* ================= 時刻の数字入力 ================= */

function parseSlots(s){
  var out = [], last = "月";
  s.split(",").forEach(function(t){
    t = t.trim();
    var m = t.match(/^([月火水木金土])?([1-7])$/);
    if(!m) return;
    var d = m[1] || last; last = d;
    out.push({d:d, p:parseInt(m[2],10)});
  });
  return out;
}

function mk(code, slots, name, teacher, cap, apps, cat, opt){
  opt = opt || {};
  var sl = parseSlots(slots);
  return {
    code:code, slotText:slots, slots:sl, name:name, teacher:teacher,
    cap:cap, apps:apps, cat:cat,
    cr: opt.cr || (sl.length > 1 ? 2 : 1),
    en: !!opt.en,
    ratio: cap > 0 ? apps/cap : 99
  };
}

/* ============================== 日本の祝日 ============================== */
var _holCache = {};
function nthMonday(y, m, n){            /* m は 1〜12 */
  var d = new Date(y, m-1, 1);
  var first = 1 + ((8 - d.getDay()) % 7);   /* その月の最初の月曜 */
  return new Date(y, m-1, first + (n-1)*7);
}
function holidaysOf(y){
  if(_holCache[y]) return _holCache[y];
  var h = {};
  var put = function(d, name){ h[toYmd(d)] = name; };
  var fixed = [[1,1,'元日'],[2,11,'建国記念の日'],[2,23,'天皇誕生日'],[4,29,'昭和の日'],
    [5,3,'憲法記念日'],[5,4,'みどりの日'],[5,5,'こどもの日'],[8,11,'山の日'],
    [11,3,'文化の日'],[11,23,'勤労感謝の日']];
  fixed.forEach(function(f){ put(new Date(y, f[0]-1, f[1]), f[2]); });
  put(nthMonday(y,1,2),  '成人の日');
  put(nthMonday(y,7,3),  '海の日');
  put(nthMonday(y,9,3),  '敬老の日');
  put(nthMonday(y,10,2), 'スポーツの日');
  /* 春分・秋分（1980〜2099年で使える式） */
  var t = y - 1980;
  put(new Date(y, 2, Math.floor(20.8431 + 0.242194*t - Math.floor(t/4))), '春分の日');
  put(new Date(y, 8, Math.floor(23.2488 + 0.242194*t - Math.floor(t/4))), '秋分の日');

  /* 振替休日：日曜と重なったら、次の祝日でない日 */
  Object.keys(h).slice().sort().forEach(function(k){
    var a = k.split('-'), d = new Date(+a[0], +a[1]-1, +a[2]);
    if(d.getDay() !== 0) return;
    var n = new Date(d); var guard = 0;
    do { n.setDate(n.getDate()+1); guard++; } while(h[toYmd(n)] && guard < 10);
    if(!h[toYmd(n)]) h[toYmd(n)] = '振替休日';
  });
  /* 国民の休日：祝日と祝日にはさまれた平日 */
  Object.keys(h).slice().sort().forEach(function(k){
    var a = k.split('-'), d = new Date(+a[0], +a[1]-1, +a[2]);
    var mid = new Date(d); mid.setDate(mid.getDate()+1);
    var nxt = new Date(d); nxt.setDate(nxt.getDate()+2);
    if(h[toYmd(mid)] || !h[toYmd(nxt)]) return;
    if(mid.getDay() === 0 || mid.getDay() === 6) return;
    h[toYmd(mid)] = '国民の休日';
  });
  _holCache[y] = h;
  return h;
}
function holidayName(ymd){
  if(!isYmd(ymd)) return '';
  return holidaysOf(+ymd.slice(0,4))[ymd] || '';
}

/* 月と日だけから、いちばん近い年を選ぶ */
function guessYear(m, d){
  var now = new Date();
  var t0 = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  var best = now.getFullYear(), score = Infinity;
  [now.getFullYear()-1, now.getFullYear(), now.getFullYear()+1].forEach(function(yy){
    var dt = new Date(yy, m-1, d);
    if(dt.getMonth() !== m-1) return;
    var diff = Math.abs((dt - t0) / 86400000);
    var sc = (dt < t0) ? diff * 1.8 : diff;   /* これからの日を優先する */
    if(sc < score){ score = sc; best = yy; }
  });
  return best;
}
function mdToYmd(m, d){
  m = toNum(m); d = toNum(d);
  if(m < 1 || m > 12 || d < 1 || d > 31) return '';
  var y = guessYear(m, d);
  var dt = new Date(y, m-1, d);
  if(dt.getMonth() !== m-1) return '';
  return toYmd(dt);
}

/* ===== 乗り継ぎの計算 ===== */
function trTime(pair){ return { dep:pair[0], arr:pair[1], d:minutesOf(pair[0]), a:minutesOf(pair[1]) }; }
/* 目標の到着時刻までに着ける便のうち、いちばん遅いものを返す */
function lastArrivalBy(table, limitMin){
  var best = null;
  table.forEach(function(p){
    var t = trTime(p);
    if(t.a <= limitMin && (!best || t.a > best.a || (t.a === best.a && t.d > best.d))) best = t;
  });
  return best;
}
/* 指定時刻以降に出る便のうち、いちばん早いものを返す */
function firstDepartureFrom(table, fromMin){
  var best = null;
  table.forEach(function(p){
    var t = trTime(p);
    if(t.d >= fromMin && (!best || t.d < best.d)) best = t;
  });
  return best;
}
function sortedDeps(table){
  return table.map(trTime).sort(function(a,b){ return a.d - b.d; });
}
/* 行きの1案：目標着時刻から逆算してバスと電車を選ぶ */
function goPlanFor(arriveByMin){
  var train = lastArrivalBy(tbl('trainGo'), arriveByMin);
  if(!train) return null;
  var margin = toNum(S.transit.sannomiyaTransfer) || 10;
  var bus = lastArrivalBy(tbl('busGo'), train.d - margin);
  return { train:train, bus:bus, arriveBy:arriveByMin };
}
/* 行き：本命と、バスを1本・2本遅らせた場合 */
function goPlans(arriveByMin, classStartMin){
  var margin = toNum(S.transit.sannomiyaTransfer) || 10;
  var base = goPlanFor(arriveByMin);
  if(!base) return [];
  var buses = sortedDeps(tbl('busGo'));
  var bi = -1;
  if(base.bus) for(var i=0;i<buses.length;i++) if(buses[i].d === base.bus.d) bi = i;
  var out = [{ bus:base.bus, train:base.train, tag:'おすすめ', ok:true }];
  [1,2].forEach(function(k){
    var b = (bi >= 0) ? buses[bi + k] : null;
    if(!b) return;
    var tr = firstDepartureFrom(tbl('trainGo'), b.a + margin);
    if(!tr) return;
    out.push({ bus:b, train:tr, tag:'バス'+k+'本あと',
      ok: (classStartMin == null) ? true : (tr.a <= classStartMin) });
  });
  return out;
}
/* 自分で足したダイヤも合わせて使う */
function tbl(name, ymd){
  var d = ymd || today();
  var a = d.split('-');
  var dow = new Date(+a[0], +a[1]-1, +a[2]).getDay();
  var holiday = (dow === 0 || dow === 6 || !!holidayName(d));
  /* 平日と休日でダイヤを使い分ける */
  var pick = holiday
    ? { busGo:(typeof BUS_GO_HD!=='undefined'?BUS_GO_HD:null),
        trainGo:(typeof TRAIN_GO_HD!=='undefined'?TRAIN_GO_HD:null),
        trainBack:(typeof TRAIN_BACK_HD!=='undefined'?TRAIN_BACK_HD:null),
        busBack:(typeof BUS_BACK_HD!=='undefined'?BUS_BACK_HD:null) }[name]
    : { busGo:(typeof BUS_GO_WD!=='undefined'?BUS_GO_WD:null),
        trainGo:(typeof TRAIN_GO_WD!=='undefined'?TRAIN_GO_WD:null),
        trainBack:(typeof TRAIN_BACK_WD!=='undefined'?TRAIN_BACK_WD:null),
        busBack:(typeof BUS_BACK_WD!=='undefined'?BUS_BACK_WD:null),
        busWork:(typeof BUS_WORK_WD!=='undefined'?BUS_WORK_WD:null) }[name];
  var base = pick || ({ busGo:BUS_GO, trainGo:TRAIN_GO, trainBack:TRAIN_BACK, busBack:BUS_BACK, busWork:BUS_WORK }[name] || []);
  var extra = ((S.transit.custom||{})[name]) || [];
  return base.concat(extra.filter(function(p){ return p && minutesOf(p[0])!=null && minutesOf(p[1])!=null; }));
}
/* バイトの日：大学を出て、開始に間に合う便（本命・1本前・1本後） */
function workPlans(leaveAfterMin, arriveByMin){
  var margin = toNum(S.transit.sannomiyaTransfer) || 10;
  var trains = sortedDeps(tbl('trainBack')).filter(function(t){ return t.d >= leaveAfterMin; });
  var out = [];
  trains.forEach(function(t){
    var b = firstDepartureFrom(tbl('busWork'), t.a + margin);
    if(!b) return;
    out.push({ train:t, bus:b, ok: b.a <= arriveByMin });
  });
  if(!out.length) return [];
  var idx = -1;
  for(var i=out.length-1;i>=0;i--){ if(out[i].ok){ idx=i; break; } }   /* 間に合う中でいちばん遅い */
  if(idx < 0) idx = 0;
  var pick = [];
  if(out[idx-1]) pick.push(Object.assign({tag:'1本前'}, out[idx-1]));
  pick.push(Object.assign({tag:'ちょうど'}, out[idx]));
  if(out[idx+1]) pick.push(Object.assign({tag:'1本後'}, out[idx+1]));
  return pick;
}
/* 帰り：鳴尾を出たい時刻から、1本前・本命・1本後 */
function backPlans(departAfterMin){
  var all = sortedDeps(tbl('trainBack'));
  var idx = -1;
  for(var i=0;i<all.length;i++){ if(all[i].d >= departAfterMin){ idx = i; break; } }
  if(idx < 0) return [];
  var margin = toNum(S.transit.sannomiyaTransfer) || 10;
  var mk = function(t, tag){
    if(!t) return null;
    return { train:t, bus:firstDepartureFrom(tbl('busBack'), t.a + margin), tag:tag };
  };
  return [mk(all[idx-1],'1本前'), mk(all[idx],'ちょうど'), mk(all[idx+1],'1本後')].filter(Boolean);
}

/* 授業の変更（休講・遠隔・補講） */
function changesOn(ymd){ return S.holidays.filter(function(h){ return h.date===ymd; }); }
function changeType(h){ return h.type || 'cancel'; }
function isCancelled(name, ymd){
  return changesOn(ymd).some(function(h){ return changeType(h)==='cancel' && (h.course===name || h.course==='*'); });
}
function isOnlineOn(name, ymd){
  return changesOn(ymd).some(function(h){ return changeType(h)==='online' && (h.course===name || h.course==='*'); });
}
function makeupsOn(ymd){
  return changesOn(ymd).filter(function(h){ return changeType(h)==='makeup'; });
}
/* 隔週：基準日を設定した科目は、基準日から2週ごとに「ある週」 */
function biweekOn(name, ymd){
  var c = courseByName(name);
  if(!c || !c.bi) return true;
  var anchor = S.biweek[name];
  if(!isYmd(anchor)) return true;      /* 基準日が無ければ毎週あるものとして扱う */
  var d = daysBetween(anchor, ymd);
  if(d === null) return true;
  var w = Math.floor(d / 7);
  return ((w % 2) + 2) % 2 === 0;
}
/* その日に実際にある授業（休講・隔週を考慮） */
function classesForDate(ymd){
  if(!isYmd(ymd)) return [];
  var a = ymd.split('-'), dch = WDAY[new Date(+a[0], +a[1]-1, +a[2]).getDay()];
  var map = {};
  termCourses().forEach(function(c){ c.slots.forEach(function(sl){ map[sl.d+sl.p] = c; }); });
  var out = [];
  var holOn = changesOn(ymd).some(function(h){ return changeType(h)==='holclass'; });   /* この日は授業あり */
  var inBreak = (S.breaks||[]).some(function(b){ return ymd >= b.from && ymd <= b.to; });
  var isHol = (!!holidayName(ymd) || inBreak) && !S.settings.classOnHoliday && !holOn;
  PERIODS.forEach(function(p){
    var c = map[dch+p]; if(!c) return;
    var off = isHol ? 'holiday' : isCancelled(c.name, ymd) ? 'cancel' : (!biweekOn(c.name, ymd) ? 'biweek' : '');
    var web = c.web || (isOnlineOn(c.name, ymd) ? 1 : 0);
    out.push({ period:p, name:c.name, room:courseRoom(c.name), web:web, req:courseReq(c.name), bi:c.bi, off:off,
               online: isOnlineOn(c.name, ymd) ? 1 : 0 });
  });
  /* 補講はその日に足す */
  makeupsOn(ymd).forEach(function(h){
    var pd = toNum(h.period) || 1;
    if(out.some(function(x){ return x.period===pd; })) return;
    out.push({ period:pd, name:h.course, room:h.room||courseRoom(h.course), web:0,
               req:courseReq(h.course), bi:0, off:'', makeup:1 });
  });
  out.sort(function(a,b){ return a.period-b.period; });
  return out;
}
function schoolClassesForDate(ymd){
  return classesForDate(ymd).filter(function(c){ return !c.web && !c.off; });
}

function subjKey(n){
  return String(n||'')
    .replace(/[（(]\s*\d+\s*[)）]\s*$/, '')   /* 末尾の (数字) */

  return ka === kb;
}

function daysUntil(day){
  var now=new Date(), t0=new Date(now.getFullYear(),now.getMonth(),now.getDate());
  var t=new Date(now.getFullYear(),now.getMonth(),day);
  if(t<t0) t=new Date(now.getFullYear(),now.getMonth()+1,day);
  return Math.round((t-t0)/86400000);
}
async function resizeImage(file,maxSide,quality){
  var dataUrl = await new Promise(function(res,rej){ var r=new FileReader(); r.onload=function(){res(r.result);}; r.onerror=function(){rej(new Error('read'));}; r.readAsDataURL(file); });
  var img = await new Promise(function(res,rej){ var i=new Image(); i.onload=function(){res(i);}; i.onerror=function(){rej(new Error('img'));}; i.src=dataUrl; });
  var sc=Math.min(1,maxSide/Math.max(img.width,img.height));
  var cv=document.createElement('canvas');
  cv.width=Math.round(img.width*sc); cv.height=Math.round(img.height*sc);
  cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height);
  return cv.toDataURL('image/jpeg',quality);
}

function festivalOn(ymd){
  var d = isYmd(ymd) ? ymd : today();
  var a = d.split('-');
  var m = +a[1], dd = +a[2];
  /* 期間で決まるもの */
  if(m===12 && dd>=18 && dd<=25) return 'xmas';
  if((m===12 && dd>=26) || (m===1 && dd<=5)) return 'newyear';
  if(m===10 && dd>=25 && dd<=31) return 'halloween';
  if(m===2 && dd>=10 && dd<=14) return 'valentine';
  if(m===2 && dd===3) return 'setsubun';
  if(m===3 && dd===3) return 'hinamatsuri';
  if(m===3 && dd>=25) return 'sakura';
  if(m===4 && dd<=10) return 'sakura';
  if(m===5 && dd>=3 && dd<=5) return 'kodomo';
  if(m===6 && dd>=1 && dd<=30) return (dd>=5 && dd<=25) ? 'tsuyu' : '';
  if(m===7 && dd>=1 && dd<=7) return 'tanabata';
  if(m===7 && dd>=20) return 'natsu';
  if(m===8 && dd<=20) return 'natsu';
  if(m===9 && dd>=10 && dd<=20) return 'tsukimi';
  if(m===11 && dd>=10 && dd<=30) return 'kouyou';
  /* 祝日そのもの */
  if(holidayName(d)) return 'holiday';
  return '';
}

/* ============================== 集計 ============================== */
function derive(){
  var rows = S.plans.reduce(function(a,p){ return a.concat(planRows(p)); }, []);
  var set = {};
  rows.forEach(function(r){ set[r.month]=1; });
  S.statements.forEach(function(s){ if(s.billingMonth) set[s.billingMonth]=1; });
  set[thisYm()]=1;
  var months = Object.keys(set).sort();
  var byMonth = {};
  months.forEach(function(m){ byMonth[m] = { smbc:{plan:0,stmt:0,rows:[],stmts:[]}, rakuten:{plan:0,stmt:0,rows:[],stmts:[]} }; });
  rows.forEach(function(r){ var g=byMonth[r.month]; if(!g||!g[r.accountId]) return; g[r.accountId].plan+=r.amount; g[r.accountId].rows.push(r); });
  S.statements.forEach(function(s){ var g=byMonth[s.billingMonth]; if(!g||!g[s.accountId]) return; g[s.accountId].stmt += Number(s.amount)||0; g[s.accountId].stmts.push(s); });
  var monthTotal = function(m){ var g=byMonth[m]; if(!g) return 0; return g.smbc.plan+g.smbc.stmt+g.rakuten.plan+g.rakuten.stmt; };
  return { rows:rows, months:months, byMonth:byMonth, monthTotal:monthTotal };
}
function sumBy(arr, f){ return (arr||[]).reduce(function(a,x){ return a + (Number(f(x))||0); }, 0); }
function budget(){
  var d = derive(), cur = thisYm();
  var pay = d.monthTotal(cur);
  var fx  = sumBy(S.fixed, function(x){ return x.amount; });
  var inc = sumBy(S.income, function(x){ return x.amount; });
  var bal = sumBy(S.balances, function(x){ return x.amount; });
  var have = bal + inc;                 /* 口座にあるお金＋今月入るお金 */
  var out  = pay + fx;                  /* 今月出ていくお金 */
  var free = have - out;
  var rate = have > 0 ? free / have : (free >= 0 ? 1 : -1);
  var level, word;
  if(have === 0){ level='none'; word='口座残高か収入を登録すると判定できます'; }
  else if(free < 0){ level='bad';  word='今月は足りません'; }
  else if(rate < .12){ level='warn'; word='かなりギリギリです'; }
  else if(rate < .3){ level='ok';   word='やりくりすれば大丈夫'; }
  else { level='good'; word='余裕があります'; }
  return { pay:pay, fixed:fx, income:inc, balance:bal, have:have, free:free,
           level:level, word:word, month:cur };
}

var syncState = { on:false, msg:'', ref:null, setDoc:null, unsub:null, timer:null, last:'', connecting:false };

function parseFbConfig(txt){
  var s = String(txt == null ? '' : txt).trim();
  if(!s) throw new Error('EMPTY');
  s = s.replace(/^\s*\/\/.*$/gm, '');
  var a = s.indexOf('{'), b = s.lastIndexOf('}');
  s = (a >= 0 && b > a) ? s.slice(a, b + 1) : '{' + s + '}';
  s = s.replace(/([{,]\s*)([A-Za-z_$][A-Za-z0-9_$]*)\s*:/g, '$1"$2":');
  s = s.replace(/'([^'\\]*)'/g, '"$1"');
  s = s.replace(/,\s*([}\]])/g, '$1');
  var cfg = JSON.parse(s);
  if(!cfg || !cfg.apiKey || !cfg.projectId) throw new Error('MISSING');
  return cfg;
}
/* Firebase を読み込む。まず新しい方式、だめなら昔ながらの方式で */
var fbLoad = null;
function loadFirebase(){
  if(fbLoad) return fbLoad;
  fbLoad = (async function(){
    /* 1) module 方式 */
    try{
      var fa = await import('https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js');
      var ff = await import('https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js');
      return { mode:'mod', fa:fa, ff:ff };
    }catch(e){ /* 次を試す */ }
    /* 2) script タグ方式（古いSafari向け） */
    var add = function(src){
      return new Promise(function(res, rej){
        var sc = document.createElement('script');
        sc.src = src; sc.async = true;
        sc.onload = res; sc.onerror = function(){ rej(new Error('SCRIPT_FAIL')); };
        document.head.appendChild(sc);
      });
    };
    await add('https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js');
    await add('https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js');
    if(!window.firebase) throw new Error('SCRIPT_FAIL');
    return { mode:'compat', fb:window.firebase };
  })();
  return fbLoad;
}

var SYNC_MAX = 700000;    /* Firestoreは1件1MBまで。余裕をみて70万文字 */
function trimPayload(body){
  /* 大きすぎるときは、重いものから順に減らす */
  var size = function(o){ return JSON.stringify(o).length; };
  if(size(body) <= SYNC_MAX) return body;
  /* 1) 会話は新しい30件だけ */
  if(body.chatRooms){
    Object.keys(body.chatRooms).forEach(function(k){
      if(Array.isArray(body.chatRooms[k]) && body.chatRooms[k].length > 30)
        body.chatRooms[k] = body.chatRooms[k].slice(-30);
    });
  }
  if(Array.isArray(body.chat) && body.chat.length > 30) body.chat = body.chat.slice(-30);
  if(size(body) <= SYNC_MAX) return body;
  /* 2) 記録類を減らす */
  if(Array.isArray(body.transitLog)) body.transitLog = body.transitLog.slice(-30);
  if(body.aiUse){ var ks = Object.keys(body.aiUse).sort(); while(ks.length > 14) delete body.aiUse[ks.shift()]; }
  if(size(body) <= SYNC_MAX) return body;
  /* 3) 会話をぜんぶ外す（端末には残る） */
  body.chat = []; body.chatRooms = {};
  if(size(body) <= SYNC_MAX) return body;
  /* 4) 終わった課題の古いものを外す */
  if(Array.isArray(body.tasks)){
    var cut = shiftDate(today(), -120);
    body.tasks = body.tasks.filter(function(t){ return !t.done || !isYmd(t.due) || t.due >= cut; });
  }
  return body;
}
function pushRemote(now){
  if(!syncState.on || !syncState.ref) return;
  clearTimeout(syncState.timer);
  var go = async function(){
    var body = trimPayload(payload());
    var sig = JSON.stringify(Object.assign({}, body, {updatedAt:0}));
    if(sig === syncState.last) return;
    syncState.size = sig.length;
    try{
      await syncState.setDoc(syncState.ref, body);
      syncState.last = sig; syncState.pushedAt = Date.now(); syncState.err = '';
      if(isTyping()) renderLater(); else if(appId === 'set') render();   /* 設定画面以外は描き直さない */
    }catch(e){
      syncState.err = String(e.message || e);
      syncState.msg = '送れませんでした：' + syncState.err.slice(0, 80);
      if(isTyping()) renderLater(); else if(appId === 'set') render();
    }
  };
  now ? go() : (syncState.timer = setTimeout(go, 600));
}
function mergeList(local, remote, dead, name){
  var m = {};
  (local||[]).forEach(function(x){ if(x && x.id) m[x.id] = x; });
  (remote||[]).forEach(function(x){
    if(!x || !x.id) return;
    var cur = m[x.id];
    if(!cur){ m[x.id] = x; return; }
    var lt = Number(cur.mt)||0, rt = Number(x.mt)||0;
    /* メモは中身が違って、どちらも新しいときは両方残す */
    if(name === 'notes' && lt !== rt){
      var lb = (cur.body||'')+'|'+(cur.title||''), rb = (x.body||'')+'|'+(x.title||'');
      if(lb !== rb && Math.abs(lt - rt) < 1000*60*60*24){
        var keepNew = rt > lt ? x : cur, keepOld = rt > lt ? cur : x;
        m[x.id] = keepNew;
        var copy = JSON.parse(JSON.stringify(keepOld));
        copy.id = keepOld.id + '_dup' + (rt > lt ? lt : rt);
        copy.title = (copy.title||'（無題）') + '（別の端末の分）';
        copy.conflict = 1;
        if(!m[copy.id]) m[copy.id] = copy;
        return;
      }
    }
    if(rt > lt) m[x.id] = x;
  });
  return Object.keys(m).map(function(k){ return m[k]; }).filter(function(x){ return !dead[x.id]; });
}
function mergeRemote(d){

  var pm = {}; S.plans.forEach(function(p){ pm[p.id]=p; });
  (d.plans||[]).forEach(function(p){ if(!pm[p.id]) pm[p.id]=p; });
  var sm = {}; S.statements.forEach(function(s){ sm[s.id]=s; });
  (d.statements||[]).forEach(function(s){ if(!sm[s.id]) sm[s.id]=Object.assign({}, s, {hasImage:false}); });

  S.deleted = Object.keys(dead);
  S.plans = Object.keys(pm).map(function(k){ return pm[k]; }).filter(function(p){ return !dead[p.id]; });
  S.statements = Object.keys(sm).map(function(k){ return sm[k]; })
    .filter(function(s){ return !dead[s.id]; })
    .sort(function(a,b){ return (b.createdAt||0)-(a.createdAt||0); });

  LISTS.forEach(function(k){ S[k] = mergeList(S[k], d[k], dead, k); });

  Object.keys(S.paid).forEach(function(k){ if(dead[planIdOf(k)]) delete S.paid[k]; });

  if(d.minWeekday != null) S.settings.minWeekday = Number(d.minWeekday)||0;
  if(d.minWeekend != null) S.settings.minWeekend = Number(d.minWeekend)||0;
  if(d.fare != null) S.settings.fare = toNum(d.fare);
  if(typeof d.shop === 'string') S.settings.shop = d.shop;
  if(typeof d.payBankId === 'string') S.settings.payBankId = d.payBankId;
  ['courseMeta','memos','transit','payApplied','attendLog','grades','biweek','termsList','termsDone','progress','taskLog','syllabus'].forEach(function(k){
    if(d[k] !== undefined && (Number((d.meta||{})[k])||0) > (Number(S.meta[k])||0)){ S[k] = d[k]; S.meta[k] = Number(d.meta[k])||0; }
  });
  if(typeof d.termId === 'string' && (Number((d.meta||{}).termsList)||0) >= (Number(S.meta.termsList)||0)) S.termId = d.termId;
  if(typeof d.wage === 'number') S.settings.wage = d.wage;
  if(Array.isArray(d.chat)){
    var lastLocal = (S.chat||[]).length ? S.chat[S.chat.length-1].mt : 0;
    var lastRemote = d.chat.length ? d.chat[d.chat.length-1].mt : 0;
    if(lastRemote > lastLocal) S.chat = d.chat;
  }

  persist();
  /* 何か変わっていれば必ず画面を描き直す */
  if(before !== JSON.stringify(payload())){
    if(isTyping()) renderLater(); else render();
  }
  pushRemote();
}

function makeIcs(){
  var lines = ['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//kurashi//JP','CALSCALE:GREGORIAN','METHOD:PUBLISH',
    'X-WR-CALNAME:くらしの手帳',
    'BEGIN:VTIMEZONE','TZID:Asia/Tokyo','BEGIN:STANDARD','DTSTART:19700101T000000',
    'TZOFFSETFROM:+0900','TZOFFSETTO:+0900','TZNAME:JST','END:STANDARD','END:VTIMEZONE'];

  var alarm = function(title, timed, ymd, hhmm){
    var out = [];
    /* どの予定も「前日の0時」に知らせる（絶対時刻で指定） */
    var prev = shiftDate(ymd, -1);

      /* 日本時間の0時＝前々日の15時（世界標準時） */

        'TRIGGER;VALUE=DATE-TIME:'+utc[0]+utc[1]+utc[2]+'T150000Z',
        'DESCRIPTION:'+icsEsc('明日：'+title),'END:VALARM');
    }

      var m2 = toNum(S.ui.icsAlarm2);
      if(m1 > 0) a.push(['-PT'+m1+'M', m1+'分前：'+title]);
      if(m2 > 0) a.push(['-PT'+m2+'M', m2+'分前：'+title]);
    }else{
      a.push(['PT9H', '今日：'+title]);      /* 当日の朝9時 */
    }
    a.forEach(function(x){
      out.push('BEGIN:VALARM','ACTION:DISPLAY','TRIGGER:'+x[0],'DESCRIPTION:'+icsEsc(x[1]),'END:VALARM');

  };

    }

  });
  S.health.forEach(function(h){
    ev('hl-'+h.id, (h.name||'')+' の期限', h.next, '', 0, '', h.memo);
  });
  var d = derive(), cur = thisYm();
  d.months.filter(function(m){ return m>=cur; }).forEach(function(m){
    [['smbc',S.settings.smbcDay],['rakuten',S.settings.rakutenDay]].forEach(function(pair){

  download(new Blob([lines.join('\r\n')],{type:'text/calendar;charset=utf-8'}), 'kurashi.ics');

/* localStorage は5MBまでなので、写真は IndexedDB に置く（数百MB〜1GBまで入る） */
var PDB = null, PDB_NAME = 'kurashi-photos', PDB_STORE = 'img';
var photoCache = {};          /* 画面に出すための一時置き場 */

function photoDB(){
  if(PDB) return PDB;
  PDB = new Promise(function(res, rej){
    if(typeof indexedDB === 'undefined'){ rej(new Error('no-idb')); return; }
    var q = indexedDB.open(PDB_NAME, 1);
    q.onupgradeneeded = function(){
      var db = q.result;
      if(!db.objectStoreNames.contains(PDB_STORE)) db.createObjectStore(PDB_STORE);
    };
    q.onsuccess = function(){ res(q.result); };
    q.onerror = function(){ rej(q.error || new Error('idb')); };
  });
  return PDB;
}
function photoPut(id, dataUrl){
  return photoDB().then(function(db){
    return new Promise(function(res, rej){
      var tx = db.transaction(PDB_STORE, 'readwrite');
      tx.objectStore(PDB_STORE).put(dataUrl, id);
      tx.oncomplete = function(){ photoCache[id] = dataUrl; res(true); };
      tx.onerror = function(){ rej(tx.error || new Error('put')); };
    });
  });
}
function photoGet(id){
  if(photoCache[id] != null) return Promise.resolve(photoCache[id]);
  /* 前のしくみ（localStorage）に残っているものも読む */
  var old = null;
  try{ old = localStorage.getItem('shiharai:memoimg:' + id); }catch(e){}
  if(old){ photoCache[id] = old; return Promise.resolve(old); }
  return photoDB().then(function(db){
    return new Promise(function(res){
      var tx = db.transaction(PDB_STORE, 'readonly');
      var q = tx.objectStore(PDB_STORE).get(id);
      q.onsuccess = function(){ photoCache[id] = q.result || null; res(q.result || null); };
      q.onerror = function(){ res(null); };
    });
  }).catch(function(){ return null; });
}
function photoDel(id){
  delete photoCache[id];
  try{ localStorage.removeItem('shiharai:memoimg:' + id); }catch(e){}
  return photoDB().then(function(db){
    return new Promise(function(res){
      var tx = db.transaction(PDB_STORE, 'readwrite');
      tx.objectStore(PDB_STORE).delete(id);
      tx.oncomplete = function(){ res(true); };
      tx.onerror = function(){ res(false); };
    });
  }).catch(function(){ return false; });
}
function photoKeys(){
  return photoDB().then(function(db){
    return new Promise(function(res){
      var tx = db.transaction(PDB_STORE, 'readonly');
      var q = tx.objectStore(PDB_STORE).getAllKeys();
      q.onsuccess = function(){ res(q.result || []); };
      q.onerror = function(){ res([]); };
    });
  }).catch(function(){ return []; });
}

  for(var j = 0; j < keys.length; j++){

      var v = localStorage.getItem(keys[j]);
      if(!v) continue;
      await photoPut(keys[j].slice('shiharai:memoimg:'.length), v);
      localStorage.removeItem(keys[j]);
      moved++;
    }catch(e){}
  }
  return moved;
}
/* 画面に貼りつけたあと、あとから写真をはめこむ */
function photoFill(){
  var els = document.querySelectorAll('img[data-pid]');
  Array.prototype.forEach.call(els, function(el){
    var id = el.dataset.pid;
    if(el.dataset.done) return;
    photoGet(id).then(function(src){
      if(src){ el.src = src; el.dataset.done = '1'; }
      else { el.closest('.mphoto') && el.closest('.mphoto').remove(); }
    });
  });
}
/* どれくらい使っているか */
async function photoUsage(){
  var used = 0, quota = 0;
  try{
    if(navigator.storage && navigator.storage.estimate){
      var e = await navigator.storage.estimate();
      used = e.usage || 0; quota = e.quota || 0;
    }
  }catch(e){}
  var n = (await photoKeys()).length;
  return { used: used, quota: quota, count: n };
}

/* いま出すかざりを決める */
function decorNow(){
  var mode = S.ui.bgMode || 'fixed';
  var fes = (S.ui.fesMode === 0) ? '' : (festivalNow() || '');
  if(fes && DECOR[fes]) return { key:fes, d:DECOR[fes] };
  if((mode === 'time' || mode === 'mix')){
    var b = timeBandNow();
    if(DECOR[b]) return { key:b, d:DECOR[b] };
  }
  if(mode === 'season' || mode === 'mix'){
    var s = seasonNow();
    var m = { spring:'sakura', summer:'natsu', autumn:'kouyou', winter:'night' }[s];
    if(DECOR[m]) return { key:m, d:DECOR[m] };
  }
  return null;
}

/* 充実度：0=なし 1=ひかえめ 2=ふつう 3=にぎやか */
function decorLevel(){
  if(S.ui.decor === 0) return 0;
  var lv = S.ui.decorLv;
  return (lv == null) ? 2 : toNum(lv);
}
function applyDecor(){
  var host = document.getElementById('decor');
  if(!host) return;
  var lv = decorLevel();
  if(lv === 0){ host.innerHTML = ''; host.className = 'decor off'; host.dataset.key=''; return; }
  var cur = decorNow();
  if(!cur){ host.innerHTML = ''; host.className = 'decor'; host.dataset.key=''; return; }
  var sig = cur.key + ':' + lv + ':' + (S.ui.decorMove === 0 ? 0 : 1);
  if(host.dataset.key === sig) return;
  host.dataset.key = sig;
  host.className = 'decor lv' + lv;

  var h = '<div class="decor-art">' + cur.d.art + '</div>';

  /* 上に散らす小さな絵（ふつう以上） */
  var marks = DECOR_TOP[cur.key];
  if(lv >= 2 && marks && marks.length){
    var n = (lv === 3) ? 14 : 7;
    h += '<div class="decor-marks">';
    for(var j = 0; j < n; j++){
      var mk = marks[j % marks.length];
      var x = (j * 37 + 9) % 94;
      var y = (j * 23 + 5) % 62;
      var sz = 13 + ((j * 7) % 14);
      var op = 0.16 + ((j % 4) * 0.05);
      var sw = 4 + (j % 5);
      h += '<span style="left:' + x + '%;top:' + y + '%;font-size:' + sz + 'px;opacity:' + op +
           ';animation-duration:' + sw + 's;animation-delay:-' + (j * 0.7) + 's">' + mk + '</span>';
    }
    h += '</div>';
  }

  /* 落ちてくるもの */
  var f = cur.d.fall;
  if(f && S.ui.decorMove !== 0 && lv >= 1){
    var cnt = (lv === 3) ? f.n : (lv === 2) ? Math.round(f.n * 0.7) : Math.round(f.n * 0.4);
    h += '<div class="decor-fall">';
    for(var i = 0; i < cnt; i++){
      var ch = f.ch[i % f.ch.length];
      var left = Math.round((i * 97 + 13) % 100);
      var dur = f.speed + (i % 5) * 2;
      var delay = -(i * (dur / Math.max(1,cnt)));
      var size = 8 + (i % 4) * 4;
      h += '<span style="left:' + left + '%;font-size:' + size + 'px;color:' + f.color +
           ';animation-duration:' + dur + 's;animation-delay:' + delay + 's">' + ch + '</span>';
    }
    h += '</div>';
  }
  host.innerHTML = h;
}

/* ============================== 授業の取り出し ============================== */
/* 後期の時間割（登録済み＋抽選で選んだ科目）を 曜日+限 で引けるようにする */
function laterTermMap(){
  var m = {};
  FIXED.forEach(function(f){
    f.slots.forEach(function(s){
      m[s.d+s.p] = { name:f.name, kind:'fixed', room:f.room||'', req:f.req, bi:f.bi, web:f.web, cr:f.cr };
    });
  });
  rSelected().forEach(function(c){
    c.slots.forEach(function(s){ m[s.d+s.p] = { name:c.name, kind:'sel', code:c.code, room:'', req:0 }; });
  });
  return m;
}
function courseList(){
  var out = [], seen = {};
  FIXED.forEach(function(f){ if(!seen[f.name]){ seen[f.name]=1; out.push({ key:f.name, name:f.name }); } });
  rSelected().forEach(function(c){ if(!seen[c.name]){ seen[c.name]=1; out.push({ key:c.name, name:c.name }); } });
  return out;
}
function classesOn(dayChar){
  var m = laterTermMap(), out = [];
  PERIODS.forEach(function(p){
    var c = m[dayChar+p];
    if(c) out.push({ period:p, name:c.name, room:c.room||'', web:c.web?1:0, req:c.req, bi:c.bi });
  });
  return out;
}
/* 通学が必要な授業だけ（WEBの遠隔授業は家で受けるので除く） */
function schoolClassesOn(dayChar){
  return classesOn(dayChar).filter(function(c){ return !c.web; });
}

/* ============================== 出発時刻 ============================== */
function commuteTotal(){
  var c = S.commute;
  return toNum(c.walk)+toNum(c.bus)+toNum(c.change)+toNum(c.train)+toNum(c.toSchool)+toNum(c.buffer);
}
function departureFor(period){
  var start = minutesOf(S.commute.periods[period-1]);
  if(start == null) return null;
  var total = commuteTotal();
  return { leave: hhmmOf(start - total), start: hhmmOf(start), total: total,
           prevDay: (start - total) < 0 };   /* 通学が長すぎて前日にまわる場合 */
}

/* ============================== 天気 ============================== */
var SANDA = { lat:34.8883, lon:135.2264, name:'三田' };
var SCHOOL = { lat:34.7188, lon:135.3606, name:'西宮' };
function weatherWord(code){
  if(code===0) return '快晴';
  if(code<=2) return '晴れ';
  if(code===3) return 'くもり';
  if(code===45||code===48) return '霧';
  if(code>=51&&code<=57) return '霧雨';
  if(code>=61&&code<=67) return '雨';
  if(code>=71&&code<=77) return '雪';
  if(code>=80&&code<=82) return 'にわか雨';
  if(code>=85&&code<=86) return 'にわか雪';
  if(code>=95) return '雷雨';
  return '';
}
async function loadWeather(){
  if(!S.ui.weather){ weather.state='off'; return; }
  weather.state = 'loading';
  var url = function(p){
    return 'https://api.open-meteo.com/v1/forecast?latitude='+p.lat+'&longitude='+p.lon+
      '&current=temperature_2m,weather_code,precipitation'+
      '&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max,snowfall_sum,precipitation_sum'+
      '&hourly=visibility,snowfall,weather_code,precipitation_probability&timezone=Asia%2FTokyo&forecast_days=2';
  };
  try{
    var res = await Promise.all([fetch(url(SANDA)), fetch(url(SCHOOL))]);
    if(!res[0].ok || !res[1].ok) throw new Error('status');
    var js = await Promise.all([res[0].json(), res[1].json()]);
    weather.sanda = js[0]; weather.school = js[1];
    weather.state = 'ok';
    weather.alert = busAlert(js[0]);
  }catch(e){
    weather.state = 'ng';
    weather.msg = '天気を取れませんでした';
  }
  if(appId === 'today') render();
}
function busAlert(w){
  try{
    var d = w.daily, h = w.hourly;
    var code = d.weather_code[0];
    var snowSum = Number(d.snowfall_sum ? d.snowfall_sum[0] : 0) || 0;
    var lowVis = false, snowHour = false;
    if(h && h.time){
      for(var i=0;i<h.time.length && i<12;i++){
        var hh = Number(String(h.time[i]).slice(11,13));
        if(hh < 5 || hh > 11) continue;               /* 通学時間帯だけ見る */
        if(Number(h.visibility[i]) < 1000) lowVis = true;
        if(Number(h.snowfall[i]) > 0) snowHour = true;
      }
    }
    if(snowSum > 0 || snowHour || (code>=71&&code<=77) || code===85 || code===86)
      return '雪の予報です。三田からのバスが遅れることがあります。早めに出るか、電車への振り替えも考えてください。';
    if(lowVis || code===45 || code===48)
      return '朝は霧が出そうです。三田の山あいは見通しが悪くなり、バスが遅れることがあります。';
    if(code>=95) return '雷雨の予報です。バス・電車とも遅れる可能性があります。';
    return '';
  }catch(e){ return ''; }
}
function umbrellaInfo(){
  if(weather.state !== 'ok') return null;
  try{
    var a = weather.sanda, b = weather.school;
    var pa = a.daily.precipitation_probability_max ? a.daily.precipitation_probability_max[0] : 0;
    var pb = b.daily.precipitation_probability_max ? b.daily.precipitation_probability_max[0] : 0;
    var pop = Math.max(Number(pa)||0, Number(pb)||0);
    var rain = Math.max(Number((a.daily.precipitation_sum||[0])[0])||0, Number((b.daily.precipitation_sum||[0])[0])||0);
    /* 通学時間帯（6〜20時）にいちばん降りそうな時間 */
    var peak = null;
    [a,b].forEach(function(w){
      var h = w.hourly;
      if(!h || !h.time) return;
      for(var i=0;i<h.time.length;i++){
        var hh = Number(String(h.time[i]).slice(11,13));
        if(hh < 6 || hh > 20) continue;
        var v = Number(h.precipitation_probability[i]) || 0;
        if(!peak || v > peak.v) peak = { v:v, at:String(h.time[i]).slice(11,16) };
      }
    });
    var need = pop >= 50 || rain >= 1;
    var maybe = !need && pop >= 30;
    return { pop:pop, rain:rain, peak:peak, need:need, maybe:maybe };
  }catch(e){ return null; }
}
function weatherCard(){
  if(weather.state === 'loading') return '<div class="s2 wx" style="margin-top:6px">天気を確認しています…</div>';
  if(weather.state === 'ng') return '<div class="s2 wx" style="margin-top:6px">天気は取れませんでした</div>';
  if(weather.state !== 'ok') return '';
  try{
    var a = weather.sanda, b = weather.school;
    var u = umbrellaInfo();
    var cur = a.current ? Math.round(a.current.temperature_2m) : null;
    var curB = b.current ? Math.round(b.current.temperature_2m) : null;
    var h = '<div class="wxrow">'+
      wxCell('三田（家）', a, cur) +
      wxCell('西宮（大学）', b, curB) + '</div>';
    if(u){
      var cls = u.need ? 'red' : u.maybe ? 'amber' : 'green';
      var msg = u.need ? '<b>傘を持って行ってください。</b>'
              : u.maybe ? '雨が降るかもしれません。折りたたみ傘があると安心です。'
              : '傘は要りません。';
      h += '<div class="bn '+cls+'" style="margin:10px 0 0"><span class="ic">'+(u.need?'☔':u.maybe?'🌂':'☀')+'</span>'+
        '<span>'+msg+'　降水'+u.pop+'%'+(u.peak && u.peak.v>=30 ? '（'+u.peak.at+'ごろがいちばん高い）' : '')+'</span></div>';
    }
    h += rainGraph(a);
    return h;
  }catch(e){ return ''; }
}
/* 時間別の降水確率グラフ（6〜21時） */
function rainGraph(w){
  try{
    var h = w.hourly, td = today(), out = [];
    for(var i=0;i<h.time.length;i++){
      var t = String(h.time[i]); if(t.slice(0,10) !== td) continue;
      var hh = Number(t.slice(11,13)); if(hh < 6 || hh > 21) continue;
      out.push({ h:hh, v:Number(h.precipitation_probability[i])||0 });
    }
    if(!out.length) return '';
    return '<div class="rg">'+out.map(function(x){
      var col = x.v>=60 ? 'var(--rakuten)' : x.v>=30 ? 'var(--warn)' : 'var(--e6)';
      return '<div class="rgc"><div class="rgb" style="height:'+Math.max(3, Math.round(x.v*0.4))+'px;background:'+col+'"></div><div class="rgl">'+x.h+'</div></div>';
    }).join('')+'</div><div class="s2">時間ごとの降水確率（%）</div>';
  }catch(e){ return ''; }
}
/* 明日の雨予報（1本早い便を勧める） */
function tomorrowRain(){
  if(weather.state !== 'ok') return null;
  try{
    var w = weather.sanda, d = w.daily;
    if(!d.time || d.time.length < 2) return null;
    var pop = Number(d.precipitation_probability_max[1]) || 0;
    return { pop:pop, need: pop >= 50 };
  }catch(e){ return null; }
}
function wxCell(label, w, cur){
  var d = w.daily;
  var mx = Math.round(d.temperature_2m_max[0]), mn = Math.round(d.temperature_2m_min[0]);
  return '<div class="wxcell"><div class="k">'+esc(label)+'</div>'+
    '<div class="now">'+(cur!=null?cur+'℃':'—')+'</div>'+
    '<div class="k">'+esc(weatherWord(d.weather_code[0]))+'　最高'+mx+'／最低'+mn+'</div></div>';
}

/* ============================== 交通・乗り換え ============================== */
/* 通学する次の日 */
function nextSchoolDay(){
  for(var i=1;i<=14;i++){
    var d = shiftDate(today(), i);
    if(schoolClassesForDate(d).length) return { date:d, inDays:i };
  }
  return null;
}
function transitFor(ymd){
  if(schoolClassesForDate(ymd).length) return transitBody(ymd);
  if(ymd !== today()) return '';
  var nx = nextSchoolDay();
  return nx ? transitBody(nx.date) : '';
}
function transitCard(){
  var td = today();
  var cls = schoolClassesForDate(td);
  var header = '';
  var target = td;
  if(!cls.length){
    var nx = nextSchoolDay();
    if(!nx) return '';
    target = nx.date;
    header = '';
  }
  return header + transitBody(target);
}
function transitBody(ymd){
  var cls = schoolClassesForDate(ymd);
  if(!cls.length) return '';
  var first = cls[0], last = cls[cls.length-1];
  var startMin = minutesOf(S.commute.periods[first.period-1]);
  var endMin   = minutesOf(S.commute.ends[last.period-1]);
  if(startMin == null || endMin == null) return '';

  var shift = S.shifts.filter(function(w){ return w.date === ymd && minutesOf(w.start) != null; })[0];
  var isToday = (ymd === today());
  var nowMin = (new Date()).getHours()*60 + (new Date()).getMinutes();
  /* 今日なら時間で出し分け。授業開始までは「行き」、始まったら「帰り」 */
  var mode = 'go';
  if(isToday && nowMin >= startMin) mode = 'back';

  var line = function(p, kind){
    var busTxt = p.bus ? (p.bus.dep+' 発 → '+p.bus.arr+' 着') : 'この時間のバスは未登録';
    var head = kind==='go'
      ? '<span class="trtag'+(p.ok?'':' ng')+'">'+esc(p.tag)+'</span>'
      : '<span class="trtag'+(p.tag==='ちょうど'?' on':'')+'">'+esc(p.tag)+'</span>';
    var rows = kind==='go'
      ? '<div class="trline"><span class="trk">バス</span><span>弥生ヶ丘五丁目 '+busTxt+'</span></div>'+
        '<div class="trline"><span class="trk">電車</span><span>三ノ宮 '+p.train.dep+' 発 → 鳴尾 '+p.train.arr+' 着</span></div>'
      : '<div class="trline"><span class="trk">電車</span><span>鳴尾 '+p.train.dep+' 発 → 三ノ宮 '+p.train.arr+' 着</span></div>'+
        '<div class="trline"><span class="trk">バス</span><span>三ノ宮 '+busTxt+'</span></div>';
    var favKey = kind+':'+(p.bus?p.bus.dep:'')+':'+p.train.dep;
    var isFav = (S.transit.fav||[]).indexOf(favKey) >= 0;
    return '<div class="trplan'+(kind==='go'&&!p.ok?' ng':'')+'">'+head+
      '<button class="mini" style="float:right" data-act="tr-fav" data-key="'+favKey+'">'+(isFav?'★':'☆')+'</button>'+rows+
      (kind==='go'&&!p.ok?'<div class="trwarn">'+first.period+'限に間に合いません</div>':'')+'</div>';
  };

  var h = '';
  var rainTomorrow = tomorrowRain();
  var isTomorrow = (ymd === shiftDate(today(),1));
  var rn = umbrellaInfo();
  if((isTomorrow && rainTomorrow && rainTomorrow.need) || (ymd===today() && rn && rn.need)){
    h += '<div class="bn amber"><span class="ic">☔</span><span>雨の予報です。バスが遅れがちなので、15分早めに着く便を出しています。</span></div>';
  }
  var offs = classesForDate(ymd).filter(function(c){ return c.off; });

  if(mode === 'go'){
      var rainNow = umbrellaInfo();
    var early = (isTomorrow && rainTomorrow && rainTomorrow.need) || (ymd===today() && rainNow && rainNow.need);
    var gos = goPlans(startMin - 30 - (early ? 15 : 0), startMin);
    h += section(isToday ? '大学への行き方' : '次に大学へ行く日の行き方', ymdLabel(ymd),
      '<div class="stat" style="margin-bottom:12px">'+
        '<div class="k">最初は'+first.period+'限 '+S.commute.periods[first.period-1]+'開始（'+esc(first.room||'')+'）</div>'+
        '<div class="v">'+hhmmOf(startMin-30)+' までに鳴尾・武庫川女子大前へ</div></div>'+
      (gos.length ? gos.map(function(p){ return line(p,'go'); }).join('') : '<div class="empty">この時間のダイヤは未登録です。</div>')+
      (offs.length ? '<p class="note">'+offs.map(function(c){ return c.name+'（'+(c.off==='cancel'?'休講':'隔週で今週なし')+'）'; }).join('、')+' を除いて計算しています。</p>' : ''));
    return h;
  }

  /* 帰り：バイトがある日はバイト先まで、なければ家まで */
  if(shift){
    var need = minutesOf(shift.start) - (toNum(S.transit.workBuffer)||10);
    var wps = workPlans(endMin + 20, need);
    h += section('バイトへの行き方', esc(shift.title||S.settings.shop||'バイト')+' '+shift.start+'〜',
      '<div class="stat" style="margin-bottom:12px">'+
        '<div class="k">'+last.period+'限 '+S.commute.ends[last.period-1]+'終わり</div>'+
        '<div class="v">'+shift.start+' までにイオンモール神戸北へ</div></div>'+
      (wps.length ? wps.map(function(p){
        return '<div class="trplan'+(p.ok?'':' ng')+'"><span class="trtag'+(p.ok?' on':' ng')+'">'+esc(p.tag)+'</span>'+
          '<div class="trline"><span class="trk">電車</span><span>鳴尾・武庫川女子大前 '+p.train.dep+' 発 → 神戸三宮 '+p.train.arr+' 着</span></div>'+
          '<div class="trline"><span class="trk">バス</span><span>三ノ宮 '+p.bus.dep+' 発 → イオンモール神戸北 '+p.bus.arr+' 着</span></div>'+
          (p.ok?'':'<div class="trwarn">開始に間に合いません</div>')+'</div>';
      }).join('') : '<div class="empty">この時間のダイヤは未登録です。</div>')+
      '<p class="note">開始の'+(toNum(S.transit.workBuffer)||10)+'分前までに着く便を選んでいます。</p>');
    return h;
  }

  var backs = backPlans(endMin + 20);
  h += section('帰り方', ymdLabel(ymd),
    '<div class="stat" style="margin-bottom:12px">'+
      '<div class="k">'+last.period+'限 '+S.commute.ends[last.period-1]+'終わり</div>'+
      '<div class="v">'+hhmmOf(endMin+20)+' に鳴尾を出る</div></div>'+
    (backs.length ? backs.map(function(p){ return line(p,'back'); }).join('') : '<div class="empty">この時間のダイヤは未登録です。</div>'));
  return h;
}
