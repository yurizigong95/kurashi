<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>時計</title>
<meta name="theme-color" content="#000000">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="時計">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="./icon.svg">
<link rel="apple-touch-icon" href="./icon.svg">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { height:100%; background:#000; overflow:hidden; }
  body {
    font-family: -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif;
    -webkit-user-select:none; user-select:none;
    -webkit-tap-highlight-color: transparent;
    touch-action: none;
    position: fixed; inset: 0;
  }
  #stage { position:absolute; inset:0; will-change: transform; }
  svg { width:100%; height:100%; display:block; }
  .num { fill:#fff; font-weight:700; text-anchor:middle; dominant-baseline:central; }
  #date { fill:#fff; font-weight:500; text-anchor:middle; dominant-baseline:central; }
  #hint {
    position:fixed; left:50%; bottom:calc(14px + env(safe-area-inset-bottom));
    transform:translateX(-50%);
    color:rgba(255,255,255,.55); font-size:13px; letter-spacing:.04em;
    background:rgba(255,255,255,.08); padding:7px 14px; border-radius:999px;
    opacity:1; transition:opacity .8s; pointer-events:none; white-space:nowrap;
  }
  #hint.hide { opacity:0; }
</style>
</head>
<body>
<div id="stage">
  <svg id="clock" aria-label="アナログ時計">
    <g id="ticks"></g>
    <text class="num" id="n12">12</text>
    <text class="num" id="n3">3</text>
    <text class="num" id="n6">6</text>
    <text class="num" id="n9">9</text>
    <text id="date"></text>
    <line id="hour"   stroke="#fff" stroke-linecap="round"/>
    <line id="minute" stroke="#fff" stroke-linecap="round"/>
    <line id="second" stroke="#f5a623" stroke-linecap="round"/>
    <circle id="pin" fill="#000" stroke="#f5a623"/>
  </svg>
</div>
<div id="hint">タップで全画面</div>
<script>
(function(){
  var NS='http://www.w3.org/2000/svg';
  var svg=document.getElementById('clock'), ticks=document.getElementById('ticks');
  var hourEl=document.getElementById('hour'), minEl=document.getElementById('minute'),
      secEl=document.getElementById('second'), pin=document.getElementById('pin'),
      dateEl=document.getElementById('date'),
      nums={12:document.getElementById('n12'),3:document.getElementById('n3'),
            6:document.getElementById('n6'),9:document.getElementById('n9')},
      stage=document.getElementById('stage');
  var tickLines=[], i, l;
  for(i=0;i<60;i++){ l=document.createElementNS(NS,'line'); l.setAttribute('stroke','#fff'); l.setAttribute('stroke-linecap','round'); ticks.appendChild(l); tickLines.push(l); }
  var CX=0, CY=0, R=100;
  function layout(){
    var w=window.innerWidth, h=window.innerHeight;
    svg.setAttribute('viewBox','0 0 '+w+' '+h);
    CX=w/2; CY=h/2;
    if(w>=h){ R=Math.min(h*0.74, w*0.44); } else { R=w*0.44; }
    var d=R*0.76, fs=R*0.24;
    place(nums[12], CX, CY-d, fs); place(nums[6], CX, CY+d, fs);
    place(nums[3], CX+d, CY, fs);  place(nums[9], CX-d, CY, fs);
    dateEl.setAttribute('x', CX+R*0.44); dateEl.setAttribute('y', CY);
    dateEl.setAttribute('font-size', Math.max(13, R*0.095));
    for(i=0;i<60;i++){
      var a=i*Math.PI/30, hr=i%5===0, r1=hr?R*0.90:R*0.945;
      l=tickLines[i];
      l.setAttribute('x1', CX+Math.sin(a)*r1); l.setAttribute('y1', CY-Math.cos(a)*r1);
      l.setAttribute('x2', CX+Math.sin(a)*R);  l.setAttribute('y2', CY-Math.cos(a)*R);
      l.setAttribute('stroke-width', hr?Math.max(3,R*0.014):Math.max(1.5,R*0.007));
      l.setAttribute('opacity', hr?0.95:0.55);
    }
    hourEl.setAttribute('stroke-width', Math.max(7, R*0.045));
    minEl.setAttribute('stroke-width', Math.max(5, R*0.034));
    secEl.setAttribute('stroke-width', Math.max(2, R*0.010));
    pin.setAttribute('cx',CX); pin.setAttribute('cy',CY);
    pin.setAttribute('r', Math.max(5, R*0.028)); pin.setAttribute('stroke-width', Math.max(2.5, R*0.012));
  }
  function place(el,x,y,fs){ el.setAttribute('x',x); el.setAttribute('y',y); el.setAttribute('font-size',fs); }
  function setHand(el,deg,len){
    var a=deg*Math.PI/180, tail=len*0.16;
    el.setAttribute('x1', CX-Math.sin(a)*tail); el.setAttribute('y1', CY+Math.cos(a)*tail);
    el.setAttribute('x2', CX+Math.sin(a)*len);  el.setAttribute('y2', CY-Math.cos(a)*len);
  }
  layout();
  window.addEventListener('resize', layout);
  window.addEventListener('orientationchange', function(){ setTimeout(layout, 60); });
  var lastDate='';
  function frame(){
    var now=new Date(), ms=now.getMilliseconds();
    var s=now.getSeconds()+ms/1000, m=now.getMinutes()+s/60, h=(now.getHours()%12)+m/60;
    setHand(secEl, s*6, R*0.88); setHand(minEl, m*6, R*0.78); setHand(hourEl, h*30, R*0.52);
    var key=now.getDate()+'-'+now.getDay();
    if(key!==lastDate){ lastDate=key; dateEl.textContent='日月火水木金土'[now.getDay()]+' '+now.getDate(); }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
  var shifts=[[0,0],[3,1],[-2,2],[1,-3],[-3,-1],[2,3]], si=0;
  setInterval(function(){ si=(si+1)%shifts.length; stage.style.transform='translate('+shifts[si][0]+'px,'+shifts[si][1]+'px)'; },60000);
  var wakeLock=null;
  function keepAwake(){ if('wakeLock' in navigator){ navigator.wakeLock.request('screen').then(function(w){ wakeLock=w; }).catch(function(){}); } }
  keepAwake();
  document.addEventListener('visibilitychange', function(){ if(document.visibilityState==='visible') keepAwake(); });
  var hint=document.getElementById('hint');
  setTimeout(function(){ hint.classList.add('hide'); }, 5000);
  document.addEventListener('click', function(){
    hint.classList.add('hide'); keepAwake();
    var el=document.documentElement;
    if(!document.fullscreenElement && el.requestFullscreen){ el.requestFullscreen().catch(function(){}); }
  });
  if('serviceWorker' in navigator){ navigator.serviceWorker.register('./sw.js').catch(function(){}); }
})();
</script>
</body>
</html>
