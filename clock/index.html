<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>時計</title>
<meta name="theme-color" content="#000000">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="時計">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="./icon.svg">
<link rel="apple-touch-icon" href="./icon.svg">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { height:100%; background:#000; overflow:hidden; }
  body {
    font-family: -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif;
    -webkit-user-select:none; user-select:none;
    -webkit-tap-highlight-color: transparent;
    touch-action: none;
    position: fixed; inset: 0;
  }
  #stage { position:absolute; inset:0; will-change: transform; }
  svg { width:100%; height:100%; display:block; }
  .num { fill:#fff; font-weight:700; text-anchor:middle; dominant-baseline:central; }
  #date { fill:#fff; font-weight:500; text-anchor:middle; dominant-baseline:central; }
  #hint {
    position:fixed; left:50%; bottom:calc(14px + env(safe-area-inset-bottom));
    transform:translateX(-50%);
    color:rgba(255,255,255,.55); font-size:13px; letter-spacing:.04em;
    background:rgba(255,255,255,.08); padding:7px 14px; border-radius:999px;
    opacity:1; transition:opacity .8s; pointer-events:none; white-space:nowrap;
  }
  #hint.hide { opacity:0; }
</style>
</head>
<body>
<div id="stage">
  <svg id="clock" viewBox="0 0 1000 600" preserveAspectRatio="xMidYMid slice" aria-label="アナログ時計">
    <g id="ticks"></g>
    <text class="num" x="500" y="88"  font-size="92">12</text>
    <text class="num" x="918" y="300" font-size="92">3</text>
    <text class="num" x="500" y="512" font-size="92">6</text>
    <text class="num" x="82"  y="300" font-size="92">9</text>
    <text id="date" x="690" y="300" font-size="40"></text>
    <line id="hour"   x1="500" y1="300" x2="500" y2="185" stroke="#fff" stroke-width="17" stroke-linecap="round"/>
    <line id="minute" x1="500" y1="300" x2="500" y2="105" stroke="#fff" stroke-width="13" stroke-linecap="round"/>
    <line id="second" x1="500" y1="345" x2="500" y2="78"  stroke="#f5a623" stroke-width="4" stroke-linecap="round"/>
    <circle cx="500" cy="300" r="11" fill="#000" stroke="#f5a623" stroke-width="5"/>
  </svg>
</div>
<div id="hint">タップで全画面</div>
<script>
(function(){
  var cx=500, cy=300, ticks=document.getElementById('ticks'), NS='http://www.w3.org/2000/svg';
  for (var i=0;i<60;i++){
    var a=i*Math.PI/30, hour=i%5===0;
    var r1=hour?392:408, r0=438;
    var l=document.createElementNS(NS,'line');
    l.setAttribute('x1', cx+Math.sin(a)*r1); l.setAttribute('y1', cy-Math.cos(a)*r1);
    l.setAttribute('x2', cx+Math.sin(a)*r0); l.setAttribute('y2', cy-Math.cos(a)*r0);
    l.setAttribute('stroke','#fff'); l.setAttribute('stroke-width', hour?6:3);
    l.setAttribute('stroke-linecap','round'); l.setAttribute('opacity', hour?0.95:0.55);
    ticks.appendChild(l);
  }
  var hourEl=document.getElementById('hour'), minEl=document.getElementById('minute'),
      secEl=document.getElementById('second'), dateEl=document.getElementById('date'),
      stage=document.getElementById('stage'), lastDate='';
  function rot(el,deg){ el.setAttribute('transform','rotate('+deg+' 500 300)'); }
  function frame(){
    var now=new Date(), ms=now.getMilliseconds();
    var s=now.getSeconds()+ms/1000, m=now.getMinutes()+s/60, h=(now.getHours()%12)+m/60;
    rot(secEl, s*6); rot(minEl, m*6); rot(hourEl, h*30);
    var key=now.getDate()+'-'+now.getDay();
    if(key!==lastDate){
      lastDate=key;
      dateEl.textContent='日月火水木金土'[now.getDay()]+' '+now.getDate();
    }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
  // 焼き付き防止: 1分ごとに数pxずらす
  var shifts=[[0,0],[3,1],[-2,2],[1,-3],[-3,-1],[2,3]], si=0;
  setInterval(function(){ si=(si+1)%shifts.length; stage.style.transform='translate('+shifts[si][0]+'px,'+shifts[si][1]+'px)'; },60000);
  // スリープ防止
  var wakeLock=null;
  function keepAwake(){ if('wakeLock' in navigator){ navigator.wakeLock.request('screen').then(function(w){ wakeLock=w; }).catch(function(){}); } }
  keepAwake();
  document.addEventListener('visibilitychange', function(){ if(document.visibilityState==='visible') keepAwake(); });
  // タップで全画面 + ヒント消去
  var hint=document.getElementById('hint');
  setTimeout(function(){ hint.classList.add('hide'); }, 5000);
  document.addEventListener('click', function(){
    hint.classList.add('hide'); keepAwake();
    var el=document.documentElement;
    if(!document.fullscreenElement && el.requestFullscreen){ el.requestFullscreen().catch(function(){}); }
  });
  if('serviceWorker' in navigator){ navigator.serviceWorker.register('./sw.js').catch(function(){}); }
})();
</script>
</body>
</html>
